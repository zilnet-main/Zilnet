<title>Zilnet</title>
<script>
(function(){
  try{
    var saved = localStorage.getItem('zilnet-theme') || 'system';
    var resolved = saved;
    if(saved === 'system'){
      resolved = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    document.documentElement.setAttribute('data-theme', resolved);
    document.documentElement.setAttribute('data-theme-pref', saved);
  }catch(e){
    document.documentElement.setAttribute('data-theme', 'dark');
  }
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --radius-s:9px; --radius-m:14px; --radius-l:22px;
    --icon-size:22px;
    --safe-bottom:env(safe-area-inset-bottom, 0px);
    --safe-top:env(safe-area-inset-top, 0px);
    --danger:#e5484d;
    --danger-dim:rgba(229,72,77,0.12);
    --font-brand:'Space Grotesk', ui-sans-serif, system-ui, sans-serif;
    --font-body:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  html[data-theme="dark"]{
    --bg:#050505; --bg-elev:#111113; --card:#0c0c0e; --border:#26262a; --border-soft:#1a1a1d;
    --fg:#f4f4f6; --fg-dim:#98989f; --fg-faint:#57575e;
    --fill:#ffffff; --fill-text:#000000;
    --icon-color:#ffffff;
    --overlay:rgba(0,0,0,0.7);
    --scrim:rgba(255,255,255,0.06);
  }
  html[data-theme="light"]{
    --bg:#ffffff; --bg-elev:#f4f4f5; --card:#ffffff; --border:#e2e2e4; --border-soft:#ececee;
    --fg:#0a0a0b; --fg-dim:#68686f; --fg-faint:#a4a4aa;
    --fill:#0a0a0b; --fill-text:#ffffff;
    --icon-color:#0a0a0b;
    --overlay:rgba(0,0,0,0.5);
    --scrim:rgba(0,0,0,0.04);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;background:var(--bg);color:var(--fg);
    font-family:var(--font-body);-webkit-font-smoothing:antialiased;
    overflow-x:hidden;width:100%;
    transition:background-color .15s ease, color .15s ease;
  }
  img,video{max-width:100%;}
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;cursor:pointer;background:none;border:none;color:inherit;}
  input,textarea,select{font-family:inherit;}
  ::selection{background:var(--fg);color:var(--bg);}
  .hidden{display:none !important;}
  .visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);}
  button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible{
    outline:2px solid var(--fg);outline-offset:2px;
  }
  @media (prefers-reduced-motion: reduce){ *{animation-duration:0.01ms !important; transition-duration:0.01ms !important;} }

  /* ---- Icon system (mask-based, theme-aware, shape-preserving) ---- */
  .icon{
    display:inline-block;width:var(--icon-size);height:var(--icon-size);
    background-color:var(--icon-color);
    -webkit-mask-image:var(--icon-url);mask-image:var(--icon-url);
    -webkit-mask-size:contain;mask-size:contain;
    -webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;
    -webkit-mask-position:center;mask-position:center;
    flex-shrink:0;transition:background-color .12s ease;
  }
  .icon-btn{
    width:44px;height:44px;border-radius:50%;
    display:inline-flex;align-items:center;justify-content:center;
    transition:transform .1s ease, background-color .12s ease;position:relative;
  }
  .icon-btn:active{transform:scale(0.88);background:var(--scrim);}
  .icon-btn.active-nav{background:var(--scrim);}
  .icon-btn.active-nav .icon{background-color:var(--fg);}
  .icon-btn .icon{ }
  .icon-sm{--icon-size:18px;}

  /* ---- Buttons / forms ---- */
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    background:var(--fill);color:var(--fill-text);border:1px solid var(--fill);
    border-radius:var(--radius-s);padding:12px 16px;font-size:15px;font-weight:600;width:100%;
    transition:transform .1s ease, opacity .15s ease;
  }
  .btn:active{transform:scale(0.97);}
  .btn[disabled]{opacity:0.4;pointer-events:none;}
  .btn.secondary{background:transparent;border:1px solid var(--border);color:var(--fg);}
  .btn.danger{background:var(--danger);border-color:var(--danger);color:#fff;}
  .btn.ghost{background:transparent;border:1px solid transparent;color:var(--fg-dim);width:auto;}
  .btn-sm{padding:8px 14px;font-size:13px;width:auto;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12.5px;color:var(--fg-dim);margin-bottom:6px;}
  .field input, .field textarea, .field select{
    width:100%;background:var(--bg-elev);border:1px solid var(--border);color:var(--fg);
    border-radius:var(--radius-s);padding:12px 13px;font-size:15px;transition:border-color .15s;outline:none;
  }
  .field input:focus, .field textarea:focus, .field select:focus{border-color:var(--fg);}
  .form-error{background:var(--danger-dim);border:1px solid rgba(229,72,77,0.3);color:var(--danger);
    font-size:13px;padding:10px 12px;border-radius:var(--radius-s);margin-bottom:14px;}
  .form-note{background:var(--bg-elev);border:1px solid var(--border);color:var(--fg-dim);
    font-size:13px;padding:10px 12px;border-radius:var(--radius-s);margin-bottom:14px;}
  .segmented{display:flex;border:1px solid var(--border);border-radius:var(--radius-s);overflow:hidden;}
  .segmented button{flex:1;padding:10px;font-size:13.5px;font-weight:600;color:var(--fg-dim);border-right:1px solid var(--border);}
  .segmented button:last-child{border-right:none;}
  .segmented button.active{background:var(--fill);color:var(--fill-text);}

  /* ---- Splash ---- */
  #splash{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:9999;}
  #splash .mark{font-family:var(--font-brand);font-size:24px;font-weight:700;letter-spacing:-0.01em;display:flex;align-items:center;gap:10px;}
  #splash .dot{width:7px;height:7px;border-radius:50%;background:var(--fg);animation:pulse 1.1s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:0.2;transform:scale(0.8);}50%{opacity:1;transform:scale(1);}}

  /* ---- Auth ---- */
  #auth-screen{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px;}
  .auth-box{width:100%;max-width:380px;}
  .auth-brand{font-family:var(--font-brand);font-size:30px;font-weight:700;letter-spacing:-0.02em;margin-bottom:6px;}
  .auth-sub{color:var(--fg-dim);font-size:14px;margin-bottom:26px;}
  .auth-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-l);padding:22px;}
  .auth-switch{text-align:center;margin-top:16px;font-size:13.5px;color:var(--fg-dim);}
  .auth-switch button{color:var(--fg);font-size:13.5px;font-weight:600;padding:0;text-decoration:underline;}
  .auth-links{display:flex;justify-content:center;margin-top:10px;}
  .link-btn{color:var(--fg-dim);font-size:12.5px;padding:0;}
  .link-btn:hover{color:var(--fg);}

  /* ---- App shell ---- */
  #app{display:none;min-height:100vh;min-height:100dvh;}
  #app.active{display:block;}
  .app-header{
    position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;
    padding:calc(10px + var(--safe-top)) 14px 10px;background:color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter:blur(12px);border-bottom:1px solid var(--border-soft);
  }
  .app-header .brand{font-family:var(--font-brand);font-size:20px;font-weight:700;letter-spacing:-0.01em;}
  .header-actions{display:flex;gap:2px;align-items:center;}
  .layout{display:flex;max-width:1180px;margin:0 auto;}
  .sidebar{
    width:250px;flex-shrink:0;position:sticky;top:0;align-self:flex-start;height:100vh;height:100dvh;
    padding:18px 10px;border-right:1px solid var(--border-soft);display:flex;flex-direction:column;
  }
  .sidebar .brand{font-family:var(--font-brand);font-size:23px;font-weight:700;padding:10px 12px 22px;letter-spacing:-0.02em;}
  .side-nav{display:flex;flex-direction:column;gap:2px;flex:1;}
  .side-link{display:flex;align-items:center;gap:15px;padding:11px 12px;border-radius:var(--radius-s);color:var(--fg-dim);font-size:15px;font-weight:500;transition:background .12s,color .12s;position:relative;}
  .side-link:hover{background:var(--scrim);color:var(--fg);}
  .side-link.active{color:var(--fg);font-weight:700;}
  .side-link.active .icon{background-color:var(--fg);}
  .side-badge{position:absolute;left:26px;top:8px;width:8px;height:8px;border-radius:50%;background:var(--fg);border:2px solid var(--bg);}
  .side-create-btn{margin:14px 4px 10px;}
  .sidebar-user{display:flex;align-items:center;gap:10px;padding:10px;border-radius:var(--radius-s);border:1px solid var(--border-soft);}
  .sidebar-user .name{font-size:13.5px;font-weight:600;}
  .sidebar-user .handle{font-size:12px;color:var(--fg-dim);}
  .main-col{flex:1;min-width:0;max-width:600px;margin:0 auto;border-right:1px solid var(--border-soft);min-height:100vh;}
  .right-col{width:320px;flex-shrink:0;padding:20px 16px;}
  main{padding-bottom:90px;}
  .bottom-nav{display:none;}

  /* ---- Avatars ---- */
  .avatar{width:38px;height:38px;border-radius:50%;object-fit:cover;background:var(--bg-elev);border:1px solid var(--border-soft);flex-shrink:0;display:block;}
  .avatar-fallback{
    width:38px;height:38px;border-radius:50%;background:var(--bg-elev);border:1px solid var(--border-soft);
    display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:var(--fg-dim);flex-shrink:0;
  }
  .avatar-lg, .avatar-lg.avatar-fallback{width:84px;height:84px;font-size:28px;}
  .avatar-sm, .avatar-sm.avatar-fallback{width:30px;height:30px;font-size:12px;}

  /* ---- Stories ---- */
  .stories-row{display:flex;gap:14px;padding:14px 16px;overflow-x:auto;border-bottom:1px solid var(--border-soft);scrollbar-width:none;}
  .stories-row::-webkit-scrollbar{display:none;}
  .story-item{display:flex;flex-direction:column;align-items:center;gap:6px;flex-shrink:0;width:64px;}
  .story-ring{width:58px;height:58px;border-radius:50%;padding:2px;border:2px solid var(--fg);display:flex;align-items:center;justify-content:center;}
  .story-ring .story-avatar-wrap{width:100%;height:100%;border-radius:50%;overflow:hidden;border:2px solid var(--bg);}
  .story-item .story-name{font-size:11px;color:var(--fg-dim);max-width:64px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .story-add{width:58px;height:58px;border-radius:50%;border:1.5px dashed var(--border);display:flex;align-items:center;justify-content:center;background:var(--bg-elev);}
  .story-add:active{transform:scale(0.92);}

  /* ---- Post card ---- */
  .post{border-bottom:1px solid var(--border-soft);padding:14px 16px;}
  .post-head{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .post-head .who{flex:1;min-width:0;cursor:pointer;}
  .post-head .username{font-size:14.5px;font-weight:600;}
  .post-head .time{font-size:12px;color:var(--fg-faint);}
  .post-media{width:100%;border-radius:var(--radius-m);overflow:hidden;background:var(--bg-elev);margin-bottom:10px;border:1px solid var(--border-soft);}
  .post-media img{width:100%;display:block;max-height:640px;object-fit:cover;}
  .post-media video{width:100%;display:block;max-height:640px;background:#000;}
  .post-media audio{width:100%;display:block;padding:14px;}
  .post-caption{font-size:14.5px;line-height:1.45;margin-bottom:10px;word-wrap:break-word;white-space:pre-wrap;}
  .post-caption .cap-user{font-weight:600;margin-right:6px;}
  .post-actions{display:flex;align-items:center;gap:2px;}
  .post-actions .spacer{flex:1;}
  .action-btn{display:flex;align-items:center;gap:6px;padding:8px;border-radius:var(--radius-s);font-size:13px;font-weight:600;color:var(--fg-dim);}
  .action-btn:active .icon{transform:scale(0.85);}
  .action-btn.on .icon{background-color:var(--fg);}
  .action-btn.on{color:var(--fg);}

  /* ---- Empty / skeleton / spinner ---- */
  .empty-state{text-align:center;padding:60px 24px;color:var(--fg-dim);}
  .empty-state h3{color:var(--fg);font-size:17px;margin:0 0 6px;font-weight:700;}
  .empty-state p{font-size:14px;margin:0 0 18px;line-height:1.5;}
  .skeleton{background:linear-gradient(90deg,var(--bg-elev) 25%,var(--border) 37%,var(--bg-elev) 63%);background-size:400% 100%;animation:sk 1.4s ease infinite;border-radius:var(--radius-s);}
  @keyframes sk{0%{background-position:100% 0;}100%{background-position:0 0;}}
  .skeleton-post{padding:14px 16px;border-bottom:1px solid var(--border-soft);}
  .skeleton-post .sk-head{display:flex;gap:10px;align-items:center;margin-bottom:12px;}
  .sk-avatar{width:38px;height:38px;border-radius:50%;}
  .sk-line{height:11px;border-radius:6px;}
  .spinner{width:20px;height:20px;border-radius:50%;border:2px solid var(--border);border-top-color:var(--fg);animation:spin .7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .spinner-center{display:flex;align-items:center;justify-content:center;padding:40px;}

  .section-title{font-size:18px;font-weight:700;padding:16px 16px 10px;font-family:var(--font-brand);}

  /* ---- Search ---- */
  .search-bar{display:flex;align-items:center;gap:8px;padding:11px 13px;margin:12px 16px;background:var(--bg-elev);border:1px solid var(--border);border-radius:var(--radius-m);}
  .search-bar input{flex:1;background:none;border:none;color:var(--fg);font-size:15px;outline:none;}
  .search-result{display:flex;align-items:center;gap:12px;padding:10px 16px;cursor:pointer;}
  .search-result:hover{background:var(--scrim);}
  .search-result .meta{flex:1;min-width:0;}
  .search-result .name{font-size:14px;font-weight:600;}
  .search-result .sub{font-size:12.5px;color:var(--fg-dim);}
  .search-result input[type="checkbox"]{width:18px;height:18px;}

  /* ---- Suggestions ---- */
  .suggest-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-m);padding:14px;}
  .suggest-card h4{margin:0 0 10px;font-size:14px;color:var(--fg-dim);font-weight:600;}
  .suggest-row{display:flex;align-items:center;gap:10px;padding:7px 0;}
  .suggest-row .meta{flex:1;min-width:0;cursor:pointer;}
  .suggest-row .name{font-size:13.5px;font-weight:600;}
  .suggest-row .sub{font-size:12px;color:var(--fg-dim);}
  .follow-btn{background:var(--fill);color:var(--fill-text);border:1px solid var(--fill);border-radius:999px;padding:6px 14px;font-size:12.5px;font-weight:600;white-space:nowrap;}
  .follow-btn.following{background:transparent;color:var(--fg);border-color:var(--border);}

  /* ---- Profile ---- */
  .profile-header{padding:20px 16px;}
  .profile-top{display:flex;gap:18px;align-items:center;margin-bottom:14px;}
  .profile-names{flex:1;min-width:0;}
  .profile-names .display-name{font-size:19px;font-weight:700;font-family:var(--font-brand);}
  .profile-names .username{color:var(--fg-dim);font-size:14px;}
  .profile-bio{font-size:14px;line-height:1.5;margin:10px 0;white-space:pre-wrap;word-wrap:break-word;}
  .profile-skills{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0;}
  .skill-chip{background:var(--bg-elev);border:1px solid var(--border);border-radius:999px;padding:4px 11px;font-size:12px;color:var(--fg-dim);}
  .profile-stats{display:flex;gap:22px;margin:14px 0;}
  .profile-stats .stat{cursor:pointer;}
  .profile-stats .stat b{font-size:15px;display:block;}
  .profile-stats .stat span{font-size:12.5px;color:var(--fg-dim);}
  .profile-actions{display:flex;gap:8px;}
  .profile-tabs{display:flex;border-bottom:1px solid var(--border-soft);margin-top:8px;}
  .profile-tab{flex:1;text-align:center;padding:12px;font-size:13px;font-weight:600;color:var(--fg-dim);border-bottom:2px solid transparent;}
  .profile-tab.active{color:var(--fg);border-color:var(--fg);}
  .grid-posts{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;}
  .grid-posts .cell{aspect-ratio:1;background:var(--bg-elev);overflow:hidden;position:relative;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:8px;text-align:center;}
  .grid-posts .cell img,.grid-posts .cell video{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;}
  .grid-posts .cell .text-only{font-size:11.5px;line-height:1.35;color:var(--fg-dim);overflow:hidden;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;}

  /* ---- Modals / panels ---- */
  .modal-overlay{position:fixed;inset:0;background:var(--overlay);z-index:200;display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .15s ease;}
  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
  @media (min-width:760px){.modal-overlay{align-items:center;}}
  .modal-panel{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-l) var(--radius-l) 0 0;width:100%;max-width:520px;max-height:88vh;display:flex;flex-direction:column;animation:slideUp .2s ease;}
  @keyframes slideUp{from{transform:translateY(24px);opacity:0.6;}to{transform:translateY(0);opacity:1;}}
  @media (min-width:760px){.modal-panel{border-radius:var(--radius-l);max-height:80vh;}}
  .modal-head{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--border-soft);flex-shrink:0;}
  .modal-head h3{margin:0;font-size:15.5px;font-weight:700;}
  .modal-body{padding:14px 16px;overflow-y:auto;flex:1;}
  .modal-foot{padding:12px 16px;border-top:1px solid var(--border-soft);flex-shrink:0;}
  .fullscreen-panel{position:fixed;inset:0;background:var(--bg);z-index:180;display:flex;flex-direction:column;}
  .fullscreen-panel .modal-head{background:color-mix(in srgb, var(--bg) 88%, transparent);backdrop-filter:blur(12px);padding-top:calc(12px + var(--safe-top));}
  .fullscreen-panel .modal-body{padding:0;}

  /* ---- Confirm dialog ---- */
  .confirm-box{padding:20px 18px;}
  .confirm-box p{font-size:14.5px;line-height:1.5;margin:0 0 18px;}
  .confirm-actions{display:flex;gap:10px;}

  /* ---- Comments ---- */
  .comment-row{display:flex;gap:10px;padding:10px 0;}
  .comment-row .meta{flex:1;min-width:0;}
  .comment-row .text{font-size:13.5px;line-height:1.4;}
  .comment-row .text b{font-weight:600;margin-right:6px;}
  .comment-row .time{font-size:11.5px;color:var(--fg-faint);margin-top:2px;}
  .comment-compose{display:flex;gap:8px;align-items:center;}
  .comment-compose input{flex:1;background:var(--bg-elev);border:1px solid var(--border);border-radius:999px;padding:10px 14px;color:var(--fg);font-size:14px;outline:none;}

  /* ---- Composer ---- */
  .composer-preview{width:100%;border-radius:var(--radius-m);overflow:hidden;background:var(--bg-elev);border:1px solid var(--border-soft);margin-bottom:12px;min-height:70px;display:flex;align-items:center;justify-content:center;position:relative;}
  .composer-preview img,.composer-preview video{width:100%;max-height:400px;object-fit:contain;background:#000;}
  .composer-preview .placeholder{color:var(--fg-faint);font-size:13px;text-align:center;padding:18px;}
  .composer-preview .remove-media{position:absolute;top:8px;right:8px;background:rgba(0,0,0,0.6);border-radius:50%;width:30px;height:30px;display:flex;align-items:center;justify-content:center;}
  .composer-preview .remove-media .icon{background-color:#fff;}
  .file-pick-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:13px;border:1.5px dashed var(--border);border-radius:var(--radius-m);color:var(--fg-dim);font-size:14px;background:var(--bg-elev);margin-bottom:12px;}
  .composer-caption{width:100%;background:var(--bg-elev);border:1px solid var(--border);color:var(--fg);border-radius:var(--radius-s);padding:12px;font-size:14.5px;resize:vertical;min-height:70px;outline:none;}
  .composer-caption:focus{border-color:var(--fg);}
  .progress-bar{height:4px;background:var(--border);border-radius:2px;overflow:hidden;margin-top:10px;}
  .progress-bar .fill{height:100%;background:var(--fg);width:0%;transition:width .2s;}
  .composer-kind-choice{display:flex;gap:12px;padding:8px 0 4px;}
  .kind-card{flex:1;border:1px solid var(--border);border-radius:var(--radius-m);padding:18px 10px;display:flex;flex-direction:column;align-items:center;gap:10px;background:var(--bg-elev);}
  .kind-card:active{transform:scale(0.97);}
  .kind-card span.label{font-size:13.5px;font-weight:600;}

  /* ---- Chats ---- */
  .chat-list-row{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border-soft);cursor:pointer;}
  .chat-list-row:hover{background:var(--scrim);}
  .chat-list-row .meta{flex:1;min-width:0;}
  .chat-list-row .name{font-size:14.5px;font-weight:600;}
  .chat-list-row .preview{font-size:13px;color:var(--fg-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .chat-list-row .time{font-size:11.5px;color:var(--fg-faint);}
  .chat-window{display:flex;flex-direction:column;height:100%;}
  .chat-messages{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:8px;}
  .msg-bubble{max-width:75%;padding:9px 13px;border-radius:16px;font-size:14px;line-height:1.4;word-wrap:break-word;}
  .msg-bubble.mine{align-self:flex-end;background:var(--fill);color:var(--fill-text);border-bottom-right-radius:4px;}
  .msg-bubble.theirs{align-self:flex-start;background:var(--bg-elev);border:1px solid var(--border-soft);border-bottom-left-radius:4px;color:var(--fg);}
  .msg-bubble img{max-width:220px;border-radius:10px;display:block;}
  .chat-input-row{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--border-soft);padding-bottom:calc(10px + var(--safe-bottom));flex-shrink:0;align-items:center;}
  .chat-input-row input{flex:1;background:var(--bg-elev);border:1px solid var(--border);border-radius:999px;padding:11px 15px;color:var(--fg);font-size:14.5px;outline:none;}
  .chat-header-title{display:flex;flex-direction:column;align-items:center;line-height:1.25;}
  .chat-header-title .dn{font-size:14.5px;font-weight:700;}
  .chat-header-title .un{font-size:12px;color:var(--fg-dim);}
  .chip{display:inline-flex;align-items:center;gap:6px;background:var(--bg-elev);border:1px solid var(--border);border-radius:999px;padding:5px 6px 5px 10px;font-size:12.5px;margin:3px;}
  .chip button{display:flex;}

  /* ---- Reels ---- */
  .reels-feed{height:calc(100vh - 60px);height:calc(100dvh - 60px);overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none;}
  .reels-feed::-webkit-scrollbar{display:none;}
  .reel-item{height:calc(100vh - 60px);height:calc(100dvh - 60px);scroll-snap-align:start;position:relative;background:#000;display:flex;align-items:center;justify-content:center;}
  .reel-item video{width:100%;height:100%;object-fit:contain;background:#000;}
  .reel-overlay{position:absolute;bottom:0;left:0;right:0;padding:16px;background:linear-gradient(to top, rgba(0,0,0,0.75), transparent);display:flex;align-items:flex-end;justify-content:space-between;gap:12px;}
  .reel-info{flex:1;min-width:0;color:#fff;cursor:pointer;}
  .reel-info .username{font-weight:700;font-size:14px;margin-bottom:4px;}
  .reel-info .caption{font-size:13px;opacity:0.9;white-space:pre-wrap;word-wrap:break-word;}
  .reel-actions{display:flex;flex-direction:column;gap:14px;align-items:center;}
  .reel-actions .icon-btn .icon{background-color:#fff;}

  /* ---- Story viewer ---- */
  .story-viewer{position:fixed;inset:0;background:#000;z-index:220;display:flex;flex-direction:column;}
  .story-progress{display:flex;gap:4px;padding:calc(8px + var(--safe-top)) 10px 6px;}
  .story-progress .bar{flex:1;height:2.5px;background:rgba(255,255,255,0.3);border-radius:2px;overflow:hidden;}
  .story-progress .bar .fill{height:100%;background:#fff;width:0%;}
  .story-viewer-head{display:flex;align-items:center;gap:10px;padding:6px 12px 10px;color:#fff;}
  .story-viewer-head .who{flex:1;font-size:13.5px;font-weight:600;}
  .story-viewer-head .time{font-size:12px;color:rgba(255,255,255,0.65);}
  .story-viewer-body{flex:1;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;}
  .story-viewer-body img{width:100%;height:100%;object-fit:contain;}
  .story-viewer-body video{width:100%;height:100%;object-fit:contain;}
  .story-text-slide{width:100%;height:100%;display:flex;align-items:center;justify-content:center;padding:40px;background:#000;}
  .story-text-slide p{color:#fff;font-size:24px;font-weight:600;text-align:center;line-height:1.4;white-space:pre-wrap;word-wrap:break-word;}
  .story-tap-zone{position:absolute;top:0;bottom:0;width:35%;z-index:2;}
  .story-caption{position:absolute;bottom:24px;left:0;right:0;text-align:center;color:#fff;font-size:14px;padding:0 20px;white-space:pre-wrap;}

  /* ---- Settings ---- */
  .settings-group{margin-bottom:22px;}
  .settings-group h4{font-size:12.5px;color:var(--fg-dim);padding:0 16px 8px;font-weight:600;}
  .settings-row{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;border-bottom:1px solid var(--border-soft);font-size:14.5px;gap:12px;}
  .settings-row select{background:var(--bg-elev);border:1px solid var(--border);color:var(--fg);border-radius:var(--radius-s);padding:8px 10px;font-size:13.5px;}
  .toggle{width:44px;height:26px;border-radius:999px;background:var(--border);position:relative;flex-shrink:0;transition:background .15s;}
  .toggle.on{background:var(--fill);}
  .toggle .knob{width:20px;height:20px;border-radius:50%;background:var(--bg);position:absolute;top:3px;left:3px;transition:transform .15s;}
  .toggle.on .knob{transform:translateX(18px);background:var(--fill-text);}

  /* ---- Notifications ---- */
  .notif-row{display:flex;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border-soft);align-items:center;}
  .notif-row.unread{background:var(--scrim);}
  .notif-row .text{font-size:13.5px;line-height:1.4;flex:1;}
  .notif-row .text b{font-weight:600;}
  .notif-row .time{font-size:11.5px;color:var(--fg-faint);margin-top:2px;}

  /* ---- Toasts ---- */
  #toast-stack{position:fixed;bottom:calc(80px + var(--safe-bottom));left:50%;transform:translateX(-50%);z-index:500;display:flex;flex-direction:column;gap:8px;align-items:center;width:100%;padding:0 16px;pointer-events:none;}
  .toast{background:var(--fg);color:var(--bg);padding:11px 18px;border-radius:999px;font-size:13.5px;font-weight:500;box-shadow:0 6px 24px rgba(0,0,0,0.3);animation:toastIn .2s ease;max-width:100%;text-align:center;}
  .toast.error{background:var(--danger);color:#fff;}
  @keyframes toastIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}

  .row{display:flex;align-items:center;}
  .between{justify-content:space-between;}
  .gap8{gap:8px;}
  .mt8{margin-top:8px;}
  .mt16{margin-top:16px;}
  .text-dim{color:var(--fg-dim);}
  .badge-dot{position:absolute;top:6px;right:6px;width:9px;height:9px;border-radius:50%;background:var(--fg);border:2px solid var(--bg);}

  @media (max-width:900px){
    .sidebar{display:none;} .right-col{display:none;} .layout{display:block;max-width:100%;}
    .main-col{border-right:none;max-width:100%;}
    main{padding-bottom:calc(64px + var(--safe-bottom) + 10px);}
    .bottom-nav{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:100;background:color-mix(in srgb, var(--bg) 92%, transparent);backdrop-filter:blur(14px);border-top:1px solid var(--border-soft);padding:6px 4px calc(6px + var(--safe-bottom));justify-content:space-around;}
    .bottom-nav .nav-item{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 10px;min-width:52px;border-radius:var(--radius-s);position:relative;}
    .bottom-nav .nav-item:active{transform:scale(0.92);}
    .app-header{padding-top:calc(10px + var(--safe-top));}
  }
  @media (min-width:901px){ .app-header{display:none;} }
  @media (max-width:520px){ .right-col{display:none;} .post{padding:12px 14px;} .section-title{padding:14px 14px 4px;} }
</style>
</head>
<body>

<div id="splash"><div class="mark">ZILNET <span class="dot"></span></div></div>

<div id="auth-screen" class="hidden">
  <div class="auth-box">
    <div class="auth-brand">Zilnet</div>
    <div class="auth-sub" id="auth-subtitle">Sign in to continue</div>
    <div class="auth-card">
      <div id="auth-message"></div>

      <form id="login-form">
        <div class="field"><label for="login-identifier">Username or email</label>
          <input id="login-identifier" type="text" autocomplete="username" required></div>
        <div class="field"><label for="login-password">Password</label>
          <input id="login-password" type="password" autocomplete="current-password" required></div>
        <button class="btn" type="submit" id="login-submit">Log in</button>
        <div class="auth-links"><button type="button" class="link-btn" id="show-forgot">Forgot password?</button></div>
      </form>

      <form id="signup-form" class="hidden">
        <div class="field"><label for="signup-username">Username</label>
          <input id="signup-username" type="text" autocomplete="username" required pattern="[a-z0-9_.]{3,30}"></div>
        <div class="field"><label for="signup-email">Email</label>
          <input id="signup-email" type="email" autocomplete="email" required></div>
        <div class="field"><label for="signup-password">Password</label>
          <input id="signup-password" type="password" autocomplete="new-password" required minlength="8"></div>
        <button class="btn" type="submit" id="signup-submit">Create account</button>
      </form>

      <form id="forgot-form" class="hidden">
        <div class="field"><label for="forgot-email">Email</label>
          <input id="forgot-email" type="email" autocomplete="email" required></div>
        <button class="btn" type="submit" id="forgot-submit">Send reset link</button>
        <div class="auth-links"><button type="button" class="link-btn" id="back-to-login-1">Back to login</button></div>
      </form>

      <form id="reset-form" class="hidden">
        <div class="field"><label for="reset-password-input">New password</label>
          <input id="reset-password-input" type="password" autocomplete="new-password" required minlength="8"></div>
        <button class="btn" type="submit" id="reset-submit">Reset password</button>
      </form>
    </div>
    <div class="auth-switch" id="auth-switch-row">Don't have an account? <button type="button" id="show-signup">Sign up</button></div>
  </div>
</div>

<div id="app">
  <header class="app-header">
    <div class="brand">Zilnet</div>
    <div class="header-actions">
      <button class="icon-btn" data-route="notifications" aria-label="Notifications" style="position:relative;">
        <span class="icon" style="--icon-url:url(/icons/IMG_1895.png);"></span>
        <span class="badge-dot hidden" id="notif-badge-mobile"></span>
      </button>
      <button class="icon-btn" data-route="messages" aria-label="Messages"><span class="icon" style="--icon-url:url(/icons/IMG_1883.png);"></span></button>
      <button class="icon-btn" data-route="more" aria-label="More"><span class="icon" style="--icon-url:url(/icons/IMG_1888.png);"></span></button>
    </div>
  </header>

  <div class="layout">
    <nav class="sidebar">
      <div class="brand">Zilnet</div>
      <div class="side-nav" id="side-nav"></div>
      <button class="btn side-create-btn" id="side-create-btn">Create</button>
      <div class="sidebar-user" id="sidebar-user">
        <img class="avatar" id="sidebar-avatar" src="" alt="" style="display:none;">
        <div class="avatar-fallback" id="sidebar-avatar-fallback" style="display:none;"></div>
        <div><div class="name" id="sidebar-name">—</div><div class="handle" id="sidebar-handle">—</div></div>
      </div>
    </nav>

    <div class="main-col" id="main-col"><main id="view-root"></main></div>
    <aside class="right-col" id="right-col"></aside>
  </div>

  <nav class="bottom-nav" id="bottom-nav"></nav>
</div>

<div id="toast-stack"></div>
<div id="modal-root"></div>

<script>
(function(){
"use strict";

/* ================= Icons ================= */
var ICONS = {
  home:'IMG_1881', search:'IMG_1882', create:'IMG_1899', reels:'IMG_1893', messages:'IMG_1883',
  profile:'IMG_1885', notification:'IMG_1895', settings:'IMG_1891', more:'IMG_1888',
  heart:'IMG_1886', comment:'IMG_1897', share:'IMG_1884', save:'IMG_1892', send:'IMG_1898',
  back:'IMG_1890', close:'IMG_1889', edit:'IMG_1879', camera:'IMG_1880'
};
function iconSpan(name, extraClass){
  return '<span class="icon'+(extraClass?(" "+extraClass):"")+'" style="--icon-url:url(/icons/'+ICONS[name]+'.png);"></span>';
}
function iconBtn(name, opts){
  opts = opts || {};
  return '<button class="icon-btn'+(opts.cls?(" "+opts.cls):"")+'"'+(opts.attrs||"")+' aria-label="'+esc(opts.label||name)+'">'+iconSpan(name)+'</button>';
}

/* ================= Utilities ================= */
function esc(str){
  if(str===null || str===undefined) return "";
  return String(str).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; });
}
function safeUrl(url){
  if(!url) return "";
  try{
    var u = String(url).trim();
    if(/^https?:\/\//i.test(u)) return u;
    if(/^\/[a-zA-Z0-9._\-\/%]*$/.test(u)) return u;
    return "";
  }catch(e){ return ""; }
}
function el(html){ var d = document.createElement("div"); d.innerHTML = html; return d.firstElementChild; }
function qs(sel, root){ return (root||document).querySelector(sel); }
function qsa(sel, root){ return Array.prototype.slice.call((root||document).querySelectorAll(sel)); }
function timeAgo(ts){
  if(!ts) return "";
  var d = new Date(ts);
  if(isNaN(d.getTime())) return "";
  var diff = (Date.now() - d.getTime())/1000;
  if(diff < 5) return "now";
  if(diff < 60) return Math.floor(diff)+"s";
  if(diff < 3600) return Math.floor(diff/60)+"m";
  if(diff < 86400) return Math.floor(diff/3600)+"h";
  if(diff < 604800) return Math.floor(diff/86400)+"d";
  return d.toLocaleDateString();
}
function debounce(fn, ms){
  var t;
  return function(){ var args = arguments, ctx = this; clearTimeout(t); t = setTimeout(function(){ fn.apply(ctx, args); }, ms); };
}
function toast(msg, type){
  var stack = qs("#toast-stack");
  var t = el('<div class="toast">'+esc(msg)+'</div>');
  if(type) t.classList.add(type);
  stack.appendChild(t);
  setTimeout(function(){ t.style.transition = "opacity .2s ease"; t.style.opacity = "0"; setTimeout(function(){ t.remove(); }, 220); }, 2800);
}
function initials(name){
  name = String(name||"").trim();
  if(!name) return "?";
  var parts = name.split(/\s+/);
  if(parts.length === 1) return parts[0].slice(0,2).toUpperCase();
  return (parts[0][0]+parts[1][0]).toUpperCase();
}
function avatarFallback(img){
  var fcls = "avatar-fallback " + (img.getAttribute("data-size-class")||"");
  var div = document.createElement("div");
  div.className = fcls.trim();
  div.textContent = img.getAttribute("data-initials") || "?";
  img.replaceWith(div);
}
window.__avatarFallback = avatarFallback;
function avatarHTML(url, name, sizeClass){
  url = safeUrl(url);
  var cls = "avatar"+(sizeClass?(" "+sizeClass):"");
  var fcls = "avatar-fallback"+(sizeClass?(" "+sizeClass):"");
  if(url){
    return '<img class="'+cls+'" src="'+esc(url)+'" alt="" data-size-class="'+esc(sizeClass||"")+'" data-initials="'+esc(initials(name))+'" onerror="window.__avatarFallback(this)">';
  }
  return '<div class="'+fcls+'">'+esc(initials(name))+'</div>';
}

/* ================= API helper ================= */
var pendingRequests = new Map();

async function api(path, opts){
  opts = opts || {};
  var method = opts.method || "GET";
  var isForm = opts.body instanceof FormData;
  var key = method+" "+path+(isForm ? "" : (opts.body ? JSON.stringify(opts.body) : ""));

  if(opts.dedupe !== false && pendingRequests.has(key)) return pendingRequests.get(key);

  var headers = {};
  if(!isForm && opts.body) headers["Content-Type"] = "application/json";

  var fetchOpts = { method: method, credentials: "same-origin", headers: headers };
  if(opts.signal) fetchOpts.signal = opts.signal;
  if(opts.body) fetchOpts.body = isForm ? opts.body : JSON.stringify(opts.body);

  var promise = (async function(){
    try{
      var res = await fetch(path, fetchOpts);
      var data = null, text = null;
      try{ text = await res.text(); data = text ? JSON.parse(text) : null; }catch(e){ data = null; }
      if(!res.ok){
        var message = (data && (data.error || data.message)) || null;
        throw { status: res.status, message: message || "Something went wrong. Please try again." };
      }
      return data;
    }catch(err){
      if(err && err.name === "AbortError") throw { status:0, aborted:true, message:"Request cancelled." };
      if(err && typeof err.status !== "undefined") throw err;
      throw { status:0, message:"Network error. Check your connection." };
    }finally{
      pendingRequests.delete(key);
    }
  })();

  pendingRequests.set(key, promise);
  return promise;
}

function handleApiError(err, opts){
  opts = opts || {};
  if(err && err.status === 401 && !opts.silentAuth){ showAuthScreen(); return; }
  toast((err && err.message) || "Something went wrong.", "error");
}

/* ================= Theme ================= */
function applyThemePref(pref){
  var resolved = pref;
  if(pref === "system"){
    resolved = (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
  }
  document.documentElement.setAttribute("data-theme", resolved);
  document.documentElement.setAttribute("data-theme-pref", pref);
}
function setThemePref(pref){
  try{ localStorage.setItem("zilnet-theme", pref); }catch(e){}
  applyThemePref(pref);
}
function getThemePref(){
  try{ return localStorage.getItem("zilnet-theme") || "system"; }catch(e){ return "system"; }
}
if(window.matchMedia){
  window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", function(){
    if(getThemePref() === "system") applyThemePref("system");
  });
}

/* ================= State ================= */
var state = { user: null, route: "home", routeParam: null, chatPollTimer: null };

var NAV_ITEMS = [
  { route:"home", label:"Home", icon:"home" },
  { route:"search", label:"Search", icon:"search" },
  { route:"reels", label:"Reels", icon:"reels" },
  { route:"messages", label:"Messages", icon:"messages" },
  { route:"notifications", label:"Notifications", icon:"notification" },
  { route:"profile", label:"Profile", icon:"profile" },
  { route:"settings", label:"Settings", icon:"settings" }
];
var BOTTOM_ITEMS = ["home","search","create","reels","profile"];

function buildNav(){
  var side = qs("#side-nav");
  side.innerHTML = NAV_ITEMS.map(function(item){
    return '<a href="#" class="side-link" data-route="'+item.route+'" style="position:relative;">'
      + iconSpan(item.icon) + ' ' + esc(item.label)
      + (item.route==="notifications" ? '<span class="side-badge hidden" id="notif-badge-desktop"></span>' : '')
      + '</a>';
  }).join("");

  var bottom = qs("#bottom-nav");
  bottom.innerHTML = BOTTOM_ITEMS.map(function(r){
    if(r === "create"){
      return '<button class="nav-item" data-route="create">'+iconSpan("create")+'</button>';
    }
    var item = NAV_ITEMS.filter(function(i){ return i.route===r; })[0];
    return '<button class="nav-item" data-route="'+r+'">'+iconSpan(item.icon)+'</button>';
  }).join("");

  qsa("[data-route]").forEach(function(btn){
    btn.addEventListener("click", function(e){
      e.preventDefault();
      var r = btn.getAttribute("data-route");
      if(r === "create"){ openComposerChoice(); return; }
      navigate(r);
    });
  });
  qs("#side-create-btn").addEventListener("click", openComposerChoice);
}

function setActiveNav(route){
  qsa(".side-link").forEach(function(l){ l.classList.toggle("active", l.getAttribute("data-route")===route); });
  qsa(".bottom-nav .nav-item").forEach(function(l){ l.classList.toggle("active-nav", l.getAttribute("data-route")===route); });
}

/* ================= Boot ================= */
async function boot(){
  buildNav();
  var params = new URLSearchParams(window.location.search);
  var resetToken = params.get("token");

  try{
    var me = await api("/api/me");
    state.user = (me && me.user) || null;
  }catch(err){ state.user = null; }

  qs("#splash").classList.add("hidden");

  if(resetToken){ showAuthScreen(); showResetForm(resetToken); return; }

  if(state.user && state.user.id) showApp();
  else showAuthScreen();
}

function showAuthScreen(){
  stopChatPolling();
  qs("#app").classList.remove("active");
  qs("#auth-screen").classList.remove("hidden");
  showLoginForm();
}
function showApp(){
  qs("#auth-screen").classList.add("hidden");
  qs("#app").classList.add("active");
  hydrateUserChrome();
  navigate("home");
  loadNotificationBadge();
}

/* ================= Auth forms ================= */
function clearAuthMessage(){ qs("#auth-message").innerHTML = ""; }
function authError(msg){ qs("#auth-message").innerHTML = '<div class="form-error">'+esc(msg)+'</div>'; }
function authNote(msg){ qs("#auth-message").innerHTML = '<div class="form-note">'+esc(msg)+'</div>'; }

function showLoginForm(){
  clearAuthMessage();
  qs("#auth-subtitle").textContent = "Sign in to continue";
  qs("#login-form").classList.remove("hidden");
  qs("#signup-form").classList.add("hidden");
  qs("#forgot-form").classList.add("hidden");
  qs("#reset-form").classList.add("hidden");
  qs("#auth-switch-row").classList.remove("hidden");
  qs("#auth-switch-row").innerHTML = 'Don\'t have an account? <button type="button" id="show-signup">Sign up</button>';
  qs("#show-signup").addEventListener("click", showSignupForm);
}
function showSignupForm(){
  clearAuthMessage();
  qs("#auth-subtitle").textContent = "Create your account";
  qs("#login-form").classList.add("hidden");
  qs("#signup-form").classList.remove("hidden");
  qs("#forgot-form").classList.add("hidden");
  qs("#reset-form").classList.add("hidden");
  qs("#auth-switch-row").innerHTML = 'Already have an account? <button type="button" id="show-login">Log in</button>';
  qs("#show-login").addEventListener("click", showLoginForm);
}
function showForgotForm(){
  clearAuthMessage();
  qs("#auth-subtitle").textContent = "Reset your password";
  qs("#login-form").classList.add("hidden");
  qs("#signup-form").classList.add("hidden");
  qs("#forgot-form").classList.remove("hidden");
  qs("#reset-form").classList.add("hidden");
  qs("#auth-switch-row").classList.add("hidden");
}
function showResetForm(token){
  clearAuthMessage();
  qs("#auth-subtitle").textContent = "Choose a new password";
  qs("#login-form").classList.add("hidden");
  qs("#signup-form").classList.add("hidden");
  qs("#forgot-form").classList.add("hidden");
  qs("#reset-form").classList.remove("hidden");
  qs("#auth-switch-row").classList.add("hidden");
  qs("#reset-form").dataset.token = token;
}
qs("#show-forgot").addEventListener("click", showForgotForm);
qs("#back-to-login-1").addEventListener("click", showLoginForm);

qs("#login-form").addEventListener("submit", async function(e){
  e.preventDefault();
  clearAuthMessage();
  var btn = qs("#login-submit"); btn.disabled = true;
  var identifier = qs("#login-identifier").value.trim();
  var password = qs("#login-password").value;
  try{
    var res = await api("/api/login", { method:"POST", body:{ username: identifier, password: password } });
    state.user = (res && res.user) || null;
    showApp();
  }catch(err){ authError(err.message || "Login failed. Check your credentials."); }
  finally{ btn.disabled = false; }
});

qs("#signup-form").addEventListener("submit", async function(e){
  e.preventDefault();
  clearAuthMessage();
  var btn = qs("#signup-submit"); btn.disabled = true;
  var username = qs("#signup-username").value.trim();
  var email = qs("#signup-email").value.trim();
  var password = qs("#signup-password").value;
  try{
    var res = await api("/api/signup", { method:"POST", body:{ username: username, email: email, password: password } });
    state.user = (res && res.user) || null;
    if(state.user && state.user.id) showApp();
  }catch(err){ authError(err.message || "Signup failed. Please try again."); }
  finally{ btn.disabled = false; }
});

qs("#forgot-form").addEventListener("submit", async function(e){
  e.preventDefault();
  clearAuthMessage();
  var btn = qs("#forgot-submit"); btn.disabled = true;
  var email = qs("#forgot-email").value.trim();
  try{
    var res = await api("/api/forgot-password", { method:"POST", body:{ email: email } });
    authNote((res && res.message) || "If that email exists, a reset link has been sent.");
  }catch(err){ authError(err.message || "Couldn't send reset link."); }
  finally{ btn.disabled = false; }
});

qs("#reset-form").addEventListener("submit", async function(e){
  e.preventDefault();
  clearAuthMessage();
  var btn = qs("#reset-submit"); btn.disabled = true;
  var token = qs("#reset-form").dataset.token;
  var password = qs("#reset-password-input").value;
  try{
    var res = await api("/api/reset-password", { method:"POST", body:{ token: token, password: password } });
    authNote((res && res.message) || "Password reset. You can log in now.");
    var url = new URL(window.location.href);
    url.searchParams.delete("token");
    window.history.replaceState({}, "", url.toString());
    setTimeout(showLoginForm, 1200);
  }catch(err){ authError(err.message || "Reset link is invalid or expired."); }
  finally{ btn.disabled = false; }
});

async function logout(){
  try{ await api("/api/logout", { method:"POST" }); }catch(e){}
  stopChatPolling();
  state.user = null;
  window.location.href = window.location.pathname;
}

/* ================= Chrome ================= */
function hydrateUserChrome(){
  var u = state.user || {};
  qs("#sidebar-name").textContent = u.display_name || u.username || "You";
  qs("#sidebar-handle").textContent = "@"+(u.username || "");
  var url = safeUrl(u.avatar_url);
  var img = qs("#sidebar-avatar"), fb = qs("#sidebar-avatar-fallback");
  if(url){ img.src = url; img.style.display=""; fb.style.display="none"; img.onerror=function(){ img.style.display="none"; fb.style.display="flex"; fb.textContent = initials(u.display_name||u.username); }; }
  else { img.style.display="none"; fb.style.display="flex"; fb.textContent = initials(u.display_name||u.username); }
}

/* ================= Routing ================= */
function navigate(route, param){
  stopChatPolling();
  state.route = route; state.routeParam = param;
  setActiveNav(route);
  qs("#right-col").innerHTML = "";
  var root = qs("#view-root");
  root.innerHTML = "";
  switch(route){
    case "home": renderHome(root); renderRightSuggestions(); break;
    case "search": renderSearch(root); break;
    case "reels": renderReels(root); break;
    case "messages": renderChats(root); break;
    case "notifications": renderNotifications(root); break;
    case "profile": renderProfile(root, param || (state.user && state.user.username)); break;
    case "settings": renderSettings(root); break;
    case "more": renderMore(root); break;
    default: renderHome(root); renderRightSuggestions();
  }
}

function skeletonPosts(n){
  var html = "";
  for(var i=0;i<n;i++){
    html += '<div class="skeleton-post"><div class="sk-head"><div class="skeleton sk-avatar"></div>'
      + '<div style="flex:1"><div class="skeleton sk-line" style="width:40%;margin-bottom:6px;"></div><div class="skeleton sk-line" style="width:25%;"></div></div></div>'
      + '<div class="skeleton" style="width:100%;height:280px;border-radius:14px;"></div></div>';
  }
  return html;
}
function emptyState(title, sub, actionsHtml){
  return '<div class="empty-state"><h3>'+esc(title)+'</h3><p>'+esc(sub)+'</p>'+(actionsHtml||"")+'</div>';
}

/* ================= HOME / FEED ================= */
function renderHome(root){
  root.innerHTML = '<div id="stories-slot"></div><div id="feed-slot">'+skeletonPosts(3)+'</div>';
  loadStories();
  loadFeed();
}

async function loadStories(){
  var slot = qs("#stories-slot");
  if(!slot) return;
  try{
    var data = await api("/api/stories/feed");
    var stories = (data && data.stories) || [];
    var html = '<div class="stories-row">';
    html += '<div class="story-item"><button class="story-add" id="add-story-btn">'+iconSpan("create")+'</button><div class="story-name">Add story</div></div>';
    stories.forEach(function(s){
      html += '<div class="story-item" data-story-id="'+esc(s.id)+'">'
        + '<div class="story-ring"><div class="story-avatar-wrap">'+avatarHTML(s.avatar_url, s.display_name||s.username, "")+'</div></div>'
        + '<div class="story-name">'+esc(s.display_name || s.username || "user")+'</div></div>';
    });
    html += '</div>';
    slot.innerHTML = html;
    var addBtn = qs("#add-story-btn");
    if(addBtn) addBtn.addEventListener("click", openStoryChoice);
    qsa(".story-item[data-story-id]", slot).forEach(function(item, idx){
      item.addEventListener("click", function(){ openStoryViewer(stories, idx); });
    });
  }catch(err){ slot.innerHTML = ""; }
}

async function loadFeed(){
  var slot = qs("#feed-slot");
  if(!slot) return;
  try{
    var data = await api("/api/feed");
    var posts = (data && data.posts) || [];
    if(posts.length === 0){
      slot.innerHTML = emptyState("Your feed is empty", "Follow people to see their posts here.",
        '<button class="btn btn-sm" id="feed-discover-btn">Find people to follow</button>');
      var db = qs("#feed-discover-btn");
      if(db) db.addEventListener("click", function(){ navigate("search"); });
      return;
    }
    slot.innerHTML = posts.map(renderPostCard).join("");
    bindPostCardEvents(slot);
  }catch(err){
    slot.innerHTML = emptyState("Couldn't load your feed", "Check your connection and try again.",
      '<button class="btn btn-sm" id="feed-retry-btn">Retry</button>');
    var rb = qs("#feed-retry-btn");
    if(rb) rb.addEventListener("click", loadFeed);
    handleApiError(err, { silentAuth:true });
  }
}

function mediaHtml(mediaUrl, mediaType){
  var url = safeUrl(mediaUrl);
  var type = String(mediaType||"").toLowerCase();
  if(!url) return "";
  if(type.indexOf("video") === 0) return '<div class="post-media"><video controls preload="metadata" playsinline src="'+esc(url)+'"></video></div>';
  if(type.indexOf("audio") === 0) return '<div class="post-media"><audio controls preload="metadata" src="'+esc(url)+'"></audio></div>';
  return '<div class="post-media"><img loading="lazy" src="'+esc(url)+'" alt=""></div>';
}

function renderPostCard(post){
  var id = post.id;
  var user = post.user || {};
  var username = user.username || "user";
  var mine = state.user && Number(post.user_id) === Number(state.user.id);
  return '<article class="post" data-post-id="'+esc(id)+'" data-owner="'+(mine?"1":"0")+'">'
    + '<div class="post-head">'
      + avatarHTML(user.avatar_url, user.display_name||username, "").replace('class="avatar', 'data-user-link="'+esc(username)+'" style="cursor:pointer;" class="avatar')
      + '<div class="who" data-user-link="'+esc(username)+'"><div class="username">'+esc(user.display_name || username)+'</div><div class="time">'+esc(timeAgo(post.created_at))+'</div></div>'
      + (mine ? '<button class="icon-btn icon-sm post-delete-btn" aria-label="Delete post">'+iconSpan("close")+'</button>' : '')
    + '</div>'
    + mediaHtml(post.media_url, post.media_type)
    + (post.content ? '<div class="post-caption"><span class="cap-user">'+esc(username)+'</span>'+esc(post.content)+'</div>' : '')
    + '<div class="post-actions">'
      + '<button class="action-btn like-btn'+(post.liked?" on":"")+'">'+iconSpan("heart")+'<span class="like-count">'+Number(post.likes_count||0)+'</span></button>'
      + '<button class="action-btn comment-btn">'+iconSpan("comment")+'<span class="comment-count">'+Number(post.comments_count||0)+'</span></button>'
      + '<button class="action-btn share-btn">'+iconSpan("share")+'</button>'
      + '<span class="spacer"></span>'
      + '<button class="action-btn save-btn'+(post.saved?" on":"")+'">'+iconSpan("save")+'</button>'
    + '</div></article>';
}

function bindPostCardEvents(scope){
  qsa(".post", scope).forEach(function(card){
    var postId = card.getAttribute("data-post-id");
    qsa("[data-user-link]", card).forEach(function(node){
      node.addEventListener("click", function(){ navigate("profile", node.getAttribute("data-user-link")); });
    });
    var likeBtn = qs(".like-btn", card);
    if(likeBtn) likeBtn.addEventListener("click", function(){ toggleLike(postId, likeBtn); });
    var commentBtn = qs(".comment-btn", card);
    if(commentBtn) commentBtn.addEventListener("click", function(){ openComments(postId); });
    var shareBtn = qs(".share-btn", card);
    if(shareBtn) shareBtn.addEventListener("click", function(){ sharePost(postId); });
    var saveBtn = qs(".save-btn", card);
    if(saveBtn) saveBtn.addEventListener("click", function(){ toggleSave(postId, saveBtn); });
    var delBtn = qs(".post-delete-btn", card);
    if(delBtn) delBtn.addEventListener("click", function(){ confirmDeletePost(postId, card); });
  });
}

async function toggleLike(postId, btn){
  try{
    var res = await api("/api/posts/"+encodeURIComponent(postId)+"/like", { method:"POST" });
    btn.classList.toggle("on", !!res.liked);
    qs(".like-count", btn).textContent = Number(res.likes_count||0);
  }catch(err){ handleApiError(err); }
}
async function toggleSave(postId, btn){
  try{
    var res = await api("/api/posts/"+encodeURIComponent(postId)+"/save", { method:"POST" });
    btn.classList.toggle("on", !!res.saved);
    toast(res.saved ? "Saved" : "Removed from saved");
  }catch(err){ handleApiError(err); }
}
function confirmDeletePost(postId, card){
  openConfirm("Delete post?", "This can't be undone.", "Delete", async function(){
    try{
      await api("/api/posts/"+encodeURIComponent(postId), { method:"DELETE" });
      card.remove();
      toast("Post deleted");
    }catch(err){ handleApiError(err); }
  });
}
async function sharePost(postId){
  var url = window.location.origin + window.location.pathname + "?post=" + encodeURIComponent(postId);
  if(navigator.share){
    try{ await navigator.share({ url: url, title: "ZILNET" }); }catch(e){}
  }else{
    try{ await navigator.clipboard.writeText(url); toast("Link copied to clipboard"); }
    catch(e){ toast("Couldn't copy link", "error"); }
  }
}

/* ================= Confirm dialog ================= */
function openConfirm(title, body, actionLabel, onConfirm){
  var html = '<div class="confirm-box"><h3 style="margin:0 0 8px;font-size:16px;">'+esc(title)+'</h3><p>'+esc(body)+'</p>'
    + '<div class="confirm-actions"><button class="btn secondary" id="confirm-cancel">Cancel</button><button class="btn danger" id="confirm-ok">'+esc(actionLabel)+'</button></div></div>';
  var overlay = openModal(html);
  qs("#confirm-cancel", overlay).addEventListener("click", closeModal);
  qs("#confirm-ok", overlay).addEventListener("click", async function(){ closeModal(); await onConfirm(); });
}

/* ================= Modal helpers ================= */
function openModal(innerHtml){
  var overlay = el('<div class="modal-overlay"></div>');
  var panel = el('<div class="modal-panel">'+innerHtml+'</div>');
  overlay.appendChild(panel);
  overlay.addEventListener("click", function(e){ if(e.target === overlay) closeModal(); });
  qs("#modal-root").appendChild(overlay);
  return overlay;
}
function closeModal(){ qs("#modal-root").innerHTML = ""; }

/* ================= COMMENTS ================= */
async function openComments(postId){
  var html = '<div class="modal-head"><h3>Comments</h3>'+iconBtn("close",{attrs:' id="close-comments"',label:"Close"})+'</div>'
    + '<div class="modal-body" id="comments-body"><div class="spinner-center"><div class="spinner"></div></div></div>'
    + '<div class="modal-foot"><div class="comment-compose"><input id="comment-input" type="text" placeholder="Add a comment…" maxlength="2000">'
    + iconBtn("send",{attrs:' id="send-comment"',label:"Send"})+'</div></div>';
  var overlay = openModal(html);
  qs("#close-comments", overlay).addEventListener("click", closeModal);

  async function load(){
    try{
      var data = await api("/api/posts/"+encodeURIComponent(postId)+"/comments");
      var comments = (data && data.comments) || [];
      var body = qs("#comments-body", overlay);
      if(comments.length === 0){ body.innerHTML = emptyState("No comments yet", "Be the first to say something.", ""); return; }
      body.innerHTML = comments.map(function(c){
        return '<div class="comment-row">'+avatarHTML(c.avatar_url, c.display_name||c.username, "avatar-sm")
          + '<div class="meta"><div class="text"><b>'+esc(c.display_name || c.username || "user")+'</b>'+esc(c.content||"")+'</div><div class="time">'+esc(timeAgo(c.created_at))+'</div></div></div>';
      }).join("");
    }catch(err){ qs("#comments-body", overlay).innerHTML = emptyState("Couldn't load comments", "Please try again.", ""); handleApiError(err); }
  }
  load();

  async function send(){
    var input = qs("#comment-input", overlay);
    var content = input.value.trim();
    if(!content) return;
    var btn = qs("#send-comment", overlay);
    btn.disabled = true;
    try{
      await api("/api/posts/"+encodeURIComponent(postId)+"/comments", { method:"POST", body:{ content: content } });
      input.value = "";
      var countEl = qs('.post[data-post-id="'+CSS.escape(String(postId))+'"] .comment-count');
      if(countEl) countEl.textContent = (parseInt(countEl.textContent,10)||0) + 1;
      load();
    }catch(err){ handleApiError(err); }
    finally{ btn.disabled = false; }
  }
  qs("#send-comment", overlay).addEventListener("click", send);
  qs("#comment-input", overlay).addEventListener("keydown", function(e){ if(e.key === "Enter") send(); });
}

/* ================= SEARCH ================= */
function renderSearch(root, opts){
  opts = opts || {};
  root.innerHTML = '<div class="search-bar">'+iconSpan("search")+'<input id="search-input" type="text" placeholder="Search Zilnet" autocomplete="off"></div><div id="search-results"></div>';
  var input = qs("#search-input");
  var resultsEl = qs("#search-results");
  var controller = null;

  var doSearch = debounce(async function(q){
    if(!q){ resultsEl.innerHTML = ""; return; }
    if(controller) controller.abort();
    controller = new AbortController();
    resultsEl.innerHTML = '<div class="spinner-center"><div class="spinner"></div></div>';
    try{
      var data = await api("/api/search?q="+encodeURIComponent(q), { signal: controller.signal, dedupe:false });
      var results = (data && data.users) || [];
      if(opts.excludeIds) results = results.filter(function(u){ return opts.excludeIds.indexOf(Number(u.id)) === -1; });
      if(results.length === 0){ resultsEl.innerHTML = emptyState("No users found", "Try a different search term.", ""); return; }
      resultsEl.innerHTML = results.map(function(u){
        return '<div class="search-result" data-username="'+esc(u.username)+'" data-id="'+esc(u.id)+'">'
          + avatarHTML(u.avatar_url, u.display_name||u.username, "")
          + '<div class="meta"><div class="name">'+esc(u.display_name || u.username)+'</div><div class="sub">@'+esc(u.username)+'</div></div>'
          + (opts.onPick ? '' : '') + '</div>';
      }).join("");
      qsa(".search-result", resultsEl).forEach(function(row){
        row.addEventListener("click", function(){
          if(opts.onPick){ opts.onPick({ id: Number(row.getAttribute("data-id")), username: row.getAttribute("data-username") }); }
          else{ navigate("profile", row.getAttribute("data-username")); }
        });
      });
    }catch(err){
      if(err && err.aborted) return;
      resultsEl.innerHTML = emptyState("Search failed", "Please try again.", "");
      handleApiError(err);
    }
  }, 350);

  input.addEventListener("input", function(){ doSearch(input.value.trim()); });
  if(!opts.noAutofocus) setTimeout(function(){ input.focus(); }, 50);
  return input;
}

/* ================= CHATS ================= */
function otherMember(chat){
  if(!chat || !Array.isArray(chat.members)) return null;
  var others = chat.members.filter(function(m){ return !state.user || Number(m.id) !== Number(state.user.id); });
  return others[0] || chat.members[0] || null;
}

async function renderChats(root){
  root.innerHTML = '<div class="row between"><div class="section-title">Messages</div></div><div id="chats-slot"><div class="spinner-center"><div class="spinner"></div></div></div>';
  try{
    var data = await api("/api/chats");
    var chats = (data && data.chats) || [];
    var slot = qs("#chats-slot");
    if(chats.length === 0){ slot.innerHTML = emptyState("No chats yet", "Start a conversation from someone's profile.", ""); return; }
    slot.innerHTML = chats.map(function(c){
      var isGroup = Number(c.is_group) === 1;
      var other = isGroup ? null : otherMember(c);
      var name = isGroup ? (c.name || "Group") : (other ? (other.display_name || other.username) : "Conversation");
      var avatarUrl = isGroup ? "" : (other ? other.avatar_url : "");
      return '<div class="chat-list-row" data-chat-id="'+esc(c.id)+'">'
        + avatarHTML(avatarUrl, name, "")
        + '<div class="meta"><div class="name">'+esc(name)+'</div><div class="preview">'+esc(c.last_message || "No messages yet")+'</div></div>'
        + '<div class="time">'+esc(timeAgo(c.last_message_at || c.created_at))+'</div></div>';
    }).join("");
    qsa(".chat-list-row", slot).forEach(function(row){ row.addEventListener("click", function(){ openChat(row.getAttribute("data-chat-id")); }); });
  }catch(err){ qs("#chats-slot").innerHTML = emptyState("Couldn't load messages", "Please try again.", ""); handleApiError(err); }
}

function stopChatPolling(){ if(state.chatPollTimer){ clearInterval(state.chatPollTimer); state.chatPollTimer = null; } }

async function openChat(chatId){
  var html = '<div class="modal-head">'+iconBtn("back",{attrs:' id="close-chat"',label:"Back"})
    + '<div class="chat-header-title"><div class="dn" id="chat-title-name">Chat</div><div class="un" id="chat-title-username"></div></div>'
    + '<span style="width:44px;"></span></div>'
    + '<div class="modal-body" style="padding:0;flex:1;display:flex;flex-direction:column;"><div class="chat-window">'
    + '<div class="chat-messages" id="chat-messages"><div class="spinner-center"><div class="spinner"></div></div></div>'
    + '<div class="chat-input-row"><input id="chat-input" type="text" placeholder="Message…" maxlength="5000">'+iconBtn("send",{attrs:' id="chat-send"',label:"Send"})+'</div>'
    + '</div></div>';

  var overlay = el('<div class="fullscreen-panel"></div>');
  overlay.innerHTML = html;
  qs("#modal-root").appendChild(overlay);
  qs("#close-chat", overlay).addEventListener("click", function(){ stopChatPolling(); overlay.remove(); });

  async function loadChatMeta(){
    try{
      var data = await api("/api/chats/"+encodeURIComponent(chatId));
      var chat = (data && data.chat) || {};
      var isGroup = Number(chat.is_group) === 1;
      if(isGroup){
        qs("#chat-title-name", overlay).textContent = chat.name || "Group";
        qs("#chat-title-username", overlay).textContent = (chat.members||[]).length + " members";
      }else{
        var other = otherMember(chat);
        qs("#chat-title-name", overlay).textContent = other ? (other.display_name || other.username) : "Chat";
        qs("#chat-title-username", overlay).textContent = other ? ("@"+other.username) : "";
      }
    }catch(err){}
  }
  async function loadMessages(silent){
    try{
      var data = await api("/api/chats/"+encodeURIComponent(chatId)+"/messages", { dedupe:false });
      var messages = (data && data.messages) || [];
      var box = qs("#chat-messages", overlay);
      if(!box) return;
      var wasAtBottom = (box.scrollTop + box.clientHeight) >= (box.scrollHeight - 40);
      if(messages.length === 0){ box.innerHTML = emptyState("No messages yet", "Say hello.", ""); return; }
      box.innerHTML = messages.map(function(m){
        var mine = state.user && Number(m.user_id) === Number(state.user.id);
        var mediaUrl = safeUrl(m.media_url);
        return '<div class="msg-bubble '+(mine?"mine":"theirs")+'">'
          + (m.content ? esc(m.content) : "")
          + (mediaUrl ? '<img src="'+esc(mediaUrl)+'" alt="">' : "")
          + '</div>';
      }).join("");
      if(!silent || wasAtBottom) box.scrollTop = box.scrollHeight;
    }catch(err){
      if(!silent){ qs("#chat-messages", overlay).innerHTML = emptyState("Couldn't load messages", "Please try again.", ""); handleApiError(err); }
    }
  }
  loadChatMeta();
  loadMessages(false);
  stopChatPolling();
  state.chatPollTimer = setInterval(function(){ loadMessages(true); }, 4000);

  async function send(){
    var input = qs("#chat-input", overlay);
    var content = input.value.trim();
    if(!content) return;
    input.value = "";
    try{
      await api("/api/chats/"+encodeURIComponent(chatId)+"/messages", { method:"POST", body:{ content: content } });
      loadMessages(false);
    }catch(err){ handleApiError(err); }
  }
  qs("#chat-send", overlay).addEventListener("click", send);
  qs("#chat-input", overlay).addEventListener("keydown", function(e){ if(e.key==="Enter") send(); });
}

/* ================= UPLOAD ================= */
function uploadFile(file, onProgress){
  var form = new FormData();
  form.append("file", file);
  return new Promise(function(resolve, reject){
    var xhr = new XMLHttpRequest();
    xhr.open("POST", "/api/upload");
    xhr.withCredentials = true;
    xhr.upload.onprogress = function(e){ if(onProgress && e.lengthComputable) onProgress(Math.round((e.loaded/e.total)*100)); };
    xhr.onload = function(){
      var data = null;
      try{ data = JSON.parse(xhr.responseText); }catch(e){}
      if(xhr.status >= 200 && xhr.status < 300) resolve(data || {});
      else reject({ status:xhr.status, message: (data && (data.error||data.message)) || "Upload failed." });
    };
    xhr.onerror = function(){ reject({ status:0, message:"Network error during upload." }); };
    xhr.send(form);
  });
}

  var uploadedUrl = null, uploadedType = null;
  var submitBtn = qs("#composer-submit", overlay);
  var captionInput = qs("#composer-caption", overlay);

  function refreshSubmitState(){
    if(cfg.requireMedia){ submitBtn.disabled = !uploadedUrl; return; }
    var hasText = captionInput && captionInput.value.trim().length > 0;
    submitBtn.disabled = !(hasText || uploadedUrl);

  qs("#composer-pick-btn", overlay).addEventListener("click", function(){ qs("#composer-file", overlay).click(); });

  submitBtn.addEventListener("click", async function(){
    var btn = this; btn.disabled = true;
    var content = captionInput ? captionInput.value.trim() : "";

        }).join("") + '</div>'
      + '<div class="story-viewer-head">' + avatarHTML(s.avatar_url, s.display_name||s.username, "avatar-sm")
        + '<div class="who">'+esc(s.display_name || s.username || "user")+'</div><div class="time">'+esc(timeAgo(s.created_at))+'</div>'
        + iconBtn("close",{attrs:' id="story-close"',label:"Close"}) + '</div>'
      + '<div class="story-viewer-body">' + bodyHtml
        + '<div class="story-tap-zone" style="left:0;" id="story-prev"></div>'
        + '<div class="story-tap-zone" style="right:0;" id="story-next"></div>'
      + '</div>';
    qs("#story-close", overlay).addEventListener("click", close);
    qs("#story-prev", overlay).addEventListener("click", function(){ goto(idx-1); });
    qs("#story-next", overlay).addEventListener("click", function(){ goto(idx+1); });
    var video = qs("video", overlay);
    clearTimeout(timer);
    if(video){
      video.addEventListener("ended", function(){ goto(idx+1); });
    }else{
      timer = setTimeout(function(){ goto(idx+1); }, DURATION);
    }
  }
  function goto(newIdx){
    if(newIdx < 0){ close(); return; }
    if(newIdx >= stories.length){ close(); return; }
    idx = newIdx;
    render();
  }
  function close(){ clearTimeout(timer); overlay.remove(); }
  render();
}

/* ================= SETTINGS ================= */
async function renderSettings(root){
  root.innerHTML = '<div class="section-title">Settings</div><div id="settings-slot"></div>';
  var slot = qs("#settings-slot");

  var themePref = getThemePref();
  var html = '<div class="settings-group"><h4>Appearance</h4>'
    + '<div class="settings-row"><span>Theme</span><div class="segmented" id="theme-segmented" style="width:190px;">'
      + '<button data-v="light" class="'+(themePref==="light"?"active":"")+'">Light</button>'
      + '<button data-v="dark" class="'+(themePref==="dark"?"active":"")+'">Dark</button>'
      + '<button data-v="system" class="'+(themePref==="system"?"active":"")+'">System</button>'
    + '</div></div></div>'
    + '<div class="settings-group"><h4>Privacy</h4><div id="privacy-slot"><div class="spinner-center"><div class="spinner"></div></div></div></div>'
    + '<div class="settings-group"><h4>Notifications</h4><div class="settings-row"><span class="text-dim">No specific notification preferences are currently supported.</span></div></div>'
    + '<div class="settings-group"><h4>Security</h4><div class="settings-row"><span class="text-dim">Changing your password while logged in isn\'t supported yet. Use "Forgot password" from the login screen instead.</span></div></div>'
    + '<div class="settings-group"><h4>Account</h4><div class="settings-row"><span>Log out</span><button class="btn btn-sm secondary" id="settings-logout">Log out</button></div></div>';
  slot.innerHTML = html;

  qsa("#theme-segmented button", slot).forEach(function(btn){
    btn.addEventListener("click", function(){
      setThemePref(btn.getAttribute("data-v"));
      qsa("#theme-segmented button", slot).forEach(function(b){ b.classList.toggle("active", b===btn); });
    });
  });
  qs("#settings-logout", slot).addEventListener("click", logout);

  async function loadPrivacy(){
    var pSlot = qs("#privacy-slot", slot);
    try{
      var data = await api("/api/settings");
      var settings = (data && data.settings) || {};
      pSlot.innerHTML = ''
        + '<div class="settings-row"><span>Profile visibility</span><select id="setting-visibility">'
          + '<option value="public"'+(settings.profile_visibility==="public"?" selected":"")+'>Public</option>'
          + '<option value="private"'+(settings.profile_visibility==="private"?" selected":"")+'>Private</option>'
        + '</select></div>'
        + '<div class="settings-row"><span>Who can message you</span><select id="setting-message-privacy">'
          + '<option value="everyone"'+(settings.message_privacy==="everyone"?" selected":"")+'>Everyone</option>'
          + '<option value="followers"'+(settings.message_privacy==="followers"?" selected":"")+'>Followers</option>'
          + '<option value="nobody"'+(settings.message_privacy==="nobody"?" selected":"")+'>Nobody</option>'
        + '</select></div>';
      qs("#setting-visibility", pSlot).addEventListener("change", saveSettings);
      qs("#setting-message-privacy", pSlot).addEventListener("change", saveSettings);
    }catch(err){ pSlot.innerHTML = emptyState("Couldn't load settings", "Please try again.", ""); handleApiError(err); }
  }
  async function saveSettings(){
    try{
      await api("/api/settings", { method:"POST", body:{
        profile_visibility: qs("#setting-visibility", slot).value,
        message_privacy: qs("#setting-message-privacy", slot).value
      }});
      toast("Settings saved");
      loadPrivacy();
    }catch(err){ handleApiError(err); loadPrivacy(); }
  }
  loadPrivacy();
}

/* ================= MORE ================= */
function renderMore(root){
  root.innerHTML = '<div class="section-title">More</div><div class="settings-group">'
    + '<div class="settings-row" id="more-groups" style="cursor:pointer;"><span>Create a group</span><span class="text-dim">›</span></div>'
    + '<div class="settings-row" id="more-settings" style="cursor:pointer;"><span>Settings</span><span class="text-dim">›</span></div>'
    + '<div class="settings-row" id="more-logout" style="cursor:pointer;"><span>Log out</span><span class="text-dim">›</span></div>'
    + '</div>';
  qs("#more-settings").addEventListener("click", function(){ navigate("settings"); });
  qs("#more-logout").addEventListener("click", logout);
  qs("#more-groups").addEventListener("click", openGroupComposer);
}

function openGroupComposer(){
  var html = '<div class="modal-head"><h3>New group</h3>'+iconBtn("close",{attrs:' id="close-group"',label:"Close"})+'</div>'
    + '<div class="modal-body">'
      + '<div class="field"><label>Group name</label><input id="group-name" type="text" maxlength="100"></div>'
      + '<div class="field"><label>Add members</label><div id="group-search-slot"></div>'
      + '<div id="group-selected"></div></div>'
    + '</div>'
    + '<div class="modal-foot"><button class="btn" id="group-submit">Create group</button></div>';
  var overlay = openModal(html);
  qs("#close-group", overlay).addEventListener("click", closeModal);

  var selected = [];
  function renderSelected(){
    qs("#group-selected", overlay).innerHTML = selected.map(function(u){
      return '<span class="chip">@'+esc(u.username)+' <button data-id="'+esc(u.id)+'">'+iconSpan("close","icon-sm")+'</button></span>';
    }).join("");
    qsa("#group-selected .chip button", overlay).forEach(function(btn){
      btn.addEventListener("click", function(){
        selected = selected.filter(function(u){ return String(u.id) !== btn.getAttribute("data-id"); });
        renderSelected();
      });
    });
  }
  renderSearch(qs("#group-search-slot", overlay), {
    noAutofocus:true,
    excludeIds: [],
    onPick: function(u){
      if(!selected.some(function(x){ return x.id === u.id; })) selected.push(u);
      renderSelected();
    }
  });

  qs("#group-submit", overlay).addEventListener("click", async function(){
    var name = qs("#group-name", overlay).value.trim();
    if(!name){ toast("Enter a group name", "error"); return; }
    if(selected.length < 1){ toast("Add at least one member", "error"); return; }
    var btn = this; btn.disabled = true;
    try{
      await api("/api/groups", { method:"POST", body:{ name: name, userIds: selected.map(function(u){ return u.id; }) } });
      toast("Group created");
      closeModal();
      navigate("messages");
    }catch(err){ handleApiError(err); }
    finally{ btn.disabled = false; }
  });
}

/* ================= Init ================= */
boot();

})();
</script>
