<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>ZILNET</title>
<style>
  :root{
    --bg:#0a0a0c;
    --bg-elev:#131317;
    --card:#151519;
    --border:#232329;
    --border-soft:#1c1c21;
    --text:#eceef1;
    --text-dim:#95979f;
    --text-faint:#5c5e66;
    --accent:#5b7cff;
    --accent-dim:#3a4a99;
    --danger:#ff5c5c;
    --success:#3ddc84;
    --radius-s:8px;
    --radius-m:14px;
    --radius-l:20px;
    --icon-box:26px;
    --safe-bottom:env(safe-area-inset-bottom, 0px);
    --safe-top:env(safe-area-inset-top, 0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
    width:100%;
  }
  img,video{max-width:100%;}
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;}
  input,textarea,select{font-family:inherit;}
  ::selection{background:var(--accent-dim);color:#fff;}

  .hidden{display:none !important;}
  .visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);}

  button{cursor:pointer;}
  button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible{
    outline:2px solid var(--accent);
    outline-offset:2px;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.01ms !important; transition-duration:0.01ms !important;}
  }

  /* ---------- Loading Splash ---------- */
  #splash{
    position:fixed;inset:0;background:var(--bg);
    display:flex;align-items:center;justify-content:center;z-index:9999;
  }
  #splash .mark{
    font-size:22px;font-weight:700;letter-spacing:0.02em;color:var(--text);
    display:flex;align-items:center;gap:10px;
  }
  #splash .dot{
    width:8px;height:8px;border-radius:50%;background:var(--accent);
    animation:pulse 1.1s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{opacity:0.25;transform:scale(0.8);}50%{opacity:1;transform:scale(1);}}

  /* ---------- Auth screen ---------- */
  #auth-screen{
    min-height:100vh;min-height:100dvh;
    display:flex;align-items:center;justify-content:center;
    padding:24px;
  }
  .auth-box{
    width:100%;max-width:380px;
  }
  .auth-brand{
    font-size:28px;font-weight:700;margin-bottom:6px;letter-spacing:-0.01em;
  }
  .auth-sub{color:var(--text-dim);font-size:14px;margin-bottom:28px;}
  .auth-card{
    background:var(--card);border:1px solid var(--border);border-radius:var(--radius-l);
    padding:22px;
  }
  .field{margin-bottom:14px;}
  .field label{
    display:block;font-size:12.5px;color:var(--text-dim);margin-bottom:6px;
  }
  .field input{
    width:100%;background:var(--bg-elev);border:1px solid var(--border);color:var(--text);
    border-radius:var(--radius-s);padding:12px 13px;font-size:15px;transition:border-color .15s;
  }
  .field input:focus{border-color:var(--accent);}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    background:var(--accent);color:#fff;border:none;border-radius:var(--radius-s);
    padding:12px 16px;font-size:15px;font-weight:600;width:100%;
    transition:transform .12s ease, filter .15s ease;
  }
  .btn:active{transform:scale(0.97);}
  .btn:hover{filter:brightness(1.08);}
  .btn.secondary{background:transparent;border:1px solid var(--border);color:var(--text);}
  .btn.danger{background:var(--danger);}
  .btn[disabled]{opacity:0.55;pointer-events:none;}
  .btn-sm{padding:8px 12px;font-size:13px;width:auto;}
  .auth-switch{
    text-align:center;margin-top:16px;font-size:13.5px;color:var(--text-dim);
  }
  .auth-switch button{background:none;border:none;color:var(--accent);font-size:13.5px;font-weight:600;padding:0;}
  .auth-links{display:flex;justify-content:space-between;margin-top:6px;}
  .link-btn{background:none;border:none;color:var(--text-dim);font-size:12.5px;padding:0;}
  .link-btn:hover{color:var(--text);}
  .form-error{
    background:rgba(255,92,92,0.1);border:1px solid rgba(255,92,92,0.3);color:#ff8888;
    font-size:13px;padding:10px 12px;border-radius:var(--radius-s);margin-bottom:14px;
  }
  .form-success{
    background:rgba(61,220,132,0.1);border:1px solid rgba(61,220,132,0.3);color:#6ee8a5;
    font-size:13px;padding:10px 12px;border-radius:var(--radius-s);margin-bottom:14px;
  }

  /* ---------- App shell ---------- */
  #app{
    display:none;
    min-height:100vh;min-height:100dvh;
  }
  #app.active{display:block;}

  .app-header{
    position:sticky;top:0;z-index:50;
    display:flex;align-items:center;justify-content:space-between;
    padding:calc(10px + var(--safe-top)) 16px 10px;
    background:rgba(10,10,12,0.9);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--border-soft);
  }
  .app-header .brand{font-size:19px;font-weight:700;letter-spacing:-0.01em;}
  .header-actions{display:flex;gap:6px;align-items:center;}

  .layout{
    display:flex;max-width:1180px;margin:0 auto;
  }
  .sidebar{
    width:250px;flex-shrink:0;
    position:sticky;top:0;align-self:flex-start;
    height:100vh;height:100dvh;
    padding:20px 12px;
    border-right:1px solid var(--border-soft);
    display:flex;flex-direction:column;
  }
  .sidebar .brand{font-size:22px;font-weight:700;padding:8px 12px 22px;letter-spacing:-0.01em;}
  .side-nav{display:flex;flex-direction:column;gap:2px;flex:1;}
  .side-link{
    display:flex;align-items:center;gap:14px;padding:11px 12px;border-radius:var(--radius-s);
    color:var(--text-dim);font-size:15px;font-weight:500;transition:background .12s;
  }
  .side-link:hover{background:var(--bg-elev);color:var(--text);}
  .side-link.active{color:var(--text);background:var(--bg-elev);}
  .side-link .icon-box{width:24px;height:24px;}
  .side-create-btn{margin:14px 4px 4px;}
  .sidebar-user{
    display:flex;align-items:center;gap:10px;padding:10px;border-radius:var(--radius-s);
    border:1px solid var(--border-soft);margin-top:8px;
  }
  .sidebar-user .name{font-size:13.5px;font-weight:600;}
  .sidebar-user .handle{font-size:12px;color:var(--text-dim);}

  .main-col{
    flex:1;min-width:0;
    max-width:600px;margin:0 auto;
    border-right:1px solid var(--border-soft);
    min-height:100vh;
  }
  .right-col{
    width:320px;flex-shrink:0;padding:20px 16px;
  }

  main{padding-bottom:90px;}

  /* Icon system */
  .icon-box{
    width:var(--icon-box);height:var(--icon-box);
    display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .icon-box img{
    width:100%;height:100%;object-fit:contain;
    filter:brightness(0) saturate(100%) invert(63%) sepia(6%) saturate(200%) opacity(0.85);
    transition:filter .15s ease, transform .12s ease;
  }
  .active .icon-box img, .icon-box.active img{
    filter:brightness(0) saturate(100%) invert(46%) sepia(65%) saturate(2500%) hue-rotate(210deg) brightness(1.05);
  }
  .tap-target{
    width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;
    border-radius:50%;border:none;background:transparent;transition:background .12s, transform .1s;
  }
  .tap-target:active{transform:scale(0.9);background:var(--bg-elev);}

  /* Bottom nav (mobile) */
  .bottom-nav{
    display:none;
  }

  /* Stories */
  .stories-row{
    display:flex;gap:14px;padding:14px 16px;overflow-x:auto;
    border-bottom:1px solid var(--border-soft);
    scrollbar-width:none;
  }
  .stories-row::-webkit-scrollbar{display:none;}
  .story-item{display:flex;flex-direction:column;align-items:center;gap:6px;flex-shrink:0;width:64px;}
  .story-ring{
    width:58px;height:58px;border-radius:50%;padding:2px;
    background:linear-gradient(135deg,var(--accent),#9a6bff);
    display:flex;align-items:center;justify-content:center;
  }
  .story-ring.seen{background:var(--border);}
  .story-ring .story-avatar{
    width:100%;height:100%;border-radius:50%;object-fit:cover;border:2px solid var(--bg);
    background:var(--bg-elev);
  }
  .story-item .story-name{font-size:11px;color:var(--text-dim);max-width:64px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .story-add{
    width:58px;height:58px;border-radius:50%;border:1.5px dashed var(--border);
    display:flex;align-items:center;justify-content:center;background:var(--bg-elev);
  }

  /* Feed / Post card */
  .post{
    border-bottom:1px solid var(--border-soft);
    padding:14px 16px;
  }
  .post-head{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .avatar{
    width:38px;height:38px;border-radius:50%;object-fit:cover;background:var(--bg-elev);
    border:1px solid var(--border-soft);flex-shrink:0;
  }
  .avatar-lg{width:84px;height:84px;}
  .post-head .who{flex:1;min-width:0;}
  .post-head .username{font-size:14.5px;font-weight:600;}
  .post-head .time{font-size:12px;color:var(--text-faint);}
  .post-media{
    width:100%;border-radius:var(--radius-m);overflow:hidden;background:var(--bg-elev);
    margin-bottom:10px;border:1px solid var(--border-soft);
  }
  .post-media img{width:100%;display:block;max-height:640px;object-fit:cover;}
  .post-media video{width:100%;display:block;max-height:640px;background:#000;}
  .post-media audio{width:100%;display:block;padding:14px;}
  .post-caption{font-size:14.5px;line-height:1.45;margin-bottom:10px;word-wrap:break-word;white-space:pre-wrap;}
  .post-caption .cap-user{font-weight:600;margin-right:6px;}
  .post-actions{display:flex;align-items:center;gap:4px;}
  .post-actions .spacer{flex:1;}
  .action-btn{
    display:flex;align-items:center;gap:6px;background:none;border:none;color:var(--text-dim);
    padding:8px;border-radius:var(--radius-s);font-size:13px;font-weight:600;
  }
  .action-btn .icon-box{width:22px;height:22px;}
  .action-btn:active .icon-box{transform:scale(0.85);}
  .action-btn.liked img{filter:brightness(0) saturate(100%) invert(48%) sepia(80%) saturate(3000%) hue-rotate(320deg);}
  .action-btn.saved img{filter:brightness(0) saturate(100%) invert(46%) sepia(65%) saturate(2500%) hue-rotate(210deg) brightness(1.05);}

  /* Empty / loading states */
  .empty-state{
    text-align:center;padding:60px 24px;color:var(--text-dim);
  }
  .empty-state .icon-big{font-size:36px;margin-bottom:12px;}
  .empty-state h3{color:var(--text);font-size:17px;margin:0 0 6px;}
  .empty-state p{font-size:14px;margin:0 0 18px;}

  .skeleton{
    background:linear-gradient(90deg,var(--bg-elev) 25%,var(--border) 37%,var(--bg-elev) 63%);
    background-size:400% 100%;animation:sk 1.4s ease infinite;border-radius:var(--radius-s);
  }
  @keyframes sk{0%{background-position:100% 0;}100%{background-position:0 0;}}
  .skeleton-post{padding:14px 16px;border-bottom:1px solid var(--border-soft);}
  .skeleton-post .sk-head{display:flex;gap:10px;align-items:center;margin-bottom:12px;}
  .sk-avatar{width:38px;height:38px;border-radius:50%;}
  .sk-line{height:11px;border-radius:6px;}

  .spinner{
    width:20px;height:20px;border-radius:50%;border:2px solid var(--border);
    border-top-color:var(--accent);animation:spin .7s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .spinner-center{display:flex;align-items:center;justify-content:center;padding:40px;}

  /* Section header */
  .section-title{font-size:16px;font-weight:700;padding:16px 16px 6px;}

  /* Search */
  .search-bar{
    display:flex;align-items:center;gap:8px;padding:10px 12px;margin:12px 16px;
    background:var(--bg-elev);border:1px solid var(--border);border-radius:var(--radius-m);
  }
  .search-bar input{
    flex:1;background:none;border:none;color:var(--text);font-size:15px;outline:none;
  }
  .search-result{
    display:flex;align-items:center;gap:12px;padding:10px 16px;
  }
  .search-result:hover{background:var(--bg-elev);}
  .search-result .meta{flex:1;min-width:0;}
  .search-result .name{font-size:14px;font-weight:600;}
  .search-result .sub{font-size:12.5px;color:var(--text-dim);}

  /* Right col suggestions */
  .suggest-card{
    background:var(--card);border:1px solid var(--border);border-radius:var(--radius-m);padding:14px;
  }
  .suggest-card h4{margin:0 0 10px;font-size:14px;color:var(--text-dim);}
  .suggest-row{display:flex;align-items:center;gap:10px;padding:7px 0;}
  .suggest-row .meta{flex:1;min-width:0;}
  .suggest-row .name{font-size:13.5px;font-weight:600;}
  .suggest-row .sub{font-size:12px;color:var(--text-dim);}
  .follow-btn{
    background:var(--accent);color:#fff;border:none;border-radius:999px;
    padding:6px 14px;font-size:12.5px;font-weight:600;white-space:nowrap;
  }
  .follow-btn.following{background:var(--bg-elev);color:var(--text);border:1px solid var(--border);}

  /* Profile */
  .profile-header{padding:20px 16px;}
  .profile-top{display:flex;gap:18px;align-items:center;margin-bottom:14px;}
  .profile-names{flex:1;min-width:0;}
  .profile-names .display-name{font-size:19px;font-weight:700;}
  .profile-names .username{color:var(--text-dim);font-size:14px;}
  .profile-bio{font-size:14px;line-height:1.5;margin:10px 0;white-space:pre-wrap;word-wrap:break-word;}
  .profile-skills{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0;}
  .skill-chip{
    background:var(--bg-elev);border:1px solid var(--border);border-radius:999px;
    padding:4px 11px;font-size:12px;color:var(--text-dim);
  }
  .profile-stats{display:flex;gap:22px;margin:14px 0;}
  .profile-stats .stat{cursor:pointer;}
  .profile-stats .stat b{font-size:15px;display:block;}
  .profile-stats .stat span{font-size:12.5px;color:var(--text-dim);}
  .profile-actions{display:flex;gap:8px;}
  .profile-tabs{display:flex;border-bottom:1px solid var(--border-soft);margin-top:8px;}
  .profile-tab{
    flex:1;text-align:center;padding:12px;font-size:13px;font-weight:600;color:var(--text-dim);
    border-bottom:2px solid transparent;
  }
  .profile-tab.active{color:var(--text);border-color:var(--accent);}
  .grid-posts{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;}
  .grid-posts .cell{aspect-ratio:1;background:var(--bg-elev);overflow:hidden;position:relative;}
  .grid-posts .cell img,.grid-posts .cell video{width:100%;height:100%;object-fit:cover;}

  /* Modals / panels */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:200;
    display:flex;align-items:flex-end;justify-content:center;
    animation:fadeIn .15s ease;
  }
  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
  @media (min-width:760px){
    .modal-overlay{align-items:center;}
  }
  .modal-panel{
    background:var(--card);border:1px solid var(--border);
    border-radius:var(--radius-l) var(--radius-l) 0 0;
    width:100%;max-width:520px;max-height:88vh;
    display:flex;flex-direction:column;
    animation:slideUp .2s ease;
  }
  @keyframes slideUp{from{transform:translateY(24px);opacity:0.6;}to{transform:translateY(0);opacity:1;}}
  @media (min-width:760px){
    .modal-panel{border-radius:var(--radius-l);max-height:80vh;}
  }
  .modal-head{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 16px;border-bottom:1px solid var(--border-soft);flex-shrink:0;
  }
  .modal-head h3{margin:0;font-size:15.5px;font-weight:700;}
  .modal-body{padding:14px 16px;overflow-y:auto;flex:1;}
  .modal-foot{padding:12px 16px;border-top:1px solid var(--border-soft);flex-shrink:0;}

  .fullscreen-panel{
    position:fixed;inset:0;background:var(--bg);z-index:180;
    display:flex;flex-direction:column;
  }
  .fullscreen-panel .modal-head{background:rgba(10,10,12,0.9);backdrop-filter:blur(10px);
    padding-top:calc(14px + var(--safe-top));}
  .fullscreen-panel .modal-body{padding:0;}

  /* Comments */
  .comment-row{display:flex;gap:10px;padding:10px 0;}
  .comment-row .meta{flex:1;min-width:0;}
  .comment-row .text{font-size:13.5px;line-height:1.4;}
  .comment-row .text b{font-weight:600;margin-right:6px;}
  .comment-row .time{font-size:11.5px;color:var(--text-faint);margin-top:2px;}
  .comment-compose{display:flex;gap:8px;align-items:center;}
  .comment-compose input{
    flex:1;background:var(--bg-elev);border:1px solid var(--border);border-radius:999px;
    padding:10px 14px;color:var(--text);font-size:14px;outline:none;
  }

  /* Create/composer */
  .composer-preview{
    width:100%;border-radius:var(--radius-m);overflow:hidden;background:var(--bg-elev);
    border:1px solid var(--border-soft);margin-bottom:12px;min-height:120px;
    display:flex;align-items:center;justify-content:center;position:relative;
  }
  .composer-preview img,.composer-preview video{width:100%;max-height:400px;object-fit:contain;background:#000;}
  .composer-preview .placeholder{color:var(--text-faint);font-size:13.5px;text-align:center;padding:30px;}
  .file-pick-btn{
    display:flex;align-items:center;justify-content:center;gap:8px;
    width:100%;padding:13px;border:1.5px dashed var(--border);border-radius:var(--radius-m);
    color:var(--text-dim);font-size:14px;background:var(--bg-elev);margin-bottom:12px;
  }
  .composer-caption{
    width:100%;background:var(--bg-elev);border:1px solid var(--border);color:var(--text);
    border-radius:var(--radius-s);padding:12px;font-size:14.5px;resize:vertical;min-height:70px;outline:none;
  }
  .composer-caption:focus{border-color:var(--accent);}
  .progress-bar{height:4px;background:var(--border);border-radius:2px;overflow:hidden;margin-top:10px;}
  .progress-bar .fill{height:100%;background:var(--accent);width:0%;transition:width .2s;}

  /* Chats */
  .chat-list-row{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border-soft);}
  .chat-list-row:hover{background:var(--bg-elev);}
  .chat-list-row .meta{flex:1;min-width:0;}
  .chat-list-row .name{font-size:14.5px;font-weight:600;}
  .chat-list-row .preview{font-size:13px;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .chat-list-row .time{font-size:11.5px;color:var(--text-faint);}
  .unread-dot{width:9px;height:9px;border-radius:50%;background:var(--accent);flex-shrink:0;}

  .chat-window{display:flex;flex-direction:column;height:100%;}
  .chat-messages{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:8px;}
  .msg-bubble{
    max-width:75%;padding:9px 13px;border-radius:16px;font-size:14px;line-height:1.4;word-wrap:break-word;
  }
  .msg-bubble.mine{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:4px;}
  .msg-bubble.theirs{align-self:flex-start;background:var(--bg-elev);border:1px solid var(--border-soft);border-bottom-left-radius:4px;}
  .chat-input-row{
    display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--border-soft);
    padding-bottom:calc(10px + var(--safe-bottom));flex-shrink:0;
  }
  .chat-input-row input{
    flex:1;background:var(--bg-elev);border:1px solid var(--border);border-radius:999px;
    padding:11px 15px;color:var(--text);font-size:14.5px;outline:none;
  }

  /* Reels */
  .reels-feed{
    height:calc(100vh - 60px);height:calc(100dvh - 60px);
    overflow-y:auto;scroll-snap-type:y mandatory;
  }
  .reel-item{
    height:calc(100vh - 60px);height:calc(100dvh - 60px);
    scroll-snap-align:start;position:relative;background:#000;
    display:flex;align-items:center;justify-content:center;
  }
  .reel-item video{width:100%;height:100%;object-fit:contain;background:#000;}
  .reel-overlay{
    position:absolute;bottom:0;left:0;right:0;padding:16px;
    background:linear-gradient(to top, rgba(0,0,0,0.7), transparent);
    display:flex;align-items:flex-end;justify-content:space-between;gap:12px;
  }
  .reel-info{flex:1;min-width:0;color:#fff;}
  .reel-info .username{font-weight:600;font-size:14px;margin-bottom:4px;}
  .reel-info .caption{font-size:13px;opacity:0.9;}
  .reel-actions{display:flex;flex-direction:column;gap:16px;align-items:center;}

<script>
(function(){
"use strict";

/* ================= Utilities ================= */
function esc(str){
  if(str===null || str===undefined) return "";
  return String(str).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}
function safeUrl(url){
  if(!url) return "";
  try{
    var u = String(url).trim();
    if(/^(https?:|data:image\/|\/)/i.test(u)) return u;
    if(/^javascript:/i.test(u)) return "";
    // relative paths without leading slash (e.g. from same-origin API)
    if(/^[a-zA-Z0-9._\-\/]+$/.test(u)) return u;
    return "";
  }catch(e){ return ""; }
}
function el(html){
  var d = document.createElement("div");
  d.innerHTML = html;
  return d.firstElementChild;
}
function qs(sel, root){ return (root||document).querySelector(sel); }
function qsa(sel, root){ return Array.prototype.slice.call((root||document).querySelectorAll(sel)); }
function timeAgo(ts){
  if(!ts) return "";
  var d = new Date(ts);
  if(isNaN(d.getTime())) return "";
  var diff = (Date.now() - d.getTime())/1000;
  if(diff < 60) return "now";
  if(diff < 3600) return Math.floor(diff/60)+"m";
  if(diff < 86400) return Math.floor(diff/3600)+"h";
  if(diff < 604800) return Math.floor(diff/86400)+"d";
  return d.toLocaleDateString();
}
function debounce(fn, ms){
  var t;
  return function(){
    var args = arguments, ctx = this;
    clearTimeout(t);
    t = setTimeout(function(){ fn.apply(ctx, args); }, ms);
  };
}
function toast(msg, type){
  var stack = qs("#toast-stack");
  var t = el('<div class="toast">'+esc(msg)+'</div>');
  if(type) t.classList.add(type);
  stack.appendChild(t);
  setTimeout(function(){
    t.style.transition = "opacity .2s ease";
    t.style.opacity = "0";
    setTimeout(function(){ t.remove(); }, 220);
  }, 2600);
}

/* ================= API helper ================= */
var pendingRequests = new Map();

async function api(path, opts){
  opts = opts || {};
  var method = opts.method || "GET";
  var isForm = opts.body instanceof FormData;
  var key = method+" "+path+(isForm ? "" : (opts.body ? JSON.stringify(opts.body) : ""));

  if(opts.dedupe !== false && pendingRequests.has(key)){
    return pendingRequests.get(key);
  }

  var controller = new AbortController();
  var headers = {};
  if(!isForm && opts.body){
    headers["Content-Type"] = "application/json";
  }

  var fetchOpts = {
    method: method,
    credentials: "same-origin",
    headers: headers,
    signal: opts.signal || controller.signal
  };
  if(opts.body){
    fetchOpts.body = isForm ? opts.body : JSON.stringify(opts.body);
  }

  var promise = (async function(){
    try{
      var res = await fetch(path, fetchOpts);
      var data = null;
      var text = null;
      try{
        text = await res.text();
        data = text ? JSON.parse(text) : null;
      }catch(e){
        data = null;
      }

      if(!res.ok){
        var message = (data && (data.error || data.message)) || null;
        if(res.status === 401){
          throw { status:401, message: message || "Please log in to continue." };
        }
        if(res.status === 403){
          throw { status:403, message: message || "You don't have permission to do that." };
        }
        if(res.status === 404){
          throw { status:404, message: message || "Not found." };
        }
        if(res.status === 400){
          throw { status:400, message: message || "That request wasn't valid." };
        }
        throw { status:res.status, message: message || "Something went wrong. Please try again." };
      }
      return data;
    }catch(err){
      if(err && err.name === "AbortError"){
        throw { status:0, aborted:true, message:"Request cancelled." };
      }
      if(err && typeof err.status !== "undefined"){
        throw err;
      }
      throw { status:0, message:"Network error. Check your connection." };
    }finally{
      pendingRequests.delete(key);
    }
  })();

  pendingRequests.set(key, promise);
  return promise;
}

function handleApiError(err, opts){
  opts = opts || {};
  if(err && err.status === 401 && !opts.silentAuth){
    showAuthScreen();
    return;
  }
  toast((err && err.message) || "Something went wrong.", "error");
}

/* ================= State ================= */
var state = {
  user: null,
  route: "home",
  routeParam: null
};

/* ================= App bootstrap ================= */
async function boot(){
  // Password reset flow via ?token=
  var params = new URLSearchParams(window.location.search);
  var resetToken = params.get("token");

  try{
    var me = await api("/api/me");
    state.user = (me && (me.user || me)) || null;
  }catch(err){
    state.user = null;
  }

  qs("#splash").classList.add("hidden");

  if(resetToken){
    showAuthScreen();
    showResetForm(resetToken);
    return;
  }

  if(state.user && state.user.id){
    showApp();
  }else{
    showAuthScreen();
  }
}

function showAuthScreen(){
  qs("#app").classList.remove("active");
  qs("#auth-screen").classList.remove("hidden");
  showLoginForm();
}
function showApp(){
  qs("#auth-screen").classList.add("hidden");
  qs("#app").classList.add("active");
  hydrateUserChrome();
  navigate("home");
  loadNotificationBadge();
}

/* ================= Auth forms ================= */
function clearAuthMessage(){ qs("#auth-message").innerHTML = ""; }
function authError(msg){
  qs("#auth-message").innerHTML = '<div class="form-error">'+esc(msg)+'</div>';
}
function authSuccess(msg){
  qs("#auth-message").innerHTML = '<div class="form-success">'+esc(msg)+'</div>';
}

function showLoginForm(){
  clearAuthMessage();
  qs("#auth-subtitle").textContent = "Sign in to continue";
  qs("#login-form").classList.remove("hidden");
  qs("#signup-form").classList.add("hidden");
  qs("#forgot-form").classList.add("hidden");
  qs("#reset-form").classList.add("hidden");
  qs("#auth-switch-row").classList.remove("hidden");
  qs("#auth-switch-row").innerHTML = 'Don\'t have an account? <button type="button" id="show-signup">Sign up</button>';
  qs("#show-signup").addEventListener("click", showSignupForm);
}
function showSignupForm(){
  clearAuthMessage();
  qs("#auth-subtitle").textContent = "Create your account";
  qs("#login-form").classList.add("hidden");
  qs("#signup-form").classList.remove("hidden");
  qs("#forgot-form").classList.add("hidden");
  qs("#reset-form").classList.add("hidden");
  qs("#auth-switch-row").innerHTML = 'Already have an account? <button type="button" id="show-login">Log in</button>';
  qs("#show-login").addEventListener("click", showLoginForm);
}
function showForgotForm(){
  clearAuthMessage();
  qs("#auth-subtitle").textContent = "Reset your password";
  qs("#login-form").classList.add("hidden");
  qs("#signup-form").classList.add("hidden");
  qs("#forgot-form").classList.remove("hidden");
  qs("#reset-form").classList.add("hidden");
  qs("#auth-switch-row").classList.add("hidden");
}
function showResetForm(token){
  clearAuthMessage();
  qs("#auth-subtitle").textContent = "Choose a new password";
  qs("#login-form").classList.add("hidden");
  qs("#signup-form").classList.add("hidden");
  qs("#forgot-form").classList.add("hidden");
  qs("#reset-form").classList.remove("hidden");
  qs("#auth-switch-row").classList.add("hidden");
  qs("#reset-form").dataset.token = token;
}

qs("#show-forgot").addEventListener("click", showForgotForm);
qs("#back-to-login-1").addEventListener("click", showLoginForm);

qs("#login-form").addEventListener("submit", async function(e){
  e.preventDefault();
  clearAuthMessage();
  var btn = qs("#login-submit");
  btn.disabled = true;
  var username = qs("#login-username").value.trim();
  var password = qs("#login-password").value;
  try{
    var res = await api("/api/login", { method:"POST", body:{ username: username, password: password } });
    state.user = (res && (res.user || res)) || null;
    showApp();
  }catch(err){
    authError(err.message || "Login failed. Check your credentials.");
  }finally{
    btn.disabled = false;
  }
});

qs("#signup-form").addEventListener("submit", async function(e){
  e.preventDefault();
  clearAuthMessage();
  var btn = qs("#signup-submit");
  btn.disabled = true;
  var username = qs("#signup-username").value.trim();
  var email = qs("#signup-email").value.trim();
  var password = qs("#signup-password").value;
  try{
    var res = await api("/api/signup", { method:"POST", body:{ username: username, email: email, password: password } });
    state.user = (res && (res.user || res)) || null;
    if(state.user && state.user.id){
      showApp();
    }else{
      authSuccess("Account created. You can log in now.");
      setTimeout(showLoginForm, 900);
    }
  }catch(err){
    authError(err.message || "Signup failed. Please try again.");
  }finally{
    btn.disabled = false;
  }
});

qs("#forgot-form").addEventListener("submit", async function(e){
  e.preventDefault();
  clearAuthMessage();
  var btn = qs("#forgot-submit");
  btn.disabled = true;
  var email = qs("#forgot-email").value.trim();
  try{
    await api("/api/forgot-password", { method:"POST", body:{ email: email } });
    authSuccess("If that email exists, a reset link has been sent.");
  }catch(err){
    authError(err.message || "Couldn't send reset link.");
  }finally{
    btn.disabled = false;
  }
});

qs("#reset-form").addEventListener("submit", async function(e){
  e.preventDefault();
  clearAuthMessage();
  var btn = qs("#reset-submit");
  btn.disabled = true;
  var token = qs("#reset-form").dataset.token;
  var password = qs("#reset-password").value;
  try{
    await api("/api/reset-password", { method:"POST", body:{ token: token, password: password } });
    authSuccess("Password reset. You can log in now.");
    var url = new URL(window.location.href);
    url.searchParams.delete("token");
    window.history.replaceState({}, "", url.toString());
    setTimeout(showLoginForm, 1000);
  }catch(err){
    authError(err.message || "Reset link is invalid or expired.");
  }finally{
    btn.disabled = false;
  }
});

async function logout(){
  try{ await api("/api/logout", { method:"POST" }); }catch(e){}
  state.user = null;
  window.location.href = window.location.pathname;
}

/* ================= Chrome (sidebar/header user info) ================= */
function hydrateUserChrome(){
  var u = state.user || {};
  qs("#sidebar-name").textContent = u.displayName || u.display_name || u.username || "You";
  qs("#sidebar-handle").textContent = "@"+(u.username || "");
  qs("#sidebar-avatar").src = safeUrl(u.avatarUrl || u.avatar_url) || "";
  qs("#sidebar-avatar").onerror = function(){ this.style.visibility="hidden"; };
}

/* ================= Routing ================= */
var routeButtons = qsa('[data-route]');
routeButtons.forEach(function(btn){
  btn.addEventListener("click", function(e){
    e.preventDefault();
    var r = btn.getAttribute("data-route");
    if(r === "create"){ openComposer(); return; }
    navigate(r);
  });
});
qs("#side-create-btn").addEventListener("click", openComposer);

function setActiveNav(route){
  qsa(".side-link").forEach(function(l){
    l.classList.toggle("active", l.getAttribute("data-route")===route);
  });
  qsa(".bottom-nav .nav-item").forEach(function(l){
    l.classList.toggle("active", l.getAttribute("data-route")===route);
  });
}

function navigate(route, param){
  state.route = route;
  state.routeParam = param;
  setActiveNav(route);
  qs("#right-col").innerHTML = "";
  var root = qs("#view-root");
  root.innerHTML = "";

  switch(route){
    case "home": renderHome(root); renderRightSuggestions(); break;
    case "search": renderSearch(root); break;
    case "reels": renderReels(root); break;
    case "messages": renderChats(root); break;
    case "notifications": renderNotifications(root); break;
    case "profile": renderProfile(root, param || (state.user && state.user.username)); break;
    case "settings": renderSettings(root); break;
    case "more": renderMore(root); break;
    default: renderHome(root); renderRightSuggestions();
  }
}

/* ================= Skeletons ================= */
function skeletonPosts(n){
  var html = "";
  for(var i=0;i<n;i++){
    html += '<div class="skeleton-post">'
      + '<div class="sk-head"><div class="skeleton sk-avatar"></div>'
      + '<div style="flex:1"><div class="skeleton sk-line" style="width:40%;margin-bottom:6px;"></div>'
      + '<div class="skeleton sk-line" style="width:25%;"></div></div></div>'
      + '<div class="skeleton" style="width:100%;height:280px;border-radius:14px;"></div>'
      + '</div>';
  }
  return html;
}

/* ================= HOME / FEED ================= */
async function renderHome(root){
  root.innerHTML = '<div id="stories-slot"></div><div id="feed-slot">'+skeletonPosts(3)+'</div>';
  loadStories();
  loadFeed();
}

async function loadStories(){
  var slot = qs("#stories-slot");
  if(!slot) return;
  try{
    var data = await api("/api/stories/feed");
    var stories = (data && (data.stories || data.items || data)) || [];
    if(!Array.isArray(stories)) stories = [];
    var html = '<div class="stories-row">';

function emptyState(title, sub, actionsHtml){
  return '<div class="empty-state"><h3>'+esc(title)+'</h3><p>'+esc(sub)+'</p>'+(actionsHtml||"")+'</div>';
}

function mediaHtml(post){
  var url = safeUrl(post.mediaUrl || post.media_url || post.url);
  var type = (post.mediaType || post.media_type || "").toLowerCase();
  if(!url) return "";
  if(type.indexOf("video") === 0){
    return '<div class="post-media"><video controls preload="metadata" playsinline src="'+esc(url)+'"></video></div>';
  }
  if(type.indexOf("audio") === 0){
    return '<div class="post-media"><audio controls preload="metadata" src="'+esc(url)+'"></audio></div>';
  }
  return '<div class="post-media"><img loading="lazy" src="'+esc(url)+'" alt=""></div>';
}

function renderPostCard(post){
  var id = post.id;
  var username = post.username || (post.user && post.user.username) || "user";
  var avatar = safeUrl(post.avatarUrl || post.avatar_url || (post.user && post.user.avatarUrl));
  var caption = post.caption || post.text || "";
  var liked = !!(post.liked || post.likedByMe || post.is_liked);
  var saved = !!(post.saved || post.savedByMe || post.is_saved);
  var likeCount = post.likeCount != null ? post.likeCount : (post.like_count != null ? post.like_count : (post.likes || 0));
  var commentCount = post.commentCount != null ? post.commentCount : (post.comment_count != null ? post.comment_count : (post.comments || 0));
  var ts = post.createdAt || post.created_at || post.timestamp;

  return '<article class="post" data-post-id="'+esc(id)+'">'
    + '<div class="post-head">'
      + '<img class="avatar" src="'+esc(avatar)+'" alt="" onerror="this.style.visibility=\'hidden\'" data-user-link="'+esc(username)+'" style="cursor:pointer;">'
      + '<div class="who"><div class="username" data-user-link="'+esc(username)+'" style="cursor:pointer;">'+esc(username)+'</div><div class="time">'+esc(timeAgo(ts))+'</div></div>'
    + '</div>'
    + mediaHtml(post)
    + (caption ? '<div class="post-caption"><span class="cap-user">'+esc(username)+'</span>'+esc(caption)+'</div>' : '')
    + '<div class="post-actions">'
      + '<button class="action-btn like-btn'+(liked?" liked":"")+'"><span class="icon-box"><img src="icons/IMG_1886.png" alt="Like"></span><span class="like-count">'+likeCount+'</span></button>'
      + '<button class="action-btn comment-btn"><span class="icon-box"><img src="icons/IMG_1897.png" alt="Comment"></span><span class="comment-count">'+commentCount+'</span></button>'
      + '<button class="action-btn share-btn"><span class="icon-box"><img src="icons/IMG_1884.png" alt="Share"></span></button>'
      + '<span class="spacer"></span>'
      + '<button class="action-btn save-btn'+(saved?" saved":"")+'"><span class="icon-box"><img src="icons/IMG_1892.png" alt="Save"></span></button>'
    + '</div>'
  + '</article>';
}

function bindPostCardEvents(scope){
  qsa(".post", scope).forEach(function(card){
    var postId = card.getAttribute("data-post-id");

    qsa("[data-user-link]", card).forEach(function(node){
      node.addEventListener("click", function(){
        navigate("profile", node.getAttribute("data-user-link"));
      });
    });

    var likeBtn = qs(".like-btn", card);
    if(likeBtn) likeBtn.addEventListener("click", function(){ toggleLike(postId, likeBtn); });

    var commentBtn = qs(".comment-btn", card);
    if(commentBtn) commentBtn.addEventListener("click", function(){ openComments(postId); });

    var shareBtn = qs(".share-btn", card);
    if(shareBtn) shareBtn.addEventListener("click", function(){ sharePost(postId); });

    var saveBtn = qs(".save-btn", card);
    if(saveBtn) saveBtn.addEventListener("click", function(){ toggleSave(postId, saveBtn); });
  });
}

async function toggleLike(postId, btn){
  var wasLiked = btn.classList.contains("liked");
  var countEl = qs(".like-count", btn);
  var count = parseInt(countEl.textContent, 10) || 0;
  btn.classList.toggle("liked");
  countEl.textContent = wasLiked ? Math.max(0,count-1) : count+1;
  try{
    await api("/api/posts/"+encodeURIComponent(postId)+"/like", { method:"POST" });
  }catch(err){
    btn.classList.toggle("liked");
    countEl.textContent = count;
    handleApiError(err);
  }
}

async function toggleSave(postId, btn){
  var wasSaved = btn.classList.contains("saved");
  btn.classList.toggle("saved");
  try{
    await api("/api/posts/"+encodeURIComponent(postId)+"/save", { method:"POST" });
    toast(wasSaved ? "Removed from saved" : "Saved", "success");
  }catch(err){
    btn.classList.toggle("saved");
    handleApiError(err);
  }
}

async function sharePost(postId){
  var url = window.location.origin + window.location.pathname + "?post=" + encodeURIComponent(postId);
  if(navigator.share){
    try{
      await navigator.share({ url: url, title: "ZILNET" });
    }catch(e){ /* user cancelled */ }
  }else{
    try{
      await navigator.clipboard.writeText(url);
      toast("Link copied to clipboard", "success");
    }catch(e){
      toast("Couldn't copy link", "error");
    }
  }
}

async function openComments(postId){
  var html = ''
    + '<div class="modal-head"><h3>Comments</h3><button class="tap-target" id="close-comments"><span class="icon-box"><img src="icons/IMG_1889.png" alt="Close"></span></button></div>'
    + '<div class="modal-body" id="comments-body"><div class="spinner-center"><div class="spinner"></div></div></div>'
    + '<div class="modal-foot"><div class="comment-compose"><input id="comment-input" type="text" placeholder="Add a comment…" maxlength="500"><button class="tap-target" id="send-comment"><span class="icon-box"><img src="icons/IMG_1898.png" alt="Send"></span></button></div></div>';
  var overlay = openModal(html);
  qs("#close-comments", overlay).addEventListener("click", closeModal);

  async function load(){
    try{
      var data = await api("/api/posts/"+encodeURIComponent(postId)+"/comments");
      var comments = (data && (data.comments || data.items || data)) || [];
      if(!Array.isArray(comments)) comments = [];
      var body = qs("#comments-body", overlay);
      if(comments.length === 0){
        body.innerHTML = emptyState("No comments yet", "Be the first to say something.", "");
        return;
      }
      body.innerHTML = comments.map(function(c){
        return '<div class="comment-row">'
          + '<img class="avatar" style="width:30px;height:30px;" src="'+esc(safeUrl(c.avatarUrl || c.avatar_url))+'" alt="" onerror="this.style.visibility=\'hidden\'">'
          + '<div class="meta"><div class="text"><b>'+esc(c.username || "user")+'</b>'+esc(c.text || c.content || "")+'</div><div class="time">'+esc(timeAgo(c.createdAt || c.created_at))+'</div></div>'
        + '</div>';
      }).join("");
    }catch(err){
      qs("#comments-body", overlay).innerHTML = emptyState("Couldn't load comments", "Please try again.", "");
      handleApiError(err);
    }
  }
  load();

  async function send(){
    var input = qs("#comment-input", overlay);
    var text = input.value.trim();
    if(!text) return;
    var btn = qs("#send-comment", overlay);
    btn.disabled = true;
    try{
      await api("/api/posts/"+encodeURIComponent(postId)+"/comments", { method:"POST", body:{ text: text } });
      input.value = "";
      var countEl = qs('.post[data-post-id="'+CSS.escape(String(postId))+'"] .comment-count');
      if(countEl) countEl.textContent = (parseInt(countEl.textContent,10)||0) + 1;
      load();
    }catch(err){
      handleApiError(err);
    }finally{
      btn.disabled = false;
    }
  }
  qs("#send-comment", overlay).addEventListener("click", send);
  qs("#comment-input", overlay).addEventListener("keydown", function(e){
    if(e.key === "Enter") send();
  });
}

function renderSearch(root){
  root.innerHTML = ''
    + '<div class="search-bar"><span class="icon-box"><img src="icons/IMG_1882.png" alt=""></span><input id="search-input" type="text" placeholder="Search ZILNET" autocomplete="off"></div>'
    + '<div id="search-results"></div>';

  var input = qs("#search-input");
  var resultsEl = qs("#search-results");
  var controller = null;

  var doSearch = debounce(async function(q){
    if(!q){
      resultsEl.innerHTML = "";
      return;
    }
    if(controller) controller.abort();
    controller = new AbortController();
    resultsEl.innerHTML = '<div class="spinner-center"><div class="spinner"></div></div>';
    try{
      var data = await api("/api/search?q="+encodeURIComponent(q), { signal: controller.signal, dedupe:false });
      var results = (data && (data.users || data.results || data.items || data)) || [];
      if(!Array.isArray(results)) results = [];
      if(results.length === 0){
        resultsEl.innerHTML = emptyState("No results", "Try a different search term.", "");
        return;
      }
      resultsEl.innerHTML = results.map(function(u){
        return '<div class="search-result" data-username="'+esc(u.username)+'">'
          + '<img class="avatar" src="'+esc(safeUrl(u.avatarUrl || u.avatar_url))+'" alt="" onerror="this.style.visibility=\'hidden\'">'
          + '<div class="meta"><div class="name">'+esc(u.displayName || u.display_name || u.username)+'</div><div class="sub">@'+esc(u.username)+'</div></div>'
        + '</div>';
      }).join("");
      qsa(".search-result", resultsEl).forEach(function(row){
        row.addEventListener("click", function(){ navigate("profile", row.getAttribute("data-username")); });
      });
    }catch(err){
      if(err && err.aborted) return;
      resultsEl.innerHTML = emptyState("Search failed", "Please try again.", "");
      handleApiError(err);
    }
  }, 350);

  input.addEventListener("input", function(){ doSearch(input.value.trim()); });
  setTimeout(function(){ input.focus(); }, 50);
}

/* ================= PROFILE ================= */
async function renderProfile(root, username){
  root.innerHTML = '<div class="spinner-center"><div class="spinner"></div></div>';
  var isSelf = !username || (state.user && username === state.user.username);

  try{
    var data;
    if(isSelf){
      data = await api("/api/profile");
    }else{
      try{
        data = await api("/api/profile/"+encodeURIComponent(username));
      }catch(e1){
        data = await api("/api/users/"+encodeURIComponent(username));
      }
    }
    var profile = (data && (data.profile || data.user || data)) || {};
    var posts = (data && (data.posts || profile.posts)) || [];
    if(!Array.isArray(posts)) posts = [];

    var followersCount = profile.followersCount != null ? profile.followersCount : (profile.followers_count != null ? profile.followers_count : (profile.followers||0));
    var followingCount = profile.followingCount != null ? profile.followingCount : (profile.following_count != null ? profile.following_count : (profile.following||0));
    var postsCount = profile.postsCount != null ? profile.postsCount : (profile.posts_count != null ? profile.posts_count : posts.length);
    var isFollowing = !!(profile.isFollowing || profile.is_following);
    var skills = profile.skills;
    var skillsArr = [];
    if(Array.isArray(skills)) skillsArr = skills;
    else if(typeof skills === "string" && skills.trim()) skillsArr = skills.split(",").map(function(s){return s.trim();}).filter(Boolean);

    root.innerHTML = ''
      + '<div class="profile-header">'
        + '<div class="profile-top">'
          + '<img class="avatar avatar-lg" src="'+esc(safeUrl(profile.avatarUrl || profile.avatar_url))+'" alt="" onerror="this.style.visibility=\'hidden\'">'
          + '<div class="profile-names"><div class="display-name">'+esc(profile.displayName || profile.display_name || profile.username || "")+'</div><div class="username">@'+esc(profile.username || username || "")+'</div></div>'
        + '</div>'
        + (profile.bio ? '<div class="profile-bio">'+esc(profile.bio)+'</div>' : '')
        + (skillsArr.length ? '<div class="profile-skills">'+skillsArr.map(function(s){return '<span class="skill-chip">'+esc(s)+'</span>';}).join("")+'</div>' : '')
        + '<div class="profile-stats">'
          + '<div class="stat" id="stat-posts"><b>'+postsCount+'</b><span>Posts</span></div>'
          + '<div class="stat" id="stat-followers"><b>'+followersCount+'</b><span>Followers</span></div>'
          + '<div class="stat" id="stat-following"><b>'+followingCount+'</b><span>Following</span></div>'
        + '</div>'
        + '<div class="profile-actions">'
          + (isSelf
              ? '<button class="btn btn-sm secondary" id="edit-profile-btn">Edit profile</button><button class="btn btn-sm secondary" id="logout-btn">Log out</button>'
              : '<button class="btn btn-sm follow-btn'+(isFollowing?" following":"")+'" id="profile-follow-btn" data-id="'+esc(profile.id)+'">'+(isFollowing?"Following":"Follow")+'</button><button class="btn btn-sm secondary" id="message-btn">Message</button>')
        + '</div>'
      + '</div>'
      + '<div class="profile-tabs"><div class="profile-tab active">Posts</div></div>'
      + '<div id="profile-grid">' + renderProfileGrid(posts) + '</div>';

    qs("#stat-followers").addEventListener("click", function(){ openFollowList(profile.id || username, "followers"); });
    qs("#stat-following").addEventListener("click", function(){ openFollowList(profile.id || username, "following"); });

    if(isSelf){
      qs("#edit-profile-btn").addEventListener("click", function(){ openEditProfile(profile); });
      qs("#logout-btn").addEventListener("click", logout);
    }else{
      var fb = qs("#profile-follow-btn");
      if(fb) fb.addEventListener("click", function(){ toggleFollow(profile.id, fb); });
      var mb = qs("#message-btn");
      if(mb) mb.addEventListener("click", function(){ startChat(profile.id); });
    }

    if(posts.length){
      qsa(".cell", root).forEach(function(cell){
        cell.addEventListener("click", function(){ openComments(cell.getAttribute("data-post-id")); });
      });
    }
  }catch(err){
    root.innerHTML = emptyState("Couldn't load profile", "Please try again.", "");
    handleApiError(err);
  }
}

function renderProfileGrid(posts){
  if(!posts.length){
    return emptyState("No posts yet", "Posts will appear here.", "");
  }
  return '<div class="grid-posts">' + posts.map(function(p){
    var url = safeUrl(p.mediaUrl || p.media_url || p.url);
    var type = (p.mediaType || p.media_type || "").toLowerCase();
    var inner = "";
    if(type.indexOf("video")===0){
      inner = '<video src="'+esc(url)+'" muted preload="metadata"></video>';
    }else if(url){
      inner = '<img loading="lazy" src="'+esc(url)+'" alt="">';
    }
    return '<div class="cell" data-post-id="'+esc(p.id)+'">'+inner+'</div>';
  }).join("") + '</div>';
}

async function startChat(userId){
  try{
    var res = await api("/api/chats", { method:"POST", body:{ userId: userId } });
    var chat = (res && (res.chat || res)) || {};
    openChat(chat.id);
  }catch(err){
    handleApiError(err);
  }
}

async function openFollowList(userId, type){
  var html = '<div class="modal-head"><h3>'+(type==="followers"?"Followers":"Following")+'</h3><button class="tap-target" id="close-follow-list"><span class="icon-box"><img src="icons/IMG_1889.png" alt="Close"></span></button></div>'
    + '<div class="modal-body" id="follow-list-body"><div class="spinner-center"><div class="spinner"></div></div></div>';
  var overlay = openModal(html);
  qs("#close-follow-list", overlay).addEventListener("click", closeModal);
  try{
    var data = await api("/api/profile/"+encodeURIComponent(userId)+"/"+type);
    var users = (data && (data.users || data.items || data)) || [];
    if(!Array.isArray(users)) users = [];
    var body = qs("#follow-list-body", overlay);
    if(users.length === 0){
      body.innerHTML = emptyState("Nobody here yet", "", "");
      return;
    }
    body.innerHTML = users.map(function(u){
      return '<div class="search-result" data-username="'+esc(u.username)+'">'
        + '<img class="avatar" src="'+esc(safeUrl(u.avatarUrl || u.avatar_url))+'" alt="" onerror="this.style.visibility=\'hidden\'">'
        + '<div class="meta"><div class="name">'+esc(u.displayName || u.display_name || u.username)+'</div><div class="sub">@'+esc(u.username)+'</div></div>'
      + '</div>';
    }).join("");
    qsa(".search-result", body).forEach(function(row){
      row.addEventListener("click", function(){
        closeModal();
        navigate("profile", row.getAttribute("data-username"));
      });
    });
  }catch(err){
    qs("#follow-list-body", overlay).innerHTML = emptyState("Couldn't load list", "", "");
    handleApiError(err);
  }
}

function openEditProfile(profile){
  var html = '<div class="modal-head"><h3>Edit profile</h3><button class="tap-target" id="close-edit"><span class="icon-box"><img src="icons/IMG_1889.png" alt="Close"></span></button></div>'
    + '<div class="modal-body">'
      + '<div style="text-align:center;margin-bottom:16px;">'
        + '<img class="avatar avatar-lg" id="edit-avatar-preview" src="'+esc(safeUrl(profile.avatarUrl || profile.avatar_url))+'" alt="" style="margin-bottom:10px;">'
        + '<div><button class="btn btn-sm secondary" id="edit-avatar-btn">Change photo</button><input type="file" id="edit-avatar-file" accept="image/*" class="visually-hidden"></div>'
      + '</div>'
      + '<div class="field"><label>Display name</label><input id="edit-display-name" type="text" value="'+esc(profile.displayName || profile.display_name || "")+'" maxlength="60"></div>'
      + '<div class="field"><label>Bio</label><textarea class="composer-caption" id="edit-bio" maxlength="200" style="min-height:70px;">'+esc(profile.bio || "")+'</textarea></div>'
      + '<div class="field"><label>Skills (comma separated)</label><input id="edit-skills" type="text" value="'+esc(Array.isArray(profile.skills) ? profile.skills.join(", ") : (profile.skills||""))+'"></div>'
    + '</div>'
    + '<div class="modal-foot"><button class="btn" id="save-profile-btn">Save changes</button></div>';
  var overlay = openModal(html);
  qs("#close-edit", overlay).addEventListener("click", closeModal);

  var pendingAvatarUrl = profile.avatarUrl || profile.avatar_url || "";

  qs("#edit-avatar-btn", overlay).addEventListener("click", function(){
    qs("#edit-avatar-file", overlay).click();
  });
  qs("#edit-avatar-file", overlay).addEventListener("change", async function(e){
    var file = e.target.files[0];
    if(!file) return;
    if(file.size > 25*1024*1024){
      toast("File is larger than 25 MB", "error");
      return;
    }
    var preview = qs("#edit-avatar-preview", overlay);
    preview.src = URL.createObjectURL(file);
    try{
      var uploaded = await uploadFile(file);
      pendingAvatarUrl = uploaded.url || uploaded.media_url;
      toast("Photo uploaded", "success");
    }catch(err){
      handleApiError(err);
    }
  });

  qs("#save-profile-btn", overlay).addEventListener("click", async function(){
    var btn = this;
    btn.disabled = true;
    try{
      await api("/api/profile/update", { method:"POST", body:{
        displayName: qs("#edit-display-name", overlay).value.trim(),
        bio: qs("#edit-bio", overlay).value.trim(),
        skills: qs("#edit-skills", overlay).value.trim(),
        avatarUrl: pendingAvatarUrl
      }});
      toast("Profile updated", "success");
      closeModal();
      navigate("profile", state.user && state.user.username);
    }catch(err){
      handleApiError(err);
    }finally{
      btn.disabled = false;
    }
  });
}

/* ================= UPLOAD ================= */
async function uploadFile(file, onProgress){
  var form = new FormData();
  form.append("file", file);
  // Using fetch directly (not api()) to allow progress via XHR when needed.
  return new Promise(function(resolve, reject){
    var xhr = new XMLHttpRequest();
    xhr.open("POST", "/api/upload");
    xhr.withCredentials = true;
    xhr.upload.onprogress = function(e){
      if(onProgress && e.lengthComputable){
        onProgress(Math.round((e.loaded/e.total)*100));
      }
    };
    xhr.onload = function(){
      var data = null;
      try{ data = JSON.parse(xhr.responseText); }catch(e){}
      if(xhr.status >= 200 && xhr.status < 300){
        resolve(data || {});
      }else{
        reject({ status:xhr.status, message: (data && (data.error||data.message)) || "Upload failed." });
      }
    };
    xhr.onerror = function(){
      reject({ status:0, message:"Network error during upload." });
    };
    xhr.send(form);
  });
}

function openMediaComposer(cfg){
  var html = '<div class="modal-head"><h3>'+esc(cfg.title)+'</h3><button class="tap-target" id="close-composer"><span class="icon-box"><img src="icons/IMG_1889.png" alt="Close"></span></button></div>'
    + '<div class="modal-body">'
      + '<div class="composer-preview" id="composer-preview"><div class="placeholder">No media selected yet</div></div>'
      + '<button class="file-pick-btn" id="composer-pick-btn"><span class="icon-box"><img src="icons/IMG_1880.png" alt=""></span> Select from gallery / files</button>'
      + '<input type="file" id="composer-file" accept="'+esc(cfg.accept)+'" class="visually-hidden">'
      + '<textarea class="composer-caption" id="composer-caption" placeholder="Write a caption'+(cfg.captionOptional?' (optional)':'')+'…" maxlength="2000"></textarea>'
      + '<div class="progress-bar hidden" id="composer-progress"><div class="fill" id="composer-progress-fill"></div></div>'
    + '</div>'
    + '<div class="modal-foot"><button class="btn" id="composer-submit" disabled>'+esc(cfg.submitLabel)+'</button></div>';

  var overlay = openModal(html);
  qs("#close-composer", overlay).addEventListener("click", closeModal);

  var uploadedUrl = null, uploadedType = null;

  qs("#composer-pick-btn", overlay).addEventListener("click", function(){
    qs("#composer-file", overlay).click();
  });

  qs("#composer-file", overlay).addEventListener("change", async function(e){
    var file = e.target.files[0];
    if(!file) return;
    if(file.size > 25*1024*1024){
      toast("File is larger than 25 MB", "error");
      return;
    }
    var preview = qs("#composer-preview", overlay);
    var objectUrl = URL.createObjectURL(file);
    if(file.type.indexOf("video") === 0){
      preview.innerHTML = '<video src="'+objectUrl+'" controls preload="metadata"></video>';
    }else if(file.type.indexOf("audio") === 0){
      preview.innerHTML = '<audio src="'+objectUrl+'" controls style="width:100%;"></audio>';
    }else{
      preview.innerHTML = '<img src="'+objectUrl+'" alt="">';
    }

    var progressWrap = qs("#composer-progress", overlay);
    var progressFill = qs("#composer-progress-fill", overlay);
    progressWrap.classList.remove("hidden");
    progressFill.style.width = "0%";
    var submitBtn = qs("#composer-submit", overlay);
    submitBtn.disabled = true;

    try{
      var result = await uploadFile(file, function(pct){ progressFill.style.width = pct+"%"; });
      uploadedUrl = result.url || result.media_url;
      uploadedType = result.media_type || file.type;
      progressFill.style.width = "100%";
      submitBtn.disabled = false;
    }catch(err){
      handleApiError(err);
      progressWrap.classList.add("hidden");
    }
  });

  qs("#composer-submit", overlay).addEventListener("click", async function(){
    if(!uploadedUrl){
      toast("Please select media first", "error");
      return;
    }
    var btn = this;
    btn.disabled = true;
    var caption = qs("#composer-caption", overlay).value.trim();
    try{
      await cfg.onSubmit(uploadedUrl, uploadedType, caption);
      closeModal();
      toast("Published", "success");
      if(cfg.onDone) cfg.onDone();
    }catch(err){
      handleApiError(err);
      btn.disabled = false;
    }
  });
}

/* ================= SETTINGS ================= */
async function renderSettings(root){
  root.innerHTML = '<div class="section-title">Settings</div><div id="settings-slot"><div class="spinner-center"><div class="spinner"></div></div></div>';
  try{
    var data = await api("/api/settings");
    var settings = (data && (data.settings || data)) || {};
    var slot = qs("#settings-slot");
    var keys = Object.keys(settings).filter(function(k){ return typeof settings[k] === "boolean"; });

    var html = '<div class="settings-group"><h4>Preferences</h4>';
    if(keys.length === 0){
      html += '<div class="settings-row"><span class="text-dim">No settings available.</span></div>';
    }else{
      keys.forEach(function(k){
        var label = k.replace(/([A-Z])/g, " $1").replace(/_/g," ").replace(/^./, function(c){return c.toUpperCase();});
        html += '<div class="settings-row"><span>'+esc(label)+'</span><button class="toggle'+(settings[k]?" on":"")+'" data-key="'+esc(k)+'"><span class="knob"></span></button></div>';
      });
    }
    html += '</div><div class="settings-group"><h4>Account</h4><div class="settings-row"><span>Log out</span><button class="btn btn-sm secondary" id="settings-logout">Log out</button></div></div>';
    slot.innerHTML = html;

    qsa(".toggle", slot).forEach(function(t){
      t.addEventListener("click", async function(){
        var key = t.getAttribute("data-key");
        var newVal = !t.classList.contains("on");
        t.classList.toggle("on");
        var payload = {};
        payload[key] = newVal;
        try{
          await api("/api/settings", { method:"POST", body: payload });
        }catch(err){
          t.classList.toggle("on");
          handleApiError(err);
        }
      });
    });
    qs("#settings-logout").addEventListener("click", logout);
  }catch(err){
    qs("#settings-slot").innerHTML = emptyState("Couldn't load settings", "Please try again.", "");
    handleApiError(err);
  }
}
