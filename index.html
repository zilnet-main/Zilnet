<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Zilnet</title>

<style>
:root{
  --bg:#000;
  --panel:#0b0b0b;
  --panel2:#111;
  --text:#fff;
  --muted:#888;
  --border:#242424;
  --soft:#171717;
  --icon-filter:none;
}

:root.light{
  --bg:#fff;
  --panel:#fafafa;
  --panel2:#f2f2f2;
  --text:#000;
  --muted:#666;
  --border:#ddd;
  --soft:#eee;
  --icon-filter:invert(1);
}

*{box-sizing:border-box}

html,body{
  margin:0;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}

button,input,textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

img{
  max-width:100%;
}

.hidden{
  display:none!important;
}

#auth{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
}

.auth-card{
  width:100%;
  max-width:400px;
  border:1px solid var(--border);
  border-radius:22px;
  padding:28px;
  background:var(--panel);
}

.logo{
  font-size:30px;
  font-weight:800;
  letter-spacing:-1.5px;
}

.auth-card h1{
  margin:0 0 8px;
}

.auth-card p{
  color:var(--muted);
}

.field{
  width:100%;
  margin:10px 0;
}

.field input,
.field textarea,
.search-input{
  width:100%;
  border:1px solid var(--border);
  background:var(--soft);
  color:var(--text);
  border-radius:12px;
  padding:13px 14px;
  outline:none;
}

.field textarea{
  min-height:110px;
  resize:vertical;
}

.primary{
  width:100%;
  border:0;
  border-radius:12px;
  background:var(--text);
  color:var(--bg);
  padding:13px;
  font-weight:700;
  margin-top:8px;
}

.secondary{
  border:1px solid var(--border);
  background:transparent;
  color:var(--text);
  border-radius:10px;
  padding:9px 13px;
}

.app{
  min-height:100vh;
}

.topbar{
  position:fixed;
  top:0;
  left:0;
  right:0;
  height:62px;
  border-bottom:1px solid var(--border);
  background:color-mix(in srgb,var(--bg) 94%,transparent);
  backdrop-filter:blur(15px);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 22px;
  z-index:20;
}

.brand{
  font-size:22px;
  font-weight:800;
}

.top-actions{
  display:flex;
  gap:8px;
}

.icon-btn{
  width:40px;
  height:40px;
  border:0;
  background:transparent;
  border-radius:12px;
  display:grid;
  place-items:center;
}

.icon-btn:hover{
  background:var(--soft);
}

.icon{
  width:22px;
  height:22px;
  object-fit:contain;
  filter:var(--icon-filter);
}

.layout{
  display:grid;
  grid-template-columns:220px minmax(0,680px) 260px;
  justify-content:center;
  gap:25px;
  padding:88px 20px 100px;
}

.sidebar{
  position:sticky;
  top:82px;
  height:max-content;
}

.nav{
  display:flex;
  flex-direction:column;
  gap:5px;
}

.nav button{
  display:flex;
  align-items:center;
  gap:13px;
  border:0;
  background:transparent;
  color:var(--text);
  padding:12px;
  border-radius:12px;
  text-align:left;
}

.nav button:hover,
.nav button.active{
  background:var(--soft);
}

.nav-label{
  font-size:14px;
}

.content{
  min-width:0;
}

.rightbar{
  position:sticky;
  top:82px;
  height:max-content;
}

.panel{
  border:1px solid var(--border);
  border-radius:18px;
  background:var(--panel);
  overflow:hidden;
}

.stories{
  display:flex;
  gap:14px;
  padding:15px;
  overflow-x:auto;
  border:1px solid var(--border);
  border-radius:18px;
  margin-bottom:16px;
}

.story{
  min-width:64px;
  text-align:center;
  cursor:pointer;
}

.avatar{
  width:48px;
  height:48px;
  border-radius:50%;
  object-fit:cover;
  background:var(--soft);
  border:1px solid var(--border);
}

.story .avatar{
  width:58px;
  height:58px;
}

.story-name{
  margin-top:5px;
  font-size:11px;
  color:var(--muted);
  overflow:hidden;
  text-overflow:ellipsis;
}

.post{
  border:1px solid var(--border);
  border-radius:18px;
  background:var(--panel);
  margin-bottom:16px;
  overflow:hidden;
}

.post-head{
  display:flex;
  align-items:center;
  gap:10px;
  padding:13px 15px;
}

.user-info{
  flex:1;
  min-width:0;
}

.username{
  font-weight:700;
  cursor:pointer;
}

.date{
  color:var(--muted);
  font-size:11px;
  margin-top:2px;
}

.post-content{
  padding:0 15px 14px;
  white-space:pre-wrap;
  word-break:break-word;
}

.post-media{
  width:100%;
  max-height:700px;
  object-fit:cover;
  display:block;
  background:#050505;
}

.post-actions{
  display:flex;
  gap:4px;
  padding:8px 10px;
  border-top:1px solid var(--border);
}

.post-actions button{
  border:0;
  background:transparent;
  color:var(--text);
  display:flex;
  align-items:center;
  gap:5px;
  padding:9px;
  border-radius:10px;
}

.post-actions button:hover{
  background:var(--soft);
}

.count{
  color:var(--muted);
  font-size:12px;
}

.comments{
  border-top:1px solid var(--border);
  padding:12px 15px;
}

.comment{
  padding:6px 0;
  font-size:13px;
}

.comment b{
  margin-right:5px;
}

.comment-form{
  display:flex;
  gap:8px;
  margin-top:10px;
}

.comment-form input{
  flex:1;
  min-width:0;
  border:1px solid var(--border);
  background:var(--soft);
  color:var(--text);
  border-radius:10px;
  padding:10px;
}

.comment-form button{
  border:0;
  background:var(--text);
  color:var(--bg);
  border-radius:10px;
  padding:0 13px;
}

.profile-head{
  border:1px solid var(--border);
  border-radius:18px;
  padding:20px;
  margin-bottom:18px;
}

.profile-main{
  display:flex;
  gap:18px;
  align-items:center;
}

.profile-avatar{
  width:92px;
  height:92px;
  border-radius:50%;
  object-fit:cover;
  border:1px solid var(--border);
}

.profile-name{
  font-size:22px;
  font-weight:800;
}

.profile-bio{
  color:var(--muted);
  margin-top:6px;
  white-space:pre-wrap;
}

.stats{
  display:flex;
  gap:25px;
  margin-top:18px;
}

.stat{
  cursor:pointer;
}

.stat b{
  display:block;
  font-size:17px;
}

.stat span{
  color:var(--muted);
  font-size:12px;
}

.profile-actions{
  margin-top:15px;
  display:flex;
  gap:8px;
}

.search-wrap{
  margin-bottom:15px;
}

.user-result{
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px;
  border-bottom:1px solid var(--border);
  cursor:pointer;
}

.user-result:last-child{
  border-bottom:0;
}

.user-result:hover{
  background:var(--soft);
}

.user-result .grow{
  flex:1;
}

.chat-layout{
  display:grid;
  grid-template-columns:230px 1fr;
  height:650px;
  border:1px solid var(--border);
  border-radius:18px;
  overflow:hidden;
}

.chat-list{
  border-right:1px solid var(--border);
  overflow:auto;
}

.chat-item{
  padding:13px;
  border-bottom:1px solid var(--border);
  cursor:pointer;
}

.chat-item:hover,
.chat-item.active{
  background:var(--soft);
}

.chat-window{
  display:flex;
  flex-direction:column;
  min-width:0;
}

.chat-messages{
  flex:1;
  overflow:auto;
  padding:16px;
}

.message{
  max-width:75%;
  padding:9px 12px;
  border-radius:15px;
  margin:7px 0;
  background:var(--soft);
  width:max-content;
}

.message.mine{
  margin-left:auto;
  background:var(--text);
  color:var(--bg);
}

.chat-form{
  display:flex;
  gap:8px;
  padding:10px;
  border-top:1px solid var(--border);
}

.chat-form input{
  flex:1;
  border:1px solid var(--border);
  background:var(--soft);
  color:var(--text);
  border-radius:12px;
  padding:12px;
}

.mobile-nav{
  display:none;
}

.empty{
  text-align:center;
  color:var(--muted);
  padding:45px 15px;
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.72);
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:100;
}

.modal.open{
  display:flex;
}

.modal-card{
  width:100%;
  max-width:500px;
  max-height:90vh;
  overflow:auto;
  border:1px solid var(--border);
  background:var(--panel);
  border-radius:20px;
  padding:20px;
}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px;
}

.toast{
  position:fixed;
  bottom:25px;
  left:50%;
  transform:translateX(-50%);
  background:var(--text);
  color:var(--bg);
  padding:11px 17px;
  border-radius:12px;
  z-index:200;
  display:none;
}

.toast.show{
  display:block;
}

@media(max-width:1050px){
  .layout{
    grid-template-columns:70px minmax(0,680px);
  }

  .sidebar{
    width:70px;
  }

  .nav-label{
    display:none;
  }

  .rightbar{
    display:none;
  }

  .nav button{
    justify-content:center;
  }
}

@media(max-width:700px){
  .topbar{
    padding:0 14px;
  }

  .layout{
    display:block;
    padding:78px 10px 90px;
  }

  .sidebar{
    display:none;
  }

  .mobile-nav{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    height:64px;
    background:var(--panel);
    border-top:1px solid var(--border);
    display:flex;
    justify-content:space-around;
    align-items:center;
    z-index:30;
  }

  .mobile-nav button{
    border:0;
    background:transparent;
    color:var(--text);
    padding:8px;
  }

  .mobile-nav .icon{
    width:23px;
    height:23px;
  }

  .chat-layout{
    grid-template-columns:1fr;
    height:auto;
  }

  .chat-list{
    max-height:180px;
    border-right:0;
    border-bottom:1px solid var(--border);
  }

  .chat-window{
    height:450px;
  }

  .profile-main{
    align-items:flex-start;
  }

  .profile-avatar{
    width:72px;
    height:72px;
  }
}
</style>
</head>

<body>

<div id="auth">
  <div class="auth-card">
    <div class="logo">Zilnet</div>
    <p id="authSubtitle">Connect with people.</p>

    <div id="loginBox">
      <h1>Welcome back</h1>

      <div class="field">
        <input id="loginUsername" placeholder="Username">
      </div>

      <div class="field">
        <input id="loginPassword" type="password" placeholder="Password">
      </div>

      <button class="primary" onclick="login()">Log in</button>

      <p>
        Don't have an account?
        <button class="secondary" onclick="toggleAuth()">Create one</button>
      </p>
    </div>

    <div id="signupBox" class="hidden">
      <h1>Create account</h1>

      <div class="field">
        <input id="signupUsername" placeholder="Username">
      </div>

      <div class="field">
        <input id="signupEmail" type="email" placeholder="Email">
      </div>

      <div class="field">
        <input id="signupPassword" type="password" placeholder="Password">
      </div>

      <button class="primary" onclick="signup()">Create account</button>

      <p>
        Already have an account?
        <button class="secondary" onclick="toggleAuth()">Log in</button>
      </p>
    </div>
  </div>
</div>

<div id="app" class="app hidden">

  <header class="topbar">
    <div class="brand">Zilnet</div>

    <div class="top-actions">
      <button class="icon-btn" onclick="showView('notifications')" title="Notifications">
        <img class="icon" src="/icons/notification.png">
      </button>

      <button class="icon-btn" onclick="showView('settings')" title="Settings">
        <img class="icon" src="/icons/settings.png">
      </button>
    </div>
  </header>

  <div class="layout">

    <aside class="sidebar">
      <nav class="nav">

        <button onclick="showView('home')">
          <img class="icon" src="/icons/home.png">
          <span class="nav-label">Home</span>
        </button>

        <button onclick="showView('search')">
          <img class="icon" src="/icons/search.png">
          <span class="nav-label">Search</span>
        </button>

        <button onclick="openCreate()">
          <img class="icon" src="/icons/create.png">
          <span class="nav-label">Create</span>
        </button>

        <button onclick="showView('reels')">
          <img class="icon" src="/icons/reels.png">
          <span class="nav-label">Reels</span>
        </button>

        <button onclick="showView('messages')">
          <img class="icon" src="/icons/messages.png">
          <span class="nav-label">Messages</span>
        </button>

        <button onclick="showMyProfile()">
          <img class="icon" src="/icons/profile.png">
          <span class="nav-label">Profile</span>
        </button>

        <button onclick="showView('settings')">
          <img class="icon" src="/icons/settings.png">
          <span class="nav-label">Settings</span>
        </button>

        <button onclick="logout()">
          <span class="nav-label">Log out</span>
        </button>

      </nav>
    </aside>

    <main class="content" id="content"></main>

    <aside class="rightbar">
      <div class="panel" style="padding:15px">
        <div style="font-weight:800;margin-bottom:12px">Your account</div>
        <div id="miniAccount"></div>
      </div>
    </aside>

  </div>

  <nav class="mobile-nav">

    <button onclick="showView('home')">
      <img class="icon" src="/icons/home.png">
    </button>

    <button onclick="showView('search')">
      <img class="icon" src="/icons/search.png">
    </button>

    <button onclick="openCreate()">
      <img class="icon" src="/icons/create.png">
    </button>

    <button onclick="showView('messages')">
      <img class="icon" src="/icons/messages.png">
    </button>

    <button onclick="showMyProfile()">
      <img class="icon" src="/icons/profile.png">
    </button>

  </nav>

</div>

<div id="modal" class="modal">
  <div class="modal-card" id="modalContent"></div>
</div>

<div id="toast" class="toast"></div>

<script>
const state = {
  me:null,
  view:"home",
  currentProfile:null,
  currentChat:null
};

const ICONS = {
  home:"home.png",
  search:"search.png",
  create:"create.png",
  reels:"reels.png",
  messages:"messages.png",
  profile:"profile.png",
  notification:"notification.png",
  settings:"settings.png",
  more:"more.png",
  heart:"heart.png",
  comment:"comment.png",
  share:"share.png",
  save:"save.png",
  send:"send.png",
  back:"back.png",
  close:"close.png",
  edit:"edit.png",
  camera:"camera.png"
};

function icon(name){
  return `<img class="icon" src="/icons/${ICONS[name] || name}" alt="">`;
}

function esc(value){
  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function safeUrl(url){
  if(!url) return "";
  if(/^data:image\//i.test(url)) return url;
  if(/^https?:\/\//i.test(url)) return url;
  return "";
}

async function api(path, options={}){
  const res = await fetch(path,{
    credentials:"same-origin",
    headers:{
      "Content-Type":"application/json",
      ...(options.headers||{})
    },
    ...options
  });

  let data={};
  try{ data=await res.json(); }catch{}

  if(!res.ok){
    throw new Error(data.error || "Request failed");
  }

  return data;
}

function toast(message){
  const el=document.getElementById("toast");
  el.textContent=message;
  el.classList.add("show");
  setTimeout(()=>el.classList.remove("show"),2500);
}

function openModal(html){
  document.getElementById("modalContent").innerHTML=html;
  document.getElementById("modal").classList.add("open");
}

function closeModal(){
  document.getElementById("modal").classList.remove("open");
}

function toggleAuth(){
  document.getElementById("loginBox").classList.toggle("hidden");
  document.getElementById("signupBox").classList.toggle("hidden");
}

async function login(){
  try{
    const username=document.getElementById("loginUsername").value.trim();
    const password=document.getElementById("loginPassword").value;

    await api("/api/login",{
      method:"POST",
      body:JSON.stringify({username,password})
    });

    await boot();
  }catch(e){
    toast(e.message);
  }
}

async function signup(){
  try{
    const username=document.getElementById("signupUsername").value.trim();
    const email=document.getElementById("signupEmail").value.trim();
    const password=document.getElementById("signupPassword").value;

    await api("/api/signup",{
      method:"POST",
      body:JSON.stringify({username,email,password})
    });

    await boot();
  }catch(e){
    toast(e.message);
  }
}

async function logout(){
  await api("/api/logout",{method:"POST"}).catch(()=>{});
  state.me=null;
  document.getElementById("app").classList.add("hidden");
  document.getElementById("auth").classList.remove("hidden");
}

async function boot(){
  try{
    const data=await api("/api/me");
    state.me=data.user;

    document.getElementById("auth").classList.add("hidden");
    document.getElementById("app").classList.remove("hidden");

    applyTheme();
    renderMiniAccount();

    const path=location.pathname;

    if(path.startsWith("/p/")){
      await showPost(Number(path.split("/")[2]));
      return;
    }

    if(path.startsWith("/u/")){
      await showProfile(decodeURIComponent(path.split("/")[2]));
      return;
    }

    await showView("home");
  }catch{
    document.getElementById("auth").classList.remove("hidden");
    document.getElementById("app").classList.add("hidden");
  }
}

function renderMiniAccount(){
  const u=state.me;
  if(!u)return;

  document.getElementById("miniAccount").innerHTML=`
    <div style="display:flex;gap:10px;align-items:center">
      <img class="avatar" src="${safeUrl(u.avatar_url)||"/icons/profile.png"}">
      <div>
        <b>${esc(u.display_name||u.username)}</b>
        <div style="color:var(--muted);font-size:12px">@${esc(u.username)}</div>
      </div>
    </div>
  `;
}

async function showView(view){
  state.view=view;

  if(view==="home") return renderHome();
  if(view==="search") return renderSearch();
  if(view==="messages") return renderMessages();
  if(view==="reels") return renderReels();
  if(view==="notifications") return renderNotifications();
  if(view==="settings") return renderSettings();
  if(view==="profile") return showProfile(state.me.username);
}

async function renderHome(){
  const content=document.getElementById("content");

  content.innerHTML=`
    <div id="storiesArea"></div>
    <div id="feedArea"><div class="empty">Loading...</div></div>
  `;

  loadStories();
  loadFeed();
}

async function loadStories(){
  try{
    const data=await api("/api/stories/feed");

    const html=(data.stories||[]).map(s=>`
      <div class="story" onclick="viewStory(${s.id})">
        <img class="avatar" src="${safeUrl(s.avatar_url)||"/icons/profile.png"}">
        <div class="story-name">${esc(s.username)}</div>
      </div>
    `).join("");

    document.getElementById("storiesArea").innerHTML=`
      <div class="stories">
        <div class="story" onclick="createStory()">
          <img class="avatar" src="${safeUrl(state.me.avatar_url)||"/icons/profile.png"}">
          <div class="story-name">Your story</div>
        </div>
        ${html || ""}
      </div>
    `;
  }catch{}
}

async function loadFeed(){
  try{
    const data=await api("/api/feed");
    const posts=data.posts||[];

    document.getElementById("feedArea").innerHTML=
      posts.length
      ? posts.map(renderPost).join("")
      : `<div class="panel empty">No posts yet.</div>`;
  }catch(e){
    document.getElementById("feedArea").innerHTML=
      `<div class="panel empty">${esc(e.message)}</div>`;
  }
}

function renderPost(p){
  const media=safeUrl(p.media_url);

  return `
    <article class="post" id="post-${p.id}">

      <div class="post-head">

        <img class="avatar"
             src="${safeUrl(p.avatar_url)||"/icons/profile.png"}"
             onclick="showProfile('${encodeURIComponent(p.username)}')">

        <div class="user-info">
          <div class="username"
               onclick="showProfile('${encodeURIComponent(p.username)}')">
            ${esc(p.display_name||p.username)}
          </div>

          <div class="date">
            @${esc(p.username)} · ${esc(formatDate(p.created_at))}
          </div>
        </div>

        <button class="icon-btn" onclick="sharePost(${p.id})">
          ${icon("more")}
        </button>

      </div>

      ${p.content ? `<div class="post-content">${esc(p.content)}</div>` : ""}

      ${
        media
        ? `<img class="post-media" src="${media}" loading="lazy">`
        : ""
      }

      <div class="post-actions">

        <button onclick="likePost(${p.id})">
          ${icon("heart")}
          <span class="count">${p.like_count||0}</span>
        </button>

        <button onclick="toggleComments(${p.id})">
          ${icon("comment")}
          <span class="count">${p.comment_count||0}</span>
        </button>

        <button onclick="sharePost(${p.id})">
          ${icon("share")}
        </button>

        <button onclick="savePost(${p.id})">
          ${icon("save")}
        </button>

      </div>

      <div id="comments-${p.id}" class="comments hidden"></div>

    </article>
  `;
}

function formatDate(date){
  if(!date)return "";
  const d=new Date(date.replace(" ","T")+"Z");
  if(Number.isNaN(d.getTime()))return date;
  return d.toLocaleDateString();
}

async function toggleComments(id){
  const el=document.getElementById(`comments-${id}`);

  if(!el.classList.contains("hidden")){
    el.classList.add("hidden");
    return;
  }

  try{
    const data=await api(`/api/posts/${id}/comments`);

    el.innerHTML=`
      ${(data.comments||[]).map(c=>`
        <div class="comment">
          <b>@${esc(c.username)}</b>${esc(c.content)}
        </div>
      `).join("")}

      <div class="comment-form">
        <input id="comment-input-${id}" placeholder="Write a comment...">
        <button onclick="commentPost(${id})">Send</button>
      </div>
    `;

    el.classList.remove("hidden");
  }catch(e){
    toast(e.message);
  }
}

async function commentPost(id){
  const input=document.getElementById(`comment-input-${id}`);

  if(!input.value.trim())return;

  try{
    await api(`/api/posts/${id}/comments`,{
      method:"POST",
      body:JSON.stringify({content:input.value.trim()})
    });

    await toggleComments(id);
    await toggleComments(id);
    loadFeed();
  }catch(e){
    toast(e.message);
  }
}

async function likePost(id){
  try{
    await api(`/api/posts/${id}/like`,{method:"POST"});
    loadFeed();
  }catch(e){
    toast(e.message);
  }
}

async function savePost(id){
  try{
    await api(`/api/posts/${id}/save`,{method:"POST"});
    toast("Saved");
  }catch(e){
    toast(e.message);
  }
}

function sharePost(id){
  const url=`${location.origin}/p/${id}`;

  if(navigator.share){
    navigator.share({
      title:"Zilnet post",
      url
    }).catch(()=>{});
  }else{
    navigator.clipboard?.writeText(url);
    toast("Post link copied");
  }
}

async function showPost(id){
  const data=await api(`/api/posts/${id}`);

  document.getElementById("content").innerHTML=
    `<div>${renderPost(data.post)}</div>`;

  window.scrollTo(0,0);
}

async function showProfile(username){
  username=decodeURIComponent(username);

  const data=await api(`/api/profile/${encodeURIComponent(username)}`);

  state.currentProfile=data.user;

  history.pushState(
    {},
    "",
    `/u/${encodeURIComponent(username)}`
  );

  const u=data.user;

  document.getElementById("content").innerHTML=`

    <div class="profile-head">

      <div class="profile-main">

        <img class="profile-avatar"
          src="${safeUrl(u.avatar_url)||"/icons/profile.png"}">

        <div>
          <div class="profile-name">
            ${esc(u.display_name||u.username)}
          </div>

          <div style="color:var(--muted)">
            @${esc(u.username)}
          </div>

          <div class="profile-bio">
            ${esc(u.bio||"")}
          </div>
        </div>

      </div>

      <div class="stats">

        <div class="stat">
          <b>${u.post_count||0}</b>
          <span>Posts</span>
        </div>

        <div class="stat" onclick="showFollowers(${u.id})">
          <b>${u.follower_count||0}</b>
          <span>Followers</span>
        </div>

        <div class="stat" onclick="showFollowing(${u.id})">
          <b>${u.following_count||0}</b>
          <span>Following</span>
        </div>

      </div>

      ${
        u.id===state.me.id
        ? `
          <div class="profile-actions">
            <button class="secondary" onclick="editProfile()">Edit profile</button>
          </div>
        `
        : `
          <div class="profile-actions">
            <button class="secondary" onclick="followUser(${u.id})">
              ${u.is_following ? "Unfollow" : "Follow"}
            </button>

            <button class="secondary" onclick="startChat(${u.id})">
              Message
            </button>
          </div>
        `
      }

    </div>

    <div id="profilePosts">
      ${
        (data.posts||[]).length
        ? data.posts.map(renderPost).join("")
        : `<div class="panel empty">No posts.</div>`
      }
    </div>
  `;
}

function showMyProfile(){
  showProfile(state.me.username);
}

async function followUser(id){
  try{
    await api(`/api/users/${id}/follow`,{method:"POST"});

    if(state.currentProfile){
      showProfile(state.currentProfile.username);
    }
  }catch(e){
    toast(e.message);
  }
}

async function showFollowers(id){
  try{
    const data=await api(`/api/profile/${id}/followers`);

    openModal(`
      <div class="modal-head">
        <h2>Followers</h2>
        <button class="icon-btn" onclick="closeModal()">${icon("close")}</button>
      </div>

      ${(data.users||[]).map(userRow).join("")}
    `);
  }catch(e){
    toast(e.message);
  }
}

async function showFollowing(id){
  try{
    const data=await api(`/api/profile/${id}/following`);

    openModal(`
      <div class="modal-head">
        <h2>Following</h2>
        <button class="icon-btn" onclick="closeModal()">${icon("close")}</button>
      </div>

      ${(data.users||[]).map(userRow).join("")}
    `);
  }catch(e){
    toast(e.message);
  }
}

function userRow(u){
  return `
    <div class="user-result"
         onclick="closeModal();showProfile('${encodeURIComponent(u.username)}')">

      <img class="avatar"
           src="${safeUrl(u.avatar_url)||"/icons/profile.png"}">

      <div class="grow">
        <b>${esc(u.display_name||u.username)}</b>
        <div style="color:var(--muted)">
          @${esc(u.username)}
        </div>
      </div>

    </div>
  `;
}

function renderSearch(){
  document.getElementById("content").innerHTML=`
    <div class="search-wrap">
      <input class="search-input"
             id="searchInput"
             placeholder="Search people..."
             oninput="performSearch()">
    </div>

    <div class="panel" id="searchResults">
      <div class="empty">Search for someone.</div>
    </div>
  `;
}

let searchTimer;

function performSearch(){
  clearTimeout(searchTimer);

  searchTimer=setTimeout(async()=>{
    const q=document.getElementById("searchInput").value.trim();

    if(!q){
      document.getElementById("searchResults").innerHTML=
        `<div class="empty">Search for someone.</div>`;
      return;
    }

    try{
      const data=await api(`/api/search?q=${encodeURIComponent(q)}`);

      document.getElementById("searchResults").innerHTML=
        (data.users||[]).map(userRow).join("")
        || `<div class="empty">No users found.</div>`;
    }catch(e){
      toast(e.message);
    }
  },250);
}

async function renderMessages(){
  const data=await api("/api/chats");

  document.getElementById("content").innerHTML=`
    <div class="chat-layout">

      <div class="chat-list">
        ${(data.chats||[]).map(c=>`
          <div class="chat-item"
               onclick="openChat(${c.id})">
            <b>${esc(c.name||c.other_username||"Chat")}</b>
            <div style="color:var(--muted);font-size:12px">
              ${esc(c.last_message||"")}
            </div>
          </div>
        `).join("") || `<div class="empty">No chats yet.</div>`}
      </div>

      <div class="chat-window" id="chatWindow">
        <div class="empty">Select a conversation.</div>
      </div>

    </div>
  `;
}

async function startChat(userId){
  try{
    const data=await api("/api/chats",{
      method:"POST",
      body:JSON.stringify({userId})
    });

    closeModal();
    showView("messages");
    setTimeout(()=>openChat(data.chat.id),200);
  }catch(e){
    toast(e.message);
  }
}

async function openChat(id){
  const data=await api(`/api/chats/${id}/messages`);

  state.currentChat=id;

  const box=document.getElementById("chatWindow");

  box.innerHTML=`
    <div class="chat-messages" id="chatMessages">

      ${(data.messages||[]).map(m=>`
        <div class="message ${m.user_id===state.me.id?"mine":""}">
          ${esc(m.content)}
        </div>
      `).join("")}

    </div>

    <form class="chat-form" onsubmit="sendMessage(event,${id})">
      <input id="messageInput" placeholder="Message..." autocomplete="off">
      <button class="primary" style="width:auto;margin:0">
        Send
      </button>
    </form>
  `;

  const messages=document.getElementById("chatMessages");
  messages.scrollTop=messages.scrollHeight;
}

async function sendMessage(event,id){
  event.preventDefault();

  const input=document.getElementById("messageInput");
  const content=input.value.trim();

  if(!content)return;

  try{
    await api(`/api/chats/${id}/messages`,{
      method:"POST",
      body:JSON.stringify({content})
    });

    input.value="";
    openChat(id);
  }catch(e){
    toast(e.message);
  }
}

async function renderReels(){
  const data=await api("/api/reels/feed");

  document.getElementById("content").innerHTML=`
    <h2>Reels</h2>

    ${
      (data.reels||[]).map(r=>`
        <div class="post">

          <div class="post-head">
            <img class="avatar"
                 src="${safeUrl(r.avatar_url)||"/icons/profile.png"}">

            <div class="user-info">
              <b>@${esc(r.username)}</b>
            </div>
          </div>

          <video
            class="post-media"
            controls
            playsinline
            src="${safeUrl(r.media_url)}">
          </video>

          ${
            r.caption
            ? `<div class="post-content">${esc(r.caption)}</div>`
            : ""
          }

        </div>
      `).join("")
      || `<div class="panel empty">No reels yet.</div>`
    }
  `;
}

async function renderNotifications(){
  const data=await api("/api/notifications");

  document.getElementById("content").innerHTML=`
    <h2>Notifications</h2>

    <div class="panel">

      ${
        (data.notifications||[]).map(n=>`
          <div class="user-result">

            <img class="avatar"
                 src="${safeUrl(n.actor_avatar)||"/icons/profile.png"}">

            <div>
              <b>@${esc(n.actor_username||"Someone")}</b>
              ${esc(notificationText(n.type))}
              <div style="color:var(--muted);font-size:11px">
                ${esc(formatDate(n.created_at))}
              </div>
            </div>

          </div>
        `).join("")
        || `<div class="empty">No notifications.</div>`
      }

    </div>
  `;

  api("/api/notifications/read",{method:"POST"}).catch(()=>{});
}

function notificationText(type){
  if(type==="follow")return " followed you";
  if(type==="like")return " liked your post";
  if(type==="comment")return " commented on your post";
  return " interacted with you";
}

async function renderSettings(){
  const data=await api("/api/settings");

  document.getElementById("content").innerHTML=`
    <div class="panel" style="padding:20px">

      <h2>Settings</h2>

      <div class="field">
        <label>Theme</label>
        <select id="themeSelect"
          class="search-input"
          onchange="saveSettings()">
          <option value="dark" ${data.settings.theme==="dark"?"selected":""}>Dark</option>
          <option value="light" ${data.settings.theme==="light"?"selected":""}>Light</option>
          <option value="system" ${data.settings.theme==="system"?"selected":""}>System</option>
        </select>
      </div>

      <div class="field">
        <label>Profile visibility</label>
        <select id="visibilitySelect"
          class="search-input"
          onchange="saveSettings()">
          <option value="public" ${data.settings.profile_visibility==="public"?"selected":""}>Public</option>
          <option value="private" ${data.settings.profile_visibility==="private"?"selected":""}>Private</option>
        </select>
      </div>

      <div class="field">
        <label>Who can message you</label>
        <select id="messagePrivacySelect"
          class="search-input"
          onchange="saveSettings()">
          <option value="everyone" ${data.settings.message_privacy==="everyone"?"selected":""}>Everyone</option>
          <option value="followers" ${data.settings.message_privacy==="followers"?"selected":""}>Followers</option>
        </select>
      </div>

    </div>
  `;
}

async function saveSettings(){
  try{
    await api("/api/settings",{
      method:"POST",
      body:JSON.stringify({
        theme:document.getElementById("themeSelect").value,
        profileVisibility:document.getElementById("visibilitySelect").value,
        messagePrivacy:document.getElementById("messagePrivacySelect").value
      })
    });

    applyTheme();
    toast("Settings saved");
  }catch(e){
    toast(e.message);
  }
}

function applyTheme(){
  const saved=localStorage.getItem("zilnet-theme")||"dark";

  if(saved==="light"){
    document.documentElement.classList.add("light");
  }else{
    document.documentElement.classList.remove("light");
  }
}

function openCreate(){
  openModal(`
    <div class="modal-head">
      <h2>Create post</h2>
      <button class="icon-btn" onclick="closeModal()">${icon("close")}</button>
    </div>

    <textarea
      id="postText"
      class="field search-input"
      placeholder="What's happening?"></textarea>

    <div class="field">
      <input
        id="postFile"
        type="file"
        accept="image/*">
    </div>

    <button class="primary" onclick="createPost()">
      Post
    </button>
  `);
}

async function createPost(){
  try{
    const content=document.getElementById("postText").value.trim();
    const file=document.getElementById("postFile").files[0];

    let mediaUrl="";
    let mediaType="";

    if(file){
      mediaUrl=await fileToDataUrl(file);

      if(mediaUrl.length>1800000){
        throw new Error("Image is too large. Use a smaller image.");
      }

      mediaType=file.type;
    }

    await api("/api/posts",{
      method:"POST",
      body:JSON.stringify({
        content,
        mediaUrl,
        mediaType
      })
    });

    closeModal();
    toast("Posted");
    showView("home");
  }catch(e){
    toast(e.message);
  }
}

async function createStory(){
  openModal(`
    <div class="modal-head">
      <h2>Your story</h2>
      <button class="icon-btn" onclick="closeModal()">${icon("close")}</button>
    </div>

    <textarea
      id="storyText"
      class="field search-input"
      placeholder="Write something..."></textarea>

    <div class="field">
      <input id="storyFile" type="file" accept="image/*">
    </div>

    <button class="primary" onclick="submitStory()">Share story</button>
  `);
}

async function submitStory(){
  try{
    const content=document.getElementById("storyText").value.trim();
    const file=document.getElementById("storyFile").files[0];

    let mediaUrl="";

    if(file){
      mediaUrl=await fileToDataUrl(file);

      if(mediaUrl.length>1800000){
        throw new Error("Image is too large.");
      }
    }

    await api("/api/stories",{
      method:"POST",
      body:JSON.stringify({
        content,
        mediaUrl,
        mediaType:file?.type||""
      })
    });

    closeModal();
    toast("Story shared");
    loadStories();
  }catch(e){
    toast(e.message);
  }
}

async function viewStory(id){
  try{
    const data=await api(`/api/stories/${id}`);

    openModal(`
      <div class="modal-head">
        <b>@${esc(data.story.username)}</b>
        <button class="icon-btn" onclick="closeModal()">${icon("close")}</button>
      </div>

      ${
        safeUrl(data.story.media_url)
        ? `<img style="width:100%;border-radius:15px"
                src="${safeUrl(data.story.media_url)}">`
        : ""
      }

      <div class="post-content">
        ${esc(data.story.content||"")}
      </div>
    `);
  }catch(e){
    toast(e.message);
  }
}

function editProfile(){
  const u=state.me;

  openModal(`
    <div class="modal-head">
      <h2>Edit profile</h2>
      <button class="icon-btn" onclick="closeModal()">${icon("close")}</button>
    </div>

    <div class="field">
      <input id="editDisplayName"
             value="${esc(u.display_name||"")}"
             placeholder="Display name">
    </div>

    <div class="field">
      <textarea id="editBio"
                placeholder="Bio">${esc(u.bio||"")}</textarea>
    </div>

    <div class="field">
      <input id="editSkills"
             value="${esc(u.skills||"")}"
             placeholder="Skills">
    </div>

    <div class="field">
      <input id="avatarFile" type="file" accept="image/*">
    </div>

    <button class="primary" onclick="saveProfile()">Save</button>
  `);
}

async function saveProfile(){
  try{
    const file=document.getElementById("avatarFile").files[0];

    let avatarUrl=state.me.avatar_url||"";

    if(file){
      avatarUrl=await fileToDataUrl(file);

      if(avatarUrl.length>1800000){
        throw new Error("Profile image is too large.");
      }
    }

    const data=await api("/api/profile/update",{
      method:"POST",
      body:JSON.stringify({
        displayName:document.getElementById("editDisplayName").value,
        bio:document.getElementById("editBio").value,
        skills:document.getElementById("editSkills").value,
        avatarUrl
      })
    });

    state.me=data.user;

    closeModal();
    renderMiniAccount();
    showMyProfile();

    toast("Profile updated");
  }catch(e){
    toast(e.message);
  }
}

function fileToDataUrl(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();

    reader.onload=()=>resolve(reader.result);
    reader.onerror=reject;

    reader.readAsDataURL(file);
  });
}

window.addEventListener("popstate",()=>{
  boot();
});

boot();
</script>
