<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#050507">
<title>ZILNET</title>

<style>
/* Part 1 CSS */

/* ...all the existing CSS... */


/* AUTH SWITCH ANIMATIONS */
@keyframes authSlideIn {
  from {
    opacity: 0;
    transform: translateX(18px);
  }
  to {
    opacity: 1;
    transform: translateX(0);
  }
}

@keyframes authSlideOut {
  from {
    opacity: 1;
    transform: translateX(0);
  }
  to {
    opacity: 0;
    transform: translateX(-18px);
  }
}

  
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  min-height:100%;
  background:#050507;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}

body{
  overflow-x:hidden;
}

button,input,textarea,select{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}

/* =========================
   ICON NORMALIZATION
   ========================= */

.zicon{
  width:26px!important;
  height:26px!important;
  min-width:26px!important;
  min-height:26px!important;
  max-width:26px!important;
  max-height:26px!important;
  object-fit:contain!important;
  object-position:center!important;
  display:block;
  flex:none;
}

.nav .zicon{
  width:27px!important;
  height:27px!important;
  min-width:27px!important;
  min-height:27px!important;
  max-width:27px!important;
  max-height:27px!important;
}

.icon-btn{
  width:42px;
  height:42px;
  padding:0;
  display:flex;
  align-items:center;
  justify-content:center;
  border:0;
  background:transparent;
  color:#fff;
  border-radius:12px;
  transition:
    transform .18s ease,
    background .18s ease;
}

.icon-btn:active{
  transform:scale(.88);
}

.icon-btn:hover{
  background:#18181d;
}

/* =========================
   AUTH
   ========================= */

#auth{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.auth-card{
  width:min(430px,100%);
  background:#0d0d11;
  border:1px solid #24242b;
  border-radius:24px;
  padding:28px;
  box-shadow:0 25px 80px rgba(0,0,0,.5);
}

.auth-logo{
  text-align:center;
  font-size:30px;
  font-weight:900;
  letter-spacing:6px;
  margin-bottom:25px;
}

.auth-tabs{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:5px;
  background:#18181d;
  padding:4px;
  border-radius:13px;
  margin-bottom:22px;
}

.auth-tab{
  border:0;
  padding:11px 7px;
  border-radius:10px;
  background:transparent;
  color:#777;
  font-size:12px;
  transition:.25s ease;
}

.auth-tab.active{
  background:#fff;
  color:#000;
}

.auth-message{
  min-height:20px;
  color:#ff6b81;
  text-align:center;
  font-size:13px;
  margin-bottom:7px;
}

.auth-panel{
  display:none;
}

.auth-panel.active{
  display:block;
  animation:authIn .32s cubic-bezier(.2,.8,.2,1);
}

@keyframes authIn{
  from{
    opacity:0;
    transform:translateX(28px) scale(.98);
  }
  to{
    opacity:1;
    transform:translateX(0) scale(1);
  }
}

.auth-panel h2{
  margin:0;
  font-size:23px;
}

.auth-subtitle{
  color:#777;
  font-size:13px;
  margin:6px 0 20px;
}

.auth-panel form{
  display:flex;
  flex-direction:column;
  gap:11px;
}

.field{
  width:100%;
  border:1px solid #292930;
  background:#17171c;
  color:#fff;
  border-radius:11px;
  padding:13px 14px;
  outline:none;
}

.field:focus{
  border-color:#666;
}

.auth-submit,
.primary{
  border:0;
  background:#fff;
  color:#000;
  border-radius:11px;
  padding:13px;
  font-weight:700;
  transition:.15s ease;
}

.auth-submit:active,
.primary:active{
  transform:scale(.98);
}

.forgot{
  display:block;
  margin:15px auto 0;
  border:0;
  background:none;
  color:#777;
  font-size:12px;
}

.loading{
  opacity:.55;
  pointer-events:none;
}

/* =========================
   APP
   ========================= */

#app{
  min-height:100vh;
  padding-bottom:78px;
}

.topbar{
  position:sticky;
  top:0;
  z-index:50;
  height:60px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 16px;
  background:rgba(5,5,7,.92);
  backdrop-filter:blur(18px);
  border-bottom:1px solid #17171c;
}

.brand{
  font-weight:900;
  letter-spacing:4px;
  font-size:18px;
}

.top-actions{
  display:flex;
  align-items:center;
  gap:3px;
}

.content{
  width:min(680px,100%);
  margin:auto;
  padding:14px;
}

.page-title{
  font-size:22px;
  font-weight:800;
  margin:8px 0 16px;
}

/* =========================
   CARDS
   ========================= */

.card{
  background:#0e0e12;
  border:1px solid #222229;
  border-radius:18px;
  padding:15px;
  margin-bottom:14px;
}

.empty{
  padding:45px 15px;
  text-align:center;
  color:#777;
}

.empty h3{
  color:#fff;
  margin:0;
}

/* =========================
   STORIES
   ========================= */

.story-row{
  display:flex;
  gap:14px;
  overflow-x:auto;
  scrollbar-width:none;
  padding:4px 1px 12px;
}

.story-row::-webkit-scrollbar{
  display:none;
}

.story{
  min-width:66px;
  text-align:center;
  font-size:11px;
  color:#999;
}

.story-avatar{
  width:58px;
  height:58px;
  padding:2px;
  border-radius:50%;
  background:linear-gradient(135deg,#ff2d55,#8a2be2,#ff9500);
  margin:auto auto 5px;
}

.story-avatar img,
.story-avatar .fallback{
  width:100%;
  height:100%;
  border-radius:50%;
  object-fit:cover;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#19191d;
}

/* =========================
   POSTS
   ========================= */

.post-head{
  display:flex;
  align-items:center;
  gap:10px;
}

.avatar{
  width:42px;
  height:42px;
  min-width:42px;
  border-radius:50%;
  object-fit:cover;
  background:#1d1d23;
}

.fallback{
  color:#fff;
  font-weight:800;
}

.post-user{
  flex:1;
  min-width:0;
}

.post-user strong{
  display:block;
  font-size:14px;
}

.post-time{
  color:#666;
  font-size:11px;
}

.post-menu{
  color:#888;
}

.post-text{
  white-space:pre-wrap;
  word-break:break-word;
  line-height:1.45;
  margin:12px 0;
}

.post-media{
  display:block;
  width:100%;
  max-height:650px;
  object-fit:contain;
  background:#030303;
  border-radius:14px;
}

.post-actions{
  display:flex;
  align-items:center;
  gap:12px;
  margin-top:12px;
}

.action{
  border:0;
  background:none;
  color:#888;
  display:flex;
  align-items:center;
  gap:5px;
  padding:5px;
  border-radius:9px;
}

.action.active{
  color:#ff375f;
}

.action:active{
  transform:scale(.9);
}

.action .zicon{
  width:23px!important;
  height:23px!important;
  min-width:23px!important;
  min-height:23px!important;
  max-width:23px!important;
  max-height:23px!important;
}

/* =========================
   NAV
   ========================= */

.bottom-nav{
  position:fixed;
  z-index:100;
  left:0;
  right:0;
  bottom:0;
  height:68px;
  display:flex;
  align-items:center;
  justify-content:space-around;
  background:rgba(8,8,10,.96);
  backdrop-filter:blur(20px);
  border-top:1px solid #202027;
}

.nav{
  width:54px;
  height:54px;
  display:flex;
  align-items:center;
  justify-content:center;
  border:0;
  background:none;
  border-radius:15px;
  opacity:.55;
  transition:.2s ease;
}

.nav.active{
  opacity:1;
  background:#18181d;
  transform:translateY(-2px);
}

.nav:active{
  transform:scale(.9);
}

/* =========================
   SEARCH
   ========================= */

.search-box{
  display:flex;
  gap:8px;
  margin-bottom:14px;
}

.search-box input{
  flex:1;
}

.user-row{
  display:flex;
  align-items:center;
  gap:12px;
  padding:11px 0;
  border-bottom:1px solid #202027;
}

.user-row:last-child{
  border-bottom:0;
}

.user-info{
  flex:1;
  min-width:0;
}

.user-info strong{
  display:block;
}

.user-info span{
  color:#777;
  font-size:12px;
}

.follow-btn{
  border:1px solid #303038;
  background:#18181d;
  color:#fff;
  border-radius:9px;
  padding:7px 12px;
}

.follow-btn.following{
  background:#fff;
  color:#000;
}

/* =========================
   MODAL
   ========================= */

#modal{
  position:fixed;
  inset:0;
  z-index:500;
  display:none;
  align-items:flex-end;
  justify-content:center;
  background:rgba(0,0,0,.7);
  backdrop-filter:blur(5px);
}

#modal.open{
  display:flex;
}

.sheet{
  width:min(680px,100%);
  max-height:92vh;
  overflow:auto;
  background:#101014;
  border:1px solid #292930;
  border-radius:22px 22px 0 0;
  padding:18px;
  animation:sheetIn .25s ease;
}

@keyframes sheetIn{
  from{
    transform:translateY(40px);
    opacity:0;
  }
  to{
    transform:translateY(0);
    opacity:1;
  }
}

.sheet-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:15px;
}

.sheet-head h3{
  margin:0;
}

/* =========================
   COMMENTS
   ========================= */

.comment-row{
  display:flex;
  gap:10px;
  padding:10px 0;
  border-bottom:1px solid #202027;
}

.comment-body{
  line-height:1.4;
}

.comment-body b{
  margin-right:7px;
}

.comment-time{
  color:#666;
  font-size:10px;
  margin-top:3px;
}

.comment-form{
  display:flex;
  gap:8px;
  margin-top:12px;
}

/* =========================
   CHAT
   ========================= */

.chat-list{
  display:flex;
  flex-direction:column;
}

.chat-item{
  width:100%;
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px 2px;
  border:0;
  border-bottom:1px solid #202027;
  background:none;
  color:#fff;
  text-align:left;
}

.chat-info{
  flex:1;
  min-width:0;
}

.chat-preview{
  color:#666;
  font-size:12px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.chat-view{
  display:flex;
  flex-direction:column;
  height:78vh;
}

.chat-head{
  display:flex;
  align-items:center;
  gap:10px;
  padding-bottom:12px;
  border-bottom:1px solid #222229;
}

.messages{
  flex:1;
  overflow-y:auto;
  padding:12px 0;
}

.bubble-wrap{
  display:flex;
  gap:7px;
  margin:7px 0;
}

.bubble-wrap.mine{
  justify-content:flex-end;
}

.bubble{
  max-width:76%;
  padding:9px 12px;
  border-radius:15px;
  background:#202027;
  word-break:break-word;
}

.mine-bubble{
  background:#fff;
  color:#000;
}

.chat-input{
  display:flex;
  gap:8px;
  padding-top:10px;
  border-top:1px solid #222229;
}

.chat-input input{
  flex:1;
}

/* =========================
   SETTINGS
   ========================= */

.setting{
  width:100%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:15px 2px;
  border:0;
  border-bottom:1px solid #222229;
  background:none;
  color:#fff;
  text-align:left;
}

.setting:last-child{
  border-bottom:0;
}

.setting small{
  display:block;
  color:#666;
}

/* =========================
   TOAST
   ========================= */

#toast{
  position:fixed;
  left:50%;
  bottom:84px;
  z-index:1000;
  transform:translateX(-50%) translateY(20px);
  opacity:0;
  pointer-events:none;
  background:#fff;
  color:#000;
  padding:10px 15px;
  border-radius:12px;
  font-size:13px;
  transition:.25s ease;
  white-space:nowrap;
  max-width:90%;
  overflow:hidden;
  text-overflow:ellipsis;
}

#toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

/* =========================
   LIGHT THEME
   ========================= */

body.light{
  background:#f5f5f7;
  color:#111;
}

body.light .topbar,
body.light .bottom-nav{
  background:rgba(255,255,255,.94);
  border-color:#ddd;
}

body.light .card,
body.light .sheet{
  background:#fff;
  border-color:#ddd;
}

body.light .field{
  background:#f3f3f5;
  color:#111;
  border-color:#ddd;
}

body.light .auth-card{
  background:#fff;
  border-color:#ddd;
}

body.light .auth-tabs{
  background:#eee;
}

body.light .auth-tab.active{
  background:#111;
  color:#fff;
}

body.light .bubble{
  background:#e9e9ed;
  color:#111;
}

body.light .mine-bubble{
  background:#111;
  color:#fff;
}

@media(max-width:500px){
  .auth-card{
    padding:22px;
  }

  .content{
    padding:10px;
  }

  .card{
    border-radius:15px;
  }
}
</style>

<script>

/* =========================================================
   ZILNET FRONTEND
   PART 1
   ========================================================= */

const ICONS = {
  home:"icons/IMG_1881.png",
  search:"icons/IMG_1882.png",
  create:"icons/IMG_1899.png",
  reels:"icons/IMG_1893.png",
  messages:"icons/IMG_1883.png",
  profile:"icons/IMG_1885.png",
  notification:"icons/IMG_1895.png",
  settings:"icons/IMG_1891.png",
  more:"icons/IMG_1888.png",
  heart:"icons/IMG_1886.png",
  comment:"icons/IMG_1897.png",
  share1:"icons/IMG_1884.png",
  share2:"icons/IMG_1887.png",
  save:"icons/IMG_1892.png",
  send:"icons/IMG_1898.png",
  back:"icons/IMG_1890.png",
  close:"icons/IMG_1889.png",
  edit:"icons/IMG_1879.png",
  camera:"icons/IMG_1880.png"
};

let me = null;
let feed = [];
let currentChatId = null;
let chatPoll = null;
let settingsCache = null;


/* =========================================================
   HELPERS
   ========================================================= */

const $ = id =>
  document.getElementById(id);


function esc(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}


function initial(user){

  const text =
    user?.display_name ||
    user?.username ||
    "?";

  return esc(
    text.charAt(0).toUpperCase()
  );
}


function avatarHTML(user,className="avatar"){

  if(user?.avatar_url){

    return `
      <img
        class="${className}"
        src="${esc(user.avatar_url)}"
        alt="">
    `;

  }

  return `
    <div class="${className} fallback">
      ${initial(user)}
    </div>
  `;
}


function toast(message){

  const t = $("toast");

  if(!t) return;

  t.textContent = message;
  t.classList.add("show");

  clearTimeout(window.__toastTimer);

  window.__toastTimer =
    setTimeout(() => {
      t.classList.remove("show");
    },3000);
}


async function api(path,options={}){

  const opts = {
    credentials:"include",
    ...options
  };

  if(
    opts.body &&
    typeof opts.body === "object" &&
    !(opts.body instanceof FormData)
  ){

    opts.headers = {
      "Content-Type":"application/json",
      ...(opts.headers || {})
    };

    opts.body = JSON.stringify(opts.body);
  }

  const response =
    await fetch("/api" + path,opts);

  let data = null;

  try{
    data = await response.json();
  }catch{}

  if(!response.ok){

    throw new Error(
      data?.error ||
      data?.message ||
      `Request failed (${response.status})`
    );
  }

  return data;
}


function setAuthMessage(message){

  $("authMessage").textContent =
    message || "";
}


function switchAuth(mode){

  setAuthMessage("");

  const login =
    mode === "login";

  $("loginTab")
    .classList.toggle("active",login);

  $("signupTab")
    .classList.toggle("active",!login);

  $("loginPanel")
    .classList.toggle("active",login);

  $("signupPanel")
    .classList.toggle("active",!login);
}

function nav(name){

/* =========================================================
   LOGIN
   ========================================================= */

$("loginForm").onsubmit =
async event => {

  event.preventDefault();

  setAuthMessage("");

  const identity =
    $("identity").value.trim();

  const password =
    $("password").value;

  if(!identity){

    setAuthMessage(
      "Enter your username or email."
    );

    return;
  }

  if(!password){

    setAuthMessage(
      "Enter your password."
    );

    return;
  }

  const button =
    $("loginButton");

  button.disabled = true;
  button.textContent = "Logging in...";

  try{

    const result =
      await api("/login",{
        method:"POST",
        body:{
          username:identity,
          email:identity,
          password
        }
      });

    me =
      result.user || null;

    if(!me)
      throw new Error("Login failed.");

    setLoggedIn(true);

    await home();

  }catch(error){

    console.error(error);

    setAuthMessage(
      error.message ||
      "Unable to login."
    );

  }finally{

    button.disabled = false;
    button.textContent = "Login";
  }
};


/* =========================================================
   SIGNUP
   ========================================================= */

$("signupForm").onsubmit =
async event => {

  event.preventDefault();

  setAuthMessage("");

  const username =
    $("signupUsername")
      .value.trim();

  const displayName =
    $("signupDisplay")
      .value.trim();

  const email =
    $("signupEmail")
      .value.trim();

  const password =
    $("signupPassword")
      .value;

  if(username.length < 3){

    setAuthMessage(
      "Username must be at least 3 characters."
    );

    return;
  }

  if(displayName.length < 2){

    setAuthMessage(
      "Enter your display name."
    );

    return;
  }

  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){

    setAuthMessage(
      "Enter a valid email."
    );

    return;
  }

  if(password.length < 8){

    setAuthMessage(
      "Password must be at least 8 characters."
    );

    return;
  }

  const button =
    $("signupButton");

  button.disabled = true;
  button.textContent = "Creating...";

  try{

    const result =
      await api("/signup",{
        method:"POST",
        body:{
          username,
          email,
          password
        }
      });

    me =
      result.user || null;

    if(!me)
      throw new Error(
        "Account creation failed."
      );

    /*
      The current Worker creates the account
      but does not store display_name during
      signup. We immediately update it using
      the real profile endpoint.
    */

    if(displayName){

      try{

        const updated =
          await api("/profile/update",{
            method:"POST",
            body:{
              display_name:displayName,
              bio:"",
              skills:"",
              avatar_url:""
            }
          });

        me =
          updated.user ||
          me;

      }catch(profileError){

        console.warn(
          "Display name update failed:",
          profileError
        );
      }
    }

    setLoggedIn(true);

    await home();

    toast("Welcome to Zilnet!");

  }catch(error){

    console.error(error);

    setAuthMessage(
      error.message ||
      "Could not create account."
    );

  }finally{

    button.disabled = false;
    button.textContent =
      "Create Account";
  }
};


/* =========================================================
   FORGOT PASSWORD
   ========================================================= */

$("forgotButton").onclick =
async () => {

  const email =
    prompt(
      "Enter the email connected to your Zilnet account:"
    );

  if(!email) return;

  try{

    const result =
      await api("/forgot-password",{
        method:"POST",
        body:{
          email:email.trim()
        }
      });

    /*
      Worker returns reset_id.
      The actual verification code is sent
      through the configured email provider.
    */

    if(!result?.reset_id){

      toast(
        result?.message ||
        "Recovery request created."
      );

      return;
    }

    const code =
      prompt(
        "Enter the 6-digit verification code from your email:"
      );

    if(!code) return;

    const newPassword =
      prompt(
        "Enter your new password (8+ characters):"
      );

    if(!newPassword) return;

    const changed =
      await api("/reset-password",{
        method:"POST",
        body:{
          reset_id:result.reset_id,
          code,
          new_password:newPassword
        }
      });

    if(changed.user){

      me =
        changed.user;

      setLoggedIn(true);

      await home();

      toast(
        "Password changed successfully."
      );

    }

  }catch(error){

    toast(
      error.message ||
      "Password recovery failed."
    );
  }
};


/* =========================================================
   SESSION BOOT
   ========================================================= */

async function boot(){

  try{

    const result =
      await api("/me");

    me =
      result.user || null;

    if(!me)
      throw new Error("No user");

    setLoggedIn(true);

    await home();

  }catch(error){

    me = null;

    setLoggedIn(false);

    switchAuth("login");
  }
}


boot();

/* =========================================================

function postHTML(post){

  const content =
    post.content ||
    post.text ||

/* =========================================================
   LIKE / UNLIKE
   ========================================================= */

async function toggleLike(postId,button){

  if(button.dataset.busy === "1")
    return;

  button.dataset.busy = "1";

  try{

    const result =
      await api(
        `/posts/${encodeURIComponent(postId)}/like`,
        {
          method:"POST"
        }
      );

    const liked =
      Boolean(
        result.liked ??
        result.is_liked
      );

    button.classList.toggle(
      "active",
      liked
    );

    const count =
      button.querySelector(".like-count");

    if(count){

      let value =
        Number(
          result.like_count ??
          result.likes ??
          count.textContent
        );

      count.textContent =
        Math.max(0,value);
    }

  }catch(error){

    toast(
      error.message ||
      "Couldn't update like."
    );

  }finally{

    button.dataset.busy = "0";
  }
}


/* =========================================================
   SAVE / UNSAVE
   ========================================================= */

async function toggleSave(postId,button){

  if(button.dataset.busy === "1")
    return;

  button.dataset.busy = "1";

  try{

    const result =
      await api(
        `/posts/${encodeURIComponent(postId)}/save`,
        {
          method:"POST"
        }
      );

    const saved =
      Boolean(
        result.saved ??
        result.is_saved
      );

    button.classList.toggle(
      "active",
      saved
    );

    toast(
      saved
        ? "Post saved."
        : "Post removed from saved."
    );

  }catch(error){

    toast(
      error.message ||
      "Couldn't update saved posts."
    );

  }finally{

    button.dataset.busy = "0";
  }
}

/* =========================================================

   ========================================================= */

async function sharePost(postId){

  const url =
    `${location.origin}/?post=${encodeURIComponent(postId)}`;

  try{

    if(navigator.share){

      await navigator.share({
        title:"Zilnet",
        url
      });

    }else if(
      navigator.clipboard
    ){

      await navigator.clipboard.writeText(url);

      toast("Post link copied.");

    }else{

      prompt(
        "Copy this link:",
        url
      );
    }

  }catch(error){

    /*
      User cancelling the native share sheet
      is not an error.
    */

    if(error?.name !== "AbortError"){

      toast(
        "Couldn't share this post."
      );
    }
  }
}

/* =========================================================
   UPLOAD
   ========================================================= */

async function uploadFile(file){

  const form =
    new FormData();

  /*
    Worker upload endpoint expects
    the actual multipart file.
  */

  form.append(
    "file",
    file,
    file.name
  );

  const response =
    await fetch(
      "/api/upload",
      {
        method:"POST",
        credentials:"include",
        body:form
      }
    );

  let data = {};

  try{
    data = await response.json();
  }catch{}

  if(!response.ok){

    throw new Error(
      data.error ||
      data.message ||
      "Upload failed."
    );
  }

  return data;
}

        </div>

          type="submit">

function previewPostFile(){

  const file =
    $("postFile")
      ?.files?.[0];

  const preview =
    $("postPreview");

  if(!file || !preview){

    if(preview)
      preview.innerHTML = "";

    return;
  }

  const url =
    URL.createObjectURL(file);

  if(file.type.startsWith("video")){

    preview.innerHTML = `
      <video
        class="media-preview"
        controls
        src="${url}">
      </video>
    `;

  }else{

    preview.innerHTML = `
      <img
        class="media-preview"
        src="${url}"
        alt="">
    `;
  }
}


async function publishPost(event){

  event.preventDefault();

  const content =
    $("postContent")
      .value
      .trim();

  const file =
    $("postFile")
      ?.files?.[0];

  if(!content && !file){

    toast(
      "Write something or choose media."
    );

    return;
  }

  const button =
    event.target.querySelector(
      "button[type=submit]"
    );

  button.disabled = true;
  button.textContent = "Publishing...";

  try{

    let mediaUrl = "";
    let mediaType = "";

    if(file){

      const uploaded =
        await uploadFile(file);

      mediaUrl =
        uploaded.url ||
        uploaded.media_url ||
        "";

      mediaType =
        uploaded.media_type ||
        file.type;
    }

    await api("/posts",{
      method:"POST",
      body:{
        content,
        media_url:mediaUrl,
        media_type:mediaType
      }
    });

    toast("Post published.");

    await home();

  }catch(error){

    toast(
      error.message ||
      "Couldn't publish post."
    );

  }finally{

    button.disabled = false;
    button.textContent = "Publish";
  }
}

async function toggleFollow(userId,button){

  if(button?.dataset.busy === "1")
    return;

  if(button)
    button.dataset.busy = "1";

  try{

    const result =
      await api(
        `/users/${encodeURIComponent(userId)}/follow`,
        {
          method:"POST"
        }
      );

    const following =
      Boolean(
        result.following ??
        result.is_following
      );

    if(button){

      button.textContent =
        following
          ? "Following"
          : "Follow";

      button.classList.toggle(
        "following",
        following
      );
    }

  }catch(error){

    toast(
      error.message ||
      "Couldn't update follow."
    );

  }finally{

    if(button)
      button.dataset.busy = "0";
  }
}

<script>
/* =========================
   ZILNET — PART 3/3
   APP LOGIC + AUTH + EVENTS
========================= */

const API = "/api";

const $ = (id) => document.getElementById(id);

let currentUser = null;
let currentPage = "home";

/* ---------- API HELPER ---------- */

async function api(path, options = {}) {
  try {
    const res = await fetch(API + path, {
      credentials: "include",
      headers: {
        "Content-Type": "application/json",
        ...(options.headers || {})
      },
      ...options
    });

    let data = {};
    try {
      data = await res.json();
    } catch (_) {}

    if (!res.ok) {
      throw new Error(data.error || data.message || `Request failed (${res.status})`);
    }

    return data;
  } catch (err) {
    throw err;
  }
}

/* ---------- MESSAGE ---------- */

function showAuthError(message) {
  const box =
    $("authError") ||
    $("loginError") ||
    $("signupError");

  if (!box) {
    alert(message);
    return;
  }

  box.textContent = message;
  box.style.display = "block";

  box.animate(
    [
      { opacity: 0, transform: "translateY(-5px)" },
      { opacity: 1, transform: "translateY(0)" }
    ],
    {
      duration: 220,
      easing: "ease-out"
    }
  );
}

function clearAuthError() {
  document.querySelectorAll(
    "#authError,#loginError,#signupError"
  ).forEach(el => {
    el.textContent = "";
    el.style.display = "none";
  });
}

/* ---------- AUTH SWITCH ---------- */

function switchAuth(mode) {
  clearAuthError();

  const loginForm =
    $("loginForm") ||
    $("login-form");

  const signupForm =
    $("signupForm") ||
    $("signup-form");

  const loginPanel =
    $("loginPanel") ||
    $("login-panel");

  const signupPanel =
    $("signupPanel") ||
    $("signup-panel");

  const targetLogin = mode === "login";

  const show = targetLogin
    ? (loginForm || loginPanel)
    : (signupForm || signupPanel);

  const hide = targetLogin
    ? (signupForm || signupPanel)
    : (loginForm || loginPanel);

  if (hide) {
    hide.style.animation = "authSlideOut .18s ease forwards";

    setTimeout(() => {
      hide.style.display = "none";

      if (show) {
        show.style.display = "";
        show.style.animation = "authSlideIn .25s ease forwards";
      }
    }, 170);
  } else if (show) {
    show.style.display = "";
    show.style.animation = "authSlideIn .25s ease forwards";
  }

  document.querySelectorAll(
    "[data-auth='login'],[data-auth='signup'],#loginSwitch,#signupSwitch"
  ).forEach(btn => {
    btn.classList.remove("active");
  });

  if (mode === "login") {
    $("loginSwitch")?.classList.add("active");
    document.querySelector("[data-auth='login']")?.classList.add("active");
  } else {
    $("signupSwitch")?.classList.add("active");
    document.querySelector("[data-auth='signup']")?.classList.add("active");
  }
}

/* ---------- LOGIN ---------- */

async function loginUser(e) {
  e?.preventDefault();
  clearAuthError();

  const login =
    $("login")?.value?.trim() ||
    $("username")?.value?.trim() ||
    $("loginUsername")?.value?.trim();

  const password =
    $("password")?.value ||
    $("loginPassword")?.value ||
    "";

  if (!login || !password) {
    showAuthError("Enter your username/email and password.");
    return;
  }

  const button =
    $("loginButton") ||
    $("loginBtn");

  const oldText = button?.textContent;

  if (button) {
    button.disabled = true;
    button.textContent = "Logging in…";
  }

  try {
    await api("/login", {
      method: "POST",
      body: JSON.stringify({
        login,
        password
      })
    });

    await loadCurrentUser();

  } catch (err) {
    showAuthError(err.message || "Login failed.");
  } finally {
    if (button) {
      button.disabled = false;
      button.textContent = oldText || "Login";
    }
  }
}

/* ---------- SIGNUP ---------- */

async function signupUser(e) {
  e?.preventDefault();
  clearAuthError();

  const username =
    $("signupUsername")?.value?.trim() ||
    $("newUsername")?.value?.trim();

  const displayName =
    $("signupDisplayName")?.value?.trim() ||
    $("displayName")?.value?.trim();

  const email =
    $("signupEmail")?.value?.trim() ||
    $("newEmail")?.value?.trim();

  const password =
    $("signupPassword")?.value ||
    $("newPassword")?.value ||
    "";

  if (!username || !displayName || !email || !password) {
    showAuthError("Fill in all required fields.");
    return;
  }

  const button =
    $("signupButton") ||
    $("signupBtn");

  const oldText = button?.textContent;

  if (button) {
    button.disabled = true;
    button.textContent = "Creating…";
  }

  try {
    await api("/signup", {
      method: "POST",
      body: JSON.stringify({
        username,
        displayName,
        email,
        password
      })
    });

    await loadCurrentUser();

  } catch (err) {
    showAuthError(err.message || "Could not create your account.");
  } finally {
    if (button) {
      button.disabled = false;
      button.textContent = oldText || "Create account";
    }
  }
}

/* ---------- CURRENT USER ---------- */

async function loadCurrentUser() {
  try {
    const data = await api("/me");

    currentUser = data.user || data;

    showApp();

    await loadHome();

  } catch (_) {
    showAuth();
  }
}

/* ---------- AUTH / APP VISIBILITY ---------- */

function showAuth() {
  const auth =
    $("authScreen") ||
    $("auth") ||
    $("loginScreen");

  const app =
    $("app") ||
    $("appScreen") ||
    $("mainApp");

  if (auth) auth.style.display = "";
  if (app) app.style.display = "none";

  switchAuth("login");
}

function showApp() {
  const auth =
    $("authScreen") ||
    $("auth") ||
    $("loginScreen");

  const app =
    $("app") ||
    $("appScreen") ||
    $("mainApp");

  if (auth) {
    auth.animate(
      [
        { opacity: 1 },
        { opacity: 0 }
      ],
      {
        duration: 220,
        easing: "ease"
      }
    );

    setTimeout(() => {
      auth.style.display = "none";
    }, 210);
  }

  if (app) {
    app.style.display = "";
    app.animate(
      [
        { opacity: 0 },
        { opacity: 1 }
      ],
      {
        duration: 300,
        easing: "ease-out"
      }
    );
  }
}

/* ---------- LOGOUT ---------- */

async function logoutUser() {
  try {
    await api("/logout", {
      method: "POST"
    });
  } catch (_) {}

  currentUser = null;
  showAuth();
}

/* ---------- HOME ---------- */

async function loadHome() {
  currentPage = "home";

  try {
    const data = await api("/feed");

    const posts =
      data.posts ||
      data.feed ||
      [];

    const feed =
      $("feed") ||
      $("posts");

    if (!feed) return;

    if (!posts.length) {
      feed.innerHTML = `
        <div class="empty-state">
          No posts yet.
        </div>
      `;
      return;
    }

    feed.innerHTML = posts.map(postHTML).join("");

  } catch (err) {
    const feed = $("feed") || $("posts");

    if (feed) {
      feed.innerHTML = `
        <div class="error-state">
          ${escapeHTML(err.message)}
        </div>
      `;
    }
  }
}

/* ---------- POST HTML ---------- */

function postHTML(post) {
  const username =
    post.username ||
    post.display_name ||
    "User";

  const content =
    post.content ||
    post.post_content ||
    "";

  const avatar =
    post.avatar_url ||
    "";

  const media =
    post.media_url ||
    "";

  let mediaHTML = "";

  if (media) {
    if (
      post.media_type === "video" ||
      /\.(mp4|webm|mov)$/i.test(media)
    ) {
      mediaHTML = `
        <video
          class="post-media"
          src="${escapeAttr(media)}"
          controls
          playsinline
        ></video>
      `;
    } else {
      mediaHTML = `
        <img
          class="post-media"
          src="${escapeAttr(media)}"
          loading="lazy"
        >
      `;
    }
  }

  return `
    <article class="post" data-post-id="${escapeAttr(post.id)}">

      <div class="post-header">

        ${
          avatar
            ? `<img class="post-avatar" src="${escapeAttr(avatar)}">`
            : `<div class="post-avatar placeholder"></div>`
        }

        <div>
          <strong>${escapeHTML(username)}</strong>
        </div>

      </div>

      ${
        content
          ? `<div class="post-content">${escapeHTML(content)}</div>`
          : ""
      }

      ${mediaHTML}

      <div class="post-actions">

        <button
          class="post-action"
          onclick="likePost('${escapeAttr(post.id)}')"
        >
          ♡
        </button>

        <button
          class="post-action"
          onclick="openComments('${escapeAttr(post.id)}')"
        >
          ○
        </button>

        <button
          class="post-action"
          onclick="sharePost('${escapeAttr(post.id)}')"
        >
          ↗
        </button>

        <button
          class="post-action"
          onclick="savePost('${escapeAttr(post.id)}')"
        >
          ♢
        </button>

      </div>

    </article>
  `;
}

/* ---------- LIKE ---------- */

async function likePost(id) {
  try {
    await api(`/posts/${encodeURIComponent(id)}/like`, {
      method: "POST"
    });

    await loadHome();

  } catch (err) {
    console.error(err);
  }
}

/* ---------- SAVE ---------- */

async function savePost(id) {
  try {
    await api(`/posts/${encodeURIComponent(id)}/save`, {
      method: "POST"
    });

    showToast("Saved");

  } catch (err) {
    showToast(err.message);
  }
}

/* ---------- SHARE ---------- */

async function sharePost(id) {
  const url =
    `${location.origin}/?post=${encodeURIComponent(id)}`;

  try {
    if (navigator.share) {
      await navigator.share({
        title: "Zilnet",
        url
      });
    } else {
      await navigator.clipboard.writeText(url);
      showToast("Post link copied");
    }
  } catch (_) {}
}

/* ---------- CREATE POST ---------- */

async function createPost() {
  const text =
    $("postText")?.value?.trim() ||
    $("postContent")?.value?.trim() ||
    "";

  const file =
    $("postFile")?.files?.[0] ||
    $("mediaFile")?.files?.[0];

  if (!text && !file) {
    showToast("Add some content first.");
    return;
  }

  /*
    IMPORTANT:
    The Worker accepts the post data directly.
    A local File object cannot be sent as a fake URL.
  */

  let media_url = "";
  let media_type = "";

  if (file) {
    /*
      Convert the selected file to a data URL.
      This keeps the frontend functional without inventing
      an /api/upload route.
    */

    media_url = await fileToDataURL(file);
    media_type = file.type.startsWith("video/")
      ? "video"
      : "image";
  }

  try {
    await api("/posts", {
      method: "POST",
      body: JSON.stringify({
        content: text,
        media_url,
        media_type
      })
    });

    if ($("postText")) $("postText").value = "";
    if ($("postContent")) $("postContent").value = "";

    if ($("postFile")) $("postFile").value = "";
    if ($("mediaFile")) $("mediaFile").value = "";

    showToast("Posted");

    await loadHome();

  } catch (err) {
    showToast(err.message || "Could not create post.");
  }
}

/* ---------- FILE PICKER ---------- */

function openMediaPicker() {
  const input =
    $("postFile") ||
    $("mediaFile") ||
    $("createMedia");

  input?.click();
}

function fileToDataURL(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();

    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;

    reader.readAsDataURL(file);
  });
}

/* ---------- COMMENTS ---------- */

async function openComments(id) {
  try {
    const data = await api(
      `/posts/${encodeURIComponent(id)}/comments`
    );

    const comments =
      data.comments ||
      [];

    const text =
      comments.length
        ? comments
            .map(c =>
              `${c.username || "User"}: ${c.content || ""}`
            )
            .join("\n")
        : "No comments yet.";

    const comment = prompt(text + "\n\nWrite a comment:");

    if (!comment?.trim()) return;

    await api(
      `/posts/${encodeURIComponent(id)}/comments`,
      {
        method: "POST",
        body: JSON.stringify({
          content: comment.trim()
        })
      }
    );

    showToast("Comment added");

  } catch (err) {
    showToast(err.message);
  }
}

/* ---------- STORIES ---------- */

async function loadStories() {
  const container =
    $("stories") ||
    $("storyContainer");

  if (!container) return;

  try {
    const data = await api("/stories");

    const stories =
      data.stories ||
      [];

    container.innerHTML = stories.map(story => `
      <button
        class="story"
        onclick="openStory('${escapeAttr(story.id)}')"
      >
        <div class="story-ring">

          ${
            story.avatar_url
              ? `<img src="${escapeAttr(story.avatar_url)}">`
              : `<div class="story-placeholder"></div>`
          }

        </div>

        <span>
          ${escapeHTML(
            story.username ||
            story.display_name ||
            "User"
          )}
        </span>
      </button>
    `).join("");

  } catch (err) {
    console.error(err);
  }
}

async function openStory(id) {
  try {
    const data = await api(
      `/stories/${encodeURIComponent(id)}`
    );

    const story = data.story || data;

    if (story.media_url) {
      window.open(story.media_url, "_blank");
    }

  } catch (err) {
    showToast(err.message);
  }
}

/* ---------- SEARCH ---------- */

async function searchUsers(value) {
  const q = value.trim();

  if (!q) return;

  try {
    const data = await api(
      `/search?q=${encodeURIComponent(q)}`
    );

    renderSearchResults(
      data.users ||
      data.results ||
      []
    );

  } catch (err) {
    showToast(err.message);
  }
}

function renderSearchResults(users) {
  const box =
    $("searchResults");

  if (!box) return;

  box.innerHTML = users.map(user => `
    <button
      class="search-user"
      onclick="openProfile('${escapeAttr(user.id)}')"
    >
      ${
        user.avatar_url
          ? `<img src="${escapeAttr(user.avatar_url)}">`
          : `<div class="avatar-placeholder"></div>`
      }

      <span>
        <strong>${escapeHTML(user.username || "")}</strong>
        <small>${escapeHTML(user.display_name || "")}</small>
      </span>
    </button>
  `).join("");
}

/* ---------- PROFILE ---------- */

async function openProfile(id) {
  try {
    const data = await api(
      `/users/${encodeURIComponent(id)}`
    );

    const user =
      data.user ||
      data;

    currentPage = "profile";

    const profile =
      $("profileContent") ||
      $("profilePanel");

    if (!profile) return;

    profile.innerHTML = `
      <div class="profile-head">

        ${
          user.avatar_url
            ? `<img class="profile-avatar" src="${escapeAttr(user.avatar_url)}">`
            : `<div class="profile-avatar placeholder"></div>`
        }

        <h2>${escapeHTML(user.display_name || user.username)}</h2>

        <p>@${escapeHTML(user.username || "")}</p>

        ${
          user.bio
            ? `<p>${escapeHTML(user.bio)}</p>`
            : ""
        }

        <button onclick="followUser('${escapeAttr(user.id)}')">
          Follow
        </button>

      </div>
    `;

    showPage("profile");

  } catch (err) {
    showToast(err.message);
  }
}

/* ---------- FOLLOW ---------- */

async function followUser(id) {
  try {
    await api(
      `/users/${encodeURIComponent(id)}/follow`,
      {
        method: "POST"
      }
    );

    showToast("Follow updated");

  } catch (err) {
    showToast(err.message);
  }
}

/* ---------- PAGE SWITCH ---------- */

function showPage(page) {
  currentPage = page;

  document.querySelectorAll("[data-page]").forEach(el => {
    el.style.display =
      el.dataset.page === page
        ? ""
        : "none";
  });

  document.querySelectorAll(
    "[data-nav]"
  ).forEach(btn => {
    btn.classList.toggle(
      "active",
      btn.dataset.nav === page
    );
  });

  if (page === "home") {
    loadHome();
    loadStories();
  }

  if (page === "notifications") {
    loadNotifications();
  }

  if (page === "reels") {
    loadReels();
  }
}

/* ---------- NOTIFICATIONS ---------- */

async function loadNotifications() {
  try {
    const data =
      await api("/notifications");

    const box =
      $("notificationsList");

    if (!box) return;

    const items =
      data.notifications ||
      [];

    box.innerHTML =
      items.length
        ? items.map(n =>
            `<div class="notification">
              ${escapeHTML(n.message || "")}
            </div>`
          ).join("")
        : `<div class="empty-state">No notifications.</div>`;

  } catch (err) {
    console.error(err);
  }
}

/* ---------- REELS ---------- */

async function loadReels() {
  try {
    const data =
      await api("/reels");

    const reels =
      data.reels ||
      [];

    const box =
      $("reelsList");

    if (!box) return;

    box.innerHTML = reels.map(r => `
      <video
        class="reel"
        src="${escapeAttr(r.media_url || "")}"
        controls
        playsinline
        loop
      ></video>
    `).join("");

  } catch (err) {
    console.error(err);
  }
}

/* ---------- TOAST ---------- */

function showToast(message) {
  let toast =
    $("zilnetToast");

  if (!toast) {
    toast = document.createElement("div");
    toast.id = "zilnetToast";

    Object.assign(toast.style, {
      position: "fixed",
      bottom: "90px",
      left: "50%",
      transform: "translateX(-50%)",
      zIndex: "99999",
      padding: "10px 16px",
      borderRadius: "12px",
      background: "#fff",
      color: "#000",
      fontSize: "14px",
      boxShadow: "0 8px 30px rgba(0,0,0,.35)"
    });

    document.body.appendChild(toast);
  }

  toast.textContent = message;

  toast.animate(
    [
      { opacity: 0, transform: "translate(-50%,10px)" },
      { opacity: 1, transform: "translate(-50%,0)" }
    ],
    {
      duration: 180,
      fill: "forwards"
    }
  );

  clearTimeout(toast._timer);

  toast._timer = setTimeout(() => {
    toast.animate(
      [
        { opacity: 1 },
        { opacity: 0 }
      ],
      {
        duration: 180,
        fill: "forwards"
      }
    );
  }, 1800);
}

/* ---------- ICON NORMALIZATION ---------- */

function normalizeIcons() {

  document.querySelectorAll(
    "img.icon, img.nav-icon, img.action-icon, .icon-box img"
  ).forEach(img => {

    img.style.width = "";
    img.style.height = "";
    img.style.maxWidth = "100%";
    img.style.maxHeight = "100%";
    img.style.objectFit = "contain";
    img.style.objectPosition = "center";
    img.style.display = "block";

  });
}

/* ---------- ICON CLICK ANIMATION ---------- */

document.addEventListener("click", e => {

  const icon =
    e.target.closest(
      "img.icon, img.nav-icon, img.action-icon, .icon-box"
    );

  if (!icon) return;

  icon.animate(
    [
      {
        transform: "scale(1)"
      },
      {
        transform: "scale(.78)"
      },
      {
        transform: "scale(1.08)"
      },
      {
        transform: "scale(1)"
      }
    ],
    {
      duration: 240,
      easing: "cubic-bezier(.2,.8,.2,1)"
    }
  );
});

/* ---------- ESCAPE ---------- */

function escapeHTML(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function escapeAttr(value) {
  return escapeHTML(value);
}

/* ---------- EVENT WIRING ---------- */

function wireEvents() {

  /* LOGIN */

  $("loginForm")?.addEventListener(
    "submit",
    loginUser
  );

  $("login-form")?.addEventListener(
    "submit",
    loginUser
  );

  $("loginButton")?.addEventListener(
    "click",
    loginUser
  );

  $("loginBtn")?.addEventListener(
    "click",
    loginUser
  );


  /* SIGNUP */

  $("signupForm")?.addEventListener(
    "submit",
    signupUser
  );

  $("signup-form")?.addEventListener(
    "submit",
    signupUser
  );

  $("signupButton")?.addEventListener(
    "click",
    signupUser
  );

  $("signupBtn")?.addEventListener(
    "click",
    signupUser
  );


  /* AUTH SWITCH */

  $("loginSwitch")?.addEventListener(
    "click",
    () => switchAuth("login")
  );

  $("signupSwitch")?.addEventListener(
    "click",
    () => switchAuth("signup")
  );

  document
    .querySelectorAll("[data-auth='login']")
    .forEach(btn =>
      btn.addEventListener(
        "click",
        () => switchAuth("login")
      )
    );

  document
    .querySelectorAll("[data-auth='signup']")
    .forEach(btn =>
      btn.addEventListener(
        "click",
        () => switchAuth("signup")
      )
    );


  /* LOGOUT */

  $("logout")?.addEventListener(
    "click",
    logoutUser
  );

  $("logoutButton")?.addEventListener(
    "click",
    logoutUser
  );


  /* CREATE */

  $("createPostButton")?.addEventListener(
    "click",
    createPost
  );

  $("postButton")?.addEventListener(
    "click",
    createPost
  );

  $("mediaButton")?.addEventListener(
    "click",
    openMediaPicker
  );

  $("cameraButton")?.addEventListener(
    "click",
    openMediaPicker
  );


  /* NAVIGATION */

  document
    .querySelectorAll("[data-nav]")
    .forEach(btn => {

      btn.addEventListener(
        "click",
        () => showPage(btn.dataset.nav)
      );

    });


  /* SEARCH */

  $("searchInput")?.addEventListener(
    "keydown",
    e => {

      if (e.key === "Enter") {
        searchUsers(e.target.value);
      }

    }
  );


  /* FILE PREVIEW */

  document
    .querySelectorAll(
      "#postFile,#mediaFile,#createMedia"
    )
    .forEach(input => {

      input.addEventListener(
        "change",
        () => {

          const file =
            input.files?.[0];

          if (file) {
            showToast(
              `${file.name} selected`
            );
          }

        }
      );

    });
}

/* ---------- START ---------- */

document.addEventListener(
  "DOMContentLoaded",
  async () => {

    wireEvents();
    normalizeIcons();

    /*
      This is important:
      the page immediately checks the actual
      Cloudflare session instead of pretending
      that a user is logged in.
    */

    await loadCurrentUser();

    loadStories();

  }
);
</script>
