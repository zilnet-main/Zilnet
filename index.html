<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>ZILNET</title>

<style>
:root{
  --bg:#050505;
  --surface:#0b0b0d;
  --surface2:#111114;
  --text:#f7f7f7;
  --muted:#85858d;
  --line:rgba(255,255,255,.08);
  --nav:rgba(5,5,5,.84);
  --danger:#ff4964;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:
    Inter,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
}

body{
  overflow-x:hidden;
}

button,input,textarea{
  font:inherit;
}

button{
  color:inherit;
  border:0;
  background:none;
  cursor:pointer;
}

input,textarea{
  color:var(--text);
  background:transparent;
  outline:none;
}

.hidden{
  display:none!important;
}

/* =========================
   AUTH
========================= */

#auth{
  min-height:100dvh;
  display:grid;
  place-items:center;
  padding:28px;
  background:
    radial-gradient(
      circle at 20% 10%,
      rgba(255,255,255,.08),
      transparent 30%
    ),
    radial-gradient(
      circle at 80% 90%,
      rgba(255,255,255,.05),
      transparent 35%
    ),
    var(--bg);
}

.auth{
  width:min(420px,100%);
  animation:appear .6s ease;
}

.logo{
  font-size:clamp(60px,17vw,94px);
  font-weight:950;
  letter-spacing:-.1em;
  line-height:.8;
  text-align:center;
}

.tagline{
  text-align:center;
  color:var(--muted);
  font-size:14px;
  margin:24px 0 36px;
}

.auth-form{
  display:grid;
  gap:12px;
}

.field{
  width:100%;
  padding:16px;
  border:1px solid var(--line);
  border-radius:17px;
  transition:.2s;
}

.field:focus{
  border-color:rgba(255,255,255,.3);
  box-shadow:0 0 0 4px rgba(255,255,255,.025);
}

.primary{
  padding:15px 18px;
  border-radius:17px;
  background:var(--text);
  color:var(--bg);
  font-weight:800;
  transition:.2s;
}

.primary:active{
  transform:scale(.97);
}

.auth-switch{
  text-align:center;
  margin-top:20px;
  color:var(--muted);
  font-size:14px;
}

.link{
  color:var(--muted);
}

.link:hover{
  color:var(--text);
}

.error{
  min-height:20px;
  color:var(--danger);
  font-size:13px;
  text-align:center;
}

/* =========================
   APP
========================= */

#app{
  min-height:100dvh;
  padding-bottom:82px;
}

.topbar{
  height:62px;
  position:sticky;
  top:0;
  z-index:20;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 18px;

  background:var(--nav);
  backdrop-filter:blur(24px);

  border-bottom:1px solid var(--line);
}

.wordmark{
  font-size:21px;
  font-weight:950;
  letter-spacing:-.08em;
}

.top-actions{
  display:flex;
  gap:5px;
}

.icon-btn{
  width:42px;
  height:42px;
  border-radius:50%;

  display:grid;
  place-items:center;

  transition:.2s;
}

.icon-btn:hover{
  background:var(--surface2);
}

.icon-btn:active{
  transform:scale(.88);
}

.main{
  width:min(760px,100%);
  margin:auto;
  padding:0 16px;
}

.page{
  display:none;
}

.page.active{
  display:block;
  animation:pageIn .35s ease;
}

/* =========================
   HOME
========================= */

.hero{
  height:200px;
  display:grid;
  place-items:center;
  position:relative;
  overflow:hidden;
}

.hero::before{
  content:"";
  position:absolute;

  width:320px;
  height:320px;

  border-radius:50%;

  background:
    radial-gradient(
      circle,
      rgba(255,255,255,.09),
      transparent 68%
    );

  filter:blur(20px);
}

.hero-title{
  position:relative;
  font-size:clamp(52px,14vw,88px);
  font-weight:950;
  letter-spacing:-.1em;
}

.label{
  margin:5px 2px 12px;

  font-size:11px;
  letter-spacing:.18em;
  text-transform:uppercase;

  color:var(--muted);
}

/* STORIES */

.stories{
  display:flex;
  gap:18px;

  overflow-x:auto;
  padding:5px 3px 24px;

  scrollbar-width:none;
}

.stories::-webkit-scrollbar{
  display:none;
}

.story{
  width:70px;
  flex:0 0 70px;
  text-align:center;
}

.story-ring{
  width:68px;
  height:68px;

  padding:2px;

  border-radius:50%;

  background:
    conic-gradient(
      #fff,
      #444,
      #fff,
      #777,
      #fff
    );

  animation:ring 5s linear infinite;
}

.story-inner{
  width:100%;
  height:100%;

  display:grid;
  place-items:center;

  overflow:hidden;

  border-radius:50%;
  border:3px solid var(--bg);

  background:var(--surface2);
}

.story-inner img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.story-name{
  margin-top:7px;

  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;

  font-size:11px;
  color:var(--muted);
}

/* COMPOSER */

.composer{
  padding:20px 2px;
  border-bottom:1px solid var(--line);
}

.composer textarea{
  width:100%;
  min-height:85px;

  resize:none;

  border:0;

  font-size:17px;
  line-height:1.5;
}

.composer-bottom{
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.counter{
  color:var(--muted);
  font-size:12px;
}

/* POSTS */

.post{
  padding:22px 2px;
  border-bottom:1px solid var(--line);

  animation:appear .35s ease;
}

.post-head{
  display:flex;
  align-items:center;
  gap:11px;
}

.avatar{
  width:43px;
  height:43px;

  border-radius:50%;

  object-fit:cover;

  background:var(--surface2);

  display:grid;
  place-items:center;

  font-weight:850;
}

.user-info{
  flex:1;
  min-width:0;
}

.username{
  font-weight:800;
}

.time{
  color:var(--muted);
  font-size:12px;
}

.post-text{
  margin:16px 0;

  line-height:1.55;
  white-space:pre-wrap;
}

.post-actions{
  display:flex;
  gap:3px;
}

.action{
  padding:9px 11px;
  border-radius:12px;

  color:var(--muted);

  transition:.2s;
}

.action:hover{
  background:var(--surface2);
  color:var(--text);
}

.action.liked{
  color:var(--danger);
}

/* =========================
   SEARCH
========================= */

.search{
  display:flex;
  gap:10px;
  align-items:center;

  padding:20px 2px;

  border-bottom:1px solid var(--line);
}

.search input{
  flex:1;
  border:0;
  font-size:17px;
}

.user-row{
  display:flex;
  align-items:center;
  gap:12px;

  padding:16px 2px;

  border-bottom:1px solid var(--line);
}

.user-main{
  flex:1;
}

.user-sub{
  margin-top:3px;
  color:var(--muted);
  font-size:13px;
}

.outline{
  padding:10px 15px;

  border:1px solid var(--line);
  border-radius:13px;

  font-weight:750;
}

/* =========================
   CHAT
========================= */

.chat-header{
  display:flex;
  align-items:center;
  gap:12px;

  padding:17px 2px;

  border-bottom:1px solid var(--line);
}

.chat-header-info{
  flex:1;
}

.chat-name{
  font-weight:850;
}

.chat-sub{
  color:var(--muted);
  font-size:12px;
}

.chat-list{
  padding-bottom:20px;
}

.chat-row{
  width:100%;

  display:flex;
  align-items:center;
  gap:12px;

  padding:16px 2px;

  text-align:left;

  border-bottom:1px solid var(--line);

  transition:.2s;
}

.chat-row:hover{
  background:var(--surface);
}

.chat-row-info{
  flex:1;
}

.chat-row-title{
  font-weight:800;
}

.chat-row-sub{
  color:var(--muted);
  font-size:13px;
  margin-top:3px;
}

.chat-type{
  font-size:11px;
  color:var(--muted);
}

/* CHAT SCREEN */

.chat-screen{
  position:fixed;
  inset:0;

  z-index:40;

  background:var(--bg);

  display:flex;
  flex-direction:column;

  animation:slideIn .3s ease;
}

.chat-screen-head{
  height:65px;

  display:flex;
  align-items:center;
  gap:10px;

  padding:0 15px;

  background:var(--nav);
  backdrop-filter:blur(22px);

  border-bottom:1px solid var(--line);
}

.chat-screen-title{
  flex:1;
}

.messages{
  flex:1;

  overflow-y:auto;

  padding:18px 15px 110px;
}

.message{
  max-width:78%;

  width:max-content;

  padding:11px 14px;

  margin:7px 0;

  border-radius:18px;

  background:var(--surface2);

  line-height:1.45;

  animation:messageIn .2s ease;
}

.message.me{
  margin-left:auto;

  background:var(--text);
  color:var(--bg);
}

.message-meta{
  margin-top:4px;
  font-size:10px;
  opacity:.55;
}

.chat-input{
  position:fixed;
  left:0;
  right:0;
  bottom:0;

  display:flex;
  gap:8px;

  padding:10px 13px calc(10px + env(safe-area-inset-bottom));

  background:var(--nav);
  backdrop-filter:blur(24px);

  border-top:1px solid var(--line);
}

.chat-input input{
  flex:1;

  border:0;

  border-radius:20px;

  padding:12px 15px;

  background:var(--surface2);
}

/* =========================
   PROFILE
========================= */

.profile{
  padding:28px 2px;
}

.profile-top{
  display:flex;
  gap:18px;
  align-items:center;
}

.profile-avatar{
  width:90px;
  height:90px;

  border-radius:50%;

  object-fit:cover;

  background:var(--surface2);

  display:grid;
  place-items:center;

  font-size:28px;
  font-weight:900;
}

.profile-info{
  flex:1;
}

.profile-name{
  font-size:23px;
  font-weight:900;
}

.profile-username{
  color:var(--muted);
  font-size:13px;
}

.bio{
  margin-top:9px;
  color:var(--muted);
  line-height:1.45;
}

.stats{
  display:flex;
  gap:32px;

  margin-top:25px;
}

.stat b{
  font-size:18px;
}

.stat span{
  display:block;

  margin-top:3px;

  color:var(--muted);
  font-size:12px;
}

.profile-buttons{
  display:flex;
  gap:8px;

  margin-top:22px;
}

/* =========================
   BOTTOM NAV
========================= */

.bottom{
  position:fixed;

  left:0;
  right:0;
  bottom:0;

  z-index:30;

  height:74px;

  background:var(--nav);

  backdrop-filter:blur(24px);

  border-top:1px solid var(--line);

  padding-bottom:env(safe-area-inset-bottom);
}

.nav{
  width:min(760px,100%);
  height:100%;
  margin:auto;

  display:grid;
  grid-template-columns:repeat(5,1fr);
}

.nav button{
  display:grid;
  place-items:center;

  color:var(--muted);

  font-size:22px;
}

.nav button.active{
  color:var(--text);
}

.nav .create{
  font-size:31px;
}

/* =========================
   MODAL
========================= */

.modal{
  position:fixed;
  inset:0;

  z-index:70;

  display:grid;
  place-items:end center;

  background:rgba(0,0,0,.55);

  backdrop-filter:blur(7px);

  animation:appear .2s ease;
}

.modal-box{
  width:min(600px,100%);

  padding:20px;

  background:var(--surface);

  border-radius:28px 28px 0 0;

  animation:sheet .3s ease;
}

.modal-handle{
  width:40px;
  height:4px;

  margin:0 auto 18px;

  border-radius:20px;

  background:var(--muted);

  opacity:.4;
}

.modal-box h2{
  margin:5px 0 20px;
}

.modal-option{
  width:100%;

  padding:17px 2px;

  text-align:left;

  border-bottom:1px solid var(--line);
}

/* GROUP CREATOR */

.group-users{
  max-height:45vh;
  overflow-y:auto;
}

.check-user{
  display:flex;
  align-items:center;
  gap:12px;

  padding:13px 2px;

  border-bottom:1px solid var(--line);
}

.check-user input{
  width:19px;
  height:19px;
}

/* =========================
   EMPTY / LOADING
========================= */

.empty{
  text-align:center;

  padding:80px 20px;

  color:var(--muted);
}

.empty strong{
  display:block;

  color:var(--text);

  font-size:18px;

  margin-bottom:7px;
}

.loader{
  width:22px;
  height:22px;

  margin:50px auto;

  border:2px solid var(--line);
  border-top-color:var(--text);

  border-radius:50%;

  animation:spin .7s linear infinite;
}

/* =========================
   ANIMATIONS
========================= */

@keyframes appear{
  from{
    opacity:0;
    transform:translateY(12px);
  }

  to{
    opacity:1;
    transform:none;
  }
}

@keyframes pageIn{
  from{
    opacity:0;
    transform:translateY(8px);
  }

  to{
    opacity:1;
    transform:none;
  }
}

@keyframes slideIn{
  from{
    opacity:0;
    transform:translateX(30px);
  }

  to{
    opacity:1;
    transform:none;
  }
}

@keyframes messageIn{
  from{
    opacity:0;
    transform:scale(.96) translateY(5px);
  }

  to{
    opacity:1;
    transform:none;
  }
}

@keyframes sheet{
  from{
    transform:translateY(100%);
  }

  to{
    transform:none;
  }
}

@keyframes ring{
  to{
    transform:rotate(360deg);
  }
}
</style>
</head>

<body>

<!-- =========================
     AUTH
========================= -->

<section id="auth">

  <div class="auth">

    <div class="logo">ZILNET</div>

    <div class="tagline">
      Connect. Create. Discover.
    </div>

    <form id="authForm" class="auth-form">

      <input
        id="username"
        class="field"
        placeholder="Username"
        autocomplete="username"
        required
      >

      <input
        id="displayName"
        class="field hidden"
        placeholder="Display name"
        autocomplete="name"
      >

      <input
        id="email"
        class="field hidden"
        placeholder="Email"
        autocomplete="email"
      >

      <input
        id="password"
        class="field"
        type="password"
        placeholder="Password"
        autocomplete="current-password"
        required
      >

      <button
        id="authBtn"
        class="primary"
        type="submit"
      >
        Log in
      </button>

      <button
        id="forgot"
        class="link"
        type="button"
      >
        Forgot password?
      </button>

      <div id="authError" class="error"></div>

    </form>

    <div class="auth-switch">

      <span id="switchText">
        New to Zilnet?
      </span>

      <button
        id="switchAuth"
        class="link"
        type="button"
      >
        Create account
      </button>

    </div>

  </div>

</section>


<!-- =========================
     APP
========================= -->

<section id="app" class="hidden">

<header class="topbar">

  <button
    class="wordmark"
    onclick="navigate('home')"
  >
    ZILNET
  </button>

  <div class="top-actions">

    <button
      class="icon-btn"
      onclick="toggleTheme()"
    >
      ◐
    </button>

    <button
      class="icon-btn"
      onclick="navigate('profile')"
    >
      ○
    </button>

  </div>

</header>


<main class="main">

<!-- HOME -->

<section
  id="page-home"
  class="page active"
>

  <div class="hero">

    <div class="hero-title">
      ZILNET
    </div>

  </div>


  <div class="label">
    Stories
  </div>

  <div
    id="stories"
    class="stories"
  ></div>


  <div class="composer">

    <textarea
      id="postText"
      maxlength="5000"
      placeholder="Share something..."
    ></textarea>

    <div class="composer-bottom">

      <span
        id="counter"
        class="counter"
      >
        0 / 5000
      </span>

      <button
        class="primary"
        onclick="createPost()"
      >
        Post
      </button>

    </div>

  </div>


  <div id="feed"></div>

</section>


<!-- DISCOVER -->

<section
  id="page-discover"
  class="page"
>

  <div class="search">

    <span>⌕</span>

    <input
      id="searchInput"
      placeholder="Search people"
    >

  </div>

  <div id="searchResults"></div>

</section>


<!-- REELS -->

<section
  id="page-reels"
  class="page"
>

  <div class="hero">
    <div
      class="hero-title"
      style="font-size:52px"
    >
      REELS
    </div>
  </div>

  <div id="reels"></div>

</section>


<!-- CHAT -->

<section
  id="page-chat"
  class="page"
>

  <div
    style="
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:24px 2px 15px;
    "
  >

    <div>

      <div class="label">
        Messages
      </div>

      <h2 style="margin:0">
        Chats
      </h2>

    </div>

    <button
      class="outline"
      onclick="openChatMenu()"
    >
      ＋ Group
    </button>

  </div>


  <div id="chatList"></div>

</section>


<!-- PROFILE -->

<section
  id="page-profile"
  class="page"
>

  <div id="profile"></div>

</section>

</main>


<!-- NAV -->

<nav class="bottom">

  <div class="nav">

    <button
      data-page="home"
      class="active"
      onclick="navigate('home')"
    >
      ⌂
    </button>

    <button
      data-page="discover"
      onclick="navigate('discover')"
    >
      ⌕
    </button>

    <button
      class="create"
      onclick="focusPost()"
    >
      ＋
    </button>

    <button
      data-page="reels"
      onclick="navigate('reels')"
    >
      ▷
    </button>

    <button
      data-page="chat"
      onclick="navigate('chat')"
    >
      ◌
    </button>

  </div>

</nav>

</section>


<div id="modalRoot"></div>


<script>

/* =========================================================
   ZILNET FRONTEND
========================================================= */

const state = {

  me:null,

  authMode:"login",

  page:"home",

  theme:
    localStorage.getItem("zilnet-theme")
    || "dark",

  searchTimer:null,

  activeChat:null

};


/* =========================================================
   API
========================================================= */

async function api(
  path,
  options={}
){

  const response =
    await fetch(
      path,
      {
        credentials:"include",

        ...options,

        headers:{
          "Content-Type":"application/json",
          ...(options.headers || {})
        }
      }
    );

  const data =
    await response
      .json()
      .catch(()=>({}));

  if(!response.ok){

    throw new Error(
      data.error
      || `Request failed (${response.status})`
    );

  }

  return data;

}


/* =========================================================
   HELPERS
========================================================= */

function esc(value=""){

  return String(value)
    .replace(/[&<>"']/g,c=>({

      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"

    }[c]));

}


function initials(name="Z"){

  return esc(
    String(name)
      .trim()
      .slice(0,1)
      .toUpperCase()
      || "Z"
  );

}


function avatar(user,size=""){

  if(user?.avatar_url){

    return `
      <img
        class="avatar ${size}"
        src="${esc(user.avatar_url)}"
        alt=""
      >
    `;

  }

  return `
    <div class="avatar ${size}">
      ${initials(
        user?.display_name
        || user?.username
        || "Z"
      )}
    </div>
  `;

}


function timeAgo(date){

  const diff =
    Date.now()
    - new Date(date).getTime();

  const mins =
    Math.floor(diff / 60000);

  if(mins < 1) return "now";

  if(mins < 60)
    return `${mins}m`;

  const hours =
    Math.floor(mins / 60);

  if(hours < 24)
    return `${hours}h`;

  return `${Math.floor(hours/24)}d`;

}


/* =========================================================
   THEME
========================================================= */

function applyTheme(){

  if(state.theme === "light"){

    document.documentElement.style.setProperty(
      "--bg",
      "#fafafa"
    );

    document.documentElement.style.setProperty(
      "--surface",
      "#ffffff"
    );

    document.documentElement.style.setProperty(
      "--surface2",
      "#f2f2f4"
    );

    document.documentElement.style.setProperty(
      "--text",
      "#101010"
    );

    document.documentElement.style.setProperty(
      "--muted",
      "#73737a"
    );

    document.documentElement.style.setProperty(
      "--line",

      "--surface",
      "#0b0b0d"
    );

      "--surface2",
      "#111114"
    );

    document.documentElement.style.setProperty(
      "--text",
      "#f7f7f7"
    );

    document.documentElement.style.setProperty(

    );

      "--line",

    );

function setAuthMode(mode){

  state.authMode = mode;

  const signup =
    mode === "signup";

  document
    .getElementById("displayName")
    .classList.toggle(
      "hidden",
      !signup
    );

  document
    .getElementById("email")
    .classList.toggle(
      "hidden",
      !signup
    );

  document
    .getElementById("forgot")
    .classList.toggle(
      "hidden",
      signup
    );

  document
    .getElementById("authBtn")
    .textContent =
      signup
        ? "Create account"
        : "Log in";

  document
    .getElementById("switchText")
    .textContent =
      signup
        ? "Already have an account?"
        : "New to Zilnet?";

  document
    .getElementById("switchAuth")
    .textContent =
      signup
        ? "Log in"
        : "Create account";

  document
    .getElementById("authError")
    .textContent = "";

}


document
  .getElementById("switchAuth")
  .onclick = ()=>{

    setAuthMode(
      state.authMode === "login"
        ? "signup"
        : "login"
    );

  };


document
  .getElementById("authForm")
  .onsubmit = async event=>{

    event.preventDefault();

    const error =
      document.getElementById(
        "authError"
      );

    error.textContent = "";

    try{

      if(state.authMode === "signup"){

        const data =
          await api(
            "/api/signup",
            {
              method:"POST",

              body:JSON.stringify({

                username:
                  document
                    .getElementById("username")
                    .value
                    .trim()
                    .toLowerCase(),

                displayName:
                  document
                    .getElementById("displayName")
                    .value
                    .trim(),

                email:
                  document
                    .getElementById("email")
                    .value
                    .trim(),

                password:
                  document
                    .getElementById("password")
                    .value

              })

            }
          );

        state.me = data.user;

      }else{

        const data =
          await api(
            "/api/login",
            {
              method:"POST",

              body:JSON.stringify({

                login:
                  document
                    .getElementById("username")
                    .value
                    .trim(),

                password:
                  document
                    .getElementById("password")
                    .value

              })

            }
          );

        state.me = data.user;

      }

      enterApp();

    }catch(err){

      error.textContent =
        err.message;

    }

  };


document
  .getElementById("forgot")
  .onclick = async()=>{

    const email =
      prompt(
        "Enter your account email:"
      );

    if(!email) return;

    try{

      await api(
        "/api/forgot-password",
        {
          method:"POST",

          body:JSON.stringify({
            email:email.trim()
          })

        }
      );

      alert(
        "If the account exists, reset instructions were sent."
      );

    }catch(err){

      alert(err.message);

    }

  };

async function boot(){

  applyTheme();

  try{

    const data =
      await api("/api/me");

    if(data?.user){

      state.me = data.user;

      enterApp();

      return;

    }

  }catch{}

  document
    .getElementById("auth")
    .classList.remove("hidden");

}


async function enterApp(){

  document
    .getElementById("auth")
    .classList.add("hidden");

  document
    .getElementById("app")
    .classList.remove("hidden");

  navigate("home");

  loadStories();
  loadFeed();
  loadChats();
  loadProfile();

}


async function logout(){

  try{

    await api(
      "/api/logout",
      {
        method:"POST"
      }
    );

  }catch{}

  state.me = null;

  document
    .getElementById("app")
    .classList.add("hidden");

  document
    .getElementById("auth")
    .classList.remove("hidden");

  setAuthMode("login");

}

function navigate(page){

  state.page = page;

  document
    .querySelectorAll(".page")
    .forEach(el=>{
      el.classList.remove("active");
    });

  document
    .getElementById(
      "page-" + page
    )
    .classList.add("active");

  document
    .querySelectorAll(".nav button")
    .forEach(button=>{
      button.classList.toggle(
        "active",
        button.dataset.page === page
      );
    });

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

  if(page === "home")
    loadFeed();

  if(page === "chat")
    loadChats();

  if(page === "profile")
    loadProfile();

}

async function startDirectChat(userId){

  try{

    /*
      Worker endpoint:
      POST /api/chats

      The current Worker owns creation of
      the chat. We send the other user's ID.
    */

    const data =
      await api(
        "/api/chats",
        {
          method:"POST",

          body:JSON.stringify({

            userId

          })

        }
      );

    const chatId =
      data.chat?.id ||
      data.chatId ||
      data.id;

    if(!chatId){

      alert(
        "Chat created, but the server did not return a chat ID."
      );

      return;

    }

    openChat(chatId);

  }catch(err){

    alert(err.message);

  }

}

function renderChatRow(chat){

   CHAT SCREEN
========================================================= */

async function openChat(chatId){

  state.activeChat = chatId;

  const screen =
    document.createElement("div");

  screen.className =
    "chat-screen";

  screen.id =
    "activeChatScreen";

  screen.innerHTML = `

    <div class="chat-screen-head">

      <button
        class="icon-btn"
        onclick="closeChat()"
      >
        ‹
      </button>

      <div class="chat-screen-title">

        <div
          id="activeChatName"
          class="chat-name"
        >
          Conversation
        </div>

        <div class="chat-sub">
          Messages
        </div>

      </div>

    </div>

    <div
      id="messages"
      class="messages"
    >
      <div class="loader"></div>
    </div>

    <form
      id="messageForm"
      class="chat-input"
    >

      <input
        id="messageText"
        placeholder="Message..."
        autocomplete="off"
      >

      <button class="primary">
        Send
      </button>

    </form>

  `;

  document.body.appendChild(screen);

  document
    .getElementById("messageForm")
    .onsubmit =
      event=>{
        event.preventDefault();
        sendMessage(chatId);
      };

  await loadMessages(chatId);

}


async function loadMessages(chatId){

  const box =
    document.getElementById(
      "messages"
    );

  if(!box) return;

  try{

    const data =
      await api(
        `/api/chats/${chatId}/messages`
      );

    const messages =
      data.messages || [];

    if(!messages.length){

      box.innerHTML = `
        <div class="empty">
          <strong>
            No messages yet.
          </strong>

          Start the conversation.
        </div>
      `;

      return;

    }

    box.innerHTML =
      messages
        .map(renderMessage)
        .join("");

    box.scrollTop =
      box.scrollHeight;

  }catch(err){

    box.innerHTML = `
      <div class="empty">
        ${esc(err.message)}
      </div>
    `;

  }

}


function renderMessage(message){

  const mine =
    String(message.user_id)
    === String(state.me?.id);

  return `

    <div
      class="message ${mine ? "me" : ""}"
    >

      ${esc(
        message.content
        || message.text
        || ""
      )}

      <div class="message-meta">
        ${mine ? "You" : ""}
      </div>

    </div>

  `;

}


async function sendMessage(chatId){

  const input =
    document.getElementById(
      "messageText"
    );

  const content =
    input.value.trim();

  if(!content)
    return;

  try{

    await api(
      `/api/chats/${chatId}/messages`,
      {
        method:"POST",

        body:JSON.stringify({
          content
        })

      }
    );

    input.value = "";

    await loadMessages(chatId);

  }catch(err){

    alert(err.message);

  }

}


function closeChat(){

  const screen =
    document.getElementById(
      "activeChatScreen"
    );

  if(screen)
    screen.remove();

  state.activeChat = null;

  loadChats();

}

async function createGroup(){

  const checked =
    [
      ...document.querySelectorAll(
        ".check-user input:checked"
      )
    ];

  const memberIds =
    checked.map(
      input=>input.value
    );

  const name =
    document
      .getElementById("groupName")
      .value
      .trim();

  if(!name){

    alert(
      "Enter a group name."
    );

    return;

  }

  if(!memberIds.length){

    alert(
      "Select at least one person."
    );

    return;

  }

  try{

    /*
      IMPORTANT:
      The current Worker exposes
      POST /api/groups.

      This sends the common group
      payload expected by the backend.
    */

    const data =
      await api(
        "/api/groups",
        {
          method:"POST",

          body:JSON.stringify({

            name,

            memberIds

          })

        }
      );

    closeModal();

    await loadChats();

    const chatId =
      data.chat?.id ||
      data.chatId ||
      data.id;

    if(chatId)
      openChat(chatId);

  }catch(err){

    alert(err.message);

  }

}

function editProfile(){

  const user =
    state.me || {};

  openModal(`

    <div class="modal-handle"></div>

    <h2>Edit profile</h2>

    <form
      onsubmit="saveProfile(event)"
      style="display:grid;gap:12px"
    >

      <input
        id="editName"
        class="field"
        placeholder="Display name"
        value="${esc(
          user.display_name || ""
        )}"
      >

      <textarea
        id="editBio"
        class="field"
        rows="4"
        placeholder="Bio"
      >${esc(
        user.bio || ""
      )}</textarea>

      <input
        id="editSkills"
        class="field"
        placeholder="Skills separated by commas"
        value="${esc(
          Array.isArray(user.skills)
            ? user.skills.join(", ")
            : user.skills || ""
        )}"
      >

      <button class="primary">
        Save changes
      </button>

    </form>

  `);

}


async function saveProfile(event){

  event.preventDefault();

  const skills =
    document
      .getElementById("editSkills")
      .value
      .split(",")
      .map(x=>x.trim())
      .filter(Boolean);

  try{

    await api(
      "/api/profile/update",
      {
        method:"PUT",

        body:JSON.stringify({

          displayName:
            document
              .getElementById("editName")
              .value
              .trim(),

          bio:
            document
              .getElementById("editBio")
              .value
              .trim(),

          skills

        })

      }
    );

    closeModal();

    loadProfile();

  }catch(err){

    alert(err.message);

  }

}


/* =========================================================
   MODALS
========================================================= */

function openModal(content){

  document
    .getElementById("modalRoot")
    .innerHTML = `

      <div
        class="modal"
        onclick="
          if(event.target===this)
            closeModal()
        "
      >

        <div class="modal-box">

          ${content}

        </div>

      </div>

    `;

}


function closeModal(){

  document
    .getElementById("modalRoot")
    .innerHTML = "";

}


/* =========================================================
   START
========================================================= */

boot();

</script>
