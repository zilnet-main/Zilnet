<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>ZILNET</title>

<link rel="icon" type="image/jpeg" href="/8B3E6116-7C23-4F57-81D1-066DBE799949.jpeg">
<link rel="apple-touch-icon" href="/8B3E6116-7C23-4F57-81D1-066DBE799949.jpeg">

<style>
:root{
  --bg:#fff;
  --surface:#fff;
  --surface2:#f7f7f8;
  --text:#111;
  --muted:#777b83;
  --line:#e8e8eb;
  --soft:#f1f1f3;
  --accent:#111;
  --shadow:0 10px 35px rgba(0,0,0,.07);
  --radius:20px;
  --nav-h:72px;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",
Inter,Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}

body.dark{
  --bg:#050505;
  --surface:#0c0c0d;
  --surface2:#151516;
  --text:#fff;
  --muted:#999ba2;
  --line:#252528;
  --soft:#1a1a1c;
  --accent:#fff;
  --shadow:0 12px 35px rgba(0,0,0,.35);
}

button,input,textarea,select{font:inherit}
button{cursor:pointer}
img{display:block;max-width:100%}
a{color:inherit}

.hidden{display:none!important}

#toast{
  position:fixed;
  left:50%;
  bottom:90px;
  transform:translateX(-50%) translateY(15px);
  z-index:9999;
  background:#111;
  color:#fff;
  padding:12px 17px;
  border-radius:999px;
  font-size:13px;
  font-weight:700;
  opacity:0;
  pointer-events:none;
  transition:.25s ease;
}
body.dark #toast{background:#fff;color:#000}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

button:active{transform:scale(.94)}

.icon{
  width:24px;
  height:24px;
  object-fit:contain;
  object-position:center;
  flex:none;
  transition:transform .16s ease,filter .2s ease,opacity .2s ease;
}

body.dark .icon{
  filter:invert(1);
}

.icon-btn{
  width:42px;
  height:42px;
  border:0;
  background:transparent;
  border-radius:50%;
  display:grid;
  place-items:center;
  padding:0;
}

.icon-btn:hover{background:var(--soft)}
.icon-btn:active .icon{transform:scale(.82)}

.avatar{
  width:44px;
  height:44px;
  border-radius:50%;
  overflow:hidden;
  flex:none;
  background:var(--soft);
  border:1px solid var(--line);
  display:grid;
  place-items:center;
  color:var(--muted);
  font-weight:800;
}

.avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.story-avatar{
  width:76px;
  height:76px;
  border-radius:50%;
  padding:3px;
  background:linear-gradient(135deg,#111,#777,#111);
  display:grid;
  place-items:center;
}

.story-avatar.seen{
  background:var(--line);
}

.story-avatar-inner{
  width:100%;
  height:100%;
  border-radius:50%;
  background:var(--bg);
  padding:3px;
}

.story-avatar-inner .avatar{
  width:100%;
  height:100%;
  border:0;
}

#auth{
  min-height:100dvh;
  display:grid;
  place-items:center;
  padding:25px;
  background:
    radial-gradient(circle at 20% 10%,rgba(0,0,0,.05),transparent 30%),
    var(--bg);
}

.auth-card{
  width:min(430px,100%);
  padding:30px;
  border:1px solid var(--line);
  border-radius:28px;
  background:var(--surface);
  box-shadow:var(--shadow);
}

.brand{
  font-size:36px;
  font-weight:950;
  letter-spacing:-2px;
  text-align:center;
}

.brand-sub{
  text-align:center;
  color:var(--muted);
  margin:7px 0 28px;
  font-size:14px;
}

.auth-tabs{
  display:grid;
  grid-template-columns:1fr 1fr;
  background:var(--soft);
  border-radius:14px;
  padding:4px;
  margin-bottom:18px;
}

.auth-tabs button{
  border:0;
  background:transparent;
  color:var(--muted);
  padding:11px;
  border-radius:11px;
  font-weight:800;
}

.auth-tabs button.active{
  background:var(--surface);
  color:var(--text);
  box-shadow:0 2px 10px rgba(0,0,0,.06);
}

.field{
  width:100%;
  border:1px solid var(--line);
  background:var(--surface2);
  color:var(--text);
  border-radius:14px;
  padding:13px 14px;
  outline:none;
  margin-bottom:11px;
}

.field:focus{
  border-color:var(--text);
}

textarea.field{
  min-height:100px;
  resize:vertical;
}

.primary{
  width:100%;
  border:0;
  border-radius:14px;
  padding:13px 16px;
  background:var(--text);
  color:var(--bg);
  font-weight:850;
}

.secondary{
  border:1px solid var(--line);
  background:var(--surface);
  color:var(--text);
  border-radius:13px;
  padding:10px 14px;
  font-weight:800;
}

.auth-error{
  color:#d11;
  font-size:13px;
  min-height:18px;
  margin:8px 0;
}

#app{
  min-height:100dvh;
  padding-bottom:calc(var(--nav-h) + 20px);
}

.topbar{
  height:74px;
  position:sticky;
  top:0;
  z-index:50;
  background:color-mix(in srgb,var(--bg) 92%,transparent);
  backdrop-filter:blur(18px);
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
}

.logo{
  font-size:26px;
  line-height:1;
  font-weight:1000;
  letter-spacing:-1.5px;
}

.top-actions{
  display:flex;
  align-items:center;
  gap:3px;
}

.page{
  width:min(680px,100%);
  margin:0 auto;
}

.story-strip{
  display:flex;
  gap:18px;
  overflow-x:auto;
  padding:18px 18px 17px;
  border-bottom:1px solid var(--line);
  scrollbar-width:none;
}

.story-strip::-webkit-scrollbar{display:none}

.story-item{
  width:78px;
  flex:none;
  text-align:center;
  border:0;
  background:none;
  color:var(--text);
  padding:0;
}

.story-name{
  margin-top:7px;
  font-size:12px;
  font-weight:700;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.add-story .story-avatar{
  background:var(--soft);
  border:2px dashed #cfd0d4;
}

.add-story-plus{
  width:100%;
  height:100%;
  display:grid;
  place-items:center;
  font-size:30px;
  color:var(--text);
}

.feed{
  padding-bottom:20px;
}

.post{
  border-bottom:1px solid var(--line);
  background:var(--surface);
  padding:17px 18px 15px;
}

.post-head{
  display:flex;
  align-items:center;
  gap:11px;
}

.post-author{
  min-width:0;
  flex:1;
}

.post-author strong{
  display:block;
  font-size:15px;
  font-weight:850;
}

.post-author span{
  display:block;
  color:var(--muted);
  font-size:12px;
  margin-top:2px;
}

.post-author button{
  border:0;
  background:none;
  padding:0;
  color:inherit;
  font-weight:850;
  text-align:left;
}

.post-content{
  margin:15px 0 13px;
  font-size:16px;
  line-height:1.5;
  white-space:pre-wrap;
  word-break:break-word;
}

.media-wrap{
  overflow:hidden;
  border-radius:17px;
  background:#000;
  margin:8px 0 14px;
}

.post-media{
  width:100%;
  max-height:650px;
  object-fit:cover;
}

.text-post-card{
  min-height:230px;
  border-radius:20px;
  display:grid;
  place-items:center;
  padding:32px;
  margin:8px 0 14px;
  text-align:center;
  color:#fff;
  font-size:23px;
  font-weight:850;
  line-height:1.25;
  letter-spacing:-.5px;
}

.post-actions{
  display:flex;
  align-items:center;
  gap:7px;
}

.post-action{
  border:0;
  background:transparent;
  color:var(--text);
  min-width:43px;
  height:40px;
  padding:0 6px;
  display:flex;
  align-items:center;
  gap:5px;
  border-radius:12px;
  font-size:13px;
  font-weight:750;
}

.post-action:hover{background:var(--soft)}
.post-action.liked .icon{filter:none}
body.dark .post-action.liked .icon{filter:invert(1)}

.post-action.save{
  margin-left:auto;
}

.post-menu{
  position:relative;
}

.post-menu-btn{
  border:0;
  background:transparent;
  color:var(--muted);
  width:36px;
  height:36px;
  border-radius:50%;
  font-size:23px;
}

.post-menu-btn:hover{background:var(--soft)}

.empty{
  padding:60px 25px;
  text-align:center;
  color:var(--muted);
}

.empty strong{
  display:block;
  color:var(--text);
  font-size:18px;
  margin-bottom:7px;
}

.bottom-nav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:60;
  height:var(--nav-h);
  padding-bottom:env(safe-area-inset-bottom);
  background:color-mix(in srgb,var(--bg) 94%,transparent);
  backdrop-filter:blur(20px);
  border-top:1px solid var(--line);
  display:grid;
  grid-template-columns:repeat(5,1fr);
}

.bottom-nav button{
  border:0;
  background:transparent;
  color:var(--muted);
  display:grid;
  place-items:center;
  align-content:center;
  gap:3px;
}

.bottom-nav button.active{
  color:var(--text);
}

.bottom-nav .icon{
  width:25px;
  height:25px;
}

.bottom-nav small{
  font-size:9px;
  font-weight:750;
}

.overlay{
  position:fixed;
  inset:0;
  z-index:100;
  background:rgba(0,0,0,.5);
  backdrop-filter:blur(6px);
  display:flex;
  align-items:flex-end;
  justify-content:center;
}

.sheet{
  width:min(680px,100%);
  max-height:92dvh;
  overflow:auto;
  background:var(--surface);
  color:var(--text);
  border-radius:27px 27px 0 0;
  padding:18px;
  animation:sheetIn .22s ease;
}

@keyframes sheetIn{
  from{transform:translateY(30px);opacity:.5}
  to{transform:translateY(0);opacity:1}
}

.sheet-handle{
  width:42px;
  height:4px;
  border-radius:9px;
  background:var(--line);
  margin:0 auto 17px;
}

.sheet-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:17px;
}

.sheet-title h2{
  margin:0;
  font-size:21px;
}

.close-sheet{
  width:38px;
  height:38px;
  border:0;
  background:var(--soft);
  border-radius:50%;
  display:grid;
  place-items:center;
}

.search-box{
  position:relative;
  margin-bottom:12px;
}

.search-box .icon{
  position:absolute;
  left:13px;
  top:50%;
  transform:translateY(-50%);
  width:20px;
  height:20px;
}

.search-box input{
  padding-left:43px;
  margin:0;
}

.user-row{
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px 4px;
  border-bottom:1px solid var(--line);
  cursor:pointer;
}

.user-row:last-child{border-bottom:0}

.user-info{
  flex:1;
  min-width:0;
}

.user-info strong{
  display:block;
  font-size:14px;
}

.user-info span{
  display:block;
  color:var(--muted);
  font-size:12px;
  margin-top:3px;
}

.profile-page{
  padding-bottom:25px;
}

.profile-hero{
  padding:25px 18px 18px;
  border-bottom:1px solid var(--line);
}

.profile-top{
  display:flex;
  align-items:flex-start;
  gap:17px;
}

.profile-avatar{
  width:92px;
  height:92px;
  border-radius:50%;
  overflow:hidden;
  flex:none;
  background:var(--soft);
  border:1px solid var(--line);
}

.profile-avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.profile-main{
  flex:1;
  min-width:0;
}

.profile-main h1{
  font-size:23px;
  margin:2px 0 4px;
  font-weight:900;
}

.profile-main .username{
  color:var(--muted);
  font-size:13px;
}

.profile-bio{
  margin:11px 0 0;
  font-size:14px;
  line-height:1.45;
  white-space:pre-wrap;
}

.profile-stats{
  display:flex;
  gap:23px;
  margin-top:16px;
}

.profile-stat{
  display:flex;
  flex-direction:column;
  font-size:12px;
  color:var(--muted);
}

.profile-stat b{
  color:var(--text);
  font-size:16px;
}

.profile-buttons{
  display:flex;
  gap:8px;
  margin-top:18px;
}

.profile-buttons button{
  flex:1;
  border:1px solid var(--line);
  background:var(--surface2);
  color:var(--text);
  border-radius:13px;
  padding:10px;
  font-weight:800;
}

.profile-more{
  width:44px!important;
  flex:none!important;
  padding:0!important;
  display:grid;
  place-items:center;
}

.profile-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:2px;
  background:var(--line);
  margin-top:2px;
}

.grid-post{
  aspect-ratio:1;
  background:var(--surface2);
  overflow:hidden;
  cursor:pointer;
  display:grid;
  place-items:center;
}

.grid-post img,.grid-post video{
  width:100%;
  height:100%;
  object-fit:cover;
}

.grid-text{
  width:100%;
  height:100%;
  display:grid;
  place-items:center;
  padding:13px;
  color:#fff;
  text-align:center;
  font-size:12px;
  font-weight:800;
}

.settings-list{
  border:1px solid var(--line);
  border-radius:18px;
  overflow:hidden;
}

.setting-row{
  width:100%;
  border:0;
  border-bottom:1px solid var(--line);
  background:var(--surface);
  color:var(--text);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:16px;
  text-align:left;
}

.setting-row:last-child{border-bottom:0}

.setting-left strong{
  display:block;
  font-size:14px;
}

.setting-left span{
  display:block;
  color:var(--muted);
  font-size:12px;
  margin-top:3px;
}

.setting-value{
  color:var(--muted);
  font-size:12px;
}

.danger{color:#d22!important}

.chat-list{
  padding:4px 18px 20px;
}

.chat-row{
  display:flex;
  align-items:center;
  gap:12px;
  padding:14px 2px;
  border-bottom:1px solid var(--line);
  cursor:pointer;
}

.chat-row:hover{background:var(--soft)}

.chat-row .avatar{
  width:50px;
  height:50px;
}

.chat-info{
  flex:1;
  min-width:0;
}

.chat-info strong{
  display:block;
  font-size:15px;
}

.chat-info span{
  display:block;
  color:var(--muted);
  font-size:12px;
  margin-top:4px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.chat-view{
  width:min(680px,100%);
  height:100dvh;
  background:var(--surface);
  display:flex;
  flex-direction:column;
}

.chat-header{
  min-height:70px;
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px 13px;
  border-bottom:1px solid var(--line);
}

.chat-title{
  flex:1;
  min-width:0;
}

.chat-title strong{
  display:block;
  font-size:15px;
}

.chat-title span{
  display:block;
  color:var(--muted);
  font-size:11px;
  margin-top:2px;
}

.chat-members{
  padding:8px 13px;
  border-bottom:1px solid var(--line);
  display:flex;
  gap:7px;
  overflow-x:auto;
}

.member-chip{
  border:1px solid var(--line);
  background:var(--surface2);
  color:var(--text);
  border-radius:999px;
  padding:6px 10px;
  font-size:11px;
  white-space:nowrap;
  cursor:pointer;
}

.messages{
  flex:1;
  overflow:auto;
  padding:17px 14px;
  display:flex;
  flex-direction:column;
  gap:7px;
}

.message{
  max-width:78%;
  padding:10px 13px;
  border-radius:18px;
  background:var(--soft);
  align-self:flex-start;
  font-size:14px;
  line-height:1.4;
  white-space:pre-wrap;
  word-break:break-word;
}

.message.mine{
  background:var(--text);
  color:var(--bg);
  align-self:flex-end;
  border-bottom-right-radius:5px;
}

.message-name{
  display:block;
  color:var(--muted);
  font-size:10px;
  font-weight:800;
  margin-bottom:3px;
  cursor:pointer;
}

.message.mine .message-name{color:color-mix(in srgb,var(--bg) 65%,transparent)}

.chat-input{
  display:flex;
  gap:8px;
  padding:10px;
  padding-bottom:max(10px,env(safe-area-inset-bottom));
  border-top:1px solid var(--line);
}

.chat-input input{
  flex:1;
  min-width:0;
  border:1px solid var(--line);
  background:var(--surface2);
  color:var(--text);
  border-radius:24px;
  padding:11px 14px;
  outline:0;
}

.chat-input button{
  width:48px;
  border:0;
  border-radius:50%;
  background:var(--text);
  color:var(--bg);
  display:grid;
  place-items:center;
}

.story-viewer{
  position:fixed;
  inset:0;
  z-index:300;
  background:#000;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
}

.story-content{
  width:min(600px,100%);
  height:100%;
  position:relative;
  display:grid;
  place-items:center;
  padding:40px 18px;
}

.story-content img,.story-content video{
  max-width:100%;
  max-height:82dvh;
  object-fit:contain;
  border-radius:18px;
}

.story-text{
  max-width:90%;
  padding:35px;
  text-align:center;
  font-size:30px;
  line-height:1.25;
  font-weight:900;
}

.story-top{
  position:absolute;
  top:15px;
  left:15px;
  right:15px;
  display:flex;
  align-items:center;
  gap:10px;
  z-index:2;
}

.story-top .avatar{
  width:38px;
  height:38px;
  background:#222;
  color:#fff;
  border-color:#444;
}

.story-top strong{
  font-size:13px;
}

.story-top span{
  display:block;
  opacity:.65;
  font-size:10px;
  margin-top:2px;
}

.story-close{
  margin-left:auto;
  width:40px;
  height:40px;
  border:0;
  border-radius:50%;
  background:rgba(255,255,255,.12);
  color:#fff;
}

.reels-list{
  padding:12px 18px 25px;
}

.reel{
  border-radius:20px;
  overflow:hidden;
  background:#000;
  margin-bottom:15px;
  position:relative;
}

.reel video{
  width:100%;
  max-height:78dvh;
  display:block;
}

.reel-caption{
  padding:12px;
  color:#fff;
  background:#111;
  font-size:14px;
}

.loading{
  padding:50px;
  text-align:center;
  color:var(--muted);
}

@media(min-width:760px){
  body{
    background:var(--surface2);
  }

  #app{
    width:min(680px,100%);
    margin:auto;
    background:var(--bg);
    min-height:100dvh;
    box-shadow:0 0 60px rgba(0,0,0,.08);
  }

  .bottom-nav{
    width:min(680px,100%);
    left:50%;
    right:auto;
    transform:translateX(-50%);
    border-left:1px solid var(--line);
    border-right:1px solid var(--line);
  }
}
</style>
</head>

<body>

<div id="toast"></div>

<section id="auth">
  <div class="auth-card">
    <div class="brand">ZILNET</div>
    <div class="brand-sub">CREATE · CONNECT · DISCOVER</div>

    <div class="auth-tabs">
      <button id="loginTab" class="active" onclick="authMode('login')">LOG IN</button>
      <button id="signupTab" onclick="authMode('signup')">SIGN UP</button>
    </div>

    <form id="loginForm">
      <input id="loginIdentity" class="field" placeholder="Username or email" autocomplete="username" required>
      <input id="loginPassword" class="field" type="password" placeholder="Password" autocomplete="current-password" required>
      <div id="loginError" class="auth-error"></div>
      <button class="primary">LOG IN</button>
    </form>

    <form id="signupForm" class="hidden">
      <input id="signupUsername" class="field" placeholder="Username" autocomplete="username" required>

  <script>
const state={
  me:null,
  page:'home',
  profile:null,
  chat:null,
  messages:[],
  poll:null,
  searchTimer:null,
  theme:'system'
};

const ICONS={
  home:'/icons/IMG_1881.png',
  search:'/Icon2/IMG_1946.png',
  create:'/icons/IMG_1899.png',
  reels:'/icons/IMG_1893.png',
  messages:'/icons/IMG_1883.png',
  profile:'/icons/IMG_1885.png',
  notification:'/icons/IMG_1895.png',
  settings:'/icons/IMG_1891.png',
  more:'/Icon2/IMG_1957.png',
  heart:'/icons/IMG_1886.png',
  comment:'/icons/IMG_1897.png',
  share1:'/icons/IMG_1884.png',
  share2:'/icons/IMG_1887.png',
  save:'/Icon2/IMG_1948.png',
  send:'/icons/IMG_1898.png',
  back:'/icons/IMG_1890.png',
  close:'/icons/IMG_1889.png',
  edit:'/icons/IMG_1879.png',
  camera:'/icons/IMG_1880.png'
};

const $=id=>document.getElementById(id);

function esc(value){
  return String(value??'').replace(/[&<>"']/g,c=>({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#039;'
  }[c]));
}

function toast(message){
  const el=$('toast');
  el.textContent=message;
  el.classList.add('show');
  clearTimeout(toast.timer);
  toast.timer=setTimeout(()=>el.classList.remove('show'),2400);
}

function initials(user){
  const text=user?.display_name||user?.username||'Z';
  return text.slice(0,2).toUpperCase();
}

function avatarHTML(user,className='avatar'){
  const fallback=`<div class="${className}">${esc(initials(user))}</div>`;

  if(!user?.avatar_url) return fallback;

  return `
    <div class="${className}">
      <img src="${esc(user.avatar_url)}" alt="">
    </div>
  `;
}

function icon(name){
  return `<img class="icon" src="${ICONS[name]}" alt="">`;
}

function normalizeApiBody(options={}){
  const out={...options};

  if(out.body && typeof out.body==='object' &&
     !(out.body instanceof FormData) &&
     !(out.body instanceof Blob)){
    out.headers={
      'Content-Type':'application/json',
      ...(out.headers||{})
    };
    out.body=JSON.stringify(out.body);
  }

  return out;
}

async function api(path,options={}){
  const opts=normalizeApiBody(options);

  const response=await fetch('/api'+path,{
    credentials:'include',
    ...opts
  });

  let data={};

  try{
    data=await response.json();
  }catch{}

  if(!response.ok){
    throw new Error(data?.error||data?.message||`Request failed (${response.status})`);
  }

  return data;
}

function authMode(mode){
  $('loginTab').classList.toggle('active',mode==='login');
  $('signupTab').classList.toggle('active',mode==='signup');

  $('loginForm').classList.toggle('hidden',mode!=='login');
  $('signupForm').classList.toggle('hidden',mode!=='signup');

  $('loginError').textContent='';
  $('signupError').textContent='';
}

$('loginForm').addEventListener('submit',async e=>{
  e.preventDefault();

  $('loginError').textContent='';

  try{
    const data=await api('/login',{
      method:'POST',
      body:{
        username:$('loginIdentity').value.trim(),
        password:$('loginPassword').value
      }
    });

    state.me=data.user;
    await bootApp();
  }catch(error){
    $('loginError').textContent=error.message;
  }
});

$('signupForm').addEventListener('submit',async e=>{
  e.preventDefault();

  $('signupError').textContent='';

  try{
    const data=await api('/signup',{
      method:'POST',
      body:{
        username:$('signupUsername').value.trim(),
        email:$('signupEmail').value.trim(),
        password:$('signupPassword').value
      }
    });

    state.me=data.user;
    await bootApp();
  }catch(error){
    $('signupError').textContent=error.message;
  }
});

async function boot(){
  try{
    const data=await api('/me');
    state.me=data.user;
    await bootApp();
  }catch{
    showAuth();
  }
}

async function bootApp(){
  $('auth').classList.add('hidden');
  $('app').classList.remove('hidden');

  await loadTheme();
  go('home');
}

function showAuth(){
  $('auth').classList.remove('hidden');
  $('app').classList.add('hidden');
}

async function logout(){
  try{
    await api('/logout',{method:'POST'});
  }catch{}

  clearInterval(state.poll);
  state.me=null;
  state.chat=null;
  showAuth();
  authMode('login');
}

function applyTheme(theme){
  state.theme=theme;

  let dark=false;

  if(theme==='dark'){
    dark=true;
  }else if(theme==='light'){
    dark=false;
  }else{
    dark=window.matchMedia &&
      window.matchMedia('(prefers-color-scheme: dark)').matches;
  }

  document.body.classList.toggle('dark',dark);
  document.querySelector('meta[name="theme-color"]')
    ?.setAttribute('content',dark?'#050505':'#ffffff');
}

async function loadTheme(){
  let theme='system';

  try{
    const data=await api('/settings');
    theme=data?.settings?.theme||'system';
  }catch{}

  applyTheme(theme);
}

async function saveTheme(theme){
  try{
    await api('/settings',{
      method:'POST',
      body:{theme}
    });

    applyTheme(theme);
    toast('Theme updated');
  }catch(error){
    toast(error.message);
  }
}

function hidePages(){
  [
    'homePage',
    'discoverPage',
    'chatPage',
    'profilePage',
    'reelsPage'
  ].forEach(id=>$(id).classList.add('hidden'));

  ['navHome','navDiscover','navReels','navProfile']
    .forEach(id=>$(id)?.classList.remove('active'));
}

function go(page){
  state.page=page;
  hidePages();

  if(page==='home'){
    $('homePage').classList.remove('hidden');
    $('navHome').classList.add('active');
    loadHome();
  }

  if(page==='discover'){
    $('discoverPage').classList.remove('hidden');
    $('navDiscover').classList.add('active');
  }

  if(page==='chat'){
    $('chatPage').classList.remove('hidden');
    loadChats();
  }

  if(page==='profile'){
    $('profilePage').classList.remove('hidden');
    $('navProfile').classList.add('active');
    openOwnProfile();
  }

  if(page==='reels'){
    $('reelsPage').classList.remove('hidden');
    $('navReels').classList.add('active');
    loadReels();
  }
}

async function loadHome(){
  $('stories').innerHTML=`
    <button class="story-item add-story" onclick="openStoryCreator()">
      <div class="story-avatar">
        <div class="story-avatar-inner">
          <div class="story-avatar">
            <div class="add-story-plus">+</div>
          </div>
        </div>
      </div>
      <div class="story-name">Add story</div>
    </button>
  `;

  $('feed').innerHTML='<div class="loading">Loading your feed…</div>';

  try{
    const data=await api('/feed');

    renderStories(data.stories||[]);
    renderFeed(data.posts||[]);
  }catch(error){
    $('feed').innerHTML=`
      <div class="empty">
        <strong>Couldn’t load your feed</strong>
        ${esc(error.message)}
      </div>
    `;
  }
}

function renderStories(stories){
  const own={
    username:state.me.username,
    display_name:state.me.display_name,
    avatar_url:state.me.avatar_url
  };

  const html=[];

  html.push(`
    <button class="story-item add-story" onclick="openStoryCreator()">
      <div class="story-avatar">
        <div class="story-avatar-inner">
          ${avatarHTML(own,'avatar')}
        </div>
      </div>
      <div class="story-name">Add story</div>
    </button>
  `);

  const grouped={};

  stories.forEach(story=>{
    const key=story.username||story.user_id;
    if(!grouped[key]) grouped[key]=[];
    grouped[key].push(story);
  });

  Object.values(grouped).forEach(userStories=>{
    const story=userStories[0];

    html.push(`
      <button class="story-item" onclick="viewStorySet(${JSON.stringify(userStories.map(x=>x.id))})">
        <div class="story-avatar">
          <div class="story-avatar-inner">
            ${avatarHTML(story,'avatar')}
          </div>
        </div>
        <div class="story-name">${esc(story.username||story.display_name||'User')}</div>
      </button>
    `);
  });

  $('stories').innerHTML=html.join('');
}

function textPostBackground(id){
  const palettes=[
    'linear-gradient(135deg,#111,#555)',
    'linear-gradient(135deg,#151515,#777)',
    'linear-gradient(135deg,#000,#777)',
    'linear-gradient(135deg,#292929,#111)',
    'linear-gradient(135deg,#444,#111)',
    'linear-gradient(135deg,#222,#888)'
  ];

  return palettes[Math.abs(Number(id)||0)%palettes.length];
}

function mediaHTML(post){
  const media=post.media_url;

  if(!media) return '';

  const type=(post.media_type||'').toLowerCase();
  const isVideo=
    type.startsWith('video') ||
    /\.(mp4|webm|mov|m4v)(\?|$)/i.test(media);

  if(isVideo){
    return `
      <div class="media-wrap">
        <video
          class="post-media"
          src="${esc(media)}"
          controls
          playsinline
          preload="metadata"></video>
      </div>
    `;
  }

  return `
    <div class="media-wrap">
      <img
        class="post-media"
        src="${esc(media)}"
        loading="lazy"
        alt="">
    </div>
  `;
}

function postHTML(post){
  const author={
    id:post.user_id,
    username:post.username,
    display_name:post.display_name,
    avatar_url:post.avatar_url
  };

  const liked=!!post.liked;
  const saved=!!post.saved;

  const onlyText=!post.media_url && post.content;

  return `
    <article class="post" id="post-${post.id}">

      <div class="post-head">

        <button
          class="avatar"
          style="border:0;padding:0"
          onclick="openProfile('${encodeURIComponent(post.username||'')}')">
          ${
            author.avatar_url
            ? `<img src="${esc(author.avatar_url)}" alt="">`
            : esc(initials(author))
          }
        </button>

        <div class="post-author">
          <button onclick="openProfile('${encodeURIComponent(post.username||'')}')">
            ${esc(post.display_name||post.username||'User')}
          </button>
          <span>
            @${esc(post.username||'')}
            · ${timeAgo(post.created_at)}
          </span>
        </div>

        ${
          Number(post.user_id)===Number(state.me.id)
          ? `
            <button class="post-menu-btn" onclick="deletePost(${post.id})">
              ⋯
            </button>
          `
          : ''
        }

      </div>

      ${
        onlyText
        ? `
          <div
            class="text-post-card"
            style="background:${textPostBackground(post.id)}">
            ${esc(post.content)}
          </div>
        `
        : mediaHTML(post)
      }

      ${
        !onlyText && post.content
        ? `<div class="post-content">${esc(post.content)}</div>`
        : ''
      }

      <div class="post-actions">

        <button
          class="post-action ${liked?'liked':''}"
          onclick="likePost(${post.id},this)">
          ${icon('heart')}
          <span data-like-count="${post.id}">
            ${Number(post.likes_count||0)}
          </span>
        </button>

        <button
          class="post-action"
          onclick="openComments(${post.id})">
          ${icon('comment')}
          <span>${Number(post.comments_count||0)}</span>
        </button>

        <button
          class="post-action"
          onclick="sharePost(${post.id})">
          ${icon('share1')}
        </button>

        <button
          class="post-action save"
          onclick="savePost(${post.id},this)">
          ${icon('save')}
        </button>

      </div>

    </article>
  `;
}

function renderFeed(posts){
  if(!posts.length){
    $('feed').innerHTML=`
      <div class="empty">
        <strong>Your feed is quiet</strong>
        Follow people or create the first post.
      </div>
    `;
    return;
  }

  $('feed').innerHTML=posts.map(postHTML).join('');
}

function timeAgo(value){
  if(!value) return '';

  const date=new Date(value);

  if(Number.isNaN(date.getTime())) return value;

  const seconds=Math.max(1,(Date.now()-date.getTime())/1000);

  if(seconds<60) return `${Math.floor(seconds)}s`;
  if(seconds<3600) return `${Math.floor(seconds/60)}m`;
  if(seconds<86400) return `${Math.floor(seconds/3600)}h`;
  if(seconds<604800) return `${Math.floor(seconds/86400)}d`;

  return date.toLocaleDateString();
}

async function likePost(id,button){
  try{
    const data=await api(`/posts/${id}/like`,{
      method:'POST'
    });

    button.classList.toggle('liked',!!data.liked);

    const count=button.querySelector(`[data-like-count="${id}"]`);
    if(count) count.textContent=Number(data.likes_count??data.count??0);
  }catch(error){
    toast(error.message);
  }
}

async function savePost(id,button){
  try{
    const data=await api(`/posts/${id}/save`,{
      method:'POST'
    });

    button.classList.toggle('liked',!!data.saved);
    toast(data.saved?'Saved':'Removed from saved');
  }catch(error){
    toast(error.message);
  }
}

async function deletePost(id){
  if(!confirm('Delete this post?')) return;

  try{
    await api(`/posts/${id}`,{method:'DELETE'});
    document.getElementById(`post-${id}`)?.remove();
    toast('Post deleted');
  }catch(error){
    toast(error.message);
  }
}

async function openComments(postId){
  openSheet('Comments',`
    <div id="commentsBody" class="loading">Loading…</div>

    <form
      id="commentForm"
      style="display:flex;gap:8px;margin-top:15px"
      onsubmit="submitComment(event,${postId})">

      <input
        id="commentInput"
        class="field"
        style="margin:0"
        placeholder="Write a comment..."
        maxlength="3000"
        required>

      <button
        class="icon-btn"
        style="background:var(--text);color:var(--bg);border-radius:13px"
        type="submit">
        ${icon('send')}
      </button>

    </form>
  `);

  try{
    const data=await api(`/posts/${postId}/comments`);
    const comments=data.comments||[];

    $('commentsBody').innerHTML=comments.length
      ? comments.map(commentHTML).join('')
      : '<div class="empty" style="padding:30px">No comments yet.</div>';
  }catch(error){
    $('commentsBody').innerHTML=`<div class="empty">${esc(error.message)}</div>`;
  }
}

function commentHTML(comment){
  const user={
    id:comment.user_id,
    username:comment.username,
    display_name:comment.display_name,
    avatar_url:comment.avatar_url
  };

  return `
    <div class="user-row" onclick="openProfile('${encodeURIComponent(user.username||'')}')">
      ${avatarHTML(user)}

      <div class="user-info">
        <strong>${esc(user.display_name||user.username)}</strong>
        <span>${esc(comment.content)}</span>
      </div>
    </div>
  `;
}

async function submitComment(event,postId){
  event.preventDefault();

  const input=$('commentInput');
  const content=input.value.trim();

  if(!content) return;

  try{
    const data=await api(`/posts/${postId}/comments`,{
      method:'POST',
      body:{content}
    });

    input.value='';

    const body=$('commentsBody');

    if(body.querySelector('.empty')){
      body.innerHTML='';
    }

    body.insertAdjacentHTML(
      'beforeend',
      commentHTML(data.comment)
    );
  }catch(error){
    toast(error.message);
  }
}

async function sharePost(id){
  const url=new URL(location.href);
  url.hash=`post-${id}`;

  try{
    if(navigator.share){
      await navigator.share({
        title:'ZILNET',
        text:'Check out this post on ZILNET',
        url:url.href
      });
    }else{
      await navigator.clipboard.writeText(url.href);
      toast('Link copied');
    }
  }catch{}
}

      class="secondary"

async function publishPost(){
  const text=$('newPostText').value.trim();
  const file=$('postPicker').files[0];

  if(!text&&!file){
    toast('Write something or choose media');
    return;
  }

  try{
    let mediaUrl='';
    let mediaType='';

    if(file){
      const form=new FormData();
      form.append('file',file);

      const upload=await api('/upload',{
        method:'POST',
        body:form
      });

async function publishStory(){
  const content=$('storyText').value.trim();
  const file=$('storyPicker').files[0];

  if(!content&&!file){
    toast('Add text or media');
    return;
  }

  try{
    let mediaUrl='';
    let mediaType='';

    if(file){
      const form=new FormData();
      form.append('file',file);

      const upload=await api('/upload',{
        method:'POST',
        body:form
      });

      mediaUrl=upload.url||upload.media_url||'';
      mediaType=upload.media_type||file.type||'';
    }

    await api('/stories',{
      method:'POST',
      body:{
        content,
        media_url:mediaUrl,
        media_type:mediaType
      }
    });

    closeOverlay();
    go('home');
    toast('Story shared');
  }catch(error){
    toast(error.message);
  }
}

function viewStorySet(ids){
  const stories=window.__stories||[];
  const list=ids.map(id=>stories.find(x=>Number(x.id)===Number(id))).filter(Boolean);

  if(!list.length) return;

  let index=0;

  const render=()=>{
    const story=list[index];

    const media=story.media_url
      ? (
        (story.media_type||'').startsWith('video')
        ? `<video src="${esc(story.media_url)}" autoplay controls playsinline></video>`
        : `<img src="${esc(story.media_url)}" alt="">`
      )
      : `<div class="story-text" style="background:${textPostBackground(story.id)}">${esc(story.content||'')}</div>`;

    openStoryViewer(story,media,()=>{
      index++;

      if(index>=list.length){
        closeOverlay();
      }else{
        render();
      }
    });
  };

  render();
}

async function openChat(chatId){
  clearInterval(state.poll);

  try{
    const summaryData=await api(`/chats/${chatId}`);
    const chat=summaryData.chat||summaryData;

    state.chat=chat;

    const messageData=await api(`/chats/${chatId}/messages`);
    state.messages=messageData.messages||[];

    renderChat();

    state.poll=setInterval(refreshMessages,3000);
  }catch(error){
    toast(error.message);
  }
}

function renderChat(){
  const chat=state.chat;
  const messages=state.messages;

  const title=chat.is_group
    ? chat.name||'Group'
    : chat.name||chat.username||'Chat';

  const otherUser=chat.user||{
    username:chat.username,
    display_name:chat.name,
    avatar_url:chat.avatar_url
  };

  openOverlay(`
    <div class="chat-view">

      <div class="chat-header">

        <button class="icon-btn" onclick="closeOverlay();loadChats()">
          ${icon('back')}
        </button>

        ${
          chat.is_group
          ? `
            <div class="avatar">${icon('messages')}</div>
          `
          : `
            <button
              class="avatar"
              style="border:0;padding:0"
              onclick="openProfile('${encodeURIComponent(otherUser.username||'')}')">
              ${
                otherUser.avatar_url
                ? `<img src="${esc(otherUser.avatar_url)}" alt="">`
                : esc(initials(otherUser))
              }
            </button>
          `
        }

        <div class="chat-title">
          ${
            chat.is_group
            ? `<strong>${esc(title)}</strong><span>Group conversation</span>`
            : `
              <strong>${esc(title)}</strong>
              <span>@${esc(chat.username||'')}</span>
            `
          }
        </div>

        ${
          !chat.is_group&&chat.username
          ? `
            <button
              class="icon-btn"
              onclick="openProfile('${encodeURIComponent(chat.username)}')">
              ${icon('profile')}
            </button>
          `
          : ''
        }

      </div>

      ${
        chat.is_group
        ? groupMemberBar()
        : ''
      }

      <div id="messageList" class="messages">
        ${messagesHTML()}
      </div>

      <form class="chat-input" onsubmit="sendMessage(event)">
        <input
          id="messageInput"
          maxlength="5000"
          placeholder="Message..."
          autocomplete="off">

        <button type="submit">
          ${icon('send')}
        </button>
      </form>

    </div>
  `);

  const list=$('messageList');
  if(list) list.scrollTop=list.scrollHeight;
}

function groupMemberBar(){
  const people=[];

  state.messages.forEach(message=>{
    const id=Number(message.user_id);

    if(!people.some(x=>Number(x.id)===id)){
      people.push({
        id,
        username:message.username,
        display_name:message.display_name,
        avatar_url:message.avatar_url
      });
    }
  });

  if(!people.length) return '';

  return `
    <div class="chat-members">
      ${people.map(person=>`
        <button
          class="member-chip"
          onclick="openProfile('${encodeURIComponent(person.username||'')}')">
          @${esc(person.username||person.display_name||'user')}
        </button>
      `).join('')}
    </div>
  `;
}

function messagesHTML(){
  if(!state.messages.length){
    return `
      <div class="empty" style="margin:auto;padding:30px">
        <strong>Start the conversation</strong>
        Send the first message.
      </div>
    `;
  }

  return state.messages.map(message=>{
    const mine=Number(message.user_id)===Number(state.me.id);

    return `
      <div class="message ${mine?'mine':''}">

        ${
          !mine&&message.username
          ? `
            <span
              class="message-name"
              onclick="openProfile('${encodeURIComponent(message.username)}')">
              @${esc(message.username)}
            </span>
          `
          : ''
        }

        ${esc(message.content||'')}

      </div>
    `;
  }).join('');
}

async function refreshMessages(){
  if(!state.chat) return;

  try{
    const data=await api(`/chats/${state.chat.id}/messages`);
    state.messages=data.messages||[];

    const list=$('messageList');

    if(list){
      list.innerHTML=messagesHTML();
      list.scrollTop=list.scrollHeight;
    }
  }catch{}
}

async function sendMessage(event){
  event.preventDefault();

  const input=$('messageInput');
  const content=input.value.trim();

  if(!content||!state.chat)return;

  try{
    await api(`/chats/${state.chat.id}/messages`,{
      method:'POST',
      body:{content}
    });

    input.value='';
    await refreshMessages();
  }catch(error){
    toast(error.message);
  }
}

function openGroupCreator(){
  openSheet('Create group',`
    <input
      id="groupName"
      class="field"
      placeholder="Group name"
      maxlength="60">

    <div class="search-box">
      <img class="icon" src="/Icon2/IMG_1946.png">
      <input
        id="groupSearch"
        class="field"
        placeholder="Search people to add..."
        oninput="searchGroupPeople(this.value)">
    </div>

    <div id="groupSelected" style="margin-bottom:10px"></div>
    <div id="groupResults"></div>

    <button
      class="primary"
      style="margin-top:15px"
      onclick="createGroup()">
      CREATE GROUP
    </button>
  `);

  window.__groupUsers=[];
}

async function searchGroupPeople(query){
  const q=query.trim();

  if(!q){
    $('groupResults').innerHTML='';
    return;
  }

  try{
    const data=await api(`/search?q=${encodeURIComponent(q)}`);
    const users=(data.users||[])
      .filter(u=>Number(u.id)!==Number(state.me.id));

    $('groupResults').innerHTML=users.map(u=>`
      <div
        class="user-row"
        onclick="selectGroupUser(${u.id},${JSON.stringify(u)})">

        ${avatarHTML(u)}

        <div class="user-info">
          <strong>${esc(u.display_name||u.username)}</strong>
          <span>@${esc(u.username)}</span>
        </div>

      </div>
    `).join('');
  }catch(error){
    $('groupResults').innerHTML='';
  }
}

function selectGroupUser(id,user){
  window.__groupUsers=window.__groupUsers||[];

  if(window.__groupUsers.some(x=>Number(x.id)===Number(id))){
    window.__groupUsers=
      window.__groupUsers.filter(x=>Number(x.id)!==Number(id));
  }else{
    window.__groupUsers.push(user);
  }

  $('groupSelected').innerHTML=window.__groupUsers.length
    ? window.__groupUsers.map(u=>`
      <button
        class="member-chip"
        onclick="selectGroupUser(${u.id},${JSON.stringify(u)})">
        @${esc(u.username)} ×
      </button>
    `).join(' ')
    : '<span style="font-size:12px;color:var(--muted)">No members selected</span>';
}

async function createGroup(){
  const users=window.__groupUsers||[];
  const name=$('groupName').value.trim()||'New group';

  if(!users.length){
    toast('Select at least one person');
    return;
  }

  try{
    const data=await api('/groups',{
      method:'POST',
      body:{
        name,
        user_ids:users.map(u=>Number(u.id))
      }
    });

    closeOverlay();
    await openChat(data.chat?.id||data.id);
    toast('Group created');
  }catch(error){
    toast(error.message);
  }
}

async function loadReels(){
  $('reelsList').innerHTML='<div class="loading">Loading reels…</div>';

  try{
    const data=await api('/reels/feed');
    const reels=data.reels||[];

    $('reelsList').innerHTML=reels.length
      ? reels.map(reelHTML).join('')
      : '<div class="empty">No reels yet.</div>';
  }catch(error){
    $('reelsList').innerHTML=`<div class="empty">${esc(error.message)}</div>`;
  }
}

function reelHTML(reel){
  const user={
    username:reel.username,
    display_name:reel.display_name,
    avatar_url:reel.avatar_url
  };

  return `
    <article class="reel">

      <video
        src="${esc(reel.media_url)}"
        controls
        loop
        muted
        playsinline
        preload="metadata"></video>

      <div class="reel-caption">
        <button
          style="border:0;background:none;color:#fff;font-weight:850;padding:0"
          onclick="openProfile('${encodeURIComponent(user.username||'')}')">
          @${esc(user.username||'')}
        </button>

        ${
          reel.caption
          ? `<div style="margin-top:6px">${esc(reel.caption)}</div>`
          : ''
        }
      </div>

    </article>
  `;
}

function openReelCreator(){
  closeOverlay();

  openSheet('New reel',`
    <button
      class="secondary"
      style="width:100%;margin-bottom:10px"
      onclick="$('reelPicker').click()">
      ${icon('camera')}
      Choose video
    </button>

    <div id="reelFileName" style="font-size:12px;color:var(--muted);margin-bottom:12px"></div>

    <textarea
      id="reelCaption"
      class="field"
      placeholder="Caption..."
      maxlength="5000"></textarea>

    <button class="primary" onclick="publishReel()">
      PUBLISH REEL
    </button>
  `);

  $('reelPicker').value='';

  $('reelPicker').onchange=()=>{
    const file=$('reelPicker').files[0];
    $('reelFileName').textContent=file?file.name:'';
  };
}

async function publishReel(){
  const file=$('reelPicker').files[0];

  if(!file){
    toast('Choose a video');
    return;
  }

  try{
    const form=new FormData();
    form.append('file',file);

    const upload=await api('/upload',{
      method:'POST',
      body:form
    });

    await api('/reels',{
      method:'POST',
      body:{
        caption:$('reelCaption').value.trim(),
        media_url:upload.url||upload.media_url
      }
    });

    closeOverlay();
    go('reels');
    toast('Reel published');
  }catch(error){
    toast(error.message);
  }
}

/* Create menu shortcut */
window.openReelCreator=openReelCreator;

/* Story data is loaded before opening a viewer */
const originalLoadHome=loadHome;

loadHome=async function(){
  try{
    const storyData=await api('/stories/feed');
    window.__stories=storyData.stories||[];
  }catch{
    window.__stories=[];
  }

  await originalLoadHome();
};

/* Handle profile links in URL */
async function handleInitialRoute(){
  const params=new URLSearchParams(location.search);
  const profile=params.get('profile');

  if(profile){
    await openProfile(encodeURIComponent(profile));
  }
}

if(window.matchMedia){
  const media=window.matchMedia('(prefers-color-scheme: dark)');
  media.addEventListener?.('change',()=>{
    if(state.theme==='system') applyTheme('system');
  });
}
