<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090a0f">
<title>ZILNET</title>

<style>
:root{
  --bg:#090a0f;
  --bg2:#0d0f15;
  --card:#12151d;
  --card2:#1b1f29;
  --text:#f7f7fb;
  --muted:#8d919d;
  --line:#242833;
  --accent:#7757ff;
  --blue:#258cff;
  --purple:#873cff;
  --bottom:rgba(9,10,15,.94);
  --chat-a:#10131a;
  --chat-b:#171b28;
  --chat-c:#242039;
  --max:760px;
}

body.light{
  --bg:#f4f5f8;
  --bg2:#fff;
  --card:#fff;
  --card2:#e9ebf1;
  --text:#111217;
  --muted:#686d79;
  --line:#d8dbe3;
  --bottom:rgba(244,245,248,.94);
  --chat-a:#e7eaf2;
  --chat-b:#f2f3f8;
  --chat-c:#dfe4ff;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,
body{
  background:var(--bg);
  color:var(--text);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
  min-height:100%;
}

body{
  overflow-x:hidden;
}

button,
input,
textarea,
select{
  font:inherit;
  color:inherit;
}

button{
  cursor:pointer;
}

img,
video{
  max-width:100%;
}

.hidden{
  display:none!important;
}

/* -------------------- ANIMATIONS -------------------- */

@keyframes tap{
  0%{transform:scale(1)}
  35%{transform:scale(.78)}
  70%{transform:scale(1.12)}
  100%{transform:scale(1)}
}

@keyframes pop{
  0%{transform:scale(.7);opacity:.2}
  60%{transform:scale(1.12);opacity:1}
  100%{transform:scale(1);opacity:1}
}

@keyframes gradientMove{
  0%{background-position:0% 50%}
  50%{background-position:100% 50%}
  100%{background-position:0% 50%}
}

@keyframes storyPulse{
  0%,100%{
    box-shadow:
      0 0 0 0 rgba(124,67,255,.15),
      0 0 18px rgba(124,67,255,.12);
  }
  50%{
    box-shadow:
      0 0 0 7px rgba(124,67,255,.08),
      0 0 30px rgba(124,67,255,.28);
  }
}

@keyframes likeBurst{
  0%{transform:scale(.5);opacity:0}
  40%{transform:scale(1.35);opacity:1}
  100%{transform:scale(1);opacity:1}
}

.tap{
  animation:tap .28s ease;
}

.performance *{
  animation:none!important;
  transition:none!important;
}

/* -------------------- TOAST -------------------- */

#toast{
  position:fixed;
  z-index:1000;
  left:50%;
  bottom:88px;
  transform:translate(-50%,20px);
  opacity:0;
  pointer-events:none;
  background:#fff;
  color:#000;
  padding:11px 17px;
  border-radius:999px;
  font-size:13px;
  font-weight:800;
  transition:.22s ease;
  max-width:90vw;
  text-align:center;
}

#toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

/* -------------------- AUTH -------------------- */

.auth{
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:24px;
}

.authbox{
  width:min(420px,100%);
  text-align:center;
}

.brand{
  font-size:42px;
  font-weight:950;
  letter-spacing:-3px;
}

.tag{
  color:var(--muted);
  margin:8px 0 28px;
}

.tabs{
  display:flex;
  border-bottom:1px solid var(--line);
  margin-bottom:18px;
}

.tabs button{
  flex:1;
  border:0;
  background:none;
  color:var(--muted);
  padding:13px;
}

.tabs .on{
  color:var(--text);
  font-weight:850;
  border-bottom:2px solid var(--text);
}

.field{
  width:100%;
  padding:14px;
  margin-bottom:10px;
  border:1px solid var(--line);
  background:var(--card);
  border-radius:13px;
  outline:0;
}

.field:focus,
.search:focus,
.chatinput input:focus{
  border-color:#7078ff;
}

.primary{
  width:100%;
  padding:14px;
  border:0;
  border-radius:13px;
  background:#fff;
  color:#000;
  font-weight:900;
}

.secondary{
  padding:11px 14px;
  border:1px solid var(--line);
  background:var(--card);
  border-radius:11px;
  font-weight:800;
}

.linkbtn{
  border:0;
  background:none;
  color:var(--text);
  font-weight:700;
  padding:12px 4px;
}

.authnote{
  font-size:12px;
  color:var(--muted);
  margin-top:18px;
  line-height:1.5;
}

/* -------------------- APP -------------------- */

.app{
  min-height:100vh;
  padding-bottom:82px;
}

.top{
  height:72px;
  position:sticky;
  top:0;
  z-index:30;
  background:rgba(9,10,15,.88);
  backdrop-filter:blur(20px);
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
}

body.light .top{
  background:rgba(244,245,248,.9);
}

.logo{
  font-size:27px;
  font-weight:950;
  letter-spacing:-2px;
}

.topbuttons{
  display:flex;
  align-items:center;
  gap:5px;
}

.ib{
  width:48px;
  height:48px;
  border:0;
  background:none;
  display:grid;
  place-items:center;
  position:relative;
  border-radius:50%;
}

.ib:active{
  background:rgba(255,255,255,.06);
}

.ib img{
  width:25px;
  height:25px;
  object-fit:contain;
  transition:
    transform .22s cubic-bezier(.2,.8,.2,1),
    filter .22s;
}

.ib:active img{
  transform:scale(.76);
}

.topIcon{
  width:25px!important;
  height:25px!important;
}

/* -------------------- CONTENT -------------------- */

.content{
  max-width:var(--max);
  margin:auto;
}

/* -------------------- STORIES -------------------- */

.stories{
  padding:17px 15px 18px;
  border-bottom:1px solid var(--line);
}

.storyrow{
  display:flex;
  gap:18px;
  overflow:auto;
  scrollbar-width:none;
}

.storyrow::-webkit-scrollbar{
  display:none;
}

.story{
  min-width:72px;
  text-align:center;
  cursor:pointer;
}

.ring{
  width:68px;
  height:68px;
  padding:3px;
  border-radius:50%;
  margin:auto;
  background:
    linear-gradient(
      135deg,
      #168dff,
      #653cff,
      #a92cff,
      #168dff
    );
  background-size:250% 250%;
  animation:
    gradientMove 5s ease infinite,
    storyPulse 2.5s ease-in-out infinite;
}

.ring.inactive{
  background:var(--card2);
  animation:none;
  box-shadow:none;
}

.ring .avatar{
  border:2px solid var(--bg);
}

.storyname{
  font-size:11px;
  margin-top:8px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  color:var(--muted);
}

/* -------------------- AVATARS -------------------- */

.avatar{
  width:100%;
  height:100%;
  border-radius:50%;
  background:var(--card2);
  display:grid;
  place-items:center;
  overflow:hidden;
  font-weight:850;
  flex:none;
}

.avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.postavatar{
  width:46px;
  height:46px;
  border-radius:50%;
  background:var(--card2);
  display:grid;
  place-items:center;
  overflow:hidden;
  flex:none;
  font-weight:850;
}

.postavatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.chatavatar{
  width:50px;
  height:50px;
  border-radius:50%;
  background:var(--card2);
  display:grid;
  place-items:center;
  overflow:hidden;
  flex:none;
}

.chatavatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.miniAvatar{
  width:29px;
  height:29px;
  border-radius:50%;
  background:var(--card2);
  overflow:hidden;
  display:grid;
  place-items:center;
  flex:none;
}

.miniAvatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

/* -------------------- POSTS -------------------- */

.post{
  border-bottom:1px solid var(--line);
}

.posthead{
  display:flex;
  align-items:center;
  gap:11px;
  padding:15px 15px;
}

.author{
  flex:1;
  min-width:0;
}

.author strong{
  display:block;
  font-size:15px;
}

.author span{
  display:block;
  color:var(--muted);
  font-size:12px;
  margin-top:2px;
}

.postmedia{
  display:block;
  width:100%;
  max-height:780px;
  background:#000;
  object-fit:contain;
}

.postimage{
  aspect-ratio:1/1;
  object-fit:cover;
}

.posttext{
  padding:18px 17px;
  font-size:16px;
  line-height:1.55;
  white-space:pre-wrap;
  min-height:180px;
  display:grid;
  place-items:center;
  text-align:center;
  font-weight:800;
  background:
    linear-gradient(
      135deg,
      #147dff,
      #563cff,
      #913cff
    );
  background-size:200% 200%;
  animation:gradientMove 8s ease infinite;
}

.posttext.onlyText{
  margin:0 15px 10px;
  border-radius:22px;
}

.actions{
  display:flex;
  align-items:center;
  padding:8px 11px;
}

.action{
  width:52px;
  height:50px;
  border:0;
  background:none;
  display:grid;
  place-items:center;
  border-radius:50%;
}

.action img{
  width:29px;
  height:29px;
  object-fit:contain;
  transition:
    transform .22s cubic-bezier(.2,.8,.2,1),
    filter .22s;
}

.action:active img{
  animation:tap .28s ease;
}

.action.comment img{
  width:30px;
  height:30px;
}

.action.save{
  margin-left:auto;
}

.action.liked img,
.action.saved img{
  filter:
    drop-shadow(0 0 5px rgba(62,105,255,.55))
    drop-shadow(0 0 8px rgba(137,53,255,.45));
}

.gradientState img{
  filter:
    sepia(1)
    saturate(6)
    hue-rotate(180deg)
    drop-shadow(0 0 6px rgba(71,101,255,.8));
}

.postinfo{
  padding:0 16px 17px;
}

.likes{
  font-size:14px;
  font-weight:900;
  margin-bottom:7px;
}

.caption{
  font-size:14px;
  line-height:1.5;
}

.caption b{
  margin-right:5px;
}

.meta{
  font-size:11px;
  color:var(--muted);
  margin-top:8px;
}

.empty{
  text-align:center;
  color:var(--muted);
  padding:70px 25px;
}

/* -------------------- BOTTOM NAV -------------------- */

.bottom{
  position:fixed;
  z-index:40;
  left:0;
  right:0;
  bottom:0;
  height:72px;
  padding-bottom:env(safe-area-inset-bottom);
  background:var(--bottom);
  backdrop-filter:blur(22px);
  border-top:1px solid var(--line);
  display:flex;
  justify-content:space-around;
  align-items:center;
}

.nav{
  width:64px;
  height:60px;
  border:0;
  background:none;
  display:grid;
  place-items:center;
  border-radius:18px;
}

.nav img{
  width:27px;
  height:27px;
  object-fit:contain;
  opacity:.72;
  transition:
    transform .2s,
    opacity .2s,
    filter .2s;
}

.nav.active img{
  opacity:1;
}

.nav:active img{
  transform:scale(.78);
}

.nav.searchActive img{
  transform:scale(1.04);
}

/* -------------------- PANELS -------------------- */

.panel{
  position:fixed;
  inset:0;
  z-index:70;
  background:var(--bg);
  overflow:auto;
}

.panelhead{
  height:70px;
  position:sticky;
  top:0;
  z-index:5;
  background:rgba(9,10,15,.94);
  backdrop-filter:blur(20px);
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  gap:8px;
  padding:0 12px;
}

body.light .panelhead{
  background:rgba(244,245,248,.94);
}

.panelhead h2{
  font-size:19px;
}

.panelbody{
  width:min(var(--max),100%);
  margin:auto;
  padding:18px 16px 45px;
}

.search{
  width:100%;
  padding:14px 16px;
  border:1px solid var(--line);
  background:var(--card);
  border-radius:14px;
  outline:0;
  margin-bottom:15px;
}

.userrow,
.chatrow{
  display:flex;
  align-items:center;
  gap:13px;
  padding:14px 3px;
  border-bottom:1px solid var(--line);
}

.userrow{
  cursor:pointer;
}

.userinfo,
.chatinfo{
  flex:1;
  min-width:0;
}

.userinfo span,
.chatinfo span{
  display:block;
  color:var(--muted);
  font-size:12px;
  margin-top:3px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.follow{
  border:1px solid var(--line);
  background:#fff;
  color:#000;
  border-radius:10px;
  padding:8px 12px;
  font-weight:850;
}

.following{
  background:var(--card);
  color:var(--text);
}

/* -------------------- PROFILE -------------------- */

.profiletop{
  padding:20px 0;
}

.profileline{
  display:flex;
  gap:18px;
  align-items:center;
}

.profileavatar{
  width:96px;
  height:96px;
  border-radius:50%;
  background:var(--card2);
  display:grid;
  place-items:center;
  overflow:hidden;
  font-size:28px;
  font-weight:900;
  flex:none;
}

.profileavatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.profilemain{
  flex:1;
  min-width:0;
}

.profilemain h2{
  font-size:21px;
}

.profilemain p{
  color:var(--muted);
  font-size:13px;
  margin-top:4px;
  white-space:pre-wrap;
}

.stats{
  display:flex;
  gap:19px;
  margin-top:13px;
  font-size:13px;
  flex-wrap:wrap;
}

.profilebuttons{
  display:flex;
  gap:8px;
  margin-top:18px;
}

.profilebuttons button{
  flex:1;
  padding:11px;
  border:1px solid var(--line);
  background:var(--card);
  border-radius:10px;
  font-weight:800;
}

.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:2px;
  margin:0 -16px;
}

.griditem{
  aspect-ratio:1;
  background:var(--card);
  overflow:hidden;
  cursor:pointer;
}

.griditem img,
.griditem video{
  width:100%;
  height:100%;
  object-fit:cover;
}

/* -------------------- SHEETS -------------------- */

.modal{
  position:fixed;
  inset:0;
  z-index:100;
  background:rgba(0,0,0,.72);
  display:grid;
  place-items:end;
}

.sheet{
  width:min(760px,100%);
  max-height:92vh;
  overflow:auto;
  background:var(--bg);
  border-radius:24px 24px 0 0;
  border:1px solid var(--line);
  padding:19px 17px 32px;
}

.sheet h3{
  margin-bottom:16px;
}

.option{
  width:100%;
  padding:18px;
  margin:6px 0;
  text-align:left;
  border:1px solid var(--line);
  background:var(--card);
  border-radius:14px;
}

.option b{
  display:block;
}

.option span{
  color:var(--muted);
  font-size:12px;
}

/* -------------------- COMMENTS -------------------- */

.comment{
  display:flex;
  gap:10px;
  margin:12px 0;
  font-size:13px;
  align-items:flex-start;
}

.comment .avatar{
  width:36px;
  height:36px;
  flex:none;
}

.commentform{
  display:flex;
  gap:8px;
  margin-top:14px;
}

.commentform input{
  flex:1;
  min-width:0;
  padding:11px 14px;
  border:1px solid var(--line);
  background:var(--card);
  border-radius:22px;
  outline:0;
}

.commentform button{
  border:0;
  background:#fff;
  color:#000;
  border-radius:22px;
  padding:0 16px;
  font-weight:850;
}

/* -------------------- CHAT -------------------- */

.chatview{
  position:fixed;
  inset:0;
  z-index:90;
  background:
    linear-gradient(
      135deg,
      var(--chat-a),
      var(--chat-b),
      var(--chat-c)
    );
  background-size:250% 250%;
  animation:gradientMove 16s ease infinite;
  display:flex;
  flex-direction:column;
}

.chatview.customBackground{
  background-size:cover;
  background-position:center;
  animation:none;
}

.chatview.customBackground::before{
  content:"";
  position:absolute;
  inset:0;
  background:rgba(5,6,10,.67);
  pointer-events:none;
}

.chatview > *{
  position:relative;
  z-index:1;
}

.chathead{
  min-height:70px;
  display:flex;
  align-items:center;
  gap:10px;
  padding:0 11px;
  border-bottom:1px solid rgba(255,255,255,.08);
  background:rgba(5,6,10,.35);
  backdrop-filter:blur(18px);
  flex:none;
}

.chathead .chatavatar{
  width:44px;
  height:44px;
}

.chathead .who{
  flex:1;
  min-width:0;
}

.chathead .who strong{
  display:block;
  font-size:15px;
}

.chathead .who span{
  font-size:12px;
  color:var(--muted);
}

.messages{
  flex:1;
  overflow:auto;
  padding:15px 13px 20px;
}

.messageRow{
  display:flex;
  gap:7px;
  margin:9px 0;
  align-items:flex-end;
}

.messageRow.mine{
  justify-content:flex-end;
}

.messageBlock{
  max-width:min(72%,430px);
}

.messageUser{
  font-size:11px;
  color:var(--muted);
  margin:0 8px 4px;
  font-weight:800;
}

.messageRow.mine .messageUser{
  text-align:right;
}

.bubble{
  width:max-content;
  max-width:100%;
  padding:9px 12px;
  border-radius:17px;
  font-size:14px;
  line-height:1.4;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}

.mineBubble{
  margin-left:auto;
  background:
    linear-gradient(
      135deg,
      #446cff,
      #7447ff
    );
  color:#fff;
  border-bottom-right-radius:5px;
}

.theirsBubble{
  background:rgba(35,39,49,.94);
  border-bottom-left-radius:5px;
}

.messageImage{
  display:block;
  width:min(240px,100%);
  max-height:300px;
  object-fit:cover;
  border-radius:16px;
  margin-top:3px;
}

.sharedPost{
  width:min(270px,100%);
  background:rgba(18,20,28,.94);
  border:1px solid rgba(255,255,255,.1);
  border-radius:17px;
  overflow:hidden;
}

.sharedPost img,
.sharedPost video{
  display:block;
  width:100%;
  max-height:260px;
  object-fit:cover;
}

.sharedPostText{
  padding:12px;
  font-size:13px;
}

.chatinput{
  display:flex;
  gap:8px;
  padding:10px;
  padding-bottom:max(10px,env(safe-area-inset-bottom));
  border-top:1px solid rgba(255,255,255,.08);
  background:rgba(5,6,10,.45);
  backdrop-filter:blur(18px);
}

.chatinput input{
  flex:1;
  min-width:0;
  padding:12px 15px;
  border:1px solid rgba(255,255,255,.25);
  background:rgba(20,22,30,.82);
  border-radius:23px;
  outline:0;
}

.chatSend{
  width:48px;
  height:48px;
  border:0;
  border-radius:50%;
  background:#fff;
  color:#000;
  display:grid;
  place-items:center;
}

.chatSend img{
  width:24px;
  height:24px;
}

.chatAttach{
  width:48px;
  height:48px;
  border:1px solid rgba(255,255,255,.2);
  border-radius:50%;
  background:rgba(20,22,30,.82);
  display:grid;
  place-items:center;
}

.chatAttach img{
  width:24px;
  height:24px;
}

/* -------------------- CHAT SETTINGS -------------------- */

.themeGrid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}

.themeCard{
  min-height:88px;
  border:1px solid var(--line);
  border-radius:16px;
  padding:13px;
  color:#fff;
  text-align:left;
  font-weight:850;
  background-size:200% 200%;
  animation:gradientMove 8s ease infinite;
}

.themeCard.active{
  outline:2px solid #fff;
  outline-offset:2px;
}

.themePreview{
  height:38px;
  border-radius:10px;
  margin-bottom:8px;
}

/* -------------------- STORY VIEWER -------------------- */

.storyviewer{
  position:fixed;
  inset:0;
  z-index:150;
  background:#000;
  display:flex;
  flex-direction:column;
}

.storytop{
  height:72px;
  display:flex;
  align-items:center;
  gap:10px;
  padding:0 12px;
  background:linear-gradient(
    rgba(0,0,0,.75),
    transparent
  );
  position:absolute;
  left:0;
  right:0;
  top:0;
  z-index:3;
}

.storytop .who{
  flex:1;
}

.storytop strong{
  display:block;
}

.storytop span{
  color:#aaa;
  font-size:12px;
}

.storymedia{
  flex:1;
  min-height:0;
  display:grid;
  place-items:center;
}

.storymedia img,
.storymedia video{
  max-width:100%;
  max-height:100%;
  width:auto;
  height:auto;
  object-fit:contain;
}

.storytext{
  max-width:90%;
  padding:35px;
  border-radius:25px;
  color:#fff;
  font-size:24px;
  font-weight:900;
  text-align:center;
}

.storybottom{
  position:absolute;
  bottom:0;
  left:0;
  right:0;
  padding:15px 12px max(15px,env(safe-area-inset-bottom));
  display:flex;
  align-items:center;
  gap:9px;
  background:linear-gradient(
    transparent,
    rgba(0,0,0,.85)
  );
  z-index:4;
}

.storyMessage{
  flex:1;
  min-width:0;
  padding:13px 16px;
  border:1px solid rgba(255,255,255,.35);
  background:rgba(20,20,25,.65);
  border-radius:25px;
  outline:0;
}

.storyLike{
  width:49px;
  height:49px;
  border:1px solid rgba(255,255,255,.35);
  background:rgba(20,20,25,.65);
  border-radius:50%;
  display:grid;
  place-items:center;
}

.storyLike img{
  width:27px;
  height:27px;
}

.storyLike.liked img{
  filter:
    drop-shadow(0 0 7px #357bff)
    drop-shadow(0 0 9px #8c39ff);
  animation:likeBurst .35s ease;
}

/* -------------------- SETTINGS -------------------- */

.setting{
  width:100%;
  padding:18px 3px;
  border:0;
  border-bottom:1px solid var(--line);
  background:none;
  text-align:left;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
}

.setting span{
  color:var(--muted);
}

.setting select{
  background:var(--card);
  border:1px solid var(--line);
  padding:7px 9px;
  border-radius:9px;
}

.sectionTitle{
  font-size:12px;
  color:var(--muted);
  font-weight:900;
  text-transform:uppercase;
  margin:23px 0 8px;
}

.switch{
  width:48px;
  height:28px;
  border-radius:99px;
  background:var(--card2);
  position:relative;
  border:1px solid var(--line);
}

.switch i{
  position:absolute;
  width:22px;
  height:22px;
  border-radius:50%;
  background:#fff;
  left:2px;
  top:2px;
  transition:.2s;
}

.switch.on{
  background:#111;
}

.switch.on i{
  left:22px;
}

/* -------------------- NOTIFICATIONS -------------------- */

.notif{
  display:flex;
  gap:12px;
  padding:14px 2px;
  border-bottom:1px solid var(--line);
  align-items:center;
}

.notif.unread{
  background:rgba(255,255,255,.035);
}

.notifDot{
  width:9px;
  height:9px;
  border-radius:50%;
  background:#fff;
  margin-left:auto;
  flex:none;
}

/* -------------------- SHARE -------------------- */

.shareUsers{
  max-height:330px;
  overflow:auto;
  border:1px solid var(--line);
  border-radius:15px;
  padding:0 12px;
  margin-top:10px;
}

.shareRow{
  display:flex;
  align-items:center;
  gap:10px;
  padding:11px 0;
  border-bottom:1px solid var(--line);
}

.shareRow:last-child{
  border-bottom:0;
}

.shareRow .userinfo{
  flex:1;
}

.shareBtn{
  border:0;
  background:#fff;
  color:#000;
  padding:8px 13px;
  border-radius:10px;
  font-weight:850;
}

/* -------------------- RESPONSIVE -------------------- */

@media(min-width:800px){
  .bottom{
    width:560px;
    left:50%;
    right:auto;
    transform:translateX(-50%);
    bottom:14px;
    border:1px solid var(--line);
    border-radius:22px;
  }

  .app{
    padding-bottom:105px;
  }
}
</style>
</head>

<body>

<div id="toast"></div>

<section id="auth" class="auth">
  <div class="authbox">
    <div class="brand">ZILNET</div>
    <div class="tag">Create. Connect. Discover.</div>

    <div class="tabs">
      <button id="loginTab" class="on" onclick="authMode('login')">
        Log in
      </button>
      <button id="signupTab" onclick="authMode('signup')">
        Create account
      </button>
    </div>

    <form id="loginForm">
      <input
        id="identity"
        class="field"
        placeholder="Username or email"
        required
      >

      <input
        id="password"
        class="field"
        type="password"
        placeholder="Password"
        required
      >

      <button class="primary">
        Log in
      </button>

      <button
        type="button"
        class="linkbtn"
        onclick="forgotPassword()"
      >
        Forgot password?
      </button>
    </form>

    <form id="signupForm" class="hidden">
      <input
        id="username"
        class="field"
        placeholder="Username"
        required
      >

      <input
        id="email"
        class="field"
        type="email"
        placeholder="Email"
        required
      >

      <input
        id="newPassword"
        class="field"
        type="password"
        placeholder="Password"
        minlength="8"
        required
      >

      <button class="primary">
        Create account
      </button>
    </form>

    <div class="authnote">
      ZILNET — a social network made for real people.
    </div>
  </div>
</section>

<div id="app" class="app hidden">

  <header class="top">

    <div class="logo">ZILNET</div>

    <div class="topbuttons">

      <button
        class="ib"
        onclick="notifications()"
        aria-label="Notifications"
      >
        <img
          class="topIcon"
          src="/icons/IMG_1895.png"
          alt=""
        >
        <i
          id="topDot"
          class="notifDot hidden"
          style="position:absolute;margin:0 0 27px 28px"
        ></i>
      </button>

      <button
        class="ib"
        onclick="chats()"
        aria-label="Messages"
      >
        <img
          class="topIcon"
          src="/icons/IMG_1883.png"
          alt=""
        >
      </button>

      <button
        class="ib"
        onclick="moreMenu()"
        aria-label="More"
      >
        <img
          class="topIcon"
          src="/Icon2/IMG_1957.png"
          alt=""
        >
      </button>

    </div>
  </header>

  <main id="home" class="content"></main>

  <nav class="bottom">

    <button
      id="homeNav"
      class="nav active"
      onclick="home()"
      aria-label="Home"
    >
      <img src="/icons/IMG_1881.png" alt="">
    </button>

    <button
      id="searchNav"
      class="nav"
      onclick="searchPanel()"
      aria-label="Search"
    >
      <img src="/Icon2/IMG_1946.png" alt="">
    </button>

    <button
      id="createNav"
      class="nav"
      onclick="createMenu()"
      aria-label="Create"
    >
      <img src="/icons/IMG_1899.png" alt="">
    </button>

    <button
      id="reelsNav"
      class="nav"
      onclick="reels()"
      aria-label="Reels"
    >
      <img src="/icons/IMG_1893.png" alt="">
    </button>

    <button
      id="profileNav"
      class="nav"
      onclick="myProfile()"
      aria-label="Profile"
    >
      <img src="/icons/IMG_1885.png" alt="">
    </button>

  </nav>

</div>

<div id="panel"></div>
<div id="modal"></div>

<div class="hidden">

  <input
    id="storyPicker"
    type="file"
    accept="image/*,video/*"
  >

  <input
    id="reelPicker"
    type="file"
    accept="video/*"
  >

  <input
    id="postPicker"
    type="file"
    accept="image/*,video/*"
  >

  <input
    id="chatImagePicker"
    type="file"
    accept="image/*,video/*"
  >

</div>
