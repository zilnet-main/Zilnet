<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>ZILNET</title>
<style>
  :root{
    --bg:#ffffff;
    --fg:#0a0a0a;
    --muted:#767676;
    --border:#e8e8e8;
    --card:#ffffff;
    --accent:#0a0a0a;
    --accent-fg:#ffffff;
    --danger:#e0245e;
    --input-bg:#f5f5f5;
    --hover:#f2f2f2;
    --safe-top:env(safe-area-inset-top,0px);
    --safe-bottom:env(safe-area-inset-bottom,0px);
  }
  html[data-theme="dark"]{
    --bg:#000000;
    --fg:#f5f5f5;
    --muted:#8a8a8a;
    --border:#242424;
    --card:#0b0b0b;
    --accent:#ffffff;
    --accent-fg:#000000;
    --input-bg:#141414;
    --hover:#151515;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    overscroll-behavior-y:none;
    transition:background .2s ease,color .2s ease;
  }
  img{-webkit-user-drag:none;user-select:none;}
  button{font-family:inherit;}
  a{color:inherit;text-decoration:none;}
  input,textarea,select{font-family:inherit;color:var(--fg);}
  ::-webkit-scrollbar{display:none;}
  * { scrollbar-width:none; }

  .hidden{display:none !important;}

  /* ---------- ICON SYSTEM ---------- */
  .icon-btn{
    width:44px;height:44px;
    min-width:44px;
    display:flex;align-items:center;justify-content:center;
    background:none;border:none;cursor:pointer;
    border-radius:50%;
    position:relative;
    transition:background .15s ease;
    padding:0;
  }
  .icon-btn:active{background:var(--hover);}
  .icon-btn img{
    width:23px;height:23px;
    object-fit:contain;
    object-position:center;
    display:block;
    transition:transform .12s ease;
    pointer-events:none;
  }
  html[data-theme="dark"] .icon-btn img{ filter:invert(1) brightness(1.05); }
  .icon-btn:active img{transform:scale(0.8);}
  .icon-btn.active-nav img{transform:scale(1.05);}
  .icon-btn.lg img{width:26px;height:26px;}
  .icon-btn.sm img{width:19px;height:19px;}
  .icon-badge{
    position:absolute;top:5px;right:6px;
    width:8px;height:8px;border-radius:50%;
    background:var(--danger);
    border:2px solid var(--bg);
  }

  /* ---------- LAYOUT ---------- */
  #app-shell{display:none;flex-direction:column;height:100%;}
  #app-shell.active{display:flex;}

  .topbar{
    position:sticky;top:0;z-index:20;
    display:flex;align-items:center;justify-content:space-between;
    padding:calc(10px + var(--safe-top)) 14px 10px;
    background:var(--bg);
    border-bottom:1px solid var(--border);
  }
  .logo{
    font-size:21px;font-weight:800;letter-spacing:1px;
  }
  .topbar-actions{display:flex;align-items:center;gap:2px;}

  #view-container{
    flex:1;overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    padding-bottom:90px;
  }

  .bottom-nav{
    position:fixed;left:0;right:0;bottom:0;z-index:30;
    display:flex;align-items:center;justify-content:space-around;
    background:var(--bg);
    border-top:1px solid var(--border);
    padding:6px 4px calc(6px + var(--safe-bottom));
  }

  /* ---------- AUTH SCREEN ---------- */
  #auth-screen{
    display:flex;flex-direction:column;
    min-height:100%;
    align-items:center;justify-content:center;
    padding:32px 26px calc(32px + var(--safe-bottom));
    background:var(--bg);
  }
  .auth-logo{
    font-size:38px;font-weight:800;letter-spacing:2px;margin-bottom:36px;
    text-align:center;
  }
  .auth-card{
    width:100%;max-width:380px;
    overflow:hidden;
    position:relative;
  }
  .auth-track{
    display:flex;
    width:200%;
    transition:transform .38s cubic-bezier(.65,0,.35,1);
  }
  .auth-track.show-signup{ transform:translateX(-50%); }
  .auth-pane{
    width:50%;
    padding:2px;
    flex-shrink:0;
  }
  .field{margin-bottom:14px;}
  .field label{
    display:block;font-size:12px;font-weight:600;
    color:var(--muted);margin-bottom:6px;
    text-transform:uppercase;letter-spacing:.4px;
  }
  .field input{
    width:100%;padding:13px 14px;
    background:var(--input-bg);
    border:1px solid var(--border);
    border-radius:10px;
    font-size:15px;
    color:var(--fg);
    outline:none;
  }
  .field input:focus{border-color:var(--fg);}
  .btn{
    width:100%;padding:14px;
    background:var(--accent);color:var(--accent-fg);
    border:none;border-radius:10px;
    font-size:15px;font-weight:700;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:8px;
    transition:opacity .15s ease, transform .1s ease;
  }
  .btn:active{transform:scale(0.98);}
  .btn:disabled{opacity:.55;cursor:default;}
  .btn.secondary{
    background:transparent;color:var(--fg);
    border:1.5px solid var(--border);
  }
  .btn.danger{background:var(--danger);color:#fff;}
  .btn.small{padding:9px 14px;font-size:13px;width:auto;}
  .spinner{
    width:16px;height:16px;border-radius:50%;
    border:2px solid rgba(255,255,255,.35);
    border-top-color:currentColor;
    animation:spin .7s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .auth-switch{
    text-align:center;margin-top:18px;font-size:14px;color:var(--muted);
  }
  .auth-switch span{
    color:var(--fg);font-weight:700;cursor:pointer;
  }
  .auth-error{
    background:rgba(224,36,94,.1);
    color:var(--danger);
    border:1px solid rgba(224,36,94,.3);
    padding:10px 12px;border-radius:8px;
    font-size:13.5px;margin-bottom:14px;
    display:none;
  }
  .auth-error.show{display:block;}
  .forgot-link{
    text-align:right;font-size:12.5px;color:var(--muted);
    margin:-6px 0 16px;cursor:pointer;
  }

  /* ---------- STORIES ---------- */
  .stories-bar{
    display:flex;gap:14px;overflow-x:auto;
    padding:14px 14px 10px;
    border-bottom:1px solid var(--border);
  }
  .story-item{
    display:flex;flex-direction:column;align-items:center;gap:5px;
    flex-shrink:0;width:66px;cursor:pointer;
  }
  .story-ring{
    width:60px;height:60px;border-radius:50%;
    padding:2.5px;
    background:linear-gradient(45deg,#000,#555,#000);
  }
  html[data-theme="dark"] .story-ring{ background:linear-gradient(45deg,#fff,#888,#fff); }
  .story-ring.own{background:var(--border);}
  .story-ring-inner{
    width:100%;height:100%;border-radius:50%;
    border:2.5px solid var(--bg);
    overflow:hidden;background:var(--input-bg);
    display:flex;align-items:center;justify-content:center;
  }
  .story-item span{font-size:11px;color:var(--fg);max-width:64px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

  .avatar-img,.avatar-fallback{
    width:100%;height:100%;object-fit:cover;display:block;
  }
  .avatar-fallback{
    display:flex;align-items:center;justify-content:center;
    background:var(--fg);color:var(--bg);
    font-weight:700;
  }

  /* ---------- POSTS / FEED ---------- */
  .post-card{border-bottom:1px solid var(--border);padding-bottom:6px;}
  .post-head{
    display:flex;align-items:center;justify-content:space-between;
    padding:11px 14px;
  }
  .post-head-left{display:flex;align-items:center;gap:10px;}
  .post-avatar{width:34px;height:34px;border-radius:50%;overflow:hidden;flex-shrink:0;}
  .post-uname{font-weight:700;font-size:14px;}
  .post-media{width:100%;background:var(--input-bg);display:block;max-height:600px;object-fit:cover;}
  .post-media-empty{padding:0;}
  .post-actions{display:flex;align-items:center;justify-content:space-between;padding:4px 8px;}
  .post-actions-left{display:flex;align-items:center;}
  .post-stats{padding:2px 14px;font-size:13.5px;font-weight:700;}
  .post-caption{padding:2px 14px 4px;font-size:14px;line-height:1.4;}
  .post-caption b{margin-right:6px;}
  .post-comments-link{padding:0 14px 4px;font-size:13.5px;color:var(--muted);cursor:pointer;}
  .post-time{padding:0 14px 12px;font-size:11px;color:var(--muted);text-transform:uppercase;}
  .heart-liked{filter:none !important;}
  html[data-theme="dark"] .heart-liked{filter:none !important;}

  .empty-state{
    padding:60px 30px;text-align:center;color:var(--muted);font-size:14.5px;
  }
  .empty-state b{display:block;color:var(--fg);font-size:17px;margin-bottom:6px;}
  .center-loading{padding:60px 0;display:flex;justify-content:center;}

  /* ---------- SEARCH ---------- */
  .search-bar{padding:12px 14px;position:sticky;top:0;background:var(--bg);z-index:5;}
  .search-bar input{
    width:100%;padding:11px 14px;border-radius:10px;
    background:var(--input-bg);border:1px solid var(--border);
    font-size:15px;outline:none;
  }
  .user-row{
    display:flex;align-items:center;gap:12px;
    padding:10px 14px;cursor:pointer;
  }
  .user-row:active{background:var(--hover);}
  .user-row .avatar-wrap{width:46px;height:46px;border-radius:50%;overflow:hidden;flex-shrink:0;}
  .user-row-info{flex:1;min-width:0;}
  .user-row-info .uname{font-weight:700;font-size:14.5px;}
  .user-row-info .dname{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

  /* ---------- PROFILE ---------- */
  .profile-head{padding:18px 16px 6px;}
  .profile-top{display:flex;align-items:center;gap:20px;}
  .profile-avatar{width:82px;height:82px;border-radius:50%;overflow:hidden;flex-shrink:0;border:1px solid var(--border);}
  .profile-stats{display:flex;flex:1;justify-content:space-around;text-align:center;}
  .profile-stats div b{display:block;font-size:17px;}
  .profile-stats div span{font-size:12px;color:var(--muted);}
  .profile-name{font-weight:700;margin-top:14px;font-size:15px;}
  .profile-bio{font-size:14px;margin-top:4px;color:var(--fg);white-space:pre-wrap;}
  .profile-skills{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
  .skill-chip{
    font-size:11.5px;padding:4px 10px;border-radius:20px;
    border:1px solid var(--border);color:var(--muted);
  }
  .profile-actions{display:flex;gap:8px;margin-top:14px;}
  .profile-actions .btn{padding:9px;font-size:13.5px;}
  .posts-grid{
    display:grid;grid-template-columns:repeat(3,1fr);gap:2px;margin-top:16px;
  }
  .grid-cell{aspect-ratio:1/1;background:var(--input-bg);overflow:hidden;cursor:pointer;}
  .grid-cell img,.grid-cell video{width:100%;height:100%;object-fit:cover;}

  /* ---------- REELS ---------- */
  #view-reels-container{padding-bottom:0 !important;}
  .reels-feed{
    height:calc(100vh - 108px - var(--safe-top));
    overflow-y:scroll;scroll-snap-type:y mandatory;
  }
  .reel-item{
    height:calc(100vh - 108px - var(--safe-top));
    scroll-snap-align:start;
    position:relative;background:#000;
    display:flex;align-items:center;justify-content:center;
  }
  .reel-item video{width:100%;height:100%;object-fit:contain;background:#000;}
  .reel-overlay{
    position:absolute;left:0;right:0;bottom:0;
    padding:16px 60px 20px 14px;
    background:linear-gradient(transparent,rgba(0,0,0,.75));
    color:#fff;
  }
  .reel-overlay .uname{font-weight:700;font-size:14.5px;}
  .reel-overlay .cap{font-size:13.5px;margin-top:4px;opacity:.92;}

  /* ---------- MESSAGES ---------- */
  .chat-row{display:flex;align-items:center;gap:12px;padding:11px 14px;cursor:pointer;}
  .chat-row:active{background:var(--hover);}
  .chat-row .avatar-wrap{width:52px;height:52px;border-radius:50%;overflow:hidden;flex-shrink:0;}
  .chat-row-info{flex:1;min-width:0;}
  .chat-row-info .cname{font-weight:700;font-size:14.5px;}
  .chat-row-info .cmsg{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  .chat-view{display:flex;flex-direction:column;height:calc(100vh - var(--safe-top));}
  .chat-header{
    display:flex;align-items:center;gap:10px;
    padding:calc(10px + var(--safe-top)) 10px 10px;
    border-bottom:1px solid var(--border);
  }
  .chat-header .cname{font-weight:700;font-size:15px;}
  .chat-messages{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px;}
  .msg-bubble{
    max-width:75%;padding:9px 13px;border-radius:16px;font-size:14.5px;line-height:1.35;
    word-wrap:break-word;
  }
  .msg-bubble.mine{align-self:flex-end;background:var(--fg);color:var(--bg);border-bottom-right-radius:4px;}
  .msg-bubble.theirs{align-self:flex-start;background:var(--input-bg);color:var(--fg);border-bottom-left-radius:4px;}
  .msg-bubble img{max-width:100%;border-radius:10px;display:block;margin-top:4px;}
  .chat-input-row{
    display:flex;align-items:center;gap:6px;padding:8px 10px calc(8px + var(--safe-bottom));
    border-top:1px solid var(--border);
  }
  .chat-input-row input{
    flex:1;padding:11px 14px;border-radius:20px;
    background:var(--input-bg);border:1px solid var(--border);
    font-size:14.5px;outline:none;
  }

  /* ---------- MODAL ---------- */
  #modal-root{position:fixed;inset:0;z-index:100;display:none;}
  #modal-root.open{display:block;}
  .modal-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.5);}
  .modal-sheet{
    position:absolute;left:0;right:0;bottom:0;
    max-height:90vh;
    background:var(--bg);
    border-radius:18px 18px 0 0;
    display:flex;flex-direction:column;
    transform:translateY(100%);
    transition:transform .3s cubic-bezier(.32,.72,0,1);
    padding-bottom:var(--safe-bottom);
  }
  #modal-root.open .modal-sheet{transform:translateY(0);}
  .modal-full .modal-sheet{
    top:0;max-height:100vh;border-radius:0;
  }
  .modal-header{
    display:flex;align-items:center;justify-content:space-between;
    padding:12px 8px 12px 14px;border-bottom:1px solid var(--border);
    flex-shrink:0;
  }
  .modal-header h3{margin:0;font-size:15.5px;}
  .modal-body{overflow-y:auto;padding:16px;}
  .modal-tabs{display:flex;border-bottom:1px solid var(--border);}
  .modal-tab{flex:1;text-align:center;padding:12px;font-size:13.5px;font-weight:700;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;}
  .modal-tab.active{color:var(--fg);border-color:var(--fg);}

  textarea.field-textarea{
    width:100%;min-height:80px;padding:12px 14px;border-radius:10px;
    background:var(--input-bg);border:1px solid var(--border);
    font-size:14.5px;resize:vertical;outline:none;
  }
  .media-picker{
    border:1.5px dashed var(--border);border-radius:12px;
    padding:26px 14px;text-align:center;cursor:pointer;margin-top:12px;
    color:var(--muted);font-size:13.5px;
  }
  .media-preview-wrap{margin-top:12px;position:relative;}
  .media-preview-wrap img,.media-preview-wrap video{width:100%;border-radius:10px;max-height:320px;object-fit:cover;background:var(--input-bg);}
  .media-remove{
    position:absolute;top:8px;right:8px;background:rgba(0,0,0,.55);
    border-radius:50%;width:30px;height:30px;
  }
  .media-remove img{filter:invert(1) !important;}

  .comment-row{display:flex;gap:10px;padding:8px 0;align-items:flex-start;}
  .comment-row .avatar-wrap{width:32px;height:32px;border-radius:50%;overflow:hidden;flex-shrink:0;}
  .comment-row .body{flex:1;font-size:14px;line-height:1.35;}
  .comment-row .body b{margin-right:6px;}
  .comment-row .time{font-size:11px;color:var(--muted);margin-top:2px;}
  .comment-input-row{display:flex;gap:8px;align-items:center;border-top:1px solid var(--border);padding:10px 4px 4px;}
  .comment-input-row input{flex:1;padding:10px 14px;border-radius:20px;background:var(--input-bg);border:1px solid var(--border);font-size:14px;outline:none;}

  .toast-wrap{
    position:fixed;top:calc(14px + var(--safe-top));left:0;right:0;
    display:flex;justify-content:center;z-index:999;pointer-events:none;
  }
  .toast{
    background:var(--fg);color:var(--bg);
    padding:10px 18px;border-radius:30px;font-size:13.5px;font-weight:600;
    box-shadow:0 6px 20px rgba(0,0,0,.2);
    opacity:0;transform:translateY(-10px);transition:all .25s ease;
    max-width:88vw;text-align:center;
  }
  .toast.show{opacity:1;transform:translateY(0);}
  .toast.error{background:var(--danger);color:#fff;}

  .settings-section{padding:6px 16px 20px;border-bottom:8px solid var(--input-bg);}
  .settings-section h4{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin:14px 0 10px;}
  .radio-row{display:flex;align-items:center;justify-content:space-between;padding:11px 0;font-size:14.5px;border-bottom:1px solid var(--border);}
  .radio-row input{width:18px;height:18px;}
  .settings-item{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 0;font-size:14.5px;border-bottom:1px solid var(--border);cursor:pointer;
  }
  .story-viewer{position:fixed;inset:0;background:#000;z-index:200;display:none;flex-direction:column;}
  .story-viewer.open{display:flex;}
  .story-progress{display:flex;gap:4px;padding:calc(8px + var(--safe-top)) 10px 0;}
  .story-progress .bar{flex:1;height:2.5px;background:rgba(255,255,255,.35);border-radius:2px;overflow:hidden;}
  .story-progress .bar i{display:block;height:100%;width:0;background:#fff;}
  .story-viewer-head{display:flex;align-items:center;gap:10px;padding:10px 12px;color:#fff;}
  .story-viewer-media{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;}
  .story-viewer-media img,.story-viewer-media video{max-width:100%;max-height:100%;}
  .story-caption{position:absolute;bottom:24px;left:0;right:0;text-align:center;color:#fff;font-size:14px;padding:0 20px;}

  @media (min-width:640px){
    #view-container{max-width:520px;margin:0 auto;padding-bottom:90px;}
    .bottom-nav{max-width:520px;margin:0 auto;left:0;right:0;}
    .topbar{max-width:520px;margin:0 auto;position:sticky;}
  }
</style>
</head>
<body>

<!-- ================= AUTH SCREEN ================= -->
<div id="auth-screen">
  <div class="auth-logo">ZILNET</div>
  <div class="auth-card">
    <div class="auth-track" id="auth-track">

      <!-- LOGIN PANE -->
      <div class="auth-pane">
        <div class="auth-error" id="login-error"></div>
        <form id="login-form">
          <div class="field">
            <label>Username or Email</label>
            <input type="text" id="login-login" autocomplete="username" required>
          </div>
          <div class="field">
            <label>Password</label>
            <input type="password" id="login-password" autocomplete="current-password" required>
          </div>
          <div class="forgot-link" id="open-forgot">Forgot password?</div>
          <button type="submit" class="btn" id="login-submit">
            <span>Log In</span>
          </button>
        </form>
        <div class="auth-switch">Don't have an account? <span id="go-signup">Sign up</span></div>
      </div>

      <!-- SIGNUP PANE -->
      <div class="auth-pane">
        <div class="auth-error" id="signup-error"></div>
        <form id="signup-form">
          <div class="field">
            <label>Username</label>
            <input type="text" id="signup-username" autocomplete="username" required>
          </div>
          <div class="field">
            <label>Display Name</label>
            <input type="text" id="signup-displayname" autocomplete="name" required>
          </div>
          <div class="field">
            <label>Email</label>
            <input type="email" id="signup-email" autocomplete="email" required>
          </div>
          <div class="field">
            <label>Password</label>
            <input type="password" id="signup-password" autocomplete="new-password" required>
          </div>
          <button type="submit" class="btn" id="signup-submit">
            <span>Create Account</span>
          </button>
        </form>
        <div class="auth-switch">Already have an account? <span id="go-login">Log in</span></div>
      </div>

    </div>
  </div>
</div>

<!-- ================= APP SHELL ================= -->
<div id="app-shell">
  <div class="topbar">
    <div class="logo">ZILNET</div>
    <div class="topbar-actions">
      <button class="icon-btn" id="nav-notifications-top">
        <img src="/icons/IMG_1895.png" alt="Notifications">
        <span class="icon-badge hidden" id="notif-dot"></span>
      </button>
      <button class="icon-btn" id="nav-messages-top">
        <img src="/icons/IMG_1883.png" alt="Messages">
      </button>
    </div>
  </div>

  <main id="view-container"></main>

  <nav class="bottom-nav">
    <button class="icon-btn nav-btn active-nav" data-view="home"><img src="/icons/IMG_1881.png" alt="Home"></button>
    <button class="icon-btn nav-btn" data-view="search"><img src="/icons/IMG_1882.png" alt="Search"></button>

<div class="story-viewer" id="story-viewer">

<!-- ================= MODAL ROOT ================= -->
<div id="modal-root">
  <div class="modal-backdrop" id="modal-backdrop"></div>

</div>

<input type="file" id="hidden-file-input" accept="image/*,video/*" class="hidden">
<script>
(function(){
"use strict";

/* ============================================================
   STATE
   ============================================================ */
var state = {
  user: null,
  view: "home",
  posts: [],
  stories: [],
  profileCache: {},
  currentProfileUsername: null,
  activeChatId: null,
  activeChatInfo: null,
  activePostId: null,
  createTab: "post",
  pendingMedia: null, // {dataUrl, type: 'image'|'video', file}
  storyGroups: [],
  storyViewerIndex: 0,
  storyViewerItems: [],
  storyTimer: null,
  settings: null
};

var MAX_MEDIA_BYTES = 700000; // ~700KB base64 safety cap (no dedicated upload endpoint exists on the server)

/* ============================================================
   API HELPER
   ============================================================ */
function apiFetch(path, method, body){
  var opts = {
    method: method || "GET",
    credentials: "include",
    headers: {}
  };
  if (body !== undefined){
    opts.headers["Content-Type"] = "application/json";
    opts.body = JSON.stringify(body);
  }
  return fetch(path, opts).then(function(res){
    return res.text().then(function(text){
      var data = null;
      try { data = text ? JSON.parse(text) : {}; } catch(e){ data = {}; }
      if (!res.ok){
        var msg = (data && data.error) ? data.error : ("Request failed (" + res.status + ")");
        var err = new Error(msg);
        err.status = res.status;
        throw err;
      }
      return data;
    });
  });
}

/* ============================================================
   UTIL
   ============================================================ */
function escapeHtml(str){
  if (str === null || str === undefined) return "";
  return String(str)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#39;");
}

function timeAgo(iso){
  if (!iso) return "";
  var t = Date.parse(iso);
  if (isNaN(t)) return "";
  var diff = Math.max(0, Date.now() - t);
  var s = Math.floor(diff/1000);
  if (s < 60) return s + "s";
  var m = Math.floor(s/60);
  if (m < 60) return m + "m";
  var h = Math.floor(m/60);
  if (h < 24) return h + "h";
  var d = Math.floor(h/24);
  if (d < 7) return d + "d";
  var w = Math.floor(d/7);
  if (w < 5) return w + "w";
  return new Date(t).toLocaleDateString();
}

function initials(name){
  name = (name||"").trim();
  if (!name) return "?";
  return name.charAt(0).toUpperCase();
}

function avatarHtml(user){
  var url = user && (user.avatarUrl || user.avatar_url);
  var label = (user && (user.displayName || user.display_name || user.username)) || "?";
  if (url){
    return '<img class="avatar-img" src="' + escapeHtml(url) + '" alt="">';
  }
  return '<div class="avatar-fallback">' + escapeHtml(initials(label)) + '</div>';
}

function toast(msg, isError){
  var el = document.getElementById("toast");
  el.textContent = msg;
  el.className = "toast show" + (isError ? " error" : "");
  clearTimeout(toast._t);
  toast._t = setTimeout(function(){ el.className = "toast"; }, 2600);
}

function setBtnLoading(btn, loading, labelWhileLoading){
  if (!btn) return;
  if (loading){
    btn.dataset.originalHtml = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span><span>' + (labelWhileLoading || "Please wait...") + '</span>';
  } else {
    btn.disabled = false;
    if (btn.dataset.originalHtml) btn.innerHTML = btn.dataset.originalHtml;
  }
}

/* ============================================================
   MODAL
   ============================================================ */
function openModal(html, opts){
  opts = opts || {};
  var root = document.getElementById("modal-root");
  var sheet = document.getElementById("modal-sheet");
  sheet.innerHTML = html;
  root.className = opts.full ? "open modal-full" : "open";
  document.body.style.overflow = "hidden";
}
function closeModal(){
  var root = document.getElementById("modal-root");
  root.className = "";
  document.getElementById("modal-sheet").innerHTML = "";
  document.body.style.overflow = "";
}
document.getElementById("modal-backdrop").addEventListener("click", closeModal);

/* ============================================================
   THEME
   ============================================================ */
function applyTheme(theme){
  var mode = theme;
  if (theme === "system" || !theme){
    mode = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  }
  document.documentElement.setAttribute("data-theme", mode);
}

/* ============================================================
   AUTH SCREEN LOGIC
   ============================================================ */
var authTrack = document.getElementById("auth-track");
document.getElementById("go-signup").addEventListener("click", function(){
  authTrack.className = "auth-track show-signup";
});
document.getElementById("go-login").addEventListener("click", function(){
  authTrack.className = "auth-track";
});

function showAuthError(which, msg){
  var el = document.getElementById(which + "-error");
  el.textContent = msg;
  el.className = "auth-error show";
}
function hideAuthError(which){
  document.getElementById(which + "-error").className = "auth-error";
}

document.getElementById("login-form").addEventListener("submit", function(e){
  e.preventDefault();
  hideAuthError("login");
  var btn = document.getElementById("login-submit");
  var login = document.getElementById("login-login").value.trim();
  var password = document.getElementById("login-password").value;
  if (!login || !password){
    showAuthError("login", "Enter your username/email and password.");
    return;
  }
  setBtnLoading(btn, true, "Logging in...");
  apiFetch("/api/login", "POST", { login: login, password: password })
    .then(function(data){
      state.user = data.user;
      enterApp();
    })
    .catch(function(err){
      showAuthError("login", err.message || "Login failed.");
    })
    .finally(function(){ setBtnLoading(btn, false); });
});

document.getElementById("signup-form").addEventListener("submit", function(e){
  e.preventDefault();
  hideAuthError("signup");
  var btn = document.getElementById("signup-submit");
  var username = document.getElementById("signup-username").value.trim();
  var displayName = document.getElementById("signup-displayname").value.trim();
  var email = document.getElementById("signup-email").value.trim();
  var password = document.getElementById("signup-password").value;
  if (!username || !displayName || !email || !password){
    showAuthError("signup", "Please fill in all fields.");
    return;
  }
  setBtnLoading(btn, true, "Creating account...");
  apiFetch("/api/signup", "POST", {
    username: username, displayName: displayName, email: email, password: password
  }).then(function(data){
    state.user = data.user;
    enterApp();
  }).catch(function(err){
    showAuthError("signup", err.message || "Could not create account.");
  }).finally(function(){ setBtnLoading(btn, false); });
});

document.getElementById("open-forgot").addEventListener("click", function(){
  openModal(
    '<div class="modal-header"><h3>Reset Password</h3>' +
    '<button class="icon-btn" id="forgot-close"><img src="/icons/IMG_1889.png"></button></div>' +
    '<div class="modal-body">' +
    '<div class="auth-error" id="forgot-error"></div>' +
    '<div class="field"><label>Email</label><input type="email" id="forgot-email"></div>' +
    '<button class="btn" id="forgot-submit"><span>Send Reset Instructions</span></button>' +
    '</div>'
  );
  document.getElementById("forgot-close").addEventListener("click", closeModal);
  document.getElementById("forgot-submit").addEventListener("click", function(){
    var btn = this;
    var email = document.getElementById("forgot-email").value.trim();
    var errEl = document.getElementById("forgot-error");
    errEl.className = "auth-error";
    if (!email){ errEl.textContent = "Enter your email."; errEl.className = "auth-error show"; return; }
    setBtnLoading(btn, true, "Sending...");
    apiFetch("/api/forgot-password", "POST", { email: email })
      .then(function(data){
        toast(data.message || "If an account exists, reset instructions were sent.");
        closeModal();
      })
      .catch(function(err){
        errEl.textContent = err.message || "Something went wrong.";
        errEl.className = "auth-error show";
      })
      .finally(function(){ setBtnLoading(btn, false); });
  });
});

/* ============================================================
   APP ENTRY / NAV
   ============================================================ */
function enterApp(){
  document.getElementById("auth-screen").className = "hidden";
  document.getElementById("app-shell").className = "active";
  loadSettingsQuiet();
  switchView("home");
  refreshNotifDot();
}

function exitApp(){
  state.user = null;
  document.getElementById("app-shell").className = "";
  document.getElementById("auth-screen").className = "";
  authTrack.className = "auth-track";
}

document.querySelectorAll(".nav-btn").forEach(function(btn){
  btn.addEventListener("click", function(){
    switchView(btn.dataset.view);
  });
});
document.getElementById("nav-notifications-top").addEventListener("click", function(){
  switchView("notifications");
});
document.getElementById("nav-messages-top").addEventListener("click", function(){
  switchView("messages");
});

function switchView(view, param){
  if (view === "create"){
    openCreateModal();
    return;
  }
  state.view = view;
  document.querySelectorAll(".nav-btn").forEach(function(b){
    b.classList.toggle("active-nav", b.dataset.view === view);
  });
  var container = document.getElementById("view-container");
  container.innerHTML = '<div class="center-loading"><div class="spinner" style="border-top-color:var(--fg);border-color:rgba(120,120,120,.3);"></div></div>';
  container.scrollTop = 0;

  if (view === "home") renderHome(container);
  else if (view === "search") renderSearch(container);
  else if (view === "reels") renderReels(container);
  else if (view === "profile") renderProfile(container, state.user.username);
  else if (view === "notifications") renderNotifications(container);
  else if (view === "messages") renderMessages(container);
  else if (view === "settings") renderSettings(container);
  else if (view === "userprofile") renderProfile(container, param);
}

/* ============================================================
   HOME / FEED
   ============================================================ */
function renderHome(container){
  Promise.all([
    apiFetch("/api/stories"),
    apiFetch("/api/feed")
  ]).then(function(results){
    var storiesData = results[0].stories || [];
    var feedData = results[1].posts || [];
    state.stories = storiesData;
    state.posts = feedData;
    container.innerHTML = storiesBarHtml(storiesData) + feedListHtml(feedData);
    wireStoriesBar(container);
    wirePostCards(container);
  }).catch(function(err){
    container.innerHTML = errorStateHtml(err.message);
    wireRetry(container, function(){ renderHome(container); });
  });
}

function storiesBarHtml(stories){
  var groupsMap = {};
  var order = [];
  stories.forEach(function(s){
    var uid = String(s.user_id);
    if (!groupsMap[uid]){ groupsMap[uid] = { user: s, items: [] }; order.push(uid); }
    groupsMap[uid].items.push(s);
  });
  state.storyGroups = order.map(function(uid){ return groupsMap[uid]; });

  var html = '<div class="stories-bar">';
  html += '<div class="story-item" id="my-story-add">' +
    '<div class="story-ring own"><div class="story-ring-inner">' + avatarHtml(state.user) + '</div></div>' +
    '<span>Your Story</span></div>';
  state.storyGroups.forEach(function(g, idx){
    if (String(g.user.user_id) === String(state.user.id)) return;
    html += '<div class="story-item" data-story-group="' + idx + '">' +
      '<div class="story-ring"><div class="story-ring-inner">' + avatarHtml({avatarUrl:g.user.avatar_url, username:g.user.username, displayName:g.user.display_name}) + '</div></div>' +
      '<span>' + escapeHtml(g.user.display_name || g.user.username) + '</span></div>';
  });
  html += '</div>';
  return html;
}

function wireStoriesBar(container){
  var addBtn = container.querySelector("#my-story-add");
  if (addBtn) addBtn.addEventListener("click", function(){ openCreateModal("story"); });
  container.querySelectorAll("[data-story-group]").forEach(function(el){
    el.addEventListener("click", function(){
      var idx = parseInt(el.dataset.storyGroup, 10);
      openStoryViewer(idx);
    });
  });
}

function feedListHtml(posts){
  if (!posts.length){
    return '<div class="empty-state"><b>No posts yet</b>Follow people or create your first post to see content here.</div>';
  }
  return posts.map(postCardHtml).join("");
}

function postCardHtml(p){
  var mediaHtml = "";
  if (p.mediaUrl){
    if ((p.mediaType||"").indexOf("video") !== -1){
      mediaHtml = '<video class="post-media" src="' + escapeHtml(p.mediaUrl) + '" controls playsinline></video>';
    } else {
      mediaHtml = '<img class="post-media" src="' + escapeHtml(p.mediaUrl) + '" alt="">';
    }
  }
  var isMine = state.user && String(p.userId) === String(state.user.id);
  return (
    '<div class="post-card" data-post-id="' + escapeHtml(p.id) + '">' +
      '<div class="post-head">' +
        '<div class="post-head-left" data-open-profile="' + escapeHtml(p.username) + '">' +
          '<div class="post-avatar">' + avatarHtml({avatarUrl:p.avatarUrl, username:p.username, displayName:p.displayName}) + '</div>' +
          '<div class="post-uname">' + escapeHtml(p.username) + '</div>' +
        '</div>' +
        (isMine ? '<button class="icon-btn sm post-more" data-post-id="' + escapeHtml(p.id) + '"><img src="/icons/IMG_1888.png"></button>' : '<div style="width:44px;"></div>') +
      '</div>' +
      mediaHtml +
      '<div class="post-actions">' +
        '<div class="post-actions-left">' +
          '<button class="icon-btn like-btn" data-post-id="' + escapeHtml(p.id) + '" data-liked="' + (p.liked?"1":"0") + '"><img src="/icons/IMG_1886.png"></button>' +
          '<button class="icon-btn comment-btn" data-post-id="' + escapeHtml(p.id) + '"><img src="/icons/IMG_1897.png"></button>' +
          '<button class="icon-btn share-btn" data-post-id="' + escapeHtml(p.id) + '"><img src="/icons/IMG_1884.png"></button>' +
        '</div>' +
        '<button class="icon-btn save-btn" data-post-id="' + escapeHtml(p.id) + '" data-saved="' + (p.saved?"1":"0") + '"><img src="/icons/IMG_1892.png"></button>' +
      '</div>' +
      '<div class="post-stats" data-likes-count="' + escapeHtml(p.id) + '">' + p.likes + (p.likes===1?" like":" likes") + '</div>' +
      (p.caption ? '<div class="post-caption"><b>' + escapeHtml(p.username) + '</b>' + escapeHtml(p.caption) + '</div>' : '') +
      (p.comments > 0 ? '<div class="post-comments-link" data-open-comments="' + escapeHtml(p.id) + '">View all ' + p.comments + ' comments</div>' : '') +
      '<div class="post-time">' + timeAgo(p.createdAt) + ' ago</div>' +
    '</div>'
  );
}

function errorStateHtml(msg){
  return '<div class="empty-state"><b>Something went wrong</b>' + escapeHtml(msg || "Please try again.") +
    '<div style="margin-top:16px;"><button class="btn secondary small" id="retry-btn" style="margin:0 auto;">Retry</button></div></div>';
}
function wireRetry(container, fn){
  var b = container.querySelector("#retry-btn");
  if (b) b.addEventListener("click", fn);
}

function wirePostCards(container){
  container.querySelectorAll("[data-open-profile]").forEach(function(el){
    el.addEventListener("click", function(){ switchView("userprofile", el.dataset.openProfile); });
  });
  container.querySelectorAll(".like-btn").forEach(function(btn){
    btn.addEventListener("click", function(){ toggleLike(btn); });
  });
  container.querySelectorAll(".save-btn").forEach(function(btn){
    btn.addEventListener("click", function(){ toggleSave(btn); });
  });
  container.querySelectorAll(".comment-btn").forEach(function(btn){
    btn.addEventListener("click", function(){ openCommentsModal(btn.dataset.postId); });
  });
  container.querySelectorAll("[data-open-comments]").forEach(function(el){
    el.addEventListener("click", function(){ openCommentsModal(el.dataset.openComments); });
  });
  container.querySelectorAll(".share-btn").forEach(function(btn){
    btn.addEventListener("click", function(){ openShareSheet(btn.dataset.postId); });
  });
  container.querySelectorAll(".post-more").forEach(function(btn){
    btn.addEventListener("click", function(){ openPostMoreMenu(btn.dataset.postId); });
  });
}

function findPostInState(postId){
  var p = state.posts.find(function(x){ return String(x.id) === String(postId); });
  return p;
}

function toggleLike(btn){
  var postId = btn.dataset.postId;
  var liked = btn.dataset.liked === "1";
  var img = btn.querySelector("img");
  btn.dataset.liked = liked ? "0" : "1";
  img.style.transform = "scale(1.25)";
  setTimeout(function(){ img.style.transform = ""; }, 140);
  var card = btn.closest(".post-card");
  var statsEl = card.querySelector('[data-likes-count]');
  var p = findPostInState(postId);
  var currentLikes = p ? p.likes : parseInt(statsEl.textContent,10) || 0;
  var newLikes = liked ? Math.max(0, currentLikes - 1) : currentLikes + 1;
  statsEl.textContent = newLikes + (newLikes===1?" like":" likes");
  if (p){ p.likes = newLikes; p.liked = !liked; }

  var req = liked ? apiFetch("/api/posts/" + postId + "/like", "DELETE") : apiFetch("/api/posts/" + postId + "/like", "POST");
  req.catch(function(err){
    btn.dataset.liked = liked ? "1" : "0";
    statsEl.textContent = currentLikes + (currentLikes===1?" like":" likes");
    if (p){ p.likes = currentLikes; p.liked = liked; }
    toast(err.message || "Could not update like.", true);
  });
}

function toggleSave(btn){
  var postId = btn.dataset.postId;
  var saved = btn.dataset.saved === "1";
  btn.dataset.saved = saved ? "0" : "1";
  var req = saved ? apiFetch("/api/posts/" + postId + "/save", "DELETE") : apiFetch("/api/posts/" + postId + "/save", "POST");
  req.then(function(){
    toast(saved ? "Removed from saved." : "Saved.");
  }).catch(function(err){
    btn.dataset.saved = saved ? "1" : "0";
    toast(err.message || "Could not update save.", true);
  });
}

function openShareSheet(postId){
  var url = window.location.origin + "/?post=" + encodeURIComponent(postId);
  openModal(
    '<div class="modal-header"><h3>Share Post</h3><button class="icon-btn" id="share-close"><img src="/icons/IMG_1889.png"></button></div>' +
    '<div class="modal-body">' +
    '<button class="btn secondary" id="share-copy" style="margin-bottom:10px;">Copy Link</button>' +
    '<button class="btn secondary" id="share-native">Share via...</button>' +
    '</div>'
  );
  document.getElementById("share-close").addEventListener("click", closeModal);
  document.getElementById("share-copy").addEventListener("click", function(){
    navigator.clipboard && navigator.clipboard.writeText(url);
    toast("Link copied.");
    closeModal();
  });
  document.getElementById("share-native").addEventListener("click", function(){
    if (navigator.share){
      navigator.share({ url: url }).catch(function(){});
    } else {
      toast("Sharing not supported on this device.", true);
    }
    closeModal();
  });
}

function openPostMoreMenu(postId){
  openModal(
    '<div class="modal-header"><h3>Post Options</h3><button class="icon-btn" id="more-close"><img src="/icons/IMG_1889.png"></button></div>' +
    '<div class="modal-body">' +
    '<button class="btn danger" id="delete-post-btn">Delete Post</button>' +
    '</div>'
  );
  document.getElementById("more-close").addEventListener("click", closeModal);
  document.getElementById("delete-post-btn").addEventListener("click", function(){
    var btn = this;
    setBtnLoading(btn, true, "Deleting...");
    apiFetch("/api/posts/" + postId, "DELETE").then(function(){
      toast("Post deleted.");
      closeModal();
      switchView(state.view);
    }).catch(function(err){
      toast(err.message || "Could not delete post.", true);
      setBtnLoading(btn, false);
    });
  });
}

/* ============================================================
   STORY VIEWER
   ============================================================ */
function openStoryViewer(groupIdx){
  var group = state.storyGroups[groupIdx];
  if (!group) return;
  state.storyViewerItems = group.items;
  state.storyViewerIndex = 0;
  document.getElementById("story-viewer-uname").textContent = group.user.display_name || group.user.username;
  document.getElementById("story-viewer-avatar").innerHTML = avatarHtml({avatarUrl:group.user.avatar_url, displayName:group.user.display_name, username:group.user.username});
  var progressEl = document.getElementById("story-progress");
  progressEl.innerHTML = group.items.map(function(){ return '<div class="bar"><i></i></div>'; }).join("");
  document.getElementById("story-viewer").className = "story-viewer open";
  playStoryAt(0);
}
function playStoryAt(idx){
  clearTimeout(state.storyTimer);
  var items = state.storyViewerItems;
  if (idx >= items.length){ closeStoryViewer(); return; }
  state.storyViewerIndex = idx;
  var s = items[idx];
  var mediaEl = document.getElementById("story-viewer-media");
  var isVideo = (s.media_type||"").indexOf("video") !== -1;
  if (s.media_url){
    mediaEl.innerHTML = isVideo
      ? '<video src="' + escapeHtml(s.media_url) + '" autoplay playsinline muted></video>'
      : '<img src="' + escapeHtml(s.media_url) + '">';
  } else {
    mediaEl.innerHTML = '<div style="color:#fff;font-size:18px;padding:30px;text-align:center;">' + escapeHtml(s.content||"") + '</div>';
  }
  var capEl = mediaEl.querySelector("img,video");
  var bars = document.querySelectorAll("#story-progress .bar i");
  for (var i=0;i<bars.length;i++){ bars[i].style.transition="none"; bars[i].style.width = i < idx ? "100%" : "0%"; }
  void document.getElementById("story-progress").offsetWidth;
  if (bars[idx]){
    bars[idx].style.transition = "width 5s linear";
    setTimeout(function(){ bars[idx].style.width = "100%"; }, 20);
  }
  state.storyTimer = setTimeout(function(){ playStoryAt(idx+1); }, 5000);
}
function closeStoryViewer(){
  clearTimeout(state.storyTimer);
  document.getElementById("story-viewer").className = "story-viewer";
  document.getElementById("story-viewer-media").innerHTML = "";
}
document.getElementById("story-viewer-close").addEventListener("click", closeStoryViewer);
document.getElementById("story-viewer-media").addEventListener("click", function(e){
  var rect = this.getBoundingClientRect();
  var x = e.clientX - rect.left;
  if (x < rect.width/2) playStoryAt(state.storyViewerIndex - 1);
  else playStoryAt(state.storyViewerIndex + 1);
});

/* ============================================================
   COMMENTS MODAL
   ============================================================ */
function openCommentsModal(postId){
  openModal(
    '<div class="modal-header"><h3>Comments</h3><button class="icon-btn" id="comments-close"><img src="/icons/IMG_1889.png"></button></div>' +
    '<div class="modal-body" id="comments-list" style="padding-bottom:4px;"><div class="center-loading"><div class="spinner" style="border-top-color:var(--fg);border-color:rgba(120,120,120,.3);"></div></div></div>' +
    '<div class="comment-input-row">' +
      '<input type="text" id="comment-input" placeholder="Add a comment...">' +
      '<button class="icon-btn" id="comment-send"><img src="/icons/IMG_1898.png"></button>' +
    '</div>'
  );
  document.getElementById("comments-close").addEventListener("click", closeModal);
  loadComments(postId);
  document.getElementById("comment-send").addEventListener("click", function(){ submitComment(postId); });
  document.getElementById("comment-input").addEventListener("keydown", function(e){
    if (e.key === "Enter") submitComment(postId);
  });
}
function loadComments(postId){
  apiFetch("/api/posts/" + postId + "/comments").then(function(data){
    var list = data.comments || [];
    var el = document.getElementById("comments-list");
    if (!list.length){
      el.innerHTML = '<div class="empty-state" style="padding:30px 10px;"><b>No comments yet</b>Be the first to comment.</div>';
      return;
    }
    el.innerHTML = list.map(function(c){
      return '<div class="comment-row">' +
        '<div class="avatar-wrap">' + avatarHtml({avatarUrl:c.avatar_url, username:c.username, displayName:c.display_name}) + '</div>' +
        '<div class="body"><b>' + escapeHtml(c.username) + '</b>' + escapeHtml(c.content) +
        '<div class="time">' + timeAgo(c.created_at) + ' ago</div></div>' +
      '</div>';
    }).join("");
  }).catch(function(err){
    document.getElementById("comments-list").innerHTML = errorStateHtml(err.message);
  });
}
function submitComment(postId){
  var input = document.getElementById("comment-input");
  var content = input.value.trim();
  if (!content) return;
  input.value = "";
  input.disabled = true;
  apiFetch("/api/posts/" + postId + "/comments", "POST", { content: content })
    .then(function(){
      loadComments(postId);
      var p = findPostInState(postId);
      if (p) p.comments = (p.comments||0) + 1;
    })
    .catch(function(err){ toast(err.message || "Could not post comment.", true); })
    .finally(function(){ input.disabled = false; input.focus(); });
}

/* ============================================================
   CREATE (POST / STORY / REEL)
   ============================================================ */
function openCreateModal(defaultTab){
  state.pendingMedia = null;
  state.createTab = defaultTab || "post";
  openModal(createModalHtml(), { full:false });
  wireCreateModal();
}
function createModalHtml(){
  var tabs = ["post","story","reel"];
  var labels = { post:"Post", story:"Story", reel:"Reel" };
  return (
    '<div class="modal-header"><h3>Create</h3><button class="icon-btn" id="create-close"><img src="/icons/IMG_1889.png"></button></div>' +
    '<div class="modal-tabs">' + tabs.map(function(t){
      return '<div class="modal-tab' + (t===state.createTab?' active':'') + '" data-tab="' + t + '">' + labels[t] + '</div>';
    }).join("") + '</div>' +
    '<div class="modal-body">' +
      '<div class="auth-error" id="create-error"></div>' +
      '<div class="media-picker" id="media-picker"><img src="/icons/IMG_1880.png" style="width:26px;height:26px;object-fit:contain;display:block;margin:0 auto 8px;' + (isDark()?'filter:invert(1);':'') + '">Tap to choose photo or video from your device</div>' +
      '<div id="media-preview-slot"></div>' +
      (state.createTab !== "reel" ? '<textarea class="field-textarea" id="create-caption" placeholder="' + (state.createTab==="story"?"Add text to your story (optional)":"Write a caption...") + '" style="margin-top:14px;"></textarea>' : '<textarea class="field-textarea" id="create-caption" placeholder="Write a caption..." style="margin-top:14px;"></textarea>') +
      '<button class="btn" id="create-submit" style="margin-top:16px;"><span>Share</span></button>' +
    '</div>'
  );
}
function isDark(){ return document.documentElement.getAttribute("data-theme") === "dark"; }

function wireCreateModal(){
  document.getElementById("create-close").addEventListener("click", closeModal);
  document.querySelectorAll(".modal-tab").forEach(function(tab){
    tab.addEventListener("click", function(){
      state.createTab = tab.dataset.tab;
      var caption = document.getElementById("create-caption").value;
      openModal(createModalHtml(), {});
      wireCreateModal();
      document.getElementById("create-caption").value = caption;
      if (state.pendingMedia) showMediaPreview();
    });
  });
  document.getElementById("media-picker").addEventListener("click", function(){
    document.getElementById("hidden-file-input").click();
  });
  if (state.pendingMedia) showMediaPreview();
  document.getElementById("create-submit").addEventListener("click", submitCreate);
}

var fileInput = document.getElementById("hidden-file-input");
fileInput.addEventListener("change", function(e){
  var file = e.target.files[0];
  fileInput.value = "";
  if (!file) return;
  var isVideo = file.type.indexOf("video") === 0;
  var reader = new FileReader();
  reader.onload = function(){
    var dataUrl = reader.result;
    var approxBytes = Math.floor((dataUrl.length - (dataUrl.indexOf(",")+1)) * 0.75);
    if (approxBytes > MAX_MEDIA_BYTES){
      showCreateError("This file is too large to upload. Your server doesn't have a dedicated media-upload endpoint yet, so files are sent as inline data and must stay small (roughly under " + Math.round(MAX_MEDIA_BYTES/1000) + "KB). Please choose a smaller image.");
      return;
    }
    state.pendingMedia = { dataUrl: dataUrl, type: isVideo ? "video" : "image", file: file };
    showMediaPreview();
  };
  reader.onerror = function(){ showCreateError("Could not read the selected file."); };
  reader.readAsDataURL(file);
});

function showMediaPreview(){
  var slot = document.getElementById("media-preview-slot");
  if (!slot || !state.pendingMedia) return;
  var m = state.pendingMedia;
  slot.innerHTML = '<div class="media-preview-wrap">' +
    (m.type === "video"
      ? '<video src="' + m.dataUrl + '" controls playsinline></video>'
      : '<img src="' + m.dataUrl + '">') +
    '<button class="icon-btn media-remove" id="media-remove-btn"><img src="/icons/IMG_1889.png"></button>' +
  '</div>';
  document.getElementById("media-picker").className = "hidden";
  document.getElementById("media-remove-btn").addEventListener("click", function(){
    state.pendingMedia = null;
    slot.innerHTML = "";
    document.getElementById("media-picker").className = "media-picker";
  });
}
function showCreateError(msg){
  var el = document.getElementById("create-error");
  if (!el) { toast(msg, true); return; }
  el.textContent = msg;
  el.className = "auth-error show";
}

function submitCreate(){
  var btn = document.getElementById("create-submit");
  var caption = (document.getElementById("create-caption").value || "").trim();
  var media = state.pendingMedia;
  showCreateError("");
  document.getElementById("create-error").className = "auth-error";

  if (state.createTab === "reel" && !media){
    showCreateError("A reel needs a video.");
    return;
  }
  if (state.createTab !== "reel" && !media && !caption){
    showCreateError("Add a caption or media to continue.");
    return;
  }

  var payload, endpoint;
  if (state.createTab === "post"){
    endpoint = "/api/posts";
    payload = { caption: caption, mediaUrl: media ? media.dataUrl : "", mediaType: media ? media.type : "" };
  } else if (state.createTab === "story"){
    endpoint = "/api/stories";
    payload = { content: caption, mediaUrl: media ? media.dataUrl : "", mediaType: media ? media.type : "" };
  } else {
    endpoint = "/api/reels";
    payload = { mediaUrl: media ? media.dataUrl : "", caption: caption };
  }

  setBtnLoading(btn, true, "Sharing...");
  apiFetch(endpoint, "POST", payload)
    .then(function(){
      toast((state.createTab === "post" ? "Post" : state.createTab === "story" ? "Story" : "Reel") + " shared.");
      closeModal();
      switchView(state.createTab === "reel" ? "reels" : "home");
    })
    .catch(function(err){
      showCreateError(err.message || "Could not share right now.");
    })
    .finally(function(){ setBtnLoading(btn, false); });
}

function loadProfilePosts(username){
  apiFetch("/api/posts?username=" + encodeURIComponent(username)).then(function(data){
    var grid = document.getElementById("profile-posts-grid");
    if (!grid) return;
    var posts = data.posts || [];

      grid.outerHTML = '<div class="empty-state"><b>No posts yet</b></div>';
      return;
    }
    grid.innerHTML = posts.map(function(p){
      var cell = (p.mediaType||"").indexOf("video") !== -1
        ? '<video src="' + escapeHtml(p.mediaUrl) + '" muted></video>'
        : (p.mediaUrl ? '<img src="' + escapeHtml(p.mediaUrl) + '">' : '<div style="padding:10px;font-size:12px;">' + escapeHtml((p.caption||"").slice(0,80)) + '</div>');

      });

function openSinglePostModal(p){
  state.posts = state.posts.filter(function(x){ return String(x.id) !== String(p.id); }).concat([p]);
  openModal(
    '<div class="modal-header"><h3>Post</h3><button class="icon-btn" id="single-post-close"><img src="/icons/IMG_1889.png"></button></div>' +

function toggleFollow(btn){
  var username = btn.dataset.username;
  var following = btn.dataset.following === "1";
  setBtnLoading(btn, true, "...");
  var req = following ? apiFetch("/api/users/" + encodeURIComponent(username) + "/follow", "DELETE")
                      : apiFetch("/api/users/" + encodeURIComponent(username) + "/follow", "POST");
  req.then(function(data){
    var nowFollowing = !!data.following;
    btn.dataset.following = nowFollowing ? "1" : "0";
    btn.className = "btn" + (nowFollowing ? " secondary" : "");
    setBtnLoading(btn, false);
    btn.querySelector("span") ? null : null;
    btn.innerHTML = nowFollowing ? "Following" : "Follow";
  }).catch(function(err){
    setBtnLoading(btn, false);
    toast(err.message || "Could not update follow status.", true);
  });
}

function renderReels(container){
  container.id = "view-container";
  apiFetch("/api/reels").then(function(data){
    var reels = data.reels || [];
    if (!reels.length){
      container.innerHTML = '<div class="empty-state"><b>No reels yet</b>Create the first reel.</div>';
      return;
    }
    container.innerHTML = '<div class="reels-feed" id="reels-feed">' + reels.map(function(r){
      return '<div class="reel-item">' +
        '<video src="' + escapeHtml(r.media_url) + '" loop muted playsinline autoplay></video>' +
        '<div class="reel-overlay"><div class="uname">@' + escapeHtml(r.username) + '</div>' +
        (r.caption ? '<div class="cap">' + escapeHtml(r.caption) + '</div>' : '') + '</div>' +
      '</div>';
    }).join("") + '</div>';

    var vids = container.querySelectorAll("video");
    var io = new IntersectionObserver(function(entries){
      entries.forEach(function(entry){
        var v = entry.target;
        if (entry.isIntersecting) v.play().catch(function(){});
        else v.pause();
      });
    }, { threshold: 0.6 });
    vids.forEach(function(v){ io.observe(v); v.addEventListener("click", function(){ v.paused ? v.play() : v.pause(); }); });
  }).catch(function(err){
    container.innerHTML = errorStateHtml(err.message);
    wireRetry(container, function(){ renderReels(container); });
  });
}

function loadChats(){

    }

        '<div class="avatar-wrap" id="chat-avatar-' + escapeHtml(c.id) + '">' + (c.is_group ? avatarHtml({displayName:c.name}) : '<div class="avatar-fallback">?</div>') + '</div>' +
        '<div class="chat-row-info"><div class="cname" id="chat-name-' + escapeHtml(c.id) + '">' + escapeHtml(c.name || "Chat") + '</div>' +
        '<div class="cmsg">' + escapeHtml(c.last_message || "No messages yet") + '</div></div>' +
      '</div>';
    }).join("");
    list.querySelectorAll("[data-chat-id]").forEach(function(row){
      row.addEventListener("click", function(){ openChatView(row.dataset.chatId); });
    });
    chats.forEach(function(c){
      if (!c.is_group) resolveDirectChatName(c.id);
    });
  }).catch(function(err){
    list.innerHTML = errorStateHtml(err.message);
    wireRetry(list, loadChats);
  });
}
function resolveDirectChatName(chatId){
  apiFetch("/api/chats/" + encodeURIComponent(chatId)).then(function(data){
    var members = data.members || [];
    var other = members.find(function(m){ return String(m.id) !== String(state.user.id); });
    if (other){
      var nameEl = document.getElementById("chat-name-" + chatId);
      var avEl = document.getElementById("chat-avatar-" + chatId);
      if (nameEl) nameEl.textContent = other.display_name || other.username;
      if (avEl) avEl.innerHTML = avatarHtml({avatarUrl:other.avatar_url, username:other.username, displayName:other.display_name});
      var row = document.getElementById("chat-row-" + chatId);
      if (row) row.dataset.otherUsername = other.username;
    }
  }).catch(function(){});
}

function openNewChatModal(){
  openModal(
    '<div class="modal-header"><h3>New Message</h3><button class="icon-btn" id="newchat-close"><img src="/icons/IMG_1889.png"></button></div>' +
    '<div class="modal-body">' +
    '<div class="auth-error" id="newchat-error"></div>' +
    '<div class="field"><label>Username or Email</label><input type="text" id="newchat-target" placeholder="Enter a username..."></div>' +
    '<button class="btn" id="newchat-submit" style="margin-bottom:10px;"><span>Start Chat</span></button>' +
    '<div style="text-align:center;font-size:12.5px;color:var(--muted);margin:14px 0 8px;">— or create a group —</div>' +
    '<div class="field"><label>Group Name</label><input type="text" id="group-name"></div>' +
    '<div class="field"><label>Member usernames (comma separated)</label><input type="text" id="group-members"></div>' +
    '<button class="btn secondary" id="group-submit"><span>Create Group</span></button>' +
    '</div>'
  );
  document.getElementById("newchat-close").addEventListener("click", closeModal);
  document.getElementById("newchat-submit").addEventListener("click", function(){
    var btn = this;
    var target = document.getElementById("newchat-target").value.trim();
    var errEl = document.getElementById("newchat-error");
    errEl.className = "auth-error";
    if (!target){ errEl.textContent = "Enter a username or email."; errEl.className = "auth-error show"; return; }
    setBtnLoading(btn, true, "Starting...");
    apiFetch("/api/chats", "POST", { username: target })
      .then(function(data){
        closeModal();
        openChatView(data.chatId);
      })
      .catch(function(err){
        errEl.textContent = err.message || "Could not start chat.";
        errEl.className = "auth-error show";
      })
      .finally(function(){ setBtnLoading(btn, false); });
  });
  document.getElementById("group-submit").addEventListener("click", function(){
    var btn = this;
    var name = document.getElementById("group-name").value.trim();
    var membersRaw = document.getElementById("group-members").value.trim();
    var errEl = document.getElementById("newchat-error");
    errEl.className = "auth-error";
    if (!name || !membersRaw){ errEl.textContent = "Enter a group name and at least one member."; errEl.className = "auth-error show"; return; }
    var usernames = membersRaw.split(",").map(function(s){ return s.trim(); }).filter(Boolean);
    setBtnLoading(btn, true, "Creating...");
    Promise.all(usernames.map(function(u){
      return apiFetch("/api/search?q=" + encodeURIComponent(u)).then(function(d){
        var match = (d.users||[]).find(function(x){ return x.username.toLowerCase() === u.toLowerCase(); });
        return match ? match.id : null;
      }).catch(function(){ return null; });
    })).then(function(ids){
      var memberIds = ids.filter(Boolean);
      if (!memberIds.length){
        errEl.textContent = "Could not find any of those usernames.";
        errEl.className = "auth-error show";
        setBtnLoading(btn, false);
        return;
      }
      apiFetch("/api/groups", "POST", { name: name, memberIds: memberIds })
        .then(function(data){
          closeModal();
          openChatView(data.chatId);
        })
        .catch(function(err){
          errEl.textContent = err.message || "Could not create group.";
          errEl.className = "auth-error show";
        })
        .finally(function(){ setBtnLoading(btn, false); });
    });
  });
}

function startChatWith(username){
  apiFetch("/api/chats", "POST", { username: username })
    .then(function(data){ switchView("messages"); setTimeout(function(){ openChatView(data.chatId); }, 50); })
    .catch(function(err){ toast(err.message || "Could not start chat.", true); });
}

function openChatView(chatId){
  state.activeChatId = chatId;
  var container = document.getElementById("view-container");
  container.innerHTML =
    '<div class="chat-view">' +
      '<div class="chat-header">' +
        '<button class="icon-btn" id="chat-back-btn"><img src="/icons/IMG_1890.png"></button>' +
        '<div class="avatar-wrap" id="chatview-avatar" style="width:36px;height:36px;border-radius:50%;overflow:hidden;"></div>' +
        '<div class="cname" id="chatview-name">Chat</div>' +
      '</div>' +
      '<div class="chat-messages" id="chat-messages"></div>' +
      '<div class="chat-input-row">' +
        '<input type="text" id="chat-msg-input" placeholder="Message...">' +
        '<button class="icon-btn" id="chat-send-btn"><img src="/icons/IMG_1898.png"></button>' +
      '</div>' +
    '</div>';
  document.getElementById("chat-back-btn").addEventListener("click", function(){ switchView("messages"); });
  document.getElementById("chat-send-btn").addEventListener("click", sendChatMessage);
  document.getElementById("chat-msg-input").addEventListener("keydown", function(e){ if (e.key === "Enter") sendChatMessage(); });

  apiFetch("/api/chats/" + encodeURIComponent(chatId)).then(function(data){
    state.activeChatInfo = data;
    var other = (data.members||[]).find(function(m){ return String(m.id) !== String(state.user.id); });
    var nameEl = document.getElementById("chatview-name");
    var avEl = document.getElementById("chatview-avatar");
    if (data.chat && data.chat.is_group){
      if (nameEl) nameEl.textContent = data.chat.name || "Group";
      if (avEl) avEl.innerHTML = avatarHtml({displayName:data.chat.name});
    } else if (other){
      if (nameEl) nameEl.textContent = other.display_name || other.username;
      if (avEl) avEl.innerHTML = avatarHtml({avatarUrl:other.avatar_url, username:other.username, displayName:other.display_name});
    }
  }).catch(function(){});

  loadMessages(chatId);
}

function loadMessages(chatId){
  var el = document.getElementById("chat-messages");
  el.innerHTML = '<div class="center-loading"><div class="spinner" style="border-top-color:var(--fg);border-color:rgba(120,120,120,.3);"></div></div>';
  apiFetch("/api/chats/" + encodeURIComponent(chatId) + "/messages").then(function(data){
    var msgs = data.messages || [];
    if (!msgs.length){
      el.innerHTML = '<div class="empty-state"><b>Say hello</b>No messages yet.</div>';
      return;
    }
    el.innerHTML = msgs.map(function(m){
      var mine = String(m.sender_id) === String(state.user.id);
      var content = m.content ? escapeHtml(m.content) : "";
      var mediaHtml = m.media_url ? '<img src="' + escapeHtml(m.media_url) + '">' : "";
      return '<div class="msg-bubble ' + (mine ? "mine" : "theirs") + '">' + content + mediaHtml + '</div>';
    }).join("");
    el.scrollTop = el.scrollHeight;
  }).catch(function(err){
    el.innerHTML = errorStateHtml(err.message);
    wireRetry(el, function(){ loadMessages(chatId); });
  });
}

function sendChatMessage(){
  var input = document.getElementById("chat-msg-input");
  var content = input.value.trim();
  if (!content || !state.activeChatId) return;
  input.value = "";
  input.disabled = true;
  apiFetch("/api/chats/" + encodeURIComponent(state.activeChatId) + "/messages", "POST", { content: content })
    .then(function(){ loadMessages(state.activeChatId); })
    .catch(function(err){ toast(err.message || "Could not send message.", true); })
    .finally(function(){ input.disabled = false; input.focus(); });
}

/* ============================================================
   NOTIFICATIONS
   ============================================================ */
function refreshNotifDot(){
  apiFetch("/api/notifications").then(function(data){
    var list = data.notifications || [];
    var hasUnread = list.some(function(n){ return n.is_read === 0 || n.is_read === null || n.is_read === undefined; });
    document.getElementById("notif-dot").className = "icon-badge" + (hasUnread ? "" : " hidden");
  }).catch(function(){});
}
function renderNotifications(container){
  apiFetch("/api/notifications").then(function(data){
    var list = data.notifications || [];
    apiFetch("/api/notifications/read", "POST").then(refreshNotifDot).catch(function(){});
    if (!list.length){
      container.innerHTML = '<div class="empty-state"><b>No notifications yet</b>Likes, comments and follows will show up here.</div>';
      return;
    }
    container.innerHTML = list.map(function(n){
      var text = n.type === "like" ? "liked your post" : n.type === "comment" ? "commented on your post" : n.type === "follow" ? "started following you" : n.type;
      return '<div class="user-row" data-postid="' + escapeHtml(n.post_id||"") + '">' +
        '<div class="avatar-wrap">' + avatarHtml({avatarUrl:n.avatar_url, username:n.username, displayName:n.display_name}) + '</div>' +
        '<div class="user-row-info"><div class="uname">' + escapeHtml(n.display_name || n.username || "Someone") + '</div>' +
        '<div class="dname">' + escapeHtml(text) + ' · ' + timeAgo(n.created_at) + ' ago</div></div>' +
      '</div>';
    }).join("");
    container.querySelectorAll("[data-postid]").forEach(function(el){
      if (!el.dataset.postid) return;
      el.addEventListener("click", function(){
        apiFetch("/api/posts/" + el.dataset.postid).then(function(d){
          if (d.post) openSinglePostModal(d.post);
        }).catch(function(){});
      });
    });
  }).catch(function(err){
    container.innerHTML = errorStateHtml(err.message);
    wireRetry(container, function(){ renderNotifications(container); });
  });
}

/* ============================================================
   SETTINGS
   ============================================================ */
function loadSettingsQuiet(){
  apiFetch("/api/settings").then(function(data){
    state.settings = data.settings;
    applyTheme(data.settings.theme);
  }).catch(function(){});
}
function renderSettings(container){
  apiFetch("/api/settings").then(function(data){
    var s = data.settings;
    state.settings = s;
    container.innerHTML =
      '<div class="settings-section">' +
        '<h4>Appearance</h4>' +
        radioRow("theme","system","System",s.theme) +
        radioRow("theme","light","Light",s.theme) +
        radioRow("theme","dark","Dark",s.theme) +
      '</div>' +
      '<div class="settings-section">' +
        '<h4>Privacy</h4>' +
        radioRow("visibility","public","Public Profile",s.profile_visibility) +
        radioRow("visibility","private","Private Profile",s.profile_visibility) +
      '</div>' +
      '<div class="settings-section">' +
        '<h4>Messages</h4>' +
        radioRow("msgprivacy","everyone","Everyone can message me",s.message_privacy) +
        radioRow("msgprivacy","followers","Only followers",s.message_privacy) +
        radioRow("msgprivacy","nobody","Nobody",s.message_privacy) +
      '</div>' +
      '<div class="settings-section">' +
        '<button class="btn" id="save-settings-btn">Save Settings</button>' +
      '</div>' +
      '<div class="settings-section">' +
        '<h4>Account</h4>' +
        '<div class="settings-item" id="change-password-item">Change Password <span>›</span></div>' +
        '<div class="settings-item" id="logout-item" style="color:var(--danger);">Log Out <span>›</span></div>' +
      '</div>';
    document.getElementById("save-settings-btn").addEventListener("click", saveSettings);
    document.getElementById("change-password-item").addEventListener("click", openChangePasswordModal);
    document.getElementById("logout-item").addEventListener("click", doLogout);
  }).catch(function(err){
    container.innerHTML = errorStateHtml(err.message);
    wireRetry(container, function(){ renderSettings(container); });
  });
}
function radioRow(group, value, label, current){
  return '<label class="radio-row"><span>' + escapeHtml(label) + '</span><input type="radio" name="' + group + '" value="' + value + '" ' + (current===value?"checked":"") + '></label>';
}
function saveSettings(){
  var btn = document.getElementById("save-settings-btn");
  var theme = document.querySelector('input[name="theme"]:checked').value;
  var visibility = document.querySelector('input[name="visibility"]:checked').value;
  var msgprivacy = document.querySelector('input[name="msgprivacy"]:checked').value;
  setBtnLoading(btn, true, "Saving...");
  apiFetch("/api/settings", "PUT", { theme: theme, profileVisibility: visibility, messagePrivacy: msgprivacy, notificationSettings: {} })
    .then(function(){
      applyTheme(theme);
      toast("Settings saved.");
    })
    .catch(function(err){ toast(err.message || "Could not save settings.", true); })
    .finally(function(){ setBtnLoading(btn, false); });
}
function openChangePasswordModal(){
  openModal(
    '<div class="modal-header"><h3>Change Password</h3><button class="icon-btn" id="pw-close"><img src="/icons/IMG_1889.png"></button></div>' +
    '<div class="modal-body">' +
    '<div class="auth-error" id="pw-error"></div>' +
    '<div class="field"><label>Current Password</label><input type="password" id="pw-current"></div>' +
    '<div class="field"><label>New Password</label><input type="password" id="pw-new"></div>' +
    '<button class="btn" id="pw-submit"><span>Update Password</span></button>' +
    '</div>'
  );
  document.getElementById("pw-close").addEventListener("click", closeModal);
  document.getElementById("pw-submit").addEventListener("click", function(){
    var btn = this;
    var current = document.getElementById("pw-current").value;
    var next = document.getElementById("pw-new").value;
    var errEl = document.getElementById("pw-error");
    errEl.className = "auth-error";
    if (!current || next.length < 8){
      errEl.textContent = "Enter your current password and a new password of at least 8 characters.";
      errEl.className = "auth-error show";
      return;
    }
    setBtnLoading(btn, true, "Updating...");
    apiFetch("/api/settings/password", "POST", { currentPassword: current, newPassword: next })
      .then(function(){
        toast("Password updated. Please log in again.");
        closeModal();
        doLogout();
      })
      .catch(function(err){
        errEl.textContent = err.message || "Could not update password.";
        errEl.className = "auth-error show";
      })
      .finally(function(){ setBtnLoading(btn, false); });
  });
}
function doLogout(){
  apiFetch("/api/logout", "POST").then(function(){
    exitApp();
    toast("Logged out.");
  }).catch(function(err){
    exitApp();
  });
}

/* ============================================================
   BOOTSTRAP
   ============================================================ */
function boot(){
  applyTheme("system");
  apiFetch("/api/me").then(function(data){
    if (data.authenticated && data.user){
      state.user = data.user;
      enterApp();
    }
  }).catch(function(){});
}
boot();

})();
</script>
