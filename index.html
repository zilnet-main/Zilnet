<style>

.auth{min-height:100vh;display:grid;place-items:center;padding:22px}.authbox{width:min(420px,100%);text-align:center}.brand{font-size:38px;font-weight:950;letter-spacing:-2px}.tag{color:var(--muted);margin:8px 0 28px}.tabs{display:flex;border-bottom:1px solid var(--line);margin-bottom:18px}.tabs button{flex:1;border:0;background:none;color:var(--muted);padding:12px}.tabs .on{color:var(--text);font-weight:800;border-bottom:2px solid var(--text)}.field{width:100%;padding:14px;margin-bottom:10px;border:1px solid var(--line);background:var(--card);border-radius:12px;outline:0}.primary{width:100%;padding:14px;border:0;border-radius:12px;background:#fff;color:#000;font-weight:850}.secondary{padding:11px 14px;border:1px solid var(--line);background:var(--card);border-radius:11px;font-weight:800}.authnote{font-size:12px;color:var(--muted);margin-top:18px;line-height:1.5}.linkbtn{border:0;background:none;color:var(--text);font-weight:700;padding:12px 4px}
.app{min-height:100vh;padding-bottom:78px}.top{height:64px;position:sticky;top:0;z-index:20;background:rgba(11,11,12,.92);backdrop-filter:blur(18px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 16px}.logo{font-size:22px;font-weight:950;letter-spacing:-1px}.topbuttons{display:flex;gap:2px}.ib{width:42px;height:42px;border:0;background:none;display:grid;place-items:center}.ib img,.nav img,.action img{width:23px;height:23px;object-fit:contain;transition:transform .18s,filter .18s}.ib:active img,.nav:active img,.action:active img{transform:scale(.82)}.nav.active img{filter:brightness(0) invert(1)}body.light .nav.active img{filter:none}
.content{max-width:var(--max);margin:auto}.stories{padding:16px;border-bottom:1px solid var(--line)}.storyrow{display:flex;gap:17px;overflow:auto;scrollbar-width:none}.storyrow::-webkit-scrollbar{display:none}.story{min-width:66px;text-align:center;cursor:pointer}.ring{width:64px;height:64px;padding:3px;border-radius:50%;margin:auto;background:linear-gradient(135deg,#2277ff,#7a39ff,#c447ff);box-shadow:0 0 16px rgba(112,73,255,.18)}.ring .avatar{border:2px solid var(--bg)}.avatar{width:100%;height:100%;border-radius:50%;background:var(--card2);display:grid;place-items:center;overflow:hidden;font-weight:850}.avatar img{width:100%;height:100%;object-fit:cover}.storyname{font-size:11px;margin-top:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.post{border-bottom:1px solid var(--line)}.posthead{display:flex;align-items:center;gap:10px;padding:14px 15px}.postavatar{width:42px;height:42px;border-radius:50%;background:var(--card2);display:grid;place-items:center;overflow:hidden;flex:none;font-weight:850}.postavatar img{width:100%;height:100%;object-fit:cover}.author{flex:1;min-width:0}.author strong{display:block;font-size:14px}.author span{font-size:12px;color:var(--muted)}.postmedia{display:block;width:100%;max-height:760px;background:#000;object-fit:contain}.postimage{aspect-ratio:1/1;object-fit:cover}.posttext{padding:17px 16px;font-size:15px;line-height:1.5;white-space:pre-wrap}.actions{display:flex;align-items:center;padding:7px 10px}.action{width:44px;height:42px;border:0;background:none;display:grid;place-items:center}.action.liked img{filter:sepia(1) saturate(9) hue-rotate(315deg)}.action.save{margin-left:auto}.postinfo{padding:0 16px 17px}.likes{font-size:13px;font-weight:850;margin-bottom:6px}.caption{font-size:14px;line-height:1.45}.caption b{margin-right:5px}.meta{font-size:12px;color:var(--muted);margin-top:8px}.empty{text-align:center;color:var(--muted);padding:70px 25px}
.bottom{position:fixed;z-index:30;left:0;right:0;bottom:0;height:64px;background:rgba(11,11,12,.95);backdrop-filter:blur(18px);border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:center}.nav{width:54px;height:54px;border:0;background:none;display:grid;place-items:center}.nav img{width:24px;height:24px;filter:grayscale(1) opacity(.72)}.nav.active img{filter:brightness(0) invert(1)}
.panel{position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto}.panelhead{height:64px;position:sticky;top:0;z-index:2;background:rgba(11,11,12,.96);backdrop-filter:blur(16px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:0 14px}.panelhead h2{font-size:18px}.panelbody{width:min(var(--max),100%);margin:auto;padding:18px 16px 40px}.search{width:100%;padding:13px 15px;border:1px solid var(--line);background:var(--card);border-radius:12px;outline:0;margin-bottom:14px}.userrow,.chatrow{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line)}.userrow{cursor:pointer}.userrow .avatar,.chatavatar{width:48px;height:48px;flex:none}.userinfo,.chatinfo{flex:1;min-width:0}.userinfo span,.chatinfo span{display:block;color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.follow{border:1px solid var(--line);background:#fff;color:#000;border-radius:9px;padding:8px 12px;font-weight:850}.following{background:none;color:var(--text)}
.profiletop{padding:20px 0}.profileline{display:flex;gap:18px;align-items:center}.profileavatar{width:92px;height:92px;border-radius:50%;background:var(--card2);display:grid;place-items:center;overflow:hidden;font-size:28px;font-weight:900;flex:none}.profileavatar img{width:100%;height:100%;object-fit:cover}.profilemain{flex:1}.profilemain h2{font-size:21px}.profilemain p{color:var(--muted);font-size:13px;margin-top:4px;white-space:pre-wrap}.stats{display:flex;gap:20px;margin-top:13px;font-size:13px}.profilebuttons{display:flex;gap:8px;margin-top:18px}.profilebuttons button{flex:1;padding:10px;border:1px solid var(--line);background:var(--card);border-radius:9px;font-weight:800}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;margin:0 -16px}.griditem{aspect-ratio:1;background:var(--card);overflow:hidden;cursor:pointer}.griditem img,.griditem video{width:100%;height:100%;object-fit:cover}.setting{width:100%;padding:18px 3px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;display:flex;justify-content:space-between;align-items:center}.setting span{color:var(--muted)}.setting input{accent-color:#000}.sectionTitle{font-size:13px;color:var(--muted);font-weight:850;text-transform:uppercase;margin:22px 0 8px}
.modal{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.7);display:grid;place-items:end}.sheet{width:min(700px,100%);max-height:90vh;overflow:auto;background:var(--bg);border-radius:20px 20px 0 0;border:1px solid var(--line);padding:16px 16px 28px}.sheet h3{margin-bottom:15px}.option{width:100%;padding:18px;margin:6px 0;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:13px}.option b{display:block}.option span{color:var(--muted);font-size:12px}.comment{display:flex;gap:9px;margin:10px 0;font-size:13px;align-items:flex-start}.comment .avatar{width:34px;height:34px;flex:none}.commentform{display:flex;gap:8px;margin-top:12px}.commentform input{flex:1;min-width:0;padding:10px 13px;border:1px solid var(--line);background:var(--card);border-radius:20px;outline:0}.commentform button{border:0;background:#fff;color:#000;border-radius:20px;padding:0 15px;font-weight:850}
.chatview{position:fixed;inset:0;z-index:90;background:var(--bg);display:flex;flex-direction:column}.chathead{height:64px;display:flex;align-items:center;gap:10px;padding:0 12px;border-bottom:1px solid var(--line);flex:none}.chathead .chatavatar{width:42px;height:42px}.chathead .who{flex:1}.chathead .who strong{display:block}.chathead .who span{font-size:12px;color:var(--muted)}.messages{flex:1;overflow:auto;padding:14px}.bubbleWrap{display:flex;gap:7px;margin:6px 0;align-items:flex-end}.bubbleWrap.mine{justify-content:flex-end}.miniAvatar{width:26px;height:26px;flex:none}.bubble{max-width:78%;padding:9px 12px;border-radius:17px;font-size:14px;white-space:pre-wrap}.mineBubble{background:#fff;color:#000;border-bottom-right-radius:5px}.theirsBubble{background:var(--card2);border-bottom-left-radius:5px}.chatinput{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line);padding-bottom:max(10px,env(safe-area-inset-bottom))}.chatinput input{flex:1;padding:11px 14px;border:1px solid var(--line);background:var(--card);border-radius:22px;outline:0}.chatinput button{border:0;background:#fff;color:#000;border-radius:22px;padding:0 16px;font-weight:850}
.storyviewer{position:fixed;inset:0;z-index:100;background:#000;display:grid;place-items:center}.storyviewer img,.storyviewer video{max-width:100%;max-height:100%;object-fit:contain}.storycaption{position:absolute;bottom:25px;left:15px;right:15px;padding:12px;background:rgba(0,0,0,.5);border-radius:12px}.notif{display:flex;gap:12px;padding:13px 2px;border-bottom:1px solid var(--line);align-items:center}.notif.unread{background:rgba(255,255,255,.035)}.notifDot{width:9px;height:9px;border-radius:50%;background:#fff;margin-left:auto;flex:none}.light .notifDot{background:#111}.switch{width:48px;height:28px;border-radius:99px;background:var(--card2);position:relative;border:1px solid var(--line)}.switch i{position:absolute;width:22px;height:22px;border-radius:50%;background:#fff;left:2px;top:2px;transition:.2s}.switch.on{background:#111}.switch.on i{left:22px}.light .switch.on{background:#000}
@media(min-width:800px){.bottom{width:520px;left:50%;right:auto;transform:translateX(-50%);bottom:14px;border:1px solid var(--line);border-radius:20px}.app{padding-bottom:100px}}
</style></head>
<body>
<div id="toast"></div>
<section id="auth" class="auth"><div class="authbox"><div class="brand">ZILNET</div><div class="tag">Create. Connect. Discover.</div><div class="tabs"><button id="loginTab" class="on" onclick="authMode('login')">Log in</button><button id="signupTab" onclick="authMode('signup')">Create account</button></div>
<form id="loginForm"><input id="identity" class="field" placeholder="Username or email" required><input id="password" class="field" type="password" placeholder="Password" required><button class="primary">Log in</button><button type="button" class="linkbtn" onclick="forgotPassword()">Forgot password?</button></form>
<form id="signupForm" class="hidden"><input id="username" class="field" placeholder="Username" required><input id="email" class="field" type="email" placeholder="Email" required><input id="newPassword" class="field" type="password" placeholder="Password" minlength="8" required><button class="primary">Create account</button></form>
<div class="authnote">Log in to the community where you can find opportunities!</div></div></section>
<div id="app" class="app hidden"><header class="top"><div class="logo">ZILNET</div><div class="topbuttons"><button class="ib" onclick="createMenu()"><img src="icons/IMG_1899.png" alt="Create"></button><button class="ib" onclick="notifications()"><img src="icons/IMG_1895.png" alt="Notifications"><i id="topDot" class="notifDot hidden" style="position:absolute;margin:0 0 24px 24px"></i></button></div></header><main id="home" class="content"></main><nav class="bottom"><button id="homeNav" class="nav active" onclick="home()"><img src="icons/IMG_1881.png" alt="Home"></button><button id="searchNav" class="nav" onclick="searchPanel()"><img src="icons/IMG_1882.png" alt="Search"></button><button class="nav" onclick="createMenu()"><img src="icons/IMG_1899.png" alt="Create"></button><button id="chatNav" class="nav" onclick="chats()"><img src="icons/IMG_1883.png" alt="Messages"></button><button id="profileNav" class="nav" onclick="myProfile()"><img src="icons/IMG_1885.png" alt="Profile"></button></nav></div>
<div id="panel"></div><div id="modal"></div><div class="hidden"><input id="storyPicker" type="file" accept="image/*,video/*"><input id="reelPicker" type="file" accept="video/*"><input id="avatarPicker" type="file" accept="image/*"></div>
<script>
const API='/api';let me=null,feed=[],chatId=null,poll=null,settingsCache=null;const $=id=>document.getElementById(id);const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));const initial=u=>(u?.display_name||u?.username||'?').slice(0,1).toUpperCase();
function avatar(u,c='avatar'){u=u||{};return u.avatar_url?`<div class="${c}"><img src="${esc(u.avatar_url)}"></div>`:`<div class="${c}">${esc(initial(u))}</div>`}function toast(x){let t=$('toast');t.textContent=x;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),2300)}
async function api(path,opt={}){let o={credentials:'include',...opt};if(o.body&&typeof o.body==='object'&&!(o.body instanceof FormData)&&!(o.body instanceof Blob)){o.headers={'Content-Type':'application/json',...(o.headers||{})};o.body=JSON.stringify(o.body)}let r=await fetch(API+path,o),d=null;try{d=await r.json()}catch{}if(!r.ok)throw Error(d?.error||d?.message||`Request failed (${r.status})`);return d}
function authMode(m){$('loginForm').classList.toggle('hidden',m!=='login');$('signupForm').classList.toggle('hidden',m!=='signup');$('loginTab').classList.toggle('on',m==='login');$('signupTab').classList.toggle('on',m==='signup')}
$('loginForm').onsubmit=async e=>{e.preventDefault();try{await api('/login',{method:'POST',body:{username:$('identity').value.trim(),password:$('password').value}});await boot()}catch(x){toast(x.message)}};$('signupForm').onsubmit=async e=>{e.preventDefault();try{await api('/signup',{method:'POST',body:{username:$('username').value.trim(),email:$('email').value.trim(),password:$('newPassword').value}});await boot()}catch(x){toast(x.message)}};
async function boot(){applyLocalTheme();try{let r=await api('/me');me=r.user;showApp()}catch{$('auth').classList.remove('hidden');$('app').classList.add('hidden')}}async function logout(){try{await api('/logout',{method:'POST'})}catch{}me=null;$('app').classList.add('hidden');$('auth').classList.remove('hidden')}
function showApp(){$('auth').classList.add('hidden');$('app').classList.remove('hidden');home();loadNotifDot()}
function nav(id){document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));if(id)$(id+'Nav')?.classList.add('active')}function closeUI(){clearInterval(poll);chatId=null;$('panel').innerHTML='';$('modal').innerHTML=''}function closeModal(){$('modal').innerHTML=''}
function mediaURL(x){return x||''}function postHTML(p){let u=p.user||p.author||p,m=p.media_url||'',type=p.media_type||'',video=type.startsWith('video')||/\.(mp4|webm|mov|m4v)(\?|$)/i.test(m),media=m?(video?`<video class="postmedia" src="${esc(mediaURL(m))}" controls playsinline preload="metadata"></video>`:`<img class="postmedia postimage" src="${esc(mediaURL(m))}" loading="lazy">`):'';return `<article class="post" id="post-${p.id}"><div class="posthead" onclick="openProfile('${encodeURIComponent(u.username||p.username||'')}')">${avatar(u,'postavatar')}<div class="author"><strong>${esc(u.display_name||u.username||'User')}</strong><span>@${esc(u.username||p.username||'')}</span></div><button class="ib" onclick="event.stopPropagation();postMenu(${p.id},${p.user_id||u.id})"><img src="icons/IMG_1888.png" alt="More"></button></div>${media}${p.content?`<div class="posttext">${esc(p.content)}</div>`:''}<div class="actions"><button class="action ${p.liked?'liked':''}" onclick="like(${p.id},this)"><img src="icons/IMG_1886.png"></button><button class="action" onclick="comments(${p.id})"><img src="icons/IMG_1897.png"></button><button class="action" onclick="share(${p.id})"><img src="icons/IMG_1884.png"></button><button class="action save ${p.saved?'liked':''}" onclick="save(${p.id},this)"><img src="icons/IMG_1892.png"></button></div><div class="postinfo"><div class="likes">${Number(p.likes_count??p.likes??0)} likes</div><div class="caption"><b>@${esc(u.username||p.username||'user')}</b> ${esc(p.content||'')}</div><div class="meta">${esc(p.created_at||'')}</div></div></article>`}
async function home(){nav('home');closeUI();$('home').innerHTML='<div class="empty">Loading…</div>';try{let r=await api('/feed');feed=r.posts||[];renderStories(r.stories||[]);$('home').insertAdjacentHTML('beforeend',feed.length?feed.map(postHTML).join(''):'<div class="empty"><h3>Your feed is empty</h3><p>Follow people or create the first post.</p></div>')}catch(x){$('home').innerHTML=`<div class="empty">${esc(x.message)}</div>`}}
function renderStories(s){let groups={};s.forEach(x=>{let u=x.user||x;let k=u.username||x.username;(groups[k]??=[]).push({...x,user:u})});let html=`<section class="stories"><div style="font-size:12px;font-weight:850;color:var(--muted);margin-bottom:13px">STORIES</div><div class="storyrow"><div class="story" onclick="pick('story')"><div class="ring"><div class="avatar">＋</div></div><div class="storyname">Your story</div></div>`;for(const a of Object.values(groups)){let u=a[0].user||a[0];html+=`<div class="story" onclick='viewStory(${JSON.stringify(a).replace(/'/g,'&#39;')})'><div class="ring">${avatar(u)}</div><div class="storyname">${esc(u.username)}</div></div>`}html+='</div></section>';$('home').insertAdjacentHTML('afterbegin',html)}
function viewStory(a){let s=a[0],m=s.media_url||'',v=(s.media_type||'').startsWith('video'),x=v?`<video src="${esc(m)}" autoplay controls playsinline></video>`:`<img src="${esc(m)}">`;$('modal').innerHTML=`<div class="storyviewer" onclick="closeModal()">${x}<div class="storycaption"><b>@${esc(s.user?.username||s.username)}</b><br>${esc(s.content||'')}</div></div>`}
async function like(id,b){try{let r=await api(`/posts/${id}/like`,{method:'POST'});b.classList.toggle('liked',!!r.liked);b.closest('.post').querySelector('.likes').textContent=`${r.likes_count} likes`}catch(x){toast(x.message)}}async function save(id,b){try{let r=await api(`/posts/${id}/save`,{method:'POST'});b.classList.toggle('liked',!!r.saved);toast(r.saved?'Saved':'Removed')}catch(x){toast(x.message)}}async function share(id){let u=new URL(location.href);u.hash='post-'+id;try{if(navigator.share)await navigator.share({title:'ZILNET post',url:u.href});else{await navigator.clipboard.writeText(u.href);toast('Link copied')}}catch{}}
async function comments(id){try{let r=await api(`/posts/${id}/comments`),cs=r.comments||[];$('modal').innerHTML=`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="sheet"><h3>Comments</h3><div id="commentList">${cs.map(c=>`<div class="comment">${avatar(c,'avatar')}<div><b>@${esc(c.username||c.user?.username||'user')}</b> ${esc(c.content)}</div></div>`).join('')}</div><form class="commentform" onsubmit="sendComment(event,${id})"><input id="commentInput" placeholder="Write a comment…" required><button>Send</button></form></div></div>`;$('commentInput').focus()}catch(x){toast(x.message)}}async function sendComment(e,id){e.preventDefault();let i=$('commentInput');try{let r=await api(`/posts/${id}/comments`,{method:'POST',body:{content:i.value.trim()}}),c=r.comment;$('commentList').insertAdjacentHTML('beforeend',`<div class="comment">${avatar(me,'avatar')}<div><b>@${esc(me.username)}</b> ${esc(c.content||i.value)}</div></div>`);i.value=''}catch(x){toast(x.message)}}
function createMenu(){$('modal').innerHTML=`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="sheet"><h3>Create</h3><button class="option" onclick="newPost()"><b>Create post</b><span>Photo, video or text</span></button><button class="option" onclick="pick('story')"><b>Create story</b><span>Photo or video</span></button><button class="option" onclick="pick('reel')"><b>Create reel</b><span>Video</span></button></div></div>`}function newPost(){$('modal').innerHTML=`<div class="modal"><div class="sheet"><h3>New post</h3><textarea id="postText" class="field" placeholder="Write something…"></textarea><input id="postFile" class="field" type="file" accept="image/*,video/*"><button class="primary" onclick="sendPost()">Post</button></div></div>`}
async function upload(f){let fd=new FormData();fd.append('file',f,f.name);let r=await api('/upload',{method:'POST',body:fd});return r.url||r.media_url||r.key}async function sendPost(){try{let f=$('postFile').files[0],m=f?await upload(f):'';await api('/posts',{method:'POST',body:{content:$('postText').value.trim(),media_url:m,media_type:f?.type||''}});closeModal();toast('Posted');home()}catch(x){toast(x.message)}}function pick(k){closeModal();let i=$(k==='story'?'storyPicker':'reelPicker');i.value='';i.onchange=()=>k==='story'?sendStory(i.files[0]):sendReel(i.files[0]);i.click()}async function sendStory(f){if(!f)return;try{let m=await upload(f);await api('/stories',{method:'POST',body:{content:'',media_url:m,media_type:f.type}});toast('Story added');home()}catch(x){toast(x.message)}}async function sendReel(f){if(!f)return;try{let m=await upload(f);await api('/reels',{method:'POST',body:{caption:'',media_url:m}});toast('Reel added');reels()}catch(x){toast(x.message)}}
function searchPanel(){nav('search');openPanel('Search',`<input id="q" class="search" placeholder="Search people, skills or work"><div id="results"></div>`);$('q').oninput=()=>doSearch();$('q').focus()}let st;async function doSearch(){clearTimeout(st);st=setTimeout(async()=>{let q=$('q').value.trim();try{let r=await api('/search?q='+encodeURIComponent(q));let us=r.users||[];$('results').innerHTML=us.map(u=>`<div class="userrow" onclick="openProfile('${encodeURIComponent(u.username)}')">${avatar(u)}<div class="userinfo"><strong>${esc(u.display_name||u.username)}</strong><span>@${esc(u.username)} ${u.skills?'· '+esc(u.skills):''}</span></div>${Number(u.id)!==Number(me.id)?`<button class="follow ${u.following?'following':''}" onclick="event.stopPropagation();follow(${u.id},this)">${u.following?'Following':'Follow'}</button>`:''}</div>`).join('')||'<div class="empty">No results.</div>'}catch(x){toast(x.message)}},220)}
async function follow(id,b){try{let r=await api(`/users/${id}/follow`,{method:'POST'});b.textContent=r.following?'Following':'Follow';b.classList.toggle('following',!!r.following)}catch(x){toast(x.message)}}
async function myProfile(){nav('profile');openProfile(encodeURIComponent(me.username),true)}async function openProfile(un,own=false){try{let r=await api('/profile/'+decodeURIComponent(un)),u=r.user,ps=r.posts||[];openPanel(u.username||'Profile',profileHTML(u,ps,own||u.username===me.username,r.private))}catch(x){toast(x.message)}}
function profileHTML(u,ps,own,privateProfile){return `<div class="profiletop"><div class="profileline">${avatar(u,'profileavatar')}<div class="profilemain"><h2>${esc(u.display_name||u.username)}</h2><p>@${esc(u.username)}${u.bio?'\n'+esc(u.bio):''}</p><div class="stats"><span><b>${ps.length}</b> posts</span><span><b>${Number(u.followers_count||0)}</b> followers</span><span><b>${Number(u.following_count||0)}</b> following</span></div></div></div><div class="profilebuttons">${own?`<button onclick="editProfile()">Edit profile</button><button onclick="settings()">Settings</button>`:`<button onclick="follow(${u.id},this)" class="${u.following?'following':''}">${u.following?'Following':'Follow'}</button><button onclick="startChat(${u.id})">Message</button>`}</div></div>${privateProfile?'<div class="empty">This account is private.</div>':`<div class="grid">${ps.map(p=>{let m=p.media_url||'';return `<div class="griditem" onclick="single(${p.id})">${m?((p.media_type||'').startsWith('video')?`<video src="${esc(m)}" muted></video>`:`<img src="${esc(m)}">`):`<div style="padding:10px;font-size:12px">${esc(p.content||'')}</div>`}</div>`}).join('')}</div>`}`}
async function single(id){try{let r=await api('/posts/'+id),p=r.post||r;openPanel('Post',postHTML(p))}catch(x){toast(x.message)}}function postMenu(id,owner){if(Number(owner)===Number(me.id)&&confirm('Delete this post?'))api(`/posts/${id}`,{method:'DELETE'}).then(home).catch(x=>toast(x.message))}
function editProfile(){closeModal();$('modal').innerHTML=`<div class="modal"><div class="sheet"><h3>Edit profile</h3><input id="ename" class="field" placeholder="Display name" value="${esc(me.display_name||'')}"><textarea id="ebio" class="field" placeholder="Bio">${esc(me.bio||'')}</textarea><input id="eskills" class="field" placeholder="Skills" value="${esc(me.skills||'')}"><input id="eavatar" class="field" placeholder="Profile image URL (optional)" value="${esc(me.avatar_url||'')}"><button class="primary" onclick="saveProfile()">Save</button></div></div>`}async function saveProfile(){try{let r=await api('/profile/update',{method:'POST',body:{display_name:$('ename').value,bio:$('ebio').value,skills:$('eskills').value,avatar_url:$('eavatar').value}});me=r.user;closeModal();toast('Profile updated');myProfile()}catch(x){toast(x.message)}}
async function chats(){nav('chat');openPanel('Chats',`<input id="chatq" class="search" placeholder="Search chats"><div id="chatList">Loading…</div><button class="primary" onclick="newChat()" style="margin-top:14px">New chat</button>`);try{let r=await api('/chats'),cs=r.chats||[];$('chatList').innerHTML=cs.map(c=>`<div class="chatrow" onclick="chat(${c.id})">${avatar(c,'chatavatar')}<div class="chatinfo"><strong>${esc(c.name||'Chat')}</strong><span>${esc(c.last_message||'No messages yet')}</span></div></div>`).join('')||'<div class="empty">No chats yet.</div>'}catch(x){toast(x.message)}}
async function newChat(){openPanel('New chat',`<input id="newq" class="search" placeholder="Search a person"><div id="newr"></div>`);$('newq').oninput=async()=>{let q=$('newq').value.trim();if(!q)return;try{let r=await api('/search?q='+encodeURIComponent(q));$('newr').innerHTML=(r.users||[]).filter(x=>Number(x.id)!==Number(me.id)).map(u=>`<div class="userrow" onclick="startChat(${u.id})">${avatar(u)}<div class="userinfo"><strong>${esc(u.display_name||u.username)}</strong><span>@${esc(u.username)}</span></div></div>`).join('')}catch{}}}
async function startChat(id){try{let r=await api('/chats',{method:'POST',body:{user_id:Number(id)}});chat(r.chat?.id||r.id)}catch(x){toast(x.message)}}async function chat(id){chatId=id;try{let info=await api(`/chats/${id}`),r=await api(`/chats/${id}/messages`),c=info.chat,ms=r.messages||[];$('modal').innerHTML=`<div class="chatview"><div class="chathead"><button class="ib" onclick="closeModal()"><img src="icons/IMG_1890.png"></button>${avatar(c.user||c,'chatavatar')}<div class="who"><strong>${esc(c.name||'Chat')}</strong><span>${c.username?'@'+esc(c.username):c.type==='group'?'Group chat':''}</span></div><button class="ib" onclick="openProfile('${encodeURIComponent(c.username||'')}')"><img src="icons/IMG_1885.png"></button></div><div id="messages" class="messages">${ms.map(msg).join('')}</div><form class="chatinput" onsubmit="sendMsg(event)"><input id="msg" placeholder="Message…"><button>Send</button></form></div>`;$('messages').scrollTop=$('messages').scrollHeight;clearInterval(poll);poll=setInterval(refreshChat,3000)}catch(x){toast(x.message)}}function msg(m){let mine=Number(m.user_id)===Number(me.id);return `<div class="bubbleWrap ${mine?'mine':''}">${mine?'':avatar(m,'miniAvatar')}<div class="bubble ${mine?'mineBubble':'theirsBubble'}">${esc(m.content||'')}</div></div>`}async function refreshChat(){if(!chatId||!$('messages'))return;try{let r=await api(`/chats/${chatId}/messages`);$('messages').innerHTML=(r.messages||[]).map(msg).join('');$('messages').scrollTop=$('messages').scrollHeight;loadNotifDot()}catch{}}async function sendMsg(e){e.preventDefault();let i=$('msg'),t=i.value.trim();if(!t)return;try{await api(`/chats/${chatId}/messages`,{method:'POST',body:{content:t}});i.value='';refreshChat()}catch(x){toast(x.message)}}
async function reels(){openPanel('Reels','<div id="reels">Loading…</div>');try{let r=await api('/reels/feed'),rs=r.reels||[];$('reels').innerHTML=rs.map(x=>`<article class="post"><div class="posthead">${avatar(x,'postavatar')}<div class="author"><strong>${esc(x.display_name||x.username)}</strong><span>@${esc(x.username)}</span></div></div><video class="postmedia" src="${esc(x.media_url)}" controls playsinline loop></video><div class="postinfo"><div class="caption"><b>@${esc(x.username)}</b> ${esc(x.caption||'')}</div></div></article>`).join('')||'<div class="empty">No reels yet.</div>'}catch(x){toast(x.message)}}
async function notifications(){openPanel('Notifications','<div id="notes">Loading…</div>');try{let r=await api('/notifications'),ns=r.notifications||[];$('notes').innerHTML=ns.map(n=>{let text=n.type==='follow'?'started following you':n.type==='like'?'liked your post':n.type==='comment'?'commented on your post':n.type==='message'?'sent you a message':'sent a notification';return `<div class="notif ${n.read?'':'unread'}" onclick="${n.actor?.username?`openProfile('${encodeURIComponent(n.actor.username)}')`:''}">${avatar(n.actor,'avatar')}<div><b>${esc(n.actor?.display_name||n.actor?.username||'Someone')}</b> ${text}<div class="meta">${esc(n.created_at||'')}</div></div>${n.read?'':'<i class="notifDot"></i>'}</div>`}).join('')||'<div class="empty">No notifications.</div>';api('/notifications/read',{method:'POST'});$('topDot').classList.add('hidden')}catch(x){toast(x.message)}}async function loadNotifDot(){try{let r=await api('/notifications'),has=(r.notifications||[]).some(n=>!n.read);$('topDot').classList.toggle('hidden',!has)}catch{}}
async function settings(){try{let r=await api('/settings');settingsCache=r.settings;renderSettings()}catch(x){toast(x.message)}}function renderSettings(){let s=settingsCache||{};$('modal').innerHTML=`<div class="modal"><div class="sheet"><h3>Settings</h3><div class="sectionTitle">Appearance</div><div class="setting"><span>Theme</span><select id="themeSel"><option value="system">System</option><option value="dark">Dark</option><option value="light">Light</option></select></div><div class="setting"><span>Performance mode<br><small style="color:var(--muted)">Reduce animations and heavy effects</small></span><button id="perf" class="switch ${localStorage.getItem('zilnet-performance')==='on'?'on':''}" onclick="togglePerformance()"><i></i></button></div><div class="sectionTitle">Privacy</div><div class="setting"><span>Private account</span><button id="priv" class="switch ${s.profile_visibility==='private'?'on':''}" onclick="togglePrivacy()"><i></i></button></div><div class="setting"><span>Who can message you</span><select id="msgPrivacy"><option value="everyone">Everyone</option><option value="followers">Followers only</option><option value="nobody">No one</option></select></div><div class="sectionTitle">Notifications</div>${['likes','comments','follows','messages'].map(k=>`<div class="setting"><span>${k[0].toUpperCase()+k.slice(1)}</span><input id="n-${k}" type="checkbox" ${s.notification_settings?.[k]!==false?'checked':''} onchange="saveSettings()"></div>`).join('')}<div class="sectionTitle">Account</div><button class="setting" onclick="editProfile()"><span>Edit profile</span><span>›</span></button><button class="setting" onclick="changePassword()"><span>Change password</span><span>›</span></button><button class="setting" onclick="logout()"><span>Log out</span><span>›</span></button></div></div>`;$('themeSel').value=s.theme||'system';$('msgPrivacy').value=s.message_privacy||'everyone';$('themeSel').onchange=saveSettings;$('msgPrivacy').onchange=saveSettings}
function togglePerformance(){let on=localStorage.getItem('zilnet-performance')==='on';localStorage.setItem('zilnet-performance',on?'off':'on');document.body.classList.toggle('performance',!on);$('perf').classList.toggle('on',!on);toast(!on?'Performance mode enabled':'Performance mode disabled')}function applyLocalTheme(){let t=localStorage.getItem('zilnet-theme')||'system';document.body.classList.toggle('light',t==='light');document.body.classList.toggle('performance',localStorage.getItem('zilnet-performance')==='on')}async function saveSettings(){try{let s=settingsCache||{},payload={theme:$('themeSel')?.value||s.theme,profile_visibility:$('priv')?.classList.contains('on')?'private':'public',message_privacy:$('msgPrivacy')?.value||s.message_privacy,notification_settings:{likes:$('n-likes')?.checked!==false,comments:$('n-comments')?.checked!==false,follows:$('n-follows')?.checked!==false,messages:$('n-messages')?.checked!==false}};let r=await api('/settings',{method:'PATCH',body:payload});settingsCache=r.settings;localStorage.setItem('zilnet-theme',payload.theme);applyLocalTheme();toast('Settings saved')}catch(x){toast(x.message)}}function togglePrivacy(){let b=$('priv');b.classList.toggle('on');saveSettings()}
function changePassword(){closeModal();$('modal').innerHTML=`<div class="modal"><div class="sheet"><h3>Change password</h3><input id="cp1" class="field" type="password" placeholder="Current password"><input id="cp2" class="field" type="password" placeholder="New password" minlength="8"><button class="primary" onclick="savePassword()">Save password</button></div></div>`}async function savePassword(){try{await api('/profile/password',{method:'POST',body:{current_password:$('cp1').value,new_password:$('cp2').value}});closeModal();toast('Password updated')}catch(x){toast(x.message)}}
async function forgotPassword(){let email=prompt('Enter the email connected to your ZILNET account');if(!email)return;try{let r=await api('/forgot-password',{method:'POST',body:{email}});let id=r.reset_id||prompt('Enter reset ID from the recovery flow');if(!id){toast(r.message);return}let code=prompt('Enter the 6-digit code sent to your email');if(!code)return;let pw=prompt('Enter your new password (8+ characters)');if(!pw)return;await api('/reset-password',{method:'POST',body:{reset_id:id,code,new_password:pw}});toast('Password changed. You are logged in.');await boot()}catch(x){toast(x.message)}}
window.onhashchange=()=>{let m=location.hash.match(/^#post-(\d+)$/);if(m&&me)single(Number(m[1]))};boot();
</script></body></html>
