<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="theme-color" content="#0b0b12">

<title>Zilnet — Connect. Create. Discover.</title>

<style>

:root{
  --bg:#08090d;
  --panel:#11131a;
  --panel2:#171923;
  --text:#f5f7fb;
  --muted:#9298a8;
  --line:#252937;
  --accent:#9b5cff;
  --accent2:#ff3d91;
  --good:#48e39a;
  --danger:#ff5d6c;
  --shadow:0 20px 60px #0008;
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  min-height:100%;
  font-family:
    Inter,
    ui-sans-serif,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
  background:
    radial-gradient(
      circle at 20% 0%,
      #28104c 0,
      #08090d 35%
    ),
    var(--bg);
  color:var(--text);
}

button,
input,
textarea,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

a{
  color:inherit;
  text-decoration:none;
}

.hidden{
  display:none!important;
}

.app{
  min-height:100vh;
}


/* =========================
   AUTH
========================= */

.auth{
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:24px;
}

.auth-card{
  width:min(460px,100%);
  background:#10121aeF;
  border:1px solid var(--line);
  border-radius:28px;
  padding:32px;
  box-shadow:var(--shadow);
  backdrop-filter:blur(20px);
}

.brand{
  font-weight:900;
  font-size:34px;
  letter-spacing:-1.5px;
}

.brand span{
  background:
    linear-gradient(
      90deg,
      var(--accent),
      var(--accent2)
    );
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}

.sub{
  color:var(--muted);
  margin:8px 0 26px;
}

.tabs{
  display:flex;
  gap:8px;
  background:#090a0f;
  padding:5px;
  border-radius:14px;
  margin-bottom:18px;
}

.tabs button{
  flex:1;
  border:0;
  background:transparent;
  color:var(--muted);
  padding:11px;
  border-radius:10px;
}

.tabs button.active{
  background:var(--panel2);
  color:var(--text);
}

.field{
  margin:12px 0;
}

.field label{
  display:block;
  color:var(--muted);
  font-size:13px;
  margin-bottom:7px;
}

.field input,
.field textarea,
.field select{
  width:100%;
  background:#0a0c12;
  color:var(--text);
  border:1px solid var(--line);
  border-radius:13px;
  padding:13px;
  outline:none;
}

.field input:focus,
.field textarea:focus{
  border-color:var(--accent);
}

.primary,
.secondary,
.danger{
  border:0;
  border-radius:13px;
  padding:12px 16px;
  font-weight:800;
}

.primary{
  background:
    linear-gradient(
      90deg,
      var(--accent),
      var(--accent2)
    );
  color:white;
}

.secondary{
  background:var(--panel2);
  color:var(--text);
  border:1px solid var(--line);
}

.danger{
  background:#35131a;
  color:#ff9ba5;
  border:1px solid #63222d;
}

.linkbtn{
  display:block;
  width:100%;
  margin-top:10px;
  background:transparent;
  border:0;
  color:var(--muted);
  padding:9px;
  font-size:13px;
}

.linkbtn:hover{
  color:var(--text);
}

.full{
  width:100%;
}

.tiny{
  font-size:12px;
  color:var(--muted);
}

.error{
  color:#ff8792;
  font-size:13px;
  margin:10px 0;
}

.ok{
  color:var(--good);
  font-size:13px;
  margin:10px 0;
}


/* =========================
   MAIN LAYOUT
========================= */

.shell{
  display:grid;
  grid-template-columns:
    250px
    minmax(0,680px)
    300px;
  gap:22px;
  max-width:1320px;
  margin:auto;
  padding:18px;
}

.sidebar,
.rightbar{
  position:sticky;
  top:18px;
  height:calc(100vh - 36px);
}

.sidebar{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.logo{
  padding:12px 14px 24px;
}

.navbtn{
  display:flex;
  align-items:center;
  gap:13px;
  width:100%;
  background:transparent;
  border:0;
  color:var(--muted);
  padding:13px 15px;
  border-radius:14px;
  text-align:left;
}

.navbtn:hover,
.navbtn.active{
  background:var(--panel);
  color:var(--text);
}

.navbtn svg{
  width:20px;
}

.spacer{
  flex:1;
}


/* =========================
   TOP BAR
========================= */

.topbar{
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px 2px 18px;
}

.mobile-brand{
  display:none;
  font-weight:900;
  font-size:22px;
}

.search{
  flex:1;
  position:relative;
}

.search input{
  width:100%;
  background:var(--panel);
  border:1px solid var(--line);
  color:var(--text);
  border-radius:15px;
  padding:12px 15px;
}

.iconbtn{
  width:42px;
  height:42px;
  border-radius:13px;
  border:1px solid var(--line);
  background:var(--panel);
  color:var(--text);
}


/* =========================
   SECTION
========================= */

.section-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin:10px 2px 12px;
}

.section-title h2{
  font-size:18px;
  margin:0;
}


/* =========================
   STORIES
========================= */

.stories{
  display:flex;
  gap:13px;
  overflow:auto;
  padding:4px 2px 18px;
}

.story{
  min-width:74px;
  text-align:center;
}

.avatar{
  width:58px;
  height:58px;
  border-radius:50%;
  object-fit:cover;
  border:2px solid var(--accent);
  background:#202331;
}

.story .avatar{
  margin:auto;
}

.story-name{
  font-size:11px;
  color:var(--muted);
  margin-top:6px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}


/* =========================
   CARDS
========================= */

.card{
  background:
    linear-gradient(
      180deg,
      #12141d,
      #0f1118
    );
  border:1px solid var(--line);
  border-radius:22px;
  box-shadow:0 12px 40px #0003;
}


/* =========================
   POSTS
========================= */

.post{
  margin:12px 0;
  padding:16px;
}

.post-head{
  display:flex;
  align-items:center;
  gap:10px;
}

.post-head .avatar{
  width:44px;
  height:44px;
  border:0;
}

.post-meta{
  flex:1;
}

.post-meta strong{
  display:block;
}

.post-meta span{
  font-size:12px;
  color:var(--muted);
}

.more{
  background:transparent;
  border:0;
  color:var(--muted);
  font-size:22px;
}

.post-text{
  line-height:1.55;
  white-space:pre-wrap;
  margin:15px 0;
}

.media{
  width:100%;
  max-height:720px;
  object-fit:cover;
  border-radius:16px;
  background:#07080b;
}

.actions{
  display:flex;
  gap:8px;
  margin-top:12px;
}

.actions button{
  border:0;
  background:transparent;
  color:var(--muted);
  padding:8px 10px;
  border-radius:10px;
}

.actions button:hover{
  background:var(--panel2);
  color:var(--text);
}

.actions .liked{
  color:#ff3d78;
}

.likes{
  font-size:13px;
  color:var(--muted);
  margin-top:4px;
}


/* =========================
   COMMENTS
========================= */

.comment-row{
  display:flex;
  gap:8px;
  margin-top:12px;
}

.comment-row input{
  flex:1;
  background:#0a0c12;
  border:1px solid var(--line);
  border-radius:12px;
  color:white;
  padding:10px;
}

.comment{
  padding:9px 0;
  border-top:1px solid var(--line);
  font-size:13px;
}

.comment b{
  margin-right:5px;
}


/* =========================
   COMPOSER
========================= */

.compose{
  padding:16px;
  margin-bottom:14px;
}

.compose textarea{
  resize:none;
  min-height:72px;
}

.compose-foot{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:10px;
}


/* =========================
   PROFILE
========================= */

.profile-card{
  padding:20px;
}

.profile-cover{
  height:120px;
  border-radius:16px;
  background:
    linear-gradient(
      120deg,
      #6f35d8,
      #e53e86,
      #ffb55b
    );
}

.profile-row{
  display:flex;
  gap:15px;
  align-items:end;
  margin-top:-32px;
  padding:0 12px;
}

.profile-row .avatar{
  width:88px;
  height:88px;
  border:4px solid var(--panel);
}

.profile-actions{
  margin-left:auto;
}

.bio{
  color:var(--muted);
  line-height:1.5;
}


/* =========================
   MEDIA GRID
========================= */

.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:4px;
}

.grid img,
.grid video{
  width:100%;
  aspect-ratio:1;
  object-fit:cover;
  border-radius:7px;
  background:#111;
}


/* =========================
   RIGHT SIDEBAR
========================= */

.rightcard{
  padding:16px;
  margin-bottom:14px;
}

.userrow{
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px 0;
}

.userrow .avatar{
  width:42px;
  height:42px;
}

.userrow > div:nth-child(2){
  flex:1;
}

.follow{
  padding:8px 11px;
  border-radius:10px;
  border:1px solid var(--line);
  background:var(--text);
  color:#111;
  font-weight:800;
}

.follow.following{
  background:var(--panel2);
  color:var(--text);
}


/* =========================
   MODAL
========================= */

.modal{
  position:fixed;
  inset:0;
  background:#0009;
  display:grid;
  place-items:center;
  padding:18px;
  z-index:50;
}

.modal-card{
  width:min(600px,100%);
  max-height:90vh;
  overflow:auto;
  background:#11131a;
  border:1px solid var(--line);
  border-radius:22px;
  padding:20px;
  box-shadow:var(--shadow);
}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.modal-head h3{
  margin:0;
}

.row{
  display:flex;
  gap:10px;
}

.row > *{
  flex:1;
}

.file{
  padding:12px;
  border:1px dashed #44495b;
  border-radius:14px;
  color:var(--muted);
}

.results{
  margin-top:10px;
}

.result{
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px;
  border-radius:12px;
}

.result:hover{
  background:var(--panel2);
}


/* =========================
   TOAST
========================= */

.toast{
  position:fixed;
  bottom:24px;
  left:50%;
  transform:translateX(-50%);
  background:#171923;
  color:#fff;
  border:1px solid var(--line);
  padding:12px 16px;
  border-radius:13px;
  z-index:100;
  box-shadow:var(--shadow);
}


/* =========================
   TABLET
========================= */

@media(max-width:1050px){

  .shell{
    grid-template-columns:
      76px
      minmax(0,680px);
    justify-content:center;
  }

  .rightbar{
    display:none;
  }

  .sidebar{
    align-items:center;
  }

  .sidebar .label,
  .sidebar .logo .brand-text{
    display:none;
  }

  .logo{
    padding:12px;
  }

  .navbtn{
    justify-content:center;
  }

  .navbtn svg{
    width:22px;
  }

}


/* =========================
   MOBILE
========================= */

@media(max-width:700px){

  .shell{
    display:block;
    padding:8px 10px 76px;
  }

  .sidebar{
    display:none;
  }

  .mobile-brand{
    display:block;
  }

  .topbar{
    position:sticky;
    top:0;
    z-index:20;
    background:#08090df2;
    backdrop-filter:blur(16px);
    padding:8px 0 10px;
  }

  .bottom{
    display:flex;
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    height:62px;
    background:#0b0c12f2;
    border-top:1px solid var(--line);
    z-index:30;
    backdrop-filter:blur(18px);
  }

  .bottom button{
    flex:1;
    border:0;
    background:transparent;
    color:var(--muted);
  }

  .bottom button.active{
    color:var(--text);
  }

  .auth-card{
    padding:24px;
  }

  .grid{
    gap:2px;
  }

  .post{
    border-radius:18px;
    padding:12px;
  }

  .story{
    min-width:68px;
  }

}


/* =========================
   LIGHT THEME
========================= */

.light{
  --bg:#f5f6fa;
  --panel:#fff;
  --panel2:#f0f1f5;
  --text:#151821;
  --muted:#687080;
  --line:#dfe2ea;
  --shadow:0 20px 60px #0001;
}

.light html,
.light body{
  background:#f5f6fa;
  color:#151821;
}

.light .auth-card,
.light .card{
  background:#fff;
}

.light .tabs,
.light .field input,
.light .field textarea,
.light .field select,
.light .search input,
.light .comment-row input{
  background:#f7f8fb;
  color:#151821;
}

</style>
</head>


<body>


<!-- =========================
     AUTH SCREEN
========================= -->

<div id="auth" class="auth">

  <div class="auth-card">

    <div class="brand">
      zil<span>net</span>
    </div>

    <div class="sub">
      A global place to create, connect and discover.
    </div>


    <div class="tabs">

      <button
        id="loginTab"
        class="active"
        onclick="setAuthMode('login')">
        Log in
      </button>

      <button
        id="signupTab"
        onclick="setAuthMode('signup')">
        Create account
      </button>

    </div>


    <form
      id="authForm"
      onsubmit="submitAuth(event)">


      <div
        id="nameField"
        class="field hidden">

        <label>
          Display name
        </label>

        <input
          id="displayName"
          maxlength="50">

      </div>


      <div class="field">

        <label>
          Username
        </label>

        <input
          id="username"
          required
          maxlength="30"
          autocomplete="username"
          placeholder="yourname">

      </div>


      <div
        id="emailField"
        class="field hidden">

        <label>
          Email
        </label>

        <input
          id="email"
          type="email"
          maxlength="120">

      </div>


      <div class="field">

        <label>
          Password
        </label>

        <input
          id="password"
          type="password"
          required
          minlength="8"
          autocomplete="current-password">

      </div>


      <div id="authMsg"></div>


      <button
        class="primary full"
        id="authBtn">

        Continue

      </button>


      <button
        type="button"
        id="forgotBtn"
        class="linkbtn hidden"
        onclick="openForgotPassword()">

        Forgot password?

      </button>

    </form>


    <p class="tiny">
      Use at least 8 characters for your password.
    </p>

  </div>

</div>



<!-- =========================
     MAIN APP
========================= -->

<div
  id="app"
  class="app hidden">


  <div class="shell">


    <!-- =========================
         SIDEBAR
    ========================= -->

    <aside class="sidebar">


      <div class="logo">

        <span class="brand">
          zil<span>net</span>
        </span>

      </div>


      <button
        class="navbtn active"
        data-page="home"
        onclick="go('home')">

        ⌂

        <span class="label">
          Home
        </span>

      </button>


      <button
        class="navbtn"
        data-page="discover"
        onclick="go('discover')">

        ⌕

        <span class="label">
          Discover
        </span>

      </button>


      <button
        class="navbtn"
        data-page="reels"
        onclick="go('reels')">

        ▶

        <span class="label">
          Reels
        </span>

      </button>


      <button
        class="navbtn"
        onclick="openCreate()">

        ＋

        <span class="label">
          Create
        </span>

      </button>


      <button
        class="navbtn"
        data-page="chat"
        onclick="go('chat')">

        ◌

        <span class="label">
          Chat
        </span>

      </button>


      <button
        class="navbtn"
        data-page="profile"
        onclick="go('profile')">

        ◎

        <span class="label">
          Profile
        </span>

      </button>


      <div class="spacer"></div>


      <button
        class="navbtn"
        onclick="openSettings()">

        ⚙

        <span class="label">
          Settings
        </span>

      </button>


      <button
        class="navbtn"
        onclick="logout()">

        ↪

        <span class="label">
          Log out
        </span>

      </button>


    </aside>



    <!-- =========================
         MAIN CONTENT
    ========================= -->

    <main>


      <header class="topbar">


        <div class="mobile-brand">
          zil<span style="color:#ff3d91">net</span>
        </div>


        <div class="search">

          <input
            id="globalSearch"
            placeholder="Search people, skills, posts…"
            oninput="searchAll(this.value)">

        </div>


        <button
          class="iconbtn"
          onclick="openNotifications()">

          ♡

        </button>


      </header>



      <!-- =========================
           HOME
      ========================= -->

      <section id="page-home">


        <div class="section-title">

          <h2>
            Stories
          </h2>

          <button
            class="secondary"
            onclick="openStory()">

            ＋

          </button>

        </div>


        <div
          id="stories"
          class="stories">
        </div>



        <!-- POST COMPOSER -->

        <div
          id="composer"
          class="compose card">


          <div class="row">


            <img
              id="composerAvatar"
              class="avatar"
              alt="">


            <textarea
              id="postText"
              placeholder="Share something with the world…">
            </textarea>


          </div>


          <div class="compose-foot">


            <div class="tiny">
              Public post • be respectful
            </div>


            <button
              class="primary"
              onclick="createPost()">

              Post

            </button>


          </div>


        </div>


        <div id="feed"></div>


      </section>



      <!-- =========================
           DISCOVER
      ========================= -->

      <section
        id="page-discover"
        class="hidden">


        <div class="section-title">

          <h2>
            Discover
          </h2>

        </div>


        <div id="discoverResults"></div>


      </section>



      <!-- =========================
           REELS
      ========================= -->

      <section
        id="page-reels"
        class="hidden">


        <div class="section-title">

          <h2>
            Reels
          </h2>


          <button
            class="primary"
            onclick="openCreate('reel')">

            ＋ Reel

          </button>

        </div>


        <div id="reelsFeed"></div>


      </section>



      <!-- =========================
           CHAT
      ========================= -->

      <section
        id="page-chat"
        class="hidden">


        <div class="section-title">

          <h2>
            Messages
          </h2>


          <button
            class="secondary"
            onclick="newGroup()">

            ＋ Group

          </button>

        </div>


        <div
          id="chatList"
          class="card">
        </div>


      </section>



      <!-- =========================
           PROFILE
      ========================= -->

      <section
        id="page-profile"
        class="hidden">

        <div id="profileView"></div>

      </section>


    </main>



    <!-- =========================
         RIGHT SIDEBAR
    ========================= -->

    <aside class="rightbar">


      <div class="rightcard card">

        <strong>
          People to connect with
        </strong>

        <div id="suggestions"></div>

      </div>


      <div class="rightcard card">

        <strong>
          Explore skills
        </strong>

        <div id="skills"></div>

      </div>


      <div class="tiny">
        Zilnet • built for people, ideas and communities.
      </div>


    </aside>


  </div>



  <!-- =========================
       MOBILE BOTTOM NAV
  ========================= -->

  <nav class="bottom">


    <button onclick="go('home')">

      ⌂
      <br>

      <small>
        Home
      </small>

    </button>


    <button onclick="go('discover')">

      ⌕
      <br>

      <small>
        Discover
      </small>

    </button>


    <button onclick="openCreate()">

      ＋
      <br>

      <small>
        Create
      </small>

    </button>


    <button onclick="go('reels')">

      ▶
      <br>

      <small>
        Reels
      </small>

    </button>


    <button onclick="go('profile')">

      ◎
      <br>

      <small>
        Profile
      </small>

    </button>


  </nav>


</div>



<!-- =========================
     MODAL
========================= -->

<div
  id="modal"
  class="modal hidden">

  <div
    class="modal-card"
    id="modalCard">
  </div>

</div>



<!-- =========================
     TOAST
========================= -->

<div
  id="toast"
  class="toast hidden">
</div>


<!-- =========================
     JAVASCRIPT STARTS IN PART 2
========================= -->

<script>
/* =========================================================
   ZILNET — PART 2
   AUTH • APP • FEED • STORIES • SEARCH • PROFILE
   ========================================================= */

const $ = id => document.getElementById(id);

const state = {
  me: null,
  posts: [],
  stories: [],
  reels: [],

/* =========================================================
   API
   ========================================================= */

async function api(path, options = {}) {
  const response = await fetch("/api" + path, {
    credentials: "include",
    ...options,
    headers: {
      ...(options.body instanceof FormData
        ? {}
        : { "Content-Type": "application/json" }),
      ...(options.headers || {})
    }
  });

  let data = {};

  try {
    data = await response.json();
  } catch (_) {}

  if (!response.ok) {
    throw new Error(data.error || "Request failed");
  }

  return data;
}


/* =========================================================
   HELPERS
   ========================================================= */

function esc(value) {
  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function toast(message) {
  const old = document.querySelector(".zilnet-toast");
  if (old) old.remove();

  const el = document.createElement("div");

  el.className = "zilnet-toast";
  el.textContent = message;

  Object.assign(el.style, {
    position: "fixed",
    left: "50%",
    bottom: "90px",
    transform: "translateX(-50%)",
    zIndex: "999999",
    padding: "12px 18px",
    borderRadius: "14px",
    background: "#111",
    color: "#fff",
    fontSize: "14px",
    boxShadow: "0 12px 35px rgba(0,0,0,.3)"
  });

  document.body.appendChild(el);

  setTimeout(() => el.remove(), 2500);
}

function formatDate(value) {
  if (!value) return "";

  const date = new Date(value);

  if (Number.isNaN(date.getTime())) return "";

  return date.toLocaleString([], {
    dateStyle: "medium",
    timeStyle: "short"
  });
}

function avatar(user, size = 44) {
  const name =
    user?.display_name ||
    user?.username ||
    "?";

  if (user?.avatar_url) {
    return `
      <img
        src="${esc(user.avatar_url)}"
        alt=""
        style="
          width:${size}px;
          height:${size}px;
          border-radius:50%;
          object-fit:cover;
        "
      >
    `;
  }

  return `
    <div
      style="
        width:${size}px;
        height:${size}px;
        border-radius:50%;
        display:flex;
        align-items:center;
        justify-content:center;
        background:linear-gradient(135deg,#7c3aed,#ec4899);
        color:#fff;
        font-weight:700;
        flex-shrink:0;
      "
    >
      ${esc(name.charAt(0).toUpperCase())}
    </div>
  `;
}


/* =========================================================
   AUTH MODE
   ========================================================= */

function setAuthMode(mode) {
  state.authMode = mode;

  const loginTab = $("loginTab");
  const signupTab = $("signupTab");

  const nameField = $("nameField");
  const emailField = $("emailField");

  const authBtn = $("authBtn");
  const password = $("password");
  const authMsg = $("authMsg");

  if (loginTab) {
    loginTab.classList.toggle(
      "active",
      mode === "login"
    );
  }

  if (signupTab) {
    signupTab.classList.toggle(
      "active",
      mode === "signup"
    );
  }

  if (nameField) {
    nameField.classList.toggle(
      "hidden",
      mode !== "signup"
    );
  }

  if (emailField) {
    emailField.classList.toggle(
      "hidden",
      mode !== "signup"
    );
  }

  if (authBtn) {
    authBtn.textContent =
      mode === "signup"
        ? "Create account"
        : "Log in";
  }

  if (password) {
    password.autocomplete =
      mode === "signup"
        ? "new-password"
        : "current-password";
  }

  if (authMsg) {
    authMsg.textContent = "";
  }
}


/* =========================================================
   LOGIN / CREATE ACCOUNT
   ========================================================= */

async function submitAuth(event) {
  event.preventDefault();

  const username =
    $("username")?.value.trim();

  const password =
    $("password")?.value || "";

  if (!username || !password) {
    toast("Enter your username and password.");
    return;
  }

  const authMsg = $("authMsg");

  try {
    if (authMsg) {
      authMsg.textContent = "Please wait...";
    }

    if (state.authMode === "signup") {

      const displayName =
        $("displayName")?.value.trim() ||
        username;

      const email =
        $("email")?.value.trim() ||
        null;

      await api("/signup", {
        method: "POST",
        body: JSON.stringify({
          username,
          password,
          display_name: displayName,
          email
        })
      });

      toast("Account created successfully.");

    } else {

      await api("/login", {
        method: "POST",
        body: JSON.stringify({
          username,
          password
        })
      });

      toast("Welcome back.");
    }

    await boot();

  } catch (error) {

    if (authMsg) {
      authMsg.textContent = error.message;
    }

    toast(error.message);
  }
}

async function boot() {
  try {

      await api("/me");

    state.me =
      data.user || data;

    $("auth")?.classList.add("hidden");
    $("app")?.classList.remove("hidden");

    updateCurrentUserUI();

    await Promise.all([
      loadFeed(),
      loadStories(),
      loadSuggestions()
    ]);

  } catch (_) {

    $("auth")?.classList.remove("hidden");

}

  if (!state.me) return;

  document
    .querySelectorAll("[data-current-username]")
    .forEach(el => {

  document
    .querySelectorAll("[data-current-name]")

  container.innerHTML =
    state.posts.map(post => {

      const id =
        Number(post.id);

      return `
        <article
          class="post"
          data-post-id="${id}"
        >

          <div class="post-head">

            <div class="post-user">

              ${avatar(post, 44)}

              <div>
                <strong>
                  ${esc(
                    post.display_name ||
                    post.username

                </strong>

                <div class="muted">
                  @${esc(post.username)}
                </div>
              </div>

            </div>

            <button
              class="icon-btn"
              onclick="postMenu(${id})"
            >
              ⋯
            </button>

          </div>

          ${
            post.content
              ? `
                <div class="post-content">
                  ${esc(post.content)}
                </div>
              `
              : ""
          }

          ${
            post.media_url
              ? `
                <img
                  class="post-media"
                  src="${esc(post.media_url)}"
                  alt=""
                  loading="lazy"
                >
              `
              : ""
          }

          <div class="post-meta">

            ${Number(post.like_count || 0)}
            likes

            ·

            ${Number(post.comment_count || 0)}
            comments

          </div>

          <div class="post-actions">

            <button
              class="icon-btn like-btn"

                toggleLike(${id}, this)

            >
              ♡
            </button>

              class="icon-btn"
              onclick="

            >
              💬
            </button>

            <button
              class="icon-btn"
              onclick="
                sharePost(${id})
              "
            >
              ↗
            </button>

            <button
              class="icon-btn"
              onclick="
                savePost(${id})
              "
            >
              🔖

          </div>

          ></div>

/* =========================================================
   POST MENU
   ========================================================= */

function postMenu(postId) {

  const post =
    state.posts.find(
      p =>
        Number(p.id) ===
        Number(postId)
    );

  if (!post) return;

  const ownPost =
    state.me &&
    Number(post.user_id) ===
    Number(state.me.id);

  if (ownPost) {

    const action =
      prompt(
        "Type:\n1 = Delete\n2 = Copy link\n3 = Cancel"
      );

    if (action === "1") {
      deletePost(postId);
    }

    if (action === "2") {
      sharePost(postId);
    }

  } else {

    const action =
      prompt(
        "Type:\n1 = Copy link\n2 = Report\n3 = Cancel"
      );

    if (action === "1") {
      sharePost(postId);
    }

    if (action === "2") {
      toast("Report system will be connected.");
    }
  }
}

async function toggleLike(postId, button) {

  try {

    const result =
      await api(
        "/posts/" +
        Number(postId) +
        "/like",
        {
          method: "POST"
        }
      );

    const liked =
      result.liked ??
      result.isLiked ??
      false;

    button.classList.toggle(
      "liked",

      liked ? "♥" : "♡";

    await loadFeed();

async function createPost(event) {

    event.preventDefault();

   ========================================================= */

async function openComments(postId) {

  const box =
    $("comments-" +
      Number(postId));

  if (!box) return;

  box.classList.toggle("hidden");

  if (box.classList.contains("hidden")) {
    return;
  }

  try {

    const data =
      await api(
        "/posts/" +
        Number(postId) +
        "/comments"
      );

    const comments =
      data.comments || [];

    box.innerHTML = `

      <div class="comment-list">

        ${
          comments.length

            ? comments.map(comment => `
                <div class="comment">

                  <strong>
                    @${esc(
                      comment.username
                    )}
                  </strong>

                  <span>
                    ${esc(
                      comment.content
                    )}
                  </span>

                </div>
              `).join("")

            : `
              <div class="muted">
                No comments yet.
              </div>
            `
        }

      </div>

      <div class="comment-form">

        <input
          id="comment-input-${Number(postId)}"
          maxlength="500"
          placeholder="Write a comment..."
        >

        <button
          onclick="
            sendComment(${Number(postId)})
          "
        >
          Send
        </button>

      </div>
    `;

  } catch (error) {

    toast(error.message);
  }
}


async function sendComment(postId) {

  const input =
    $("comment-input-" +
      Number(postId));

  if (!input) return;

  const content =
    input.value.trim();

  if (!content) return;

  try {

    await api("/comments", {
      method: "POST",
      body: JSON.stringify({
        post_id: Number(postId),
        content
      })
    });

    input.value = "";

    await loadFeed();

    await openComments(postId);

  } catch (error) {

    toast(error.message);
  }
}

async function sharePost(postId) {

  const url =
    location.origin +
    location.pathname +
    "?post=" +
    Number(postId);

  try {

    if (navigator.share) {

      await navigator.share({
        title: "Zilnet post",
        url
      });

    } else {

      await navigator.clipboard.writeText(url);

      toast("Post link copied.");
    }

  } catch (_) {}
}

export default {
  async fetch(request, env) {
    const url = new URL(request.url);

    try {
      /* =========================
         API ROUTER
         ========================= */

      if (url.pathname.startsWith("/api/")) {
        return await handleAPI(request, env, url);
      }

      /* =========================
         R2 MEDIA
         ========================= */

      if (url.pathname.startsWith("/media/")) {
        if (!env.MEDIA) {
          return new Response("Media storage not configured", {
            status: 503
          });
        }

        const key = decodeURIComponent(
          url.pathname.slice("/media/".length)
        );

        const object = await env.MEDIA.get(key);

        if (!object) {
          return new Response("Not found", {
            status: 404
          });
        }

        const headers = new Headers();

        object.writeHttpMetadata(headers);
        headers.set("etag", object.httpEtag);
        headers.set("cache-control", "public, max-age=31536000");

        return new Response(object.body, {
          headers
        });
      }

      /* =========================
         WEBSITE
         ========================= */

      return env.ASSETS.fetch(request);

    } catch (error) {
      console.error(error);

      return Response.json(
        {
          error: "Internal server error"
        },
        {
          status: 500
        }
      );
    }
  }
};


/* =========================================================
   API
   ========================================================= */

async function handleAPI(request, env, url) {

  const path = url.pathname;
  const method = request.method;

  /* =========================
     DATABASE TEST
     ========================= */

  if (
    path === "/api/test-db" &&
    method === "GET"
  ) {
    const result =
      await env.DB
        .prepare("SELECT 1 AS connected")
        .first();

    return Response.json(result);
  }


  /* =========================
     SIGN UP
     ========================= */

  if (
    path === "/api/signup" &&
    method === "POST"
  ) {
    const data = await request.json();

    const username =
      String(data.username || "")
        .trim()
        .toLowerCase();

    const email =
      data.email
        ? String(data.email).trim().toLowerCase()
        : null;

    const displayName =
      String(
        data.display_name ||
        username
      ).trim();

    const password =
      String(data.password || "");

    if (!/^[a-z0-9_.]{3,30}$/.test(username)) {
      return Response.json(
        {
          error:
            "Username must be 3–30 characters and use letters, numbers, _ or ."
        },
        { status: 400 }
      );
    }

    if (password.length < 8) {
      return Response.json(
        {
          error:
            "Password must be at least 8 characters."
        },
        { status: 400 }
      );
    }

    const existing =
      await env.DB
        .prepare(
          "SELECT id FROM users WHERE username = ?"
        )
        .bind(username)
        .first();

    if (existing) {
      return Response.json(
        {
          error: "Username already exists."
        },
        { status: 409 }
      );
    }

    if (email) {
      const existingEmail =
        await env.DB
          .prepare(
            "SELECT id FROM users WHERE email = ?"
          )
          .bind(email)
          .first();

      if (existingEmail) {
        return Response.json(
          {
            error: "Email already exists."
          },
          { status: 409 }
        );
      }
    }

    const salt =
      crypto.randomUUID() +
      crypto.randomUUID();

    const passwordHash =
      await hashPassword(password, salt);

    const result =
      await env.DB
        .prepare(`
          INSERT INTO users
          (
            username,
            email,
            display_name,
            password_hash,
            password_salt
          )
          VALUES (?, ?, ?, ?, ?)
        `)
        .bind(
          username,
          email,
          displayName,
          passwordHash,
          salt
        )
        .run();

    const userId =
      result.meta.last_row_id;

    const token =
      await createSession(
        env,
        userId
      );

    return withCookie(
      Response.json({
        success: true,
        user: {
          id: userId,
          username,
          email,
          display_name: displayName
        }
      }),
      token
    );
  }


  /* =========================
     LOGIN
     ========================= */

  if (
    path === "/api/login" &&
    method === "POST"
  ) {
    const data = await request.json();

    const username =
      String(data.username || "")
        .trim()
        .toLowerCase();

    const password =
      String(data.password || "");

    const user =
      await env.DB
        .prepare(`
          SELECT *
          FROM users
          WHERE username = ?
        `)
        .bind(username)
        .first();

    if (!user) {
      return Response.json(
        {
          error: "Invalid username or password."
        },
        { status: 401 }
      );
    }

    const hash =
      await hashPassword(
        password,
        user.password_salt
      );

    if (
      hash !== user.password_hash
    ) {
      return Response.json(
        {
          error: "Invalid username or password."
        },
        { status: 401 }
      );
    }

    const token =
      await createSession(
        env,
        user.id
      );

    return withCookie(
      Response.json({
        success: true,
        user: cleanUser(user)
      }),
      token
    );
  }


  /* =========================
     LOGOUT
     ========================= */

  if (
    path === "/api/logout" &&
    method === "POST"
  ) {
    const token =
      getCookie(request, "zilnet_session");

    if (token) {
      await env.DB
        .prepare(
          "DELETE FROM sessions WHERE token = ?"
        )
        .bind(token)
        .run();
    }

    return new Response(
      JSON.stringify({
        success: true
      }),
      {
        headers: {
          "content-type": "application/json",
          "set-cookie":
            "zilnet_session=; Path=/; HttpOnly; Secure; SameSite=Lax; Max-Age=0"
        }
      }
    );
  }


  /* =========================
     CURRENT USER
     ========================= */

  if (
    path === "/api/me" &&
    method === "GET"
  ) {
    const user =
      await requireUser(
        request,
        env
      );

    if (!user) {
      return Response.json(
        {
          error: "Not logged in"
        },
        { status: 401 }
      );
    }

    return Response.json({
      user: cleanUser(user)
    });
  }


  /* =========================
     FEED
     ========================= */

  if (
    path === "/api/feed" &&
    method === "GET"
  ) {
    const user =
      await getCurrentUser(
        request,
        env
      );

    const rows =
      await env.DB
        .prepare(`
          SELECT
            p.*,
            u.username,
            u.display_name,
            u.avatar_url,

            (
              SELECT COUNT(*)
              FROM likes l
              WHERE l.post_id = p.id
            ) AS like_count,

            (
              SELECT COUNT(*)
              FROM comments c
              WHERE c.post_id = p.id
            ) AS comment_count

          FROM posts p

          JOIN users u
            ON u.id = p.user_id

          ORDER BY p.created_at DESC

          LIMIT 100
        `)
        .all();

    return Response.json({
      posts: rows.results || []
    });
  }


  /* =========================
     CREATE POST
     ========================= */

  if (
    path === "/api/posts" &&
    method === "POST"
  ) {
    const user =
      await requireUser(
        request,
        env
      );

    if (!user) {
      return unauthorized();
    }

    const data =
      await request.json();

    const content =
      String(data.content || "")
        .trim();

    if (!content) {
      return Response.json(
        {
          error: "Post cannot be empty."
        },
        { status: 400 }
      );
    }

    if (content.length > 5000) {
      return Response.json(
        {
          error: "Post is too long."
        },
        { status: 400 }
      );
    }

    const result =
      await env.DB
        .prepare(`
          INSERT INTO posts
          (
            user_id,
            content
          )
          VALUES (?, ?)
        `)
        .bind(
          user.id,
          content
        )
        .run();

    return Response.json({
      success: true,
      post_id: result.meta.last_row_id
    });
  }


  /* =========================
     DELETE POST
     ========================= */

  if (
    path.match(/^\/api\/posts\/\d+$/) &&
    method === "DELETE"
  ) {
    const user =
      await requireUser(
        request,
        env
      );

    if (!user) {
      return unauthorized();
    }

    const id =
      Number(
        path.split("/").pop()
      );

    const result =
      await env.DB
        .prepare(`
          DELETE FROM posts
          WHERE id = ?
          AND user_id = ?
        `)
        .bind(
          id,
          user.id
        )
        .run();

    return Response.json({
      success:
        result.meta.changes > 0
    });
  }


  /* =========================
     LIKE POST
     ========================= */

  if (
    path.match(/^\/api\/posts\/\d+\/like$/) &&
    method === "POST"
  ) {
    const user =
      await requireUser(
        request,
        env
      );

    if (!user) {
      return unauthorized();
    }

    const postId =
      Number(
        path.split("/")[3]
      );

    const existing =
      await env.DB
        .prepare(`
          SELECT id
          FROM likes
          WHERE post_id = ?
          AND user_id = ?
        `)
        .bind(
          postId,
          user.id
        )
        .first();

    if (existing) {

      await env.DB
        .prepare(`
          DELETE FROM likes
          WHERE post_id = ?
          AND user_id = ?
        `)
        .bind(
          postId,
          user.id
        )
        .run();

      return Response.json({
        liked: false
      });
    }

    await env.DB
      .prepare(`
        INSERT INTO likes
        (
          post_id,
          user_id
        )
        VALUES (?, ?)
      `)
      .bind(
        postId,
        user.id
      )
      .run();

    return Response.json({
      liked: true
    });
  }


  /* =========================
     COMMENTS
     ========================= */

  if (
    path === "/api/comments" &&
    method === "POST"
  ) {
    const user =
      await requireUser(
        request,
        env
      );

    if (!user) {
      return unauthorized();
    }

    const data =
      await request.json();

    const postId =
      Number(data.post_id);

    const content =
      String(data.content || "")
        .trim();

    if (!postId || !content) {
      return Response.json(
        {
          error: "Invalid comment."
        },
        { status: 400 }
      );
    }

    await env.DB
      .prepare(`
        INSERT INTO comments
        (
          post_id,
          user_id,
          content
        )
        VALUES (?, ?, ?)
      `)
      .bind(
        postId,
        user.id,
        content
      )
      .run();

    return Response.json({
      success: true
    });
  }


  if (
    path.match(/^\/api\/posts\/\d+\/comments$/) &&
    method === "GET"
  ) {
    const postId =
      Number(
        path.split("/")[3]
      );

    const result =
      await env.DB
        .prepare(`
          SELECT
            c.*,
            u.username,
            u.display_name,
            u.avatar_url

          FROM comments c

          JOIN users u
            ON u.id = c.user_id

          WHERE c.post_id = ?

          ORDER BY c.created_at ASC
        `)
        .bind(postId)
        .all();

    return Response.json({
      comments:
        result.results || []
    });
  }


  /* =========================
     SEARCH
     ========================= */

  if (
    path === "/api/search" &&
    method === "GET"
  ) {
    const q =
      url.searchParams
        .get("q") ||
        "";

    const search =
      `%${q.trim()}%`;

    const users =
      await env.DB
        .prepare(`
          SELECT
            id,
            username,
            display_name,
            avatar_url,
            bio
          FROM users
          WHERE username LIKE ?
             OR display_name LIKE ?
          LIMIT 30
        `)
        .bind(
          search,
          search
        )
        .all();

    const posts =
      await env.DB
        .prepare(`
          SELECT
            p.id,
            p.user_id,
            p.content,
            p.created_at,
            u.username,
            u.display_name,
            u.avatar_url
          FROM posts p
          JOIN users u
            ON u.id = p.user_id
          WHERE p.content LIKE ?
          ORDER BY p.created_at DESC
          LIMIT 30
        `)
        .bind(search)
        .all();

    return Response.json({
      users: users.results || [],
      posts: posts.results || []
    });
  }


  /* =========================
     SUGGESTIONS
     ========================= */

  if (
    path === "/api/suggestions" &&
    method === "GET"
  ) {
    const user =
      await getCurrentUser(
        request,
        env
      );

    let query = `
      SELECT
        id,
        username,
        display_name,
        avatar_url
      FROM users
    `;

    const params = [];

    if (user) {
      query += `
        WHERE id != ?
        AND id NOT IN (
          SELECT following_id
          FROM follows
          WHERE follower_id = ?
        )
      `;

      params.push(
        user.id,
        user.id
      );
    }

    query += `
      ORDER BY RANDOM()
      LIMIT 10
    `;

    const statement =
      env.DB.prepare(query);

    const result =
      params.length
        ? await statement.bind(...params).all()
        : await statement.all();

    return Response.json({
      users:
        result.results || []
    });
  }


  /* =========================
     FOLLOW
     ========================= */

  if (
    path.match(/^\/api\/users\/\d+\/follow$/) &&
    method === "POST"
  ) {
    const user =
      await requireUser(
        request,
        env
      );

    if (!user) {
      return unauthorized();
    }

    const targetId =
      Number(
        path.split("/")[3]
      );

    if (
      targetId === user.id
    ) {
      return Response.json(
        {
          error: "You cannot follow yourself."
        },
        { status: 400 }
      );
    }

    const existing =
      await env.DB
        .prepare(`
          SELECT id
          FROM follows
          WHERE follower_id = ?
          AND following_id = ?
        `)
        .bind(
          user.id,
          targetId
        )
        .first();

    if (existing) {

      await env.DB
        .prepare(`
          DELETE FROM follows
          WHERE follower_id = ?
          AND following_id = ?
        `)
        .bind(
          user.id,
          targetId
        )
        .run();

      return Response.json({
        following: false
      });
    }

    await env.DB
      .prepare(`
        INSERT INTO follows
        (
          follower_id,
          following_id
        )
        VALUES (?, ?)
      `)
      .bind(
        user.id,
        targetId
      )
      .run();

    return Response.json({
      following: true
    });
  }


  /* =========================
     USER PROFILE
     ========================= */

  if (
    path.match(/^\/api\/users\/\d+$/) &&
    method === "GET"
  ) {
    const id =
      Number(
        path.split("/")[3]
      );

    const user =
      await env.DB
        .prepare(`
          SELECT
            id,
            username,
            email,
            display_name,
            bio,
            avatar_url,
            skills,
            created_at,

            (
              SELECT COUNT(*)
              FROM posts
              WHERE posts.user_id = users.id
            ) AS post_count,

            (
              SELECT COUNT(*)
              FROM follows
              WHERE following_id = users.id
            ) AS follower_count,

            (
              SELECT COUNT(*)
              FROM follows
              WHERE follower_id = users.id
            ) AS following_count

          FROM users

          WHERE id = ?
        `)
        .bind(id)
        .first();

    if (!user) {
      return Response.json(
        {
          error: "User not found."
        },
        { status: 404 }
      );
    }

    return Response.json({
      user
    });
  }


  /* =========================
     EDIT PROFILE
     ========================= */

  if (
    path === "/api/profile" &&
    method === "PUT"
  ) {
    const user =
      await requireUser(
        request,
        env
      );

    if (!user) {
      return unauthorized();
    }

    const data =
      await request.json();

    const displayName =
      String(
        data.display_name ??
        user.display_name ??
        ""
      ).trim();

    const bio =
      String(
        data.bio ??
        user.bio ??
        ""
      ).trim();

    const skills =
      String(
        data.skills ??
        user.skills ??
        ""
      ).trim();

    await env.DB
      .prepare(`
        UPDATE users
        SET
          display_name = ?,
          bio = ?,
          skills = ?
        WHERE id = ?
      `)
      .bind(
        displayName,
        bio,
        skills,
        user.id
      )
      .run();

    return Response.json({
      success: true
    });
  }


  /* =========================
     STORIES
     ========================= */

  if (
    path === "/api/stories" &&
    method === "GET"
  ) {
    const user =
      await getCurrentUser(
        request,
        env
      );

    if (!user) {
      return Response.json({
        stories: []
      });
    }

    const result =
      await env.DB
        .prepare(`
          SELECT
            s.*,
            u.username,
            u.display_name,
            u.avatar_url

          FROM stories s

          JOIN users u
            ON u.id = s.user_id

          WHERE
            s.user_id = ?

            OR s.visibility = 'public'

            OR (
              s.visibility = 'followers'
              AND EXISTS (
                SELECT 1
                FROM follows f
                WHERE f.follower_id = ?
                AND f.following_id = s.user_id
              )
            )

          AND datetime(
            s.created_at,
            '+24 hours'
          ) > datetime('now')

          ORDER BY s.created_at DESC
        `)
        .bind(
          user.id,
          user.id
        )
        .all();

    return Response.json({
      stories:
        result.results || []
    });
  }


  /* =========================
     CREATE STORY
     ========================= */

  if (
    path === "/api/stories" &&
    method === "POST"
  ) {
    const user =
      await requireUser(
        request,
        env
      );

    if (!user) {
      return unauthorized();
    }

    const data =
      await request.json();

    const content =
      String(data.content || "")
        .trim();

    const visibility =
      data.visibility === "followers"
        ? "followers"
        : "public";

    if (!content) {
      return Response.json(
        {
          error: "Story cannot be empty."
        },
        { status: 400 }
      );
    }

    await env.DB
      .prepare(`
        INSERT INTO stories
        (
          user_id,
          content,
          visibility
        )
        VALUES (?, ?, ?)
      `)
      .bind(
        user.id,
        content,
        visibility
      )
      .run();

    return Response.json({
      success: true
    });
  }


  /* =========================
     SINGLE STORY
     ========================= */

  if (
    path.match(/^\/api\/stories\/\d+$/) &&
    method === "GET"
  ) {
    const id =
      Number(
        path.split("/")[3]
      );

    const story =
      await env.DB
        .prepare(`
          SELECT
            s.*,
            u.username,
            u.display_name,
            u.avatar_url

          FROM stories s

          JOIN users u
            ON u.id = s.user_id

          WHERE s.id = ?
        `)
        .bind(id)
        .first();

    if (!story) {
      return Response.json(
        {
          error: "Story not found."
        },
        { status: 404 }
      );
    }

    return Response.json({
      story
    });
  }


  /* =========================
     REELS
     ========================= */

  if (
    path === "/api/reels" &&
    method === "GET"
  ) {
    const result =
      await env.DB
        .prepare(`
          SELECT
            r.*,
            u.username,
            u.display_name,
            u.avatar_url

          FROM reels r

          JOIN users u
            ON u.id = r.user_id

          ORDER BY r.created_at DESC

          LIMIT 100
        `)
        .all();

    return Response.json({
      reels:
        result.results || []
    });
  }


  /* =========================
     CREATE REEL
     ========================= */

  if (
    path === "/api/reels" &&
    method === "POST"
  ) {
    const user =
      await requireUser(
        request,
        env
      );

    if (!user) {
      return unauthorized();
    }

      .prepare(`
        INSERT INTO reels
        (
          user_id,
          media_url,
          caption
        )
        VALUES (?, ?, ?)
      `)
      .bind(
        user.id,
        mediaUrl,
        caption

    return Response.json({
      success: true
    });
  }


  /* =========================
     CHATS
     ========================= */

  if (
    path === "/api/chats" &&
    method === "GET"
  ) {
    const user =
      await requireUser(
        request,
        env
      );

    if (!user) {
      return unauthorized();
    }

    const result =
      await env.DB
        .prepare(`
          SELECT
            c.id,
            c.name,

          FROM chats c

          JOIN chat_members cm
            ON cm.chat_id = c.id

          WHERE cm.user_id = ?

          ORDER BY c.created_at DESC
        `)
        .bind(user.id)
        .all();

    return Response.json({
      chats:
        result.results || []
    });
  }


  /* =========================
     CHAT MESSAGES
     ========================= */

  if (
    path.match(/^\/api\/chats\/\d+\/messages$/) &&
    method === "GET"
  ) {
    const user =
      await requireUser(
        request,

      );

    const member =

        .prepare(`
          SELECT id
          FROM chat_members
          WHERE chat_id = ?
          AND user_id = ?
        `)
        .bind(
          chatId,
          user.id
        )
        .first();

    if (!member) {
      return Response.json(
        {
          error: "Access denied."
        },
        { status: 403 }
      );
    }

    const result =
      await env.DB
        .prepare(`
          SELECT
            m.*,
            u.username,
            u.display_name,
            u.avatar_url

          FROM messages m

          JOIN users u
            ON u.id = m.user_id

          WHERE m.chat_id = ?

          ORDER BY m.created_at ASC

          LIMIT 200
        `)
        .bind(chatId)
        .all();

    return Response.json({
      messages:
        result.results || []
    });
  }


  /* =========================
     SEND MESSAGE
     ========================= */

  if (
    path.match(/^\/api\/chats\/\d+\/messages$/) &&
    method === "POST"
  ) {
    const user =
      await requireUser(
        request,
        env
      );

    if (!user) {
      return unauthorized();
    }

    const chatId =
      Number(
        path.split("/")[3]
      );

    const data =

    const content =

      ).trim();

    if (!content) {
      return Response.json(
        {
          error: "Message cannot be empty."
        },
        { status: 400 }
      );
    }

    const member =
      await env.DB
        .prepare(`
          SELECT id
          FROM chat_members
          WHERE chat_id = ?

        `)
        .bind(
          chatId,
          user.id
        )
        .first();

    if (!member) {
      return Response.json(
        {
          error: "You are not a member of this chat."
        },
        { status: 403 }
      );
    }

    await env.DB
      .prepare(`
        INSERT INTO messages
        (
          chat_id,
          user_id,
          content
        )
        VALUES (?, ?, ?)
      `)
      .bind(
        chatId,
        user.id,
        content
      )
      .run();

    return Response.json({
      success: true
    });
  }


  /* =========================
     NOTIFICATIONS
     ========================= */

  if (
    path === "/api/notifications" &&
    method === "GET"
  ) {
    const user =
      await requireUser(
        request,

        result.results || []

  }


  /* =========================
     PRIVACY SETTINGS
     ========================= */

  if (
    path === "/api/settings/privacy" &&
    method === "PUT"
  ) {
    const user =
      await requireUser(

      `)
      .bind(
        isPrivate,
        user.id
      )
      .run();

    return Response.json({
      success: true
    });
  }


  return Response.json(
    {
      error: "API route not found."
    },
    {
      status: 404
    }
  );
}


/* =========================================================
   AUTH HELPERS
   ========================================================= */

async function getCurrentUser(
  request,
  env
) {
  const token =
    getCookie(
      request,
      "zilnet_session"
    );

  if (!token) return null;

  const result =
    await env.DB
      .prepare(`
        SELECT
          u.*
        FROM sessions s

        JOIN users u
          ON u.id = s.user_id

        WHERE s.token = ?

        AND datetime(
          s.expires_at
        ) > datetime('now')
      `)
      .bind(token)
      .first();

  return result || null;
}


async function requireUser(
  request,
  env
) {
  return getCurrentUser(
    request,
    env
  );
}


async function createSession(
  env,
  userId
) {
  const token =
    crypto.randomUUID() +
    crypto.randomUUID();

  await env.DB
    .prepare(`
      INSERT INTO sessions
      (
        user_id,
        token,
        expires_at
      )
      VALUES (
        ?,
        ?,
        datetime('now', '+30 days')
      )
    `)
    .bind(
      userId,
      token
    )
    .run();

  return token;
}


/* =========================================================
   PASSWORD HASH
   ========================================================= */

async function hashPassword(
  password,
  salt
) {
  const encoder =
    new TextEncoder();

  const key =
    await crypto.subtle.importKey(
      "raw",
      encoder.encode(password),
      {
        name: "PBKDF2"
      },
      false,
      ["deriveBits"]
    );

  const bits =
    await crypto.subtle.deriveBits(
      {
        name: "PBKDF2",
        salt: encoder.encode(salt),
        iterations: 100000,
        hash: "SHA-256"
      },
      key,
      256
    );

  return bytesToHex(
    new Uint8Array(bits)
  );
}


function bytesToHex(bytes) {
  return [...bytes]
    .map(
      b =>
        b.toString(16).padStart(2, "0")
    )
    .join("");
}


/* =========================================================
   COOKIE
   ========================================================= */

function getCookie(
  request,
  name
) {
  const cookie =
    request.headers.get("Cookie");

  if (!cookie) return null;

  const parts =
    cookie.split(";");

  for (const part of parts) {

    const [key, ...value] =
      part.trim().split("=");

    if (key === name) {
      return value.join("=");
    }
  }

  return null;
}


function withCookie(
  response,
  token
) {
  const headers =
    new Headers(
      response.headers
    );

  headers.append(
    "Set-Cookie",
    [
      `zilnet_session=${token}`,
      "Path=/",
      "HttpOnly",
      "Secure",
      "SameSite=Lax",
      "Max-Age=2592000"
    ].join("; ")
  );

  return new Response(
    response.body,
    {
      status: response.status,
      headers
    }
  );
}


function unauthorized() {
  return Response.json(
    {
      error: "You must be logged in."
    },
    {
      status: 401
    }
  );
}

}

/* =========================
   SHARE POST
   ========================= */

async function sharePost(postId) {
    const url =
        `${location.origin}/?post=${encodeURIComponent(postId)}`;

    try {
        if (navigator.share) {
            await navigator.share({
                title: 'Zilnet',
                text: 'Check this post on Zilnet',
                url
            });
        } else {
            await navigator.clipboard.writeText(url);
            toast('Post link copied');
        }

    } catch (error) {
        if (error.name !== 'AbortError') {
            try {
                await navigator.clipboard.writeText(url);
                toast('Post link copied');
            } catch {
                toast('Could not share post');
            }
        }
    }
}

/* =========================
   MEDIA PREVIEW
   ========================= */

function previewMedia(input, previewId) {
    const preview = document.getElementById(previewId);

    if (!preview || !input.files || !input.files.length) {
        return;
    }

    const file = input.files[0];

    if (!file.type.startsWith('image/') &&
        !file.type.startsWith('video/')) {
        toast('Please select an image or video');
        input.value = '';
        return;
    }

    const url = URL.createObjectURL(file);

    preview.innerHTML = '';

    if (file.type.startsWith('image/')) {
        preview.innerHTML = `
            <img
                src="${url}"
                alt="Preview"
                style="
                    width:100%;
                    max-height:420px;
                    object-fit:contain;
                    border-radius:18px;
                "
            >
        `;
    } else {
        preview.innerHTML = `
            <video
                src="${url}"
                controls
                playsinline
                style="
                    width:100%;
                    max-height:420px;
                    border-radius:18px;
                "
            ></video>
        `;
    }

    preview.style.display = 'block';
}


/* =========================
   FILE SIZE CHECK
   ========================= */

function validateMediaFile(file) {
    if (!file) return false;

    const maxSize = 50 * 1024 * 1024;

    if (file.size > maxSize) {
        toast('File is too large. Maximum size is 50 MB.');
        return false;
    }

    const allowed = [
        'image/jpeg',
        'image/png',
        'image/webp',
        'image/gif',
        'video/mp4',
        'video/webm',
        'video/quicktime'
    ];

    if (!allowed.includes(file.type)) {
        toast('This file type is not supported');
        return false;
    }

    return true;
}


/* =========================
   POST MEDIA UPLOAD
   ========================= */

async function uploadPostMedia(file) {
    if (!validateMediaFile(file)) return null;

    const form = new FormData();

    form.append('file', file);
    form.append('type', 'post');

    try {
        const response = await fetch('/api/upload', {
            method: 'POST',
            body: form,
            credentials: 'include'
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.error || 'Upload failed');
        }

        return data.url;

    } catch (error) {
        toast(error.message || 'Upload failed');
        return null;
    }
}

/* =========================
   USER ID GENERATOR
   ========================= */

function generateUserId(username) {
    if (!username) return '';

    const clean =
        username
            .toLowerCase()
            .replace(/[^a-z0-9]/g, '');

    const random =
        Math.floor(1000 + Math.random() * 9000);

    return `${clean}_${random}`;
}

   ========================= */

function limitText(input, maxLength) {
    if (!input) return;

    if (input.value.length > maxLength) {
        input.value = input.value.slice(0, maxLength);
        toast(`Maximum ${maxLength} characters`);
    }
}
