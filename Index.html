<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="theme-color" content="#0b0b12">

<title>Zilnet — Connect. Create. Discover.</title>

<style>

:root{
  --bg:#08090d;
  --panel:#11131a;
  --panel2:#171923;
  --text:#f5f7fb;
  --muted:#9298a8;
  --line:#252937;
  --accent:#9b5cff;
  --accent2:#ff3d91;
  --good:#48e39a;
  --danger:#ff5d6c;
  --shadow:0 20px 60px #0008;
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  min-height:100%;
  font-family:
    Inter,
    ui-sans-serif,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
  background:
    radial-gradient(
      circle at 20% 0%,
      #28104c 0,
      #08090d 35%
    ),
    var(--bg);
  color:var(--text);
}

button,
input,
textarea,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

a{
  color:inherit;
  text-decoration:none;
}

.hidden{
  display:none!important;
}

.app{
  min-height:100vh;
}


/* =========================
   AUTH
========================= */

.auth{
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:24px;
}

.auth-card{
  width:min(460px,100%);
  background:#10121aeF;
  border:1px solid var(--line);
  border-radius:28px;
  padding:32px;
  box-shadow:var(--shadow);
  backdrop-filter:blur(20px);
}

.brand{
  font-weight:900;
  font-size:34px;
  letter-spacing:-1.5px;
}

.brand span{
  background:
    linear-gradient(
      90deg,
      var(--accent),
      var(--accent2)
    );
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}

.sub{
  color:var(--muted);
  margin:8px 0 26px;
}

.tabs{
  display:flex;
  gap:8px;
  background:#090a0f;
  padding:5px;
  border-radius:14px;
  margin-bottom:18px;
}

.tabs button{
  flex:1;
  border:0;
  background:transparent;
  color:var(--muted);
  padding:11px;
  border-radius:10px;
}

.tabs button.active{
  background:var(--panel2);
  color:var(--text);
}

.field{
  margin:12px 0;
}

.field label{
  display:block;
  color:var(--muted);
  font-size:13px;
  margin-bottom:7px;
}

.field input,
.field textarea,
.field select{
  width:100%;
  background:#0a0c12;
  color:var(--text);
  border:1px solid var(--line);
  border-radius:13px;
  padding:13px;
  outline:none;
}

.field input:focus,
.field textarea:focus{
  border-color:var(--accent);
}

.primary,
.secondary,
.danger{
  border:0;
  border-radius:13px;
  padding:12px 16px;
  font-weight:800;
}

.primary{
  background:
    linear-gradient(
      90deg,
      var(--accent),
      var(--accent2)
    );
  color:white;
}

.secondary{
  background:var(--panel2);
  color:var(--text);
  border:1px solid var(--line);
}

.danger{
  background:#35131a;
  color:#ff9ba5;
  border:1px solid #63222d;
}

.linkbtn{
  display:block;
  width:100%;
  margin-top:10px;
  background:transparent;
  border:0;
  color:var(--muted);
  padding:9px;
  font-size:13px;
}

.linkbtn:hover{
  color:var(--text);
}

.full{
  width:100%;
}

.tiny{
  font-size:12px;
  color:var(--muted);
}

.error{
  color:#ff8792;
  font-size:13px;
  margin:10px 0;
}

.ok{
  color:var(--good);
  font-size:13px;
  margin:10px 0;
}


/* =========================
   MAIN LAYOUT
========================= */

.shell{
  display:grid;
  grid-template-columns:
    250px
    minmax(0,680px)
    300px;
  gap:22px;
  max-width:1320px;
  margin:auto;
  padding:18px;
}

.sidebar,
.rightbar{
  position:sticky;
  top:18px;
  height:calc(100vh - 36px);
}

.sidebar{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.logo{
  padding:12px 14px 24px;
}

.navbtn{
  display:flex;
  align-items:center;
  gap:13px;
  width:100%;
  background:transparent;
  border:0;
  color:var(--muted);
  padding:13px 15px;
  border-radius:14px;
  text-align:left;
}

.navbtn:hover,
.navbtn.active{
  background:var(--panel);
  color:var(--text);
}

.navbtn svg{
  width:20px;
}

.spacer{
  flex:1;
}


/* =========================
   TOP BAR
========================= */

.topbar{
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px 2px 18px;
}

.mobile-brand{
  display:none;
  font-weight:900;
  font-size:22px;
}

.search{
  flex:1;
  position:relative;
}

.search input{
  width:100%;
  background:var(--panel);
  border:1px solid var(--line);
  color:var(--text);
  border-radius:15px;
  padding:12px 15px;
}

.iconbtn{
  width:42px;
  height:42px;
  border-radius:13px;
  border:1px solid var(--line);
  background:var(--panel);
  color:var(--text);
}


/* =========================
   SECTION
========================= */

.section-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin:10px 2px 12px;
}

.section-title h2{
  font-size:18px;
  margin:0;
}


/* =========================
   STORIES
========================= */

.stories{
  display:flex;
  gap:13px;
  overflow:auto;
  padding:4px 2px 18px;
}

.story{
  min-width:74px;
  text-align:center;
}

.avatar{
  width:58px;
  height:58px;
  border-radius:50%;
  object-fit:cover;
  border:2px solid var(--accent);
  background:#202331;
}

.story .avatar{
  margin:auto;
}

.story-name{
  font-size:11px;
  color:var(--muted);
  margin-top:6px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}


/* =========================
   CARDS
========================= */

.card{
  background:
    linear-gradient(
      180deg,
      #12141d,
      #0f1118
    );
  border:1px solid var(--line);
  border-radius:22px;
  box-shadow:0 12px 40px #0003;
}


/* =========================
   POSTS
========================= */

.post{
  margin:12px 0;
  padding:16px;
}

.post-head{
  display:flex;
  align-items:center;
  gap:10px;
}

.post-head .avatar{
  width:44px;
  height:44px;
  border:0;
}

.post-meta{
  flex:1;
}

.post-meta strong{
  display:block;
}

.post-meta span{
  font-size:12px;
  color:var(--muted);
}

.more{
  background:transparent;
  border:0;
  color:var(--muted);
  font-size:22px;
}

.post-text{
  line-height:1.55;
  white-space:pre-wrap;
  margin:15px 0;
}

.media{
  width:100%;
  max-height:720px;
  object-fit:cover;
  border-radius:16px;
  background:#07080b;
}

.actions{
  display:flex;
  gap:8px;
  margin-top:12px;
}

.actions button{
  border:0;
  background:transparent;
  color:var(--muted);
  padding:8px 10px;
  border-radius:10px;
}

.actions button:hover{
  background:var(--panel2);
  color:var(--text);
}

.actions .liked{
  color:#ff3d78;
}

.likes{
  font-size:13px;
  color:var(--muted);
  margin-top:4px;
}


/* =========================
   COMMENTS
========================= */

.comment-row{
  display:flex;
  gap:8px;
  margin-top:12px;
}

.comment-row input{
  flex:1;
  background:#0a0c12;
  border:1px solid var(--line);
  border-radius:12px;
  color:white;
  padding:10px;
}

.comment{
  padding:9px 0;
  border-top:1px solid var(--line);
  font-size:13px;
}

.comment b{
  margin-right:5px;
}


/* =========================
   COMPOSER
========================= */

.compose{
  padding:16px;
  margin-bottom:14px;
}

.compose textarea{
  resize:none;
  min-height:72px;
}

.compose-foot{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:10px;
}


/* =========================
   PROFILE
========================= */

.profile-card{
  padding:20px;
}

.profile-cover{
  height:120px;
  border-radius:16px;
  background:
    linear-gradient(
      120deg,
      #6f35d8,
      #e53e86,
      #ffb55b
    );
}

.profile-row{
  display:flex;
  gap:15px;
  align-items:end;
  margin-top:-32px;
  padding:0 12px;
}

.profile-row .avatar{
  width:88px;
  height:88px;
  border:4px solid var(--panel);
}

.profile-actions{
  margin-left:auto;
}

.bio{
  color:var(--muted);
  line-height:1.5;
}


/* =========================
   MEDIA GRID
========================= */

.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:4px;
}

.grid img,
.grid video{
  width:100%;
  aspect-ratio:1;
  object-fit:cover;
  border-radius:7px;
  background:#111;
}


/* =========================
   RIGHT SIDEBAR
========================= */

.rightcard{
  padding:16px;
  margin-bottom:14px;
}

.userrow{
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px 0;
}

.userrow .avatar{
  width:42px;
  height:42px;
}

.userrow > div:nth-child(2){
  flex:1;
}

.follow{
  padding:8px 11px;
  border-radius:10px;
  border:1px solid var(--line);
  background:var(--text);
  color:#111;
  font-weight:800;
}

.follow.following{
  background:var(--panel2);
  color:var(--text);
}


/* =========================
   MODAL
========================= */

.modal{
  position:fixed;
  inset:0;
  background:#0009;
  display:grid;
  place-items:center;
  padding:18px;
  z-index:50;
}

.modal-card{
  width:min(600px,100%);
  max-height:90vh;
  overflow:auto;
  background:#11131a;
  border:1px solid var(--line);
  border-radius:22px;
  padding:20px;
  box-shadow:var(--shadow);
}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.modal-head h3{
  margin:0;
}

.row{
  display:flex;
  gap:10px;
}

.row > *{
  flex:1;
}

.file{
  padding:12px;
  border:1px dashed #44495b;
  border-radius:14px;
  color:var(--muted);
}

.results{
  margin-top:10px;
}

.result{
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px;
  border-radius:12px;
}

.result:hover{
  background:var(--panel2);
}


/* =========================
   TOAST
========================= */

.toast{
  position:fixed;
  bottom:24px;
  left:50%;
  transform:translateX(-50%);
  background:#171923;
  color:#fff;
  border:1px solid var(--line);
  padding:12px 16px;
  border-radius:13px;
  z-index:100;
  box-shadow:var(--shadow);
}


/* =========================
   TABLET
========================= */

@media(max-width:1050px){

  .shell{
    grid-template-columns:
      76px
      minmax(0,680px);
    justify-content:center;
  }

  .rightbar{
    display:none;
  }

  .sidebar{
    align-items:center;
  }

  .sidebar .label,
  .sidebar .logo .brand-text{
    display:none;
  }

  .logo{
    padding:12px;
  }

  .navbtn{
    justify-content:center;
  }

  .navbtn svg{
    width:22px;
  }

}


/* =========================
   MOBILE
========================= */

@media(max-width:700px){

  .shell{
    display:block;
    padding:8px 10px 76px;
  }

  .sidebar{
    display:none;
  }

  .mobile-brand{
    display:block;
  }

  .topbar{
    position:sticky;
    top:0;
    z-index:20;
    background:#08090df2;
    backdrop-filter:blur(16px);
    padding:8px 0 10px;
  }

  .bottom{
    display:flex;
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    height:62px;
    background:#0b0c12f2;
    border-top:1px solid var(--line);
    z-index:30;
    backdrop-filter:blur(18px);
  }

  .bottom button{
    flex:1;
    border:0;
    background:transparent;
    color:var(--muted);
  }

  .bottom button.active{
    color:var(--text);
  }

  .auth-card{
    padding:24px;
  }

  .grid{
    gap:2px;
  }

  .post{
    border-radius:18px;
    padding:12px;
  }

  .story{
    min-width:68px;
  }

}


/* =========================
   LIGHT THEME
========================= */

.light{
  --bg:#f5f6fa;
  --panel:#fff;
  --panel2:#f0f1f5;
  --text:#151821;
  --muted:#687080;
  --line:#dfe2ea;
  --shadow:0 20px 60px #0001;
}

.light html,
.light body{
  background:#f5f6fa;
  color:#151821;
}

.light .auth-card,
.light .card{
  background:#fff;
}

.light .tabs,
.light .field input,
.light .field textarea,
.light .field select,
.light .search input,
.light .comment-row input{
  background:#f7f8fb;
  color:#151821;
}

</style>
</head>


<body>


<!-- =========================
     AUTH SCREEN
========================= -->

<div id="auth" class="auth">

  <div class="auth-card">

    <div class="brand">
      zil<span>net</span>
    </div>

    <div class="sub">
      A global place to create, connect and discover.
    </div>


    <div class="tabs">

      <button
        id="loginTab"
        class="active"
        onclick="setAuthMode('login')">
        Log in
      </button>

      <button
        id="signupTab"
        onclick="setAuthMode('signup')">
        Create account
      </button>

    </div>


    <form
      id="authForm"
      onsubmit="submitAuth(event)">


      <div
        id="nameField"
        class="field hidden">

        <label>
          Display name
        </label>

        <input
          id="displayName"
          maxlength="50">

      </div>


      <div class="field">

        <label>
          Username
        </label>

        <input
          id="username"
          required
          maxlength="30"
          autocomplete="username"
          placeholder="yourname">

      </div>


      <div
        id="emailField"
        class="field hidden">

        <label>
          Email
        </label>

        <input
          id="email"
          type="email"
          maxlength="120">

      </div>


      <div class="field">

        <label>
          Password
        </label>

        <input
          id="password"
          type="password"
          required
          minlength="8"
          autocomplete="current-password">

      </div>


      <div id="authMsg"></div>


      <button
        class="primary full"
        id="authBtn">

        Continue

      </button>


      <button
        type="button"
        id="forgotBtn"
        class="linkbtn hidden"
        onclick="openForgotPassword()">

        Forgot password?

      </button>

    </form>


    <p class="tiny">
      Use at least 8 characters for your password.
    </p>

  </div>

</div>



<!-- =========================
     MAIN APP
========================= -->

<div
  id="app"
  class="app hidden">


  <div class="shell">


    <!-- =========================
         SIDEBAR
    ========================= -->

    <aside class="sidebar">


      <div class="logo">

        <span class="brand">
          zil<span>net</span>
        </span>

      </div>


      <button
        class="navbtn active"
        data-page="home"
        onclick="go('home')">

        ⌂

        <span class="label">
          Home
        </span>

      </button>


      <button
        class="navbtn"
        data-page="discover"
        onclick="go('discover')">

        ⌕

        <span class="label">
          Discover
        </span>

      </button>


      <button
        class="navbtn"
        data-page="reels"
        onclick="go('reels')">

        ▶

        <span class="label">
          Reels
        </span>

      </button>


      <button
        class="navbtn"
        onclick="openCreate()">

        ＋

        <span class="label">
          Create
        </span>

      </button>


      <button
        class="navbtn"
        data-page="chat"
        onclick="go('chat')">

        ◌

        <span class="label">
          Chat
        </span>

      </button>


      <button
        class="navbtn"
        data-page="profile"
        onclick="go('profile')">

        ◎

        <span class="label">
          Profile
        </span>

      </button>


      <div class="spacer"></div>


      <button
        class="navbtn"
        onclick="openSettings()">

        ⚙

        <span class="label">
          Settings
        </span>

      </button>


      <button
        class="navbtn"
        onclick="logout()">

        ↪

        <span class="label">
          Log out
        </span>

      </button>


    </aside>



    <!-- =========================
         MAIN CONTENT
    ========================= -->

    <main>


      <header class="topbar">


        <div class="mobile-brand">
          zil<span style="color:#ff3d91">net</span>
        </div>


        <div class="search">

          <input
            id="globalSearch"
            placeholder="Search people, skills, posts…"
            oninput="searchAll(this.value)">

        </div>


        <button
          class="iconbtn"
          onclick="openNotifications()">

          ♡

        </button>


      </header>



      <!-- =========================
           HOME
      ========================= -->

      <section id="page-home">


        <div class="section-title">

          <h2>
            Stories
          </h2>

          <button
            class="secondary"
            onclick="openStory()">

            ＋

          </button>

        </div>


        <div
          id="stories"
          class="stories">
        </div>



        <!-- POST COMPOSER -->

        <div
          id="composer"
          class="compose card">


          <div class="row">


            <img
              id="composerAvatar"
              class="avatar"
              alt="">


            <textarea
              id="postText"
              placeholder="Share something with the world…">
            </textarea>


          </div>


          <div class="compose-foot">


            <div class="tiny">
              Public post • be respectful
            </div>


            <button
              class="primary"
              onclick="createPost()">

              Post

            </button>


          </div>


        </div>


        <div id="feed"></div>


      </section>



      <!-- =========================
           DISCOVER
      ========================= -->

      <section
        id="page-discover"
        class="hidden">


        <div class="section-title">

          <h2>
            Discover
          </h2>

        </div>


        <div id="discoverResults"></div>


      </section>



      <!-- =========================
           REELS
      ========================= -->

      <section
        id="page-reels"
        class="hidden">


        <div class="section-title">

          <h2>
            Reels
          </h2>


          <button
            class="primary"
            onclick="openCreate('reel')">

            ＋ Reel

          </button>

        </div>


        <div id="reelsFeed"></div>


      </section>



      <!-- =========================
           CHAT
      ========================= -->

      <section
        id="page-chat"
        class="hidden">


        <div class="section-title">

          <h2>
            Messages
          </h2>


          <button
            class="secondary"
            onclick="newGroup()">

            ＋ Group

          </button>

        </div>


        <div
          id="chatList"
          class="card">
        </div>


      </section>



      <!-- =========================
           PROFILE
      ========================= -->

      <section
        id="page-profile"
        class="hidden">

        <div id="profileView"></div>

      </section>


    </main>



    <!-- =========================
         RIGHT SIDEBAR
    ========================= -->

    <aside class="rightbar">


      <div class="rightcard card">

        <strong>
          People to connect with
        </strong>

        <div id="suggestions"></div>

      </div>


      <div class="rightcard card">

        <strong>
          Explore skills
        </strong>

        <div id="skills"></div>

      </div>


      <div class="tiny">
        Zilnet • built for people, ideas and communities.
      </div>


    </aside>


  </div>



  <!-- =========================
       MOBILE BOTTOM NAV
  ========================= -->

  <nav class="bottom">


    <button onclick="go('home')">

      ⌂
      <br>

      <small>
        Home
      </small>

    </button>


    <button onclick="go('discover')">

      ⌕
      <br>

      <small>
        Discover
      </small>

    </button>


    <button onclick="openCreate()">

      ＋
      <br>

      <small>
        Create
      </small>

    </button>


    <button onclick="go('reels')">

      ▶
      <br>

      <small>
        Reels
      </small>

    </button>


    <button onclick="go('profile')">

      ◎
      <br>

      <small>
        Profile
      </small>

    </button>


  </nav>


</div>



<!-- =========================
     MODAL
========================= -->

<div
  id="modal"
  class="modal hidden">

  <div
    class="modal-card"
    id="modalCard">
  </div>

</div>



<!-- =========================
     TOAST
========================= -->

<div
  id="toast"
  class="toast hidden">
</div>


<!-- =========================
     JAVASCRIPT STARTS IN PART 2
========================= -->

<script>
/* =========================================================
   ZILNET — PART 2
   Core JavaScript
========================================================= */

const $ = id => document.getElementById(id);

const state = {
  me: null,
  page: "home",
  posts: [],
  stories: [],
  chats: [],
  currentChat: null,

/* =========================================================
   API
========================================================= */

async function api(path, options = {}) {

  const response = await fetch("/api" + path, {
    credentials: "include",
    ...options
  });

  let data = {};

  try {
    data = await response.json();
  } catch {
    data = {};
  }

  if (!response.ok) {
    throw new Error(
      data.error ||
      data.message ||
      "Something went wrong."
    );
  }

  return data;
}


/* =========================================================
   HELPERS
========================================================= */

function esc(value) {

  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}


function toast(message) {

  const el = $("toast");

  if (!el) return;

  el.textContent = message;
  el.classList.remove("hidden");

  clearTimeout(window.__toastTimer);

  window.__toastTimer = setTimeout(() => {
    el.classList.add("hidden");
  }, 2600);
}


function formatDate(value) {

  if (!value) return "";

  const d = new Date(
    value.includes("T")
      ? value
      : value.replace(" ", "T") + "Z"
  );

  if (Number.isNaN(d.getTime())) {
    return "";
  }

  return d.toLocaleDateString(
    undefined,
    {
      day: "numeric",
      month: "short"
    }
  );
}


function avatar(url, name = "") {

  if (url) {
    return esc(url);
  }

  const letter =
    String(name || "?")
      .charAt(0)
      .toUpperCase();

  return "data:image/svg+xml;charset=UTF-8," +
    encodeURIComponent(`
      <svg xmlns="http://www.w3.org/2000/svg"
           width="100"
           height="100"
           viewBox="0 0 100 100">
        <rect width="100" height="100" rx="50"
              fill="#202331"/>
        <text x="50"
              y="58"
              text-anchor="middle"
              font-family="Arial"
              font-size="42"
              fill="white">${letter}</text>
      </svg>
    `);
}

/* =========================================================
   LOGIN / CREATE ACCOUNT
========================================================= */

async function submitAuth(event) {

  event.preventDefault();

  const mode =
    $("authForm").dataset.mode || "login";

  const username =
    $("username").value.trim();

  const password =
    $("password").value;

  const displayName =
    $("displayName").value.trim();

  const email =
    $("email").value.trim();


  if (!username) {

    $("authMsg").innerHTML =
      `<div class="error">
        Enter your username.
      </div>`;

    return;
  }


  if (password.length < 8) {

    $("authMsg").innerHTML =
      `<div class="error">
        Password must be at least 8 characters.
      </div>`;

    return;
  }


  if (
    mode === "signup" &&
    !email
  ) {

    $("authMsg").innerHTML =
      `<div class="error">
        Enter your email address.
      </div>`;

    return;
  }


  const button = $("authBtn");

  button.disabled = true;

  button.textContent =
    mode === "signup"
      ? "Creating account…"
      : "Signing in…";


  try {

    const result =
      await api(
        mode === "signup"
          ? "/signup"
          : "/login",
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({
            username,
            password,
            display_name:
              displayName || username,
            email
          })
        }
      );


    state.me = result.user;

    $("password").value = "";

    showApp();

    toast(
      mode === "signup"
        ? "Your account is ready."
        : "Welcome back."
    );


  } catch (error) {

    $("authMsg").innerHTML =
      `<div class="error">
        ${esc(error.message)}
      </div>`;

  } finally {

    button.disabled = false;

    button.textContent =
      mode === "signup"
        ? "Create account"
        : "Log in";
  }
}

/* =========================================================
   NAVIGATION
========================================================= */

function go(page) {

  state.page = page;


  [
    "home",
    "discover",
    "reels",
    "chat",
    "profile"
  ].forEach(name => {

    const section =
      $("page-" + name);

    if (section) {

      section.classList.toggle(
        "hidden",
        name !== page
      );
    }
  });


  document
    .querySelectorAll(".navbtn[data-page]")
    .forEach(button => {

      button.classList.toggle(
        "active",
        button.dataset.page === page
      );
    });


  if (page === "home") {

    loadHome();

  } else if (page === "discover") {

    searchAll(
      $("globalSearch").value.trim()
    );

  } else if (page === "reels") {

    loadReels();

  } else if (page === "chat") {

    loadChats();

  } else if (page === "profile") {

    loadProfile();
  }
}

async function viewStory(id) {

      await api(
        "/stories/" + Number(id)
      );

    const story =
      result.story;


    if (!story) {

      toast("Story unavailable.");

      return;
    }


    let media = "";


    if (story.media_url) {

      if (
        String(
          story.media_type || ""
        ).startsWith("video")
      ) {

        media = `

          <video
            class="media"
            src="${esc(
              story.media_url
            )}"
            controls
            autoplay
            playsinline>
          </video>

        `;

      } else {

        media = `

          <img
            class="media"
            src="${esc(
              story.media_url
            )}"
            alt="">

      }

    openModal(`

          @${esc(story.username)}

async function loadFeed() {

function renderFeed() {

  const container =
    $("feed");

  if (!container) return;


  if (!state.posts.length) {

    container.innerHTML = `

      <div class="card post">

        <strong>
          Your feed is empty.
        </strong>

        <p class="tiny">
          Follow people or create your first post.
        </p>

      </div>

    `;

    return;
  }


  container.innerHTML =
    state.posts
      .map(renderPost)
      .join("");
}


function renderPost(post) {

  const liked =
    Boolean(
      post.liked ||
      post.is_liked
    );


  const own =
    state.me &&
    Number(post.user_id) ===
      Number(state.me.id);


  return `

    <article
      class="post card"
      data-post-id="${Number(post.id)}">


      <div class="post-head">


        <img
          class="avatar"
          src="${avatar(
            post.avatar_url,
            post.username
          )}"
          alt="">


        <div class="post-meta">

          <strong>
            ${esc(
              post.display_name ||
              post.username
            )}
          </strong>

          <span>
            @${esc(post.username)}
            ${post.created_at
              ? " · " + formatDate(post.created_at)
              : ""}
          </span>

        </div>


        <button
          class="more"
          onclick="postMenu(${Number(post.id)})">

          ⋯

        </button>


      </div>


      ${
        post.content
          ? `<div class="post-text">
              ${esc(post.content)}
            </div>`
          : ""
      }


      ${
        post.media_url
          ? renderMedia(post)
          : ""
      }


      <div class="actions">


        <button
          class="${liked ? "liked" : ""}"
          onclick="toggleLike(this,${Number(post.id)})">

          ♥
          ${Number(post.likes_count || 0)}

        </button>


        <button
          onclick="toggleComments(this,${Number(post.id)})">

          ◌
          ${Number(post.comments_count || 0)}

        </button>


        <button
          onclick="sharePost(${Number(post.id)})">

          ↗

        </button>


        <button
          onclick="savePost(${Number(post.id)})">

          ☆

        </button>


      </div>


      <div class="likes">

        ${Number(post.likes_count || 0)}
        likes

      </div>


      <div
        id="comments-${Number(post.id)}"
        class="comments hidden">
      </div>


    </article>

  `;
}


function renderMedia(post) {

  const type =
    String(
      post.media_type || ""
    );


  if (
    type.startsWith("video")
  ) {

    return `

      <video
        class="media"
        src="${esc(post.media_url)}"
        controls
        playsinline
        preload="metadata">
      </video>

    `;
  }


  return `

    <img
      class="media"
      src="${esc(post.media_url)}"
      alt=""
      loading="lazy">

  `;
}

/* =========================================================
   MEDIA UPLOAD
========================================================= */

async function uploadMedia(file) {

  if (!file) {

    throw new Error(
      "Choose a file first."
    );
  }


  const maxSize =
    100 * 1024 * 1024;


  if (file.size > maxSize) {

    throw new Error(
      "This file is too large."
    );
  }


  const form =
    new FormData();

  form.append(
    "file",
    file
  );


  return await api(
    "/upload",
    {
      method: "POST",
      body: form
    }
  );
}

async function toggleLike(

) {

  try {

        "/posts/" +

        "/like",
        {

        }
      );

    const post =
      button.closest(".post");


    if (post) {

      const count =
        post.querySelector(".likes");


      if (count) {

        count.textContent =
          `${Number(

          )} likes`;
      }
    }


    const icon =
      button.firstChild;


    if (icon) {

      button.innerHTML =
        `♥ ${Number(
          result.likes_count || 0
        )}`;
    }


  } catch (error) {

    toast(error.message);

  } finally {

    button.disabled = false;
  }
}

async function toggleComments(

  box.innerHTML = `

        maxlength="500">

      <button
        class="primary"
        onclick="sendComment(${Number(postId)})">

        Send

      </button>

    </div>

    <div
      id="comment-list-${Number(postId)}">
    </div>

  `;


  await loadComments(postId);
}


async function loadComments(postId) {

  try {

    const result =
      await api(
        "/posts/" +
        Number(postId) +
        "/comments"
      );


    const comments =
      result.comments || [];


    const list =
      $("comment-list-" +
        Number(postId));


    if (!list) return;


    list.innerHTML =
      comments.length
        ? comments.map(comment => `

            <div class="comment">

              <b>
                @${esc(comment.username)}
              </b>

              ${esc(comment.content)}

            </div>

          `).join("")

        : `

            <div class="tiny">
              No comments yet.
            </div>

          `;


  } catch (error) {

    toast(error.message);
  }
}


async function sendComment(postId) {

  const input =
    $("comment-input-" +
      Number(postId));


  if (!input) return;


  const content =
    input.value.trim();


  if (!content) return;


  try {

    await api(
      "/comments",
      {
        method: "POST",

        headers: {
          "Content-Type":
            "application/json"
        },

        body: JSON.stringify({
          post_id:
            Number(postId),

          content
        })
      }
    );


    input.value = "";

    await loadComments(postId);

    toast("Comment added.");

  } catch (error) {

    toast(error.message);
  }
}

========================================================= */

async function sharePost(postId) {

  const url =
    location.origin +
    "/?post=" +
    Number(postId);


  try {

    if (
      navigator.share
    ) {

      await navigator.share({
        title: "Zilnet",
        text: "Check this post on Zilnet.",
        url
      });

    } else {

      await navigator.clipboard.writeText(
        url
      );

      toast("Post link copied.");
    }

  } catch {
    // User cancelled share.
  }
}


async function copyPostLink(postId) {

/* =========================================================
   SEARCH
========================================================= */

function searchAll(query) {

  clearTimeout(
    state.searchTimer
  );


  state.searchTimer =
    setTimeout(
      () => performSearch(query),
      250
    );
}


async function performSearch(query) {

  if (
    state.page !== "discover" &&
    !query.trim()
  ) {

    return;
  }


  const container =
    $("discoverResults");


  if (!container) return;


  container.innerHTML = `

    <div class="card post tiny">
      Searching…
    </div>

  `;


  try {

    const result =
      await api(
        "/search?q=" +
        encodeURIComponent(
          query.trim()
        )
      );


    renderSearchResults(
      result
    );


    if (
      state.page !== "discover"
    ) {

      go("discover");
    }


  } catch (error) {

    container.innerHTML = `

      <div class="card post">

        <div class="error">
          ${esc(error.message)}
        </div>

      </div>

    `;
  }
}


function renderSearchResults(
  result
) {

  const users =
    result.users || [];


  const posts =
    result.posts || [];


  const container =
    $("discoverResults");


  if (!container) return;


  let html = "";


  if (users.length) {

    html += `

      <div class="section-title">

        <h2>
          People
        </h2>

      </div>

    `;


    html += users.map(user => `

      <div
        class="card post"
        onclick="openUserProfile(${Number(user.id)})"
        style="cursor:pointer">

        <div class="userrow">

          <img
            class="avatar"
            src="${avatar(
              user.avatar_url,
              user.username
            )}">

          <div>

            <strong>
              ${esc(
                user.display_name ||
                user.username
              )}
            </strong>

            <div class="tiny">
              @${esc(user.username)}
            </div>

          </div>

        </div>

      </div>

    `).join("");
  }


  if (posts.length) {

    html += `

      <div class="section-title">

        <h2>
          Posts
        </h2>

      </div>

    `;


    html += posts.map(
      renderPost
    ).join("");
  }


  if (!html) {

    html = `

      <div class="card post">

        <strong>
          Nothing found.
        </strong>

        <p class="tiny">
          Try another username, skill or keyword.
        </p>

      </div>

    `;
  }


  container.innerHTML =
    html;
}

      result.user ||

            .value.trim(),

    $("createMsg").innerHTML =
      `<div class="error">

    return;

  try {

    await api(
      "/reels",
      {
        method: "POST",

        headers: {
          "Content-Type":
            "application/json"

          caption,

    const messages =

  const own =
    state.me &&
    Number(message.user_id) ===
      Number(state.me.id);


  return `

    <div
      class="comment"
      style="
        text-align:${own ? "right" : "left"};
      ">

      <b>
        ${own
          ? "You"
          : "@" + esc(message.username)}
      </b>

      <div>
        ${esc(message.content)}
      </div>

    </div>

  `;
}


async function sendMessage() {

  const input =
    $("messageInput");


  if (!input ||
      !state.currentChat) {

    return;
  }


  const content =
    input.value.trim();


  if (!content) return;


  try {

    await api(
      "/chats/" +
      Number(state.currentChat) +
      "/messages",
      {
        method: "POST",

        headers: {
          "Content-Type":
            "application/json"
        },

        body: JSON.stringify({
          content
        })
      }
    );


    input.value = "";

    await openChat(
      state.currentChat
    );

  } catch (error) {

    toast(error.message);
  }
}

        },

        body: JSON.stringify({
          profile_visibility:
            visibility
        })
      }
    );


    closeModal();

    toast("Privacy settings saved.");

  } catch (error) {

    $("privacyMsg").innerHTML =
      `<div class="error">
        ${esc(error.message)}
      </div>`;
  }
}


function openSecuritySettings() {

  openModal(`

    <div class="modal-head">

      <h3>
        Security
      </h3>

      <button
        class="iconbtn"
        onclick="closeModal()">
        ×
      </button>

    </div>


    <p class="tiny">
      Your account uses a secure session. Password recovery can be expanded with email verification and one-time reset links.
    </p>


    <button
      class="secondary full"
      onclick="openForgotPassword();">

      Password recovery

    </button>

  `);
}


/* =========================================================
   MODAL
========================================================= */

function openModal(content) {

  $("modalCard").innerHTML =
    content;

  $("modal").classList.remove(
    "hidden"
  );
}


function closeModal() {

  $("modal").classList.add(
    "hidden"
  );

  $("modalCard").innerHTML =
    "";
}


/* Close modal by tapping outside. */

$("modal").addEventListener(
  "click",
  event => {

    if (
      event.target ===
      $("modal")
    ) {

      closeModal();
    }
  }
);


/* =========================================================
   CAMERA / GALLERY SUPPORT
========================================================= */

function openCameraInput(
  inputId
) {

  const input =
    $(inputId);


  if (!input) return;


  input.setAttribute(
    "capture",
    "environment"
  );


  input.click();
}


function openGalleryInput(
  inputId
) {

  const input =
    $(inputId);


  if (!input) return;


  input.removeAttribute(
    "capture"
  );


  input.click();
}


/* =========================================================
   KEYBOARD SHORTCUT
========================================================= */

document.addEventListener(
  "keydown",
  event => {

    if (
      event.key === "Escape"
    ) {

      closeModal();
    }
  }
);


/* =========================================================
   START ZILNET
========================================================= */

document.addEventListener(
  "DOMContentLoaded",
  () => {

    setAuthMode("login");

    boot();

  }
);
