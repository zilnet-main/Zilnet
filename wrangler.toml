name = "zilnet"
main = "worker.js"
compatibility_date = "2026-09-09"

[assets]
directory = "./"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "zilnet-db"
database_id = "69f8b11c-1474-4db5-af80-ecd0dc17714d"
{
  "observability": {
    "logs": {
      "enabled": true,
      "head_sampling_rate": 1,
      "invocation_logs": true,
      "persist": true
    },
    "traces": {
      "enabled": false,
      "head_sampling_rate": 1,
      "persist": true
    }
  }
}
